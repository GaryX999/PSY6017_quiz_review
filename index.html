 rule**","**Transitional rule**","**Actual formula**","**Concrete operational rule**"]},{"id":"d1-l3-015","day":1,"lecture":3,"topic":"形式运算","difficulty":1,"type":"direct","stem":"按 PPT，**hypothetical-deductive reasoning** 指的是？","options":["从多个具体观察中归纳出一般原则","从总体原则出发提出具体结论，并系统检验各种可能","在心理上逆转某种物理或心理转换","把两个对象的关系传递给第三个对象"],"answer":1,"option_notes":["这是 **inductive logic**（从特定到一般），方向与假设演绎相反。","**Hypothetical-deductive reasoning**：从总体原则推出具体结论，先想所有可能再系统检验。","这是 **reversibility**，属具体运算阶段图式。","这是 **transitivity**（传递性），属形式运算推理但不是假设演绎。"],"explain":"形式运算阶段的两大标志：能理解无实物参照的抽象概念（美、爱、自由、道德），以及 **hypothetical-deductive reasoning**。它自上而下，与自下而上的归纳逻辑相对。","source":"L3 p.26","tags":["formal operational stage","hypothetical-deductive reasoning"],"stem_en":"According to the lecture, which of the following best describes what **hypothetical-deductive reasoning** refers to in the formal operational stage?","options_en":["Deriving a general principle from many specific observations","Starting from an overarching principle and proposing specific conclusions, then systematically testing all possibilities","Mentally undoing a physical or mental transformation","Carrying the relation between two objects over to a third object"]},{"id":"d1-l3-016","day":1,"lecture":3,"topic":"传递性","difficulty":2,"type":"direct","stem":"儿童知道 A<B 且 B<C，就能据此推断 A<C。这体现形式运算阶段的哪种推理？","options":["**Inductive logic**（归纳逻辑）","**Hypothetical-deductive reasoning**","**Transitivity**（传递性）","**Horizontal décalage**（水平滞差）"],"answer":2,"option_notes":["归纳逻辑从特定观察得一般原则，题干是从已知关系推出新关系。","假设演绎从总体原则推具体结论，题干是元素间关系的逻辑传递。","**Transitivity**：两个元素的关系可逻辑地传递给与之相关的其他元素，A<B 且 B<C 则 A<C。","水平滞差指具体运算技能跨任务的时间差，不是推理形式。"],"explain":"传递性是形式运算的经典推理任务。PPT 还指出该任务激活 **DLPFC**（工作记忆与抽象操作）、顶叶皮层（比较与推理整合）、颞叶（记忆关联）与前扣带皮层（冲突监测）。","source":"L3 p.28","tags":["transitivity","formal operational stage","DLPFC"],"stem_en":"A child knows that A<B and B<C, and can therefore infer that A<C. Which kind of reasoning in the formal operational stage does this reflect?","options_en":["**Inductive logic**","**Hypothetical-deductive reasoning**","**Transitivity**","**Horizontal décalage**"]},{"id":"d1-l3-017","day":1,"lecture":3,"topic":"假想观众","difficulty":2,"type":"direct","stem":"中一学生坚称“全校都在看我的新发型”，因此不敢进入食堂。这最符合？","options":["**Personal fable**（个人寓言）","**Naïve idealism**（天真理想主义）","**Centration**（集中化）","**Imaginary audience**（假想观众）"],"answer":3,"option_notes":["个人寓言是“自己独特、特别、不会受伤”的信念，题干重点是“被众人注视”。","天真理想主义是用理想世界批判现实并想改变它，与被注视感无关。","集中化是前运算期只考虑单一维度，不适合解释青春期现象。","**Imaginary audience**：认为周围人像自己一样关注自己的外表，是青春期自我中心的表现。"],"explain":"青春期自我中心源于假设演绎思维与“自己的想法有无限力量”的错觉，典型表现为 **imaginary audience**（被注视、渴望隐私）与 **personal fable**（独特、不受伤害）。","source":"L3 p.29","tags":["imaginary audience","adolescent egocentrism"],"stem_en":"A Form 1 student insists that 'the whole school is looking at my new haircut' and is therefore afraid to enter the canteen. This best fits:","options_en":["**Personal fable**","**Naïve idealism**","**Centration**","**Imaginary audience**"]},{"id":"d1-l3-018","day":1,"lecture":3,"topic":"个人寓言","difficulty":2,"type":"direct","stem":"中三学生认为“只有我经历过这么强烈的情绪，别人永远无法理解我”，并相信自己不会出事。这最符合？","options":["**Personal fable**（个人寓言）","**Imaginary audience**（假想观众）","**Naïve idealism**（天真理想主义）","**Preoperational egocentrism**（前运算自我中心）"],"answer":0,"option_notes":["**Personal fable**：认为自己独特、特别且不会受到伤害；情绪体验的独特性强化了不可伤害感。","**Imaginary audience** 是“别人都在看我”的信念，题干强调自我的独特性与不受伤害。","**Naïve idealism** 指用理想世界对照现实并产生不满，不是自我独特性。","前运算自我中心指难以采择他人视角；青春期自我中心是有假设演绎思维基础的新形式。"],"explain":"个人寓言与假想观众互相强化：因为觉得自己重要（有观众），就觉得感受独一无二（寓言），进而低估风险，更易饮酒或发生无保护性行为，也可能引发焦虑、抑郁。","source":"L3 p.30","tags":["personal fable","adolescent egocentrism","risk taking"],"stem_en":"A Form 3 student believes that 'only I have ever felt such intense emotions and no one can ever understand me', and also believes that nothing bad will happen to him. This best fits:","options_en":["**Personal fable**","**Imaginary audience**","**Naïve idealism**","**Preoperational egocentrism**"]},{"id":"d1-l3-019","day":1,"lecture":3,"topic":"社会文化观","difficulty":1,"type":"direct","stem":"**Vygotsky** 把儿童看作哪一种角色，并据此强调社会文化世界是认知发展的源泉？","options":["独自探索世界的“小科学家”","被强化与模仿塑造的被动学习者","从成人与同伴导师处学习的“学徒”（apprentice）","按内在时间表展开阶段的成熟有机体"],"answer":2,"option_notes":["这是皮亚杰式观点：儿童通过独立探索建构知识，正是维果茨基批评之处。","这是极端的学习视角描述；维果茨基强调社会互动，但不是机械强化。","**Apprentice**：儿童从成人/同伴导师获得协助、指导与激励，社会文化世界是认知发展源泉。","强调内在成熟时间表的是皮亚杰的阶段论，维果茨基更强调文化与教学作用。"],"explain":"维果茨基挑战皮亚杰“忽视社会文化影响”：儿童习得文化的价值观、信念与问题解决策略，像学徒一样在导师协助下逐渐独立运作，故社会互动是发展源泉。","source":"L3 p.32","tags":["Vygotsky","apprentice","sociocultural theory"],"stem_en":"What role did **Vygotsky** see children as playing, and on this basis argue that the social and cultural world is the source of cognitive development?","options_en":["A 'little scientist' who explores the world alone","A passive learner shaped by reinforcement and imitation","An 'apprentice' who learns from adult and peer mentors","A maturing organism whose stages unfold according to an internal timetable"]},{"id":"d1-l3-020","day":1,"lecture":3,"topic":"最近发展区","difficulty":1,"type":"direct","stem":"下列哪项最准确描述 **zone of proximal development**？","options":["儿童已经能独立完成的所有任务范围","儿童独立能完成与在指导下能完成之间的差距","超出儿童能力、即使协助也无法完成的任务范围","儿童在同龄团体中的相对排名"],"answer":1,"option_notes":["这是“过易区”；ZPD 关注的是尚需协助才能完成的部分。","**ZPD**：学习者独立能完成的任务与在指导下能完成的任务之间的差距。","这是“过难区”，即使有协助也超出能力范围，不属于 ZPD。","相对排名属常模比较，ZPD 是任务难度与协助之间的关系。"],"explain":"ZPD 位于“过易区”与“过难区”之间：在 **more knowledgeable other**（教师、家长、同伴或教育技术）提示、开放式提问与示范下完成，随后逐步撤除 **scaffolding**。","source":"L3 p.35","tags":["zone of proximal development","scaffolding","Vygotsky"],"stem_en":"Which of the following statements most accurately describes **Vygotsky**'s concept of the **zone of proximal development**?","options_en":["All the tasks a child can already complete independently","The gap between what a child can do independently and what can be done with guidance","Tasks beyond a child's ability that cannot be completed even with help","The child's relative ranking within a same-age group"]},{"id":"d1-l4-001","day":1,"lecture":4,"topic":"语言定义","difficulty":1,"type":"direct","stem":"按 PPT 对 **language** 的界定，下列说法最准确的是？","options":["由情绪声音与手势构成的表达系统","由少量本身无意义的符号按约定语法规则组合、可生成无限信息的交流系统","天生具备、无需语言输入的普遍语法","通过模仿成人句子逐句累积的言语习惯"],"answer":1,"option_notes":["情绪声音与手势只是交流的一部分，未涵盖“符号按规则组合生成无限信息”这一核心。","**Language**：少量本身无意义的符号（音节、词、惯用语）按约定语法规则组合，可生成无限多信息。","这是 **nativist** 的 **universal grammar** 主张，不是语言的一般定义。","这是学习视角对语言获得的解释，且无法解释创造性表达，不是定义。"],"explain":"语言定义两个要点：①符号本身无意义，靠 **grammatical rules** 组合；②组合后可生成无限多的信息。它是最复杂抽象的知识体系之一，儿童却在早期就能理解并使用。","source":"L4 p.4","tags":["language","grammatical rules","symbol system"],"stem_en":"According to the lecture's definition, which of the following statements most accurately captures what **language** is?","options_en":["An expression system made up of emotional sounds and gestures","A communication system in which meaningless symbols are combined by agreed-on grammatical rules to produce infinite messages","An innate universal grammar that does not require language input","Speech habits accumulated sentence by sentence through imitating adults"]},{"id":"d1-l4-002","day":1,"lecture":4,"topic":"语言组成","difficulty":1,"type":"direct","stem":"语言的五大组成部分中，对应“句子（sentences）”这一层次的是？","options":["**Phonology**","**Morphology**","**Semantics**","**Syntax**"],"answer":3,"option_notes":["**Phonology**（音系学）对应语音，研究音位与语音组合规则。","**Morphology**（形态学）对应词汇，研究音位构成有意义单词的规则。","**Semantics**（语义学）对应意义，研究词语与句子表达的含义。","**Syntax**（句法学）对应句子，规定词与语法标记如何组合成有意义的句子。"],"explain":"五大组成：**phonology**（音）→ **morphology**（词）→ **semantics**（义）→ **syntax**（句）→ **pragmatics**（语境）。考法常是“给研究问题，问属于哪一层”或“哪一层对应哪个单位”。","source":"L4 p.5","tags":["phonology","morphology","semantics","syntax","pragmatics"],"stem_en":"Among the five components of language introduced in the lecture, which one corresponds to the level of 'sentences'?","options_en":["**Phonology**","**Morphology**","**Semantics**","**Syntax**"]},{"id":"d1-l4-003","day":1,"lecture":4,"topic":"音系学","difficulty":1,"type":"direct","stem":"在 **phonology** 中，**phoneme** 是指什么？","options":["语音的基本单位，如 /b/、/d/","最小的有意义语言单位","一个人所理解的所有词语","句子里表达语气的语法标记"],"answer":0,"option_notes":["**Phoneme**（音位）：语音的基本单位，音系学研究其辨别（b/d）与组合规则。","这是 **morpheme**（语素）的定义——最小意义单位。","这是 **lexicon**（词汇库）——一个人理解的所有词语。","语气标记不是音位；**phoneme** 只指语音的基本单位，与语气无关。"],"explain":"**Phonology** 研究语音系统：辨别音位差异、哪些音位可组合（Dog＝/d/ /ɒ/ /g/）、哪些音不存在于本语言。字母语言以 **phoneme** 为单位，中文以音节为单位。","source":"L4 p.6","tags":["phonology","phoneme","language variation"],"stem_en":"According to the lecture, in **phonology**, which of the following best describes what a **phoneme** refers to as a unit of speech sound?","options_en":["A basic unit of sound, such as /b/ and /d/","The smallest meaningful unit of language","All the words a person understands","A grammatical marker in a sentence that expresses tone"]},{"id":"d1-l4-004","day":1,"lecture":4,"topic":"形态学","difficulty":1,"type":"direct","stem":"按 **morphology** 的划分，**unhappiness** 由几个 **morpheme** 构成？","options":["1 个语素（整词不可再分）","2 个语素（un + happiness）","3 个语素（un + happy + ness）","4 个语素（u + n + happy + ness）"],"answer":2,"option_notes":["一个语素意味着不可再分，但 unhappiness 可拆出前缀与后缀。","两个语素会漏掉一个词缀；PPT 原例拆为 un/happy/ness 三部分。","三个语素：un（否定）+ happy（自由语素）+ ness（名词后缀），是 PPT 原例。","把字母 u、n 当作语素是错误拆分；语素必须有意义。"],"explain":"**Morpheme** 是最小意义单位：英语靠前缀（un+）、后缀（+ness）改变意义。汉语通常一个汉字＝一个音节＝一个语素，语素复合（心+情＝心情）是汉语重要特征。","source":"L4 p.8","tags":["morphology","morpheme","unhappiness"],"stem_en":"According to the rules of **morphology** covered in the lecture, how many **morphemes** does the English word **unhappiness** consist of?","options_en":["1 morpheme (the whole word cannot be divided)","2 morphemes (un + happiness)","3 morphemes (un + happy + ness)","4 morphemes (u + n + happy + ness)"]},{"id":"d1-l4-005","day":1,"lecture":4,"topic":"语素类型","difficulty":2,"type":"direct","stem":"按 **morphology** 的分类，下列哪一项属于 **bound morpheme**？","options":["happy（可单独成词）","unhappy 中的 un-","book 中的 book","dog 中的 dog"],"answer":1,"option_notes":["happy 可单独成词，也是 **free morpheme**。","un- 不能单独成词，必须附着于 happy 等自由语素，属 **bound morpheme**。","book 可单独成词，属 **free morpheme**。","dog 可单独成词，是 **free morpheme**，不是黏着语素。"],"explain":"语素分两类：能独立使用的 **free morpheme**（dog、happy）与必须附着的 **bound morpheme**（un-、-ed、-s）。**Lexicon** 指一个人理解的全部词语，与语素类型是两个层次。","source":"L4 p.10","tags":["free morpheme","bound morpheme","morphology"],"stem_en":"According to **morphology**, which of the following items is an example of a **bound morpheme** as described in the lecture?","options_en":["happy (which can stand alone as a word)","un- in unhappy","book (as in the word book)","dog (as in the word dog)"]},{"id":"d1-l4-006","day":1,"lecture":4,"topic":"语用学","difficulty":1,"type":"direct","stem":"安迪不直说想吃什么，只说“这时候吃冰淇淋不错”；玛丽听懂了他的隐含意图。这依赖哪种语言能力？","options":["**Pragmatics**（语用学）","**Phonology**（音系学）","**Morphology**（形态学）","**Syntax**（句法学）"],"answer":0,"option_notes":["**Pragmatics**：社会语境中有效得体使用语言的原则，包括解读说话人真实含义。","**Phonology** 处理语音系统，无法解释隐含意图的推断。","**Morphology** 处理构词规则，与语境推断无关。","**Syntax** 只保证句子结构合法，不负责读懂言外之意。"],"explain":"语用学关注“说话人含义”而非字面意义：粤语问候“食咗饭未啊？”是寒暄而非真的查问。**Pragmatics** 还包括根据语境调整措辞、礼貌与言外之意。","source":"L4 p.13","tags":["pragmatics","speaker meaning","context"],"stem_en":"Andy does not say directly what he wants to eat, only that 'ice cream is good this time of year'; Mary understands his implied intention. Which language ability does this depend on?","options_en":["**Pragmatics**","**Phonology**","**Morphology**","**Syntax**"]},{"id":"d1-l4-007","day":1,"lecture":4,"topic":"心理状态谈话","difficulty":2,"type":"direct","stem":"**mental state talk（MST）** 把心理状态术语分为三类，know、think、remember 属于哪一类？","options":["**desire**（愿望）","**emotion**（情绪）","社交（social）","**cognition**（认知）"],"answer":3,"option_notes":["愿望类如 want、wish、hope，表达需求、欲望或偏好。","情绪类如 happy、sad、angry，指情绪状态与表达。","“社交”不属于 MST 的三类；MST 分类为愿望、认知、情绪。","认知类（cognition）：与思维、知识和信念相关，如 know、think、remember。"],"explain":"**MST** 指使用心理状态术语的对话，约 2–3 岁开始，是 **ToM** 发展的语言基础。三类术语：愿望（want/wish/hope）、认知（know/think/remember）、情绪（happy/sad/angry）。","source":"L4 p.15","tags":["mental state talk","theory of mind","desire"],"stem_en":"**Mental state talk (MST)** divides mental-state terms into three categories. Which category do know, think and remember belong to, according to the lecture?","options_en":["**desire**","**emotion**","social","**cognition**"]},{"id":"d1-l4-008","day":1,"lecture":4,"topic":"MST层级","difficulty":3,"type":"direct","stem":"儿童说“我以为那是蛇，但其实是根绳子”。按 MST 的语言内容层级，这属于？","options":["L1 仅提及心理状态术语","L2 因果解释性","L3 对比性（contrastive）","音系意识的早期表现"],"answer":2,"option_notes":["L1 只是提及术语（如“知道”“想要”），没有把主观状态与现实对照。","L2 因果解释是把心理状态与可观察行为连接，如“他伤心，因为气球飞走了”。","L3 对比性（contrastive）：把主观心理状态与客观现实明确对比，如“以为是蛇，其实是绳子”。","音系意识是对语音的觉察（如去掉 /m/ 说 ice），与心理状态无关。"],"explain":"MST 三层级递进：L1 提及→L2 因果解释→L3 对比（主观 vs 客观）。L3 表明儿童能把“自己以为的”与“实际”区分开，是 **ToM** 语言通路的最高层。","source":"L4 p.16","tags":["mental state talk","contrastive talk","theory of mind"],"stem_en":"A child says, 'I thought it was a snake, but it is actually a rope.' According to the levels of linguistic content in MST, this belongs to:","options_en":["L1: merely mentioning mental-state terms","L2: causal-explanatory talk","L3: contrastive talk","An early sign of phonological awareness"]},{"id":"d1-l4-009","day":1,"lecture":4,"topic":"语言发展理论","difficulty":1,"type":"direct","stem":"“生物成熟、认知发展与环境影响交互作用，共同决定语言发展进程”属于哪一视角？","options":["**Nativist**","**Interactionist**","**Sociocultural**","**Learning (empiricist)**"],"answer":1,"option_notes":["**Nativist**：认为人类生理上被预设语言习得能力（LAD/LMC）。","**Interactionist**：生物成熟、认知发展与环境影响交互，共同决定语言发展进程。","**Sociocultural** 属 **Vygotsky** 传统，强调文化工具；本讲三大语言视角中不单列。","**Learning (empiricist)**：强调强化与模仿，成人通过示范与强化塑造儿童言语。"],"explain":"本讲用三种视角解释语言发展：**learning (empiricist)**、**nativist**、**interactionist**。看到“交互作用／生物×认知×环境”即锁定互动论；看到“生物预设”选先天论。","source":"L4 p.30","tags":["interactionist","nativist","learning perspective"],"stem_en":"The view that biological maturation, cognitive development and environmental influences interact to determine the course of language development belongs to which perspective?","options_en":["**Nativist**","**Interactionist**","**Sociocultural**","**Learning (empiricist)**"]},{"id":"d1-l4-010","day":1,"lecture":4,"topic":"学习视角","difficulty":3,"type":"direct","stem":"按 PPT 对学习视角的评价，下列哪项最能反驳“成人强化合乎语法的言语，儿童因此学会句法”？","options":["母亲按事实真假而非语法对错做回应（Him cow 被认可）","模仿与强化在塑造地区口音上确实重要","儿童能快速映射新接触的词义","儿童在 18–24 个月出现命名爆炸"],"answer":0,"option_notes":["母亲依事实真假回应（Him cow 被认可），且 It broked 等创造句成人不说，不可能是模仿习得。","模仿与强化在口音上确实重要，这是学习视角的有效范围，不能反驳句法主张。","快速映射属词义学习，与句法规则是否靠强化习得无直接关系。","命名爆炸是词汇量现象，不能说明语法规则的来源。"],"explain":"学习视角解释句法的软肋：成人通常强化“内容真假”而非句法形式；儿童还会说出成人从未说过的过度规则化句子。模仿与强化更适合解释地区口音差异。","source":"L4 p.19","tags":["learning perspective","imitation","reinforcement"],"stem_en":"According to the lecture's evaluation of the learning perspective, which of the following best refutes the claim that 'adults reinforce grammatically correct speech, and children therefore learn syntax'?","options_en":["Mothers respond to whether a statement is true rather than whether it is grammatical ('Him cow' is approved)","Imitation and reinforcement are indeed important in shaping regional accents","Children can fast-map the meanings of newly encountered words","Children show a naming explosion between 18 and 24 months"]},{"id":"d1-l4-011","day":1,"lecture":4,"topic":"先天论","difficulty":1,"type":"direct","stem":"先天论中的 **LAD** 与 **LMC** 分别由谁提出？","options":["**Skinner** 与 **Piaget**","**Bandura** 与 **Vygotsky**","**Lenneberg** 与 **Broca**","**Chomsky** 与 **Slobin**"],"answer":3,"option_notes":["**Skinner** 属学习视角，**Piaget** 关注认知结构，均非 LAD/LMC 提出者。","**Bandura** 是社会学习理论家，**Vygotsky** 属社会文化取向，与 LAD/LMC 无关。","**Lenneberg** 提出敏感期假说，**Broca** 发现的是言语产生脑区。","**LAD**（语言习得装置）由 **Chomsky** 提出；**LMC**（语言制造能力）由 **Slobin** 提出。"],"explain":"**LAD** 由言语输入激活、包含 **universal grammar**；**LMC** 是 Slobin 提出的、高度专门化于语言学习的认知与知觉能力。两者同属“生物预设”阵营。","source":"L4 p.20","tags":["LAD","LMC","Chomsky","Slobin"],"stem_en":"Within the **nativist** perspective on language development, which two theorists proposed **LAD** and **LMC**, respectively?","options_en":["**Skinner** and **Piaget**","**Bandura** and **Vygotsky**","**Lenneberg** and **Broca**","**Chomsky** and **Slobin**"]},{"id":"d1-l4-012","day":1,"lecture":4,"topic":"敏感期","difficulty":1,"type":"direct","stem":"**sensitive-period hypothesis** 认为自然习得母语的时间窗口是？","options":["出生后的前 6 个月","出生前到出生后 2 岁","从出生到青春期","青春期之后到成年早期"],"answer":2,"option_notes":["前 6 个月太窄；支持证据指向更长的窗口，直到青春期前。","“出生前到 2 岁”是感知运动/依恋研究的范围，不是本假说主张。","**Sensitive-period hypothesis**：母语自然习得仅有一个短暂窗口，即从出生到青春期。","青春期之后属“晚期”；Johnson & Newport 显示晚期抵达者语法掌握明显较差。"],"explain":"敏感期假说的证据：成人失语者需大量治疗而儿童不必；长期缺乏正常语言环境的儿童日后难习得；Genie 与 Chelsea 案例。它常与 **nativist** 视角一起考。","source":"L4 p.24","tags":["sensitive period","nativist","Lenneberg"],"stem_en":"According to the **sensitive-period hypothesis**, what is the time window for the natural acquisition of a first language?","options_en":["The first 6 months after birth","From before birth to 2 years of age","From birth to puberty","From after puberty to early adulthood"]},{"id":"d1-l4-013","day":1,"lecture":4,"topic":"二语习得","difficulty":2,"type":"direct","stem":"**Johnson & Newport (1989)** 研究不同年龄抵美移民的英语语法成绩，主要发现是？","options":["3–7 岁开始学英语者接近母语水平，15 岁后抵达者表现较差","抵达年龄越晚，语法成绩越好","各年龄抵达者的语法成绩没有差异","只有母语者能达到最高水平，移民都无法接近"],"answer":0,"option_notes":["研究显示 3–7 岁抵美者英语熟练度与母语者相当；青春期后（尤其 15 岁后）表现较差。","结果与“越晚越好”相反：越晚抵达成绩越差，支持敏感期。","若各年龄无差异，就不能支持敏感期假说；研究结果并非如此。","早期抵达的移民可接近母语水平，只是晚期抵达者较差。"],"explain":"该研究把 **sensitive period** 效应延伸到第二语言：学第一/第二语言都“越早越容易”。注意区分支持先天论的三类证据：语言普遍性、物种特异性、大脑功能特化。","source":"L4 p.27","tags":["Johnson & Newport","sensitive period","second language"],"stem_en":"**Johnson & Newport (1989)** studied the English grammar scores of immigrants who arrived in the United States at different ages. What was their main finding?","options_en":["Those who began learning English at ages 3–7 approached native level, while those arriving after age 15 performed poorly","The later they arrived, the better their grammar scores","There were no differences in grammar scores among arrival-age groups","Only native speakers can reach the highest level, and no immigrant can come close"]},{"id":"d1-l4-014","day":1,"lecture":4,"topic":"互动论","difficulty":2,"type":"direct","stem":"母亲听到“狗狗走”，回应“是的，狗狗正在走开”。这在互动论中属于哪种支持？","options":["**Recast**（重述）","**Expansion**（扩展）","**Child-directed speech**（儿童指向言语）","**Overregularization**（过度规则化）"],"answer":1,"option_notes":["**Recast** 是把儿童句子换成新语法形式，如“狗狗吃”→“狗狗在吃什么？”，本例是丰富化原句。","**Expansion**：把儿童不合语法的表述改为语法正确且更丰富的版本，如“狗狗走”→“狗狗正在走开”。","**Child-directed speech** 指对婴儿说的简短、高音、强调关键词的句子，与本例回应方式不同。","**Overregularization** 是儿童过度泛化语法规则（mice→mouses），不是成人对话策略。"],"explain":"互动论的环境支持包括 **child-directed speech**、轮流对话、**expansion**、**recast** 与延伸对话。常获扩展、重述与延伸的儿童更快习得语法规则，说明输入质量很重要。","source":"L4 p.32","tags":["expansion","recast","interactionist"],"stem_en":"A mother hears 'Doggy go' and responds, 'Yes, the doggy is going away.' In the interactionist perspective, which kind of support is this?","options_en":["**Recast**","**Expansion**","**Child-directed speech**","**Overregularization**"]},{"id":"d1-l4-015","day":1,"lecture":4,"topic":"接受与产出","difficulty":2,"type":"direct","stem":"关于 **receptive language** 与 **productive language** 的发展顺序，下列哪项正确？","options":["**productive** 比 **receptive** 更早发展","两者在 12–13 个月同时出现","**receptive**（理解）早于 **productive**（表达）","**receptive** 要到学龄期才出现"],"answer":2,"option_notes":["顺序相反：理解先于表达，婴儿听懂的多于能说出的。","12–13 个月开始理解词语，但能说出的词远少于理解的词，两者不同步。","**Receptive language**（理解）的发展早于 **productive language**（表达），PPT 明确。","接受性语言在婴儿期（12–13 个月前）已开始发展，并非学龄期才出现。"],"explain":"前语言期婴儿已能理解语言：12–13 个月开始懂词义，但产出滞后。家长常观察到“听得懂、说得少”；7–8 个月的发声轮替则属 **pragmatics** 的萌芽。","source":"L4 p.37","tags":["receptive language","productive language","prelinguistic"],"stem_en":"Which of the following statements about the developmental order of **receptive language** and **productive language** is correct?","options_en":["**productive** language develops earlier than **receptive** language","Both appear at the same time, around 12–13 months","**receptive** language (understanding) develops earlier than **productive** language (expression)","**receptive** language does not appear until school age"]},{"id":"d1-l4-016","day":1,"lecture":4,"topic":"单词句期","difficulty":2,"type":"direct","stem":"幼儿在 18–24 个月词汇量骤然加速，两岁能说出近 200 个词。这一现象称为？","options":["**Fast-mapping**","**Overextension**","**Telegraphic speech**","**Naming explosion**"],"answer":3,"option_notes":["**Fast-mapping** 是听到新词后被应用几次就快速掌握词义（13–15 个月），属机制非现象。","**Overextension** 是把词过度概括（“猫”指所有有毛动物），属用词错误。","**Telegraphic speech** 是 18–24 个月开始的双词组合，不描述词汇量。","**Naming explosion**（命名爆炸）：18–24 个月词汇量快速扩张，两岁时约 200 词。"],"explain":"单词句期早期语义发展：词汇一次一个→ **naming explosion**（18–24 个月）→两岁近 200 词。机制之一是 **fast-mapping**；此阶段常见 **overextension** 与 **underextension**。","source":"L4 p.38","tags":["naming explosion","holophrase","vocabulary"],"stem_en":"Between 18 and 24 months a toddler's vocabulary suddenly accelerates, and by age two the child can produce nearly 200 words. This phenomenon is called:","options_en":["**Fast-mapping**","**Overextension**","**Telegraphic speech**","**Naming explosion**"]},{"id":"d1-l4-017","day":1,"lecture":4,"topic":"快速映射","difficulty":2,"type":"direct","stem":"老师让儿童“拿青瓷色的积木，不要蓝色的”，儿童从此推断出“青瓷色”的含义。这是？","options":["**Fast-mapping**","**Overregularization**","**Syntactical bootstrapping**","**Underextension**"],"answer":0,"option_notes":["**Fast-mapping**：听过新词被应用几次（甚至一次）后快速掌握词义，13–15 个月起出现。","**Overregularization** 是把语法规则过度泛化（mice→mouses），属语法而非词义推断。","**Syntactical bootstrapping** 是从句子结构推断词义（gorping 例），题干靠对比线索而非句法。","**Underextension** 是用词范围过窄（“猫”只指自家猫），属已学词的使用错误。"],"explain":"词义推断有两条路径：社会/语境线索（如注视者线索）与句法线索（**syntactical bootstrapping**）。快速映射说明儿童能在极少接触下建立词—义联结，是词汇爆发的重要机制。","source":"L4 p.42","tags":["fast-mapping","word learning","bootstrapping"],"stem_en":"A teacher asks a child to 'get the celadon block, not the blue one', and the child infers the meaning of 'celadon' from this. This is:","options_en":["**Fast-mapping**","**Overregularization**","**Syntactical bootstrapping**","**Underextension**"]},{"id":"d1-l4-018","day":1,"lecture":4,"topic":"词义错误","difficulty":2,"type":"direct","stem":"幼儿把“猫”用于所有有毛动物；另一个幼儿用“猫”只指自家那只猫。这两类错误依次是？","options":["**fast-mapping**；**bootstrapping**","**overextension**；**underextension**","**underextension**；**overextension**","**holophrase**；**overregularization**"],"answer":1,"option_notes":["快速映射与句法启动是词义学习机制，不是用词范围错误。","**Overextension**＝过度概括（“猫”指所有有毛动物）；**underextension**＝范围过窄（只指自家猫）。","顺序反了：题干先“所有有毛动物”是过度扩展，后“只指自家猫”是扩展不足。","**Holophrase** 是单词句，**overregularization** 是语法规则泛化，均不符。"],"explain":"儿童掌握词义时会出现两种方向相反的错误：范围过宽（**overextension**）与范围过窄（**underextension**）。随词汇与类别知识增长，两者逐渐收窄到成人范围。","source":"L4 p.43","tags":["overextension","underextension","word meaning"],"stem_en":"One child uses 'cat' for all furry animals, while another child uses 'cat' only for the family cat. These two types of error are, respectively:","options_en":["**fast-mapping**; **bootstrapping**","**overextension**; **underextension**","**underextension**; **overextension**","**holophrase**; **overregularization**"]},{"id":"d1-l4-019","day":1,"lecture":4,"topic":"电报句期","difficulty":1,"type":"direct","stem":"幼儿说“妈妈喝”而不是“喝妈妈”，说明他已意识到什么在传达意义中的重要性？","options":["动词时态标记","被动句的结构","语素的复合方式","词序在传达意义中的重要性"],"answer":3,"option_notes":["时态标记（-ed 等）属 **grammatical morphemes**，要到学前期才按顺序习得。","被动句要到 4–5 岁以后仍常被误解，不属 18–24 个月的特征。","语素复合是构词现象（心+情），题干是句子层面的词序问题。","**Telegraphic speech** 阶段儿童已意识到词序重要，“妈妈喝”与“喝妈妈”意义不同。"],"explain":"**Telegraphic speech** 约 18–24 个月开始：只保留实词、省略功能词，如“妈妈袜”可依语境表示“这是妈妈的袜子”或“妈妈在给我穿袜子”。词序意识说明 **syntax** 发展已启动。","source":"L4 p.45","tags":["telegraphic speech","word order","syntax"],"stem_en":"A toddler says 'Mommy drink' rather than 'Drink Mommy'. What has the child realized is important for conveying meaning?","options_en":["Verb tense markers","The structure of passive sentences","The way morphemes are compounded","The importance of word order in conveying meaning"]},{"id":"d1-l4-020","day":1,"lecture":4,"topic":"语法语素","difficulty":1,"type":"direct","stem":"儿童把不规则复数 mice 说成 mouses。这一现象称为？","options":["**Underextension**","**Telegraphic speech**","**Overregularization**","**Fast-mapping**"],"answer":2,"option_notes":["**Underextension** 指词义范围过窄（“猫”只指自家猫），与语法泛化无关。","**Telegraphic speech** 指电报式双词句，省略功能词，不是形态规则泛化。","**Overregularization**（过度规则化）：把语法规则过度泛化到不规则情况，如 mice→mouses。","**Fast-mapping** 指快速掌握新词义，不是语法泛化错误。"],"explain":"过度规则化其实是好消息：说明儿童已抽象出复数规则（-s），只是尚未学会不规则例外。学前期（2.5–5 岁）语法语素按固定顺序习得，早期语素语义/句法复杂度较低。","source":"L4 p.47","tags":["overregularization","grammatical morphemes","preschool"],"stem_en":"When a young child says 'mouses' instead of the irregular plural 'mice', which phenomenon does this illustrate?","options_en":["**Underextension**","**Telegraphic speech**","**Overregularization**","**Fast-mapping**"]},{"id":"d1-l5-001","day":1,"lecture":5,"topic":"情绪表达","difficulty":1,"type":"direct","stem":"**Table 10.1** 把情绪分为基本情绪与 **self-conscious emotions**（自我意识情绪）。下列哪一组全部属于后者？","stem_en":"According to **Table 10.1**, emotions are divided into basic emotions and **self-conscious emotions**, which require self-awareness and the ability to evaluate one's own behaviour against standards. Which of the following groups consists entirely of **self-conscious emotions**?","options":["**embarrassment**、**guilt**、**shame**","**anger**、**fear**、**sadness**","**interest**、**disgust**、**distress**","**surprise**、**joy**、**envy**"],"options_en":["**embarrassment**, **guilt**, **shame**","**anger**, **fear**, **sadness**","**interest**, **disgust**, **distress**","**surprise**, **joy**, **envy**"],"answer":0,"option_notes":["尴尬、内疚、羞耻均需自我意识与按标准评价自身行为，属 **self-conscious emotions**。","**anger**、**fear**、**sadness** 是最早出现的基本情绪，健康婴儿在相同年龄出现。","**interest** 与 **distress** 在出生时已有，属生物决定的基本情绪。","**envy** 属自我意识情绪，但 **surprise** 与 **joy** 是基本情绪，故本组不全属于后者。"],"explain":"**Table 10.1** 把情绪分两大类：基本情绪出生即有、跨文化解读相似；**self-conscious** 与 **self-evaluative** 情绪（尴尬、嫉妒、内疚、自豪、羞耻）需自我意识与按标准评价自身行为的认知能力，出现较晚。","source":"L5 p.4","tags":["self-conscious emotions","basic emotions","Table 10.1"]},{"id":"d1-l5-002","day":1,"lecture":5,"topic":"情绪自我调节","difficulty":1,"type":"direct","stem":"3–4 岁幼儿在 **effortful control**（努力控制）上有明显进步，其典型表现是什么？","stem_en":"Children aged 3–4 show marked improvement in **effortful control**, a key aspect of emotional self-regulation in early childhood. Which of the following behaviours is a typical sign of this developmental change?","options":["开始会掩饰真实情绪，难过也微笑","情绪爆发次数增多，用哭闹表达需求","能用语言说出多种调节策略，并抑制冲动、转移注意力","完全依靠照料者安抚，不会转移注意力"],"options_en":["They begin to disguise their true emotions and smile even when sad","Emotional outbursts become more frequent, and crying expresses every need","They can verbalise several strategies, inhibit impulses and shift attention","They rely entirely on caregivers to soothe them and never shift attention"],"answer":2,"option_notes":["掩饰真实情绪属 **emotional display rules**，但不是 **effortful control** 的定义。","PPT 指出此阶段情绪爆发“减少”，说爆增与事实相反。","**effortful control** 指抑制冲动并转移注意力；3–4 岁还能用语言说出多种调节策略。","依靠照料者安抚是 6 个月前后年幼婴儿的模式，3–4 岁已明显减少。"],"explain":"情绪自我调节随大脑皮层发育与照料者协助而提升：年幼婴儿靠照料者安抚，学步期会分散注意，3–4 岁能用语言说出策略、情绪爆发减少；**effortful control** 即抑制冲动与转移注意力。","source":"L5 p.7","tags":["effortful control","emotional self-regulation"]},{"id":"d1-l5-003","day":1,"lecture":5,"topic":"情绪表达规则","difficulty":2,"type":"direct","stem":"关于儿童习得 **emotional display rules**（情绪表达规则）的发展，下列哪一项陈述最符合 PPT？","stem_en":"Children gradually acquire **emotional display rules**, the social norms for adjusting emotional expressions to fit expectations. Which of the following statements about their development in childhood best matches the lecture?","options":["儿童要到 7–9 岁才开始掩饰真实情绪","3 岁已能掩饰真实情绪，但 13 岁仍难以抑制愤怒","3 岁能掩饰真实情绪，13 岁时已能完全抑制愤怒","情绪表达规则与抵抗同伴压力的能力无关"],"options_en":["Children cannot disguise their true feelings until about 7–9 years of age","Three-year-olds can disguise true feelings, but at 13 children still find it hard to suppress anger","Three-year-olds can disguise true feelings, and by 13 they can fully suppress anger","Display rules are unrelated to the ability to resist peer pressure"],"answer":1,"option_notes":["PPT 指出 3 岁就能掩饰真实情绪，7–9 岁的说法把年龄推后了。","3 岁能掩饰真实情绪，但到 13 岁仍难抑制愤怒；这种能力与亲社会、抗同伴压力相关。","13 岁仍难以抑制愤怒，“已能完全抑制”与 PPT 相反。","相反：年长青少年的这种能力与更亲社会、更能抵抗同伴压力相关。"],"explain":"**Emotional display rules** 指按社会期待调整情绪表达。掩饰真实情绪约 3 岁出现，但抑制愤怒到青春期后段才较成熟；这种能力是社交适应的指标，与亲社会行为及抵抗同伴压力相关。","source":"L5 p.10","tags":["emotional display rules","social development"]},{"id":"d1-l5-004","day":1,"lecture":5,"topic":"气质定义","difficulty":1,"type":"direct","stem":"**Rothbart & Bates** 如何定义 **temperament**（气质）？下列哪项最符合？","stem_en":"In the lecture, **Rothbart & Bates** offered a well-known definition of **temperament** that is widely used in developmental psychology. Which of the following statements best matches their definition of this concept?","options":["儿童在智力测验上的稳定排名与学业表现","由照料者教养方式塑造的行为习惯","婴儿与照料者之间形成的强烈情感纽带","以体质为基础、在情绪、动作、注意力反应性与自我调节上的个体差异"],"options_en":["A child's stable rank on intelligence tests and academic performance","Behavioural habits shaped by caregivers' child-rearing practices","The strong emotional bond formed between an infant and a caregiver","Constitutionally based individual differences in emotional, motor and attentional reactivity and self-regulation"],"answer":3,"option_notes":["这是学业能力与 IQ 的稳定表现，不是气质的定义。","教养方式属环境因素；气质强调的是体质基础与早期反应风格。","这是 **attachment** 的定义：与重要他人形成的强烈情感纽带。","气质＝**constitutionally based** 的个体差异，涵盖情绪、动作、注意反应性与自我调节。"],"explain":"**Temperament** 是个体的行为风格与典型反应方式，被视为人格的生物与情绪基础。注意与 **attachment**（情感纽带）及后天教养塑造的行为区分；PPT 引 **Rothbart & Bates**（1998）的定义。","source":"L5 p.12","tags":["temperament","Rothbart & Bates","attachment"]},{"id":"d1-l5-005","day":1,"lecture":5,"topic":"气质类型","difficulty":2,"type":"direct","stem":"一名 10 个月婴儿情绪多为消极、吃睡等身体机能不规律、适应差、反应强烈。按 **Thomas & Chess** 的分类，他属于哪一型、约占多少？","stem_en":"A 10-month-old infant is mostly in a negative mood, has irregular eating and sleeping rhythms, adapts poorly to change and reacts intensely. According to **Thomas & Chess**, which temperament type is this, and about what proportion of children show it?","options":["**easy temperament**，约 40%","**difficult temperament**，约 10%","**slow-to-warm-up**，约 15%","**others**，约 35%"],"options_en":["**easy temperament**, about 40%","**difficult temperament**, about 10%","**slow-to-warm-up**, about 15%","**others**, about 35%"],"answer":1,"option_notes":["**easy** 型情绪积极、身体机能规律、适应性强、反应温和，与题干相反。","**difficult** 型正是情绪消极、身体机能不规律、适应差、反应强烈，约占 10%。","**slow-to-warm-up** 型活动量低、对新奇事物退缩、反应温和，情绪并非以消极为主。","**others**（35%）在任何维度上都没有明显偏高或偏低，题干特征已很鲜明。"],"explain":"**Thomas & Chess** 依情绪质量、节律性、适应性、反应强度等维度分出三类气质：easy（40%）、difficult（10%）、slow-to-warm-up（15%），其余 35% 归为 **others**。","source":"L5 p.13","tags":["temperament types","difficult temperament","Thomas & Chess"]},{"id":"d1-l5-006","day":1,"lecture":5,"topic":"依恋文化差异","difficulty":2,"type":"direct","stem":"关于依恋类型的**文化差异**，下列哪一项符合 PPT 的描述？","stem_en":"Some form of secure attachment appears in every culture, yet attachment types vary considerably across cultures. Which of the following statements about **cultural differences** in attachment best matches the lecture?","options":["日本与以色列婴儿更易成为矛盾型，德国婴儿更易成为回避型","安全型依恋只出现在西方文化中","德国母亲刻意培养依赖，故德国婴儿多为矛盾型","所有文化中安全型依恋都最少见"],"options_en":["Japanese and Israeli infants are more likely to be ambivalent, and German infants more likely to be avoidant","Secure attachment appears only in Western cultures","German mothers deliberately foster dependence, so most German infants are ambivalent","Secure attachment is the least common type in every culture"],"answer":0,"option_notes":["日本母亲很少与婴儿分离、以色列儿童在集体环境长大，故更易见矛盾型；德国母亲明确训练独立，故更易见回避型。","所有文化都出现安全型依恋，且它是最常见的类型。","德国母亲训练的是独立而非依赖，因此对应的是回避型。","安全型依恋在各文化中都是最常见的一类，不是最少见。"],"explain":"依恋有文化差异，但**安全型**仍是全球最常见类型：日本（母婴少分离）与以色列（集体养育）婴儿更易被归为**ambivalent**，德国母亲强调独立训练，婴儿更易归为**avoidant**。测量工具与养育常规本身也会造成差异。","source":"L5 p.36","tags":["cultural variations","ambivalent attachment","avoidant attachment"]},{"id":"d1-l5-007","day":1,"lecture":5,"topic":"气质环境与文化","difficulty":3,"type":"direct","stem":"关于气质的共享环境、非共享环境与文化影响，下列哪项符合 PPT？","stem_en":"Which of the following statements about **temperament** best matches the lecture?","options":["同卵双胞胎气质相似度低于异卵双胞胎","共享环境主要影响消极方面，如对陌生人不安","害羞内敛在美国处于社交劣势，但在亚洲文化受重视","非共享环境主要影响微笑、社交性等积极方面"],"options_en":["Identical twins are less similar in temperament than fraternal twins","Shared environment mainly influences negative aspects such as unease with strangers","Shyness is a social disadvantage in the United States but is valued in Asian cultures","Nonshared environment mainly influences positive aspects such as smiling and sociability"],"answer":2,"option_notes":["双生子研究结论相反：同卵比异卵更相似，气质属中度可遗传。","PPT 说共享环境影响积极方面（微笑、社交性、安抚性），非共享环境才针对消极方面。","害羞内敛在美国是社交劣势，在亚洲文化受重视，在瑞典也较被认可。","非共享环境影响消极方面，例如对陌生人感到不安，不是积极方面。"],"explain":"气质约中度可遗传（同卵比异卵更相似）。环境影响要分共享（家庭氛围，利于微笑、社交性）与非共享（独特经历，带来对陌生人的不安）；同一气质在不同文化评价不同，害羞在亚洲文化反而受重视。","source":"L5 p.18","tags":["temperament","shared environment","culture"]},{"id":"d1-l5-008","day":1,"lecture":5,"topic":"依恋与同步性","difficulty":1,"type":"direct","stem":"在依恋研究中，**interactional synchrony**（互动同步性）指的是什么？","stem_en":"In research on attachment, **interactional synchrony** is thought to be an important basis for the emotional bond between infant and caregiver. What exactly does this term refer to according to the lecture?","options":["婴儿对陌生人表现出的警觉与退缩","婴儿与照料者分离时产生的焦虑反应","照料者按固定时间表喂养婴儿的作息安排","婴儿与照料者之间协调、同步的日常互动"],"options_en":["The wariness and withdrawal an infant shows towards strangers","The anxious reaction an infant shows when separated from the caregiver","A caregiver's fixed feeding schedule for the infant","Coordinated, synchronised routines of interaction between infant and caregiver"],"answer":3,"option_notes":["这是 **stranger anxiety**，属依恋相关恐惧，不是同步性。","这是 **separation anxiety**，指分离引发的焦虑。","固定时间表喂养不是同步性；同步性强调互动中双向的协调与呼应。","**interactional synchrony**＝协调的互动常规（synchronized routines），对情感依恋至关重要。"],"explain":"**Attachment** 是与生命中重要他人形成的强烈情感纽带，且是双向的；**interactional synchrony** 指照料者与婴儿之间协调、同步的互动常规，是形成情感依恋的重要基础。","source":"L5 p.19","tags":["attachment","interactional synchrony"]},{"id":"d1-l5-009","day":1,"lecture":5,"topic":"依恋发展阶段","difficulty":1,"type":"direct","stem":"婴儿首次建立真正的依恋、偏爱特定个体，并把该个体当作探索世界的安全基地。这属于哪个阶段？","stem_en":"An infant forms a first true attachment, favours one particular person and uses that person as a secure base for exploration. Which phase of attachment development, as described in the lecture, is this?","options":["**asocial**（0–6 周）","**specific attachment**（7–9 个月）","**multiple attachments**（9–18 个月）","**indiscriminate**（6 周–6/7 个月）"],"options_en":["**asocial** (0–6 weeks)","**specific attachment** (7–9 months)","**multiple attachments** (9–18 months)","**indiscriminate** (6 weeks–6/7 months)"],"answer":1,"option_notes":["**asocial phase** 对社交与非社交刺激都产生积极反应，尚无依恋对象。","**specific attachment phase** 首次建立真正依恋、偏爱一人，并以之作为探索的 **secure base**。","多重依恋阶段已对多位家人、保姆产生依恋，发生在特定依恋之后。","无差别依恋阶段只是偏爱某些人，但不排斥任何人，尚未形成真正依恋。"],"explain":"依恋发展四阶段：**asocial**（0–6 周）→ **indiscriminate**（6 周–6/7 个月）→ **specific**（7–9 个月，出现真正依恋与 **secure base**）→ **multiple**（9–18 个月，扩展到其他家人与保姆）。","source":"L5 p.20","tags":["attachment development","specific attachment","secure base"]},{"id":"d1-l5-010","day":1,"lecture":5,"topic":"依恋理论","difficulty":2,"type":"direct","stem":"“我爱你，因为你奖励我”这句话最能代表哪一种依恋理论的观点？","stem_en":"The statement 'I love you because you reward me' summarises one classic explanation of how attachment forms. Which theory of attachment does it best represent according to the lecture material?","options":["**learning theory**（学习理论）","**psychoanalytic theory**（精神分析理论）","**cognitive-developmental theory**（认知发展）","**ethological viewpoint**（习性学观点）"],"options_en":["**learning theory**","**psychoanalytic theory**","**cognitive-developmental theory**","**ethological viewpoint**"],"answer":0,"option_notes":["**learning theory**：喂养带来舒适与奖励，婴儿因被奖励而爱照料者。","精神分析的说法是“我爱你，因为你喂养我”，强调口唇期满足与共生关系。","认知发展理论的说法是“要爱你，我必须知道你会一直在那里”，强调客体永久性。","习性学（**Lorenz**、**Bowlby**）强调依恋的先天性与生存价值，不谈奖励。"],"explain":"四种理论各有口号：精神分析“因你喂养我”、学习理论“因你奖励我”、认知发展“知道你会在那里”、习性学强调天生倾向与接近性行为。题干关键词是“奖励”，对应学习理论。","source":"L5 p.22","tags":["attachment theories","learning theory","Bowlby"]},{"id":"d1-l5-011","day":1,"lecture":5,"topic":"Harlow 研究","difficulty":1,"type":"direct","stem":"**Harlow** 的恒河猴实验，对依恋理论最重要的启示是什么？","stem_en":"In **Harlow**'s studies, infant rhesus monkeys were reared with wire and cloth surrogate mothers. What was the most important implication of these studies for attachment theory, as presented in the lecture?","options":["依恋完全由喂养行为决定，食物最重要","依恋是后天习得的，与本能无关","**contact comfort** 对依恋比食物更重要","依恋建立依赖 **object permanence** 的发展"],"options_en":["Attachment is entirely determined by feeding; food is the most important thing","Attachment is learned and has nothing to do with instinct","**contact comfort** is more important for attachment than food","Attachment depends on the development of **object permanence**"],"answer":2,"option_notes":["实验否定喂养决定论：幼猴即使由铁丝“妈妈”供奶，也长时间依附绒布妈妈。","**Harlow** 反而认为建立牢固情感联结的能力是天生的，具生存价值。","**contact comfort** 比食物更重要，说明依恋不是由喂养满足单独产生。","**object permanence** 属认知发展理论对依恋的解释（7–9 个月），不是 **Harlow** 实验的结论。"],"explain":"**Harlow** 发现幼猴更依恋提供接触舒适的绒布“妈妈”而非供奶的铁丝“妈妈”。由此推论：建立情感联结的能力是**天生的**、有生存价值，并靠创造与维持接近性的本能行为维系。","source":"L5 p.23","tags":["Harlow","contact comfort","attachment"]},{"id":"d1-l5-012","day":1,"lecture":5,"topic":"依恋相关恐惧","difficulty":1,"type":"direct","stem":"关于 **stranger anxiety** 与 **separation anxiety** 的出现年龄与高峰，下列哪项正确？","stem_en":"Which of the following statements about the typical onset and peak ages of both **stranger anxiety** and **separation anxiety** in infancy is correct according to the lecture material on attachment?","options":["陌生人焦虑 6–8 个月出现、14–18 个月达峰；分离焦虑 8–10 个月达峰","陌生人焦虑 8–10 个月达峰；分离焦虑 6–8 个月出现、14–18 个月达峰","两者都在出生时出现，3 岁同步消失","分离焦虑 8–10 个月达峰；陌生人焦虑 14–18 个月达峰"],"options_en":["Stranger anxiety appears at 6–8 months and peaks at 14–18 months; separation anxiety peaks at 8–10 months","Stranger anxiety peaks at 8–10 months; separation anxiety appears at 6–8 months and peaks at 14–18 months","Both appear at birth and disappear together at age 3","Separation anxiety peaks at 8–10 months; stranger anxiety peaks at 14–18 months"],"answer":1,"option_notes":["把两者年龄对调了：6–8 个月出现、14–18 个月达峰的是分离焦虑。","陌生人焦虑约在主要依恋形成时开始、8–10 个月达峰；分离焦虑 6–8 个月出现、14–18 个月达峰。","两者都有明显发展时间表，并非出生即出现或 3 岁同步消失。","同样对调：陌生人焦虑峰在 8–10 个月，分离焦虑峰在 14–18 个月。"],"explain":"两种依恋相关恐惧的高峰不同步：**stranger anxiety** 随主要依恋形成而出现，8–10 个月达峰后下降；**separation anxiety** 6–8 个月出现、14–18 个月达峰，之后逐渐减弱，青少年仍可能见到。","source":"L5 p.25","tags":["stranger anxiety","separation anxiety"]},{"id":"d1-l5-013","day":1,"lecture":5,"topic":"Strange Situation","difficulty":2,"type":"direct","stem":"**Ainsworth** 的 **Strange Situation** 共 8 个片段，最能区分依恋类型的编码观察点是？","stem_en":"**Ainsworth**'s **Strange Situation** consists of eight standardised episodes that are coded in detail. Which observation from the episodes is the most important coding focus for distinguishing the four attachment types in the lecture?","options":["游戏质量（**quality of play**）","对陌生人的反应","被陌生人安抚的能力","分离时的反应与重聚时的反应"],"options_en":["Quality of play","The infant's reaction to the stranger","The infant's ability to be soothed by the stranger","The infant's reaction at separation and at reunion"],"answer":3,"option_notes":["游戏质量是观察项之一，但不足以区分依恋类型。","对陌生人的反应会被记录，但不是分类的主要依据。","能否被陌生人安抚是观察项之一，仍非分类关键。","程序安排两次分离与两次重聚，重点编码分离焦虑与 **reunion**（重聚）反应。"],"explain":"**Strange Situation** 以 8 个标准化片段观察游戏质量、对陌生人的反应、分离焦虑、能否被陌生人安抚，以及两次**重聚**反应。依恋分类主要依据“分离 + 重聚”的模式，而非单一片段。","source":"L5 p.26","tags":["Strange Situation","Ainsworth","reunion"]},{"id":"d1-l5-014","day":1,"lecture":5,"topic":"依恋类型","difficulty":2,"type":"direct","stem":"一名 12 个月婴儿分离前少探索、紧贴母亲；分离时极度痛苦；重聚时既想亲近又抗拒身体接触；母亲在场仍戒备陌生人。最可能是哪种依恋？","stem_en":"A 12-month-old explores little and clings to the mother before separation, is extremely distressed during separation, both seeks closeness and resists physical contact at reunion, and remains wary of strangers even when the mother is present. Which attachment type is most likely?","options":["**resistant attachment**（抗拒型）","**secure attachment**（安全型）","**avoidant attachment**（回避型）","**disorganized attachment**（混乱型）"],"options_en":["**resistant attachment**","**secure attachment**","**avoidant attachment**","**disorganized attachment**"],"answer":0,"option_notes":["**resistant** 型少探索、分离时极痛苦、重聚矛盾纠结、母亲在场仍戒备，全部吻合。","**secure** 型会探索、以母亲为安全基地、重聚时热情寻求安慰，与题干不符。","**avoidant** 型分离时几乎不痛苦、重聚时忽略母亲，与题干相反。","**disorganized** 型是接近与回避的困惑混杂，属最不安全类型，题干更符合抗拒型。"],"explain":"四种依恋按“探索、分离反应、重聚反应、对陌生人”区分：**secure** 以母亲作安全基地、重聚可被安抚；**resistant** 高焦虑且重聚矛盾；**avoidant** 冷淡回避；**disorganized** 混乱无组织。","source":"L5 p.27","tags":["attachment types","resistant attachment","Strange Situation"]},{"id":"d1-l5-015","day":1,"lecture":5,"topic":"依恋类型","difficulty":2,"type":"direct","stem":"婴儿重聚时在“接近母亲”与“回避母亲”之间表现困惑、动作无组织。这一依恋类型及特点是什么？","stem_en":"At reunion, an infant seems confused between approaching and avoiding the mother and shows disorganised movements. Which attachment type is this, and what are its defining features according to the lecture?","options":["**secure attachment**，最常见（65%）","**avoidant attachment**，约占 20%","**disorganized/disoriented**，最不安全（5%）","**resistant attachment**，约占 10%"],"options_en":["**secure attachment**, the most common (65%)","**avoidant attachment**, about 20%","**disorganized/disoriented**, the most insecure (5%)","**resistant attachment**, about 10%"],"answer":2,"option_notes":["**secure** 重聚时会主动寻求安慰、可被安抚，不是接近—回避的困惑。","**avoidant** 型对母亲离开几乎无痛苦、重聚时忽略母亲，是“有组织”的回避。","**disorganized/disoriented** 是最不安全类型（约 5%），重聚时接近与回避并存、表现困惑。","**resistant** 型重聚时矛盾纠结但仍以接近母亲为主，约占 10%。"],"explain":"**Disorganized/disoriented attachment** 比例最低（约 5%），特征是重聚时接近与回避并存、动作刻板或无目的，常见于被忽视或受虐的儿童；它与其他三种“有组织”的应对策略不同。","source":"L5 p.28","tags":["disorganized attachment","Strange Situation"]},{"id":"d1-l5-016","day":1,"lecture":5,"topic":"内部工作模型","difficulty":2,"type":"direct","stem":"**Bartholomew & Horowitz** 的成人依恋四风格，是由哪两个“工作模型”维度组合而成？","stem_en":"**Bartholomew & Horowitz** described four adult attachment styles derived from working models of self and others. Which two dimensions are combined to produce these four styles in the lecture material?","options":["情绪表达规则与情绪调节策略","自我模型（我是否可爱）与他人模型（他人是否可靠）","气质类型与父母教养方式","探索行为与分离焦虑的强度"],"options_en":["Emotional display rules and emotion-regulation strategies","The self model (am I lovable?) and the other model (are others dependable?)","Temperament type and parental child-rearing style","Exploration behaviour and the intensity of separation anxiety"],"answer":1,"option_notes":["情绪表达规则与调节策略属情绪发展主题，不是工作模型的两个维度。","2×2 组合：积极或消极的自我模型 × 他人模型，得到安全、痴迷、疏离、恐惧四型。","气质与教养是依恋的前因，不是工作模型本身的维度。","探索与分离焦虑是 **Strange Situation** 的观察行为，不是工作模型的维度。"],"explain":"依恋质量能预测后续发展，是因为它构成**内部工作模型**（cognitive representations）：他人是否可靠、我是否可爱。两维度交叉成安全、痴迷、疏离、恐惧四种风格，分别对应四种早期依恋类型。","source":"L5 p.29","tags":["internal working model","Bartholomew & Horowitz"]},{"id":"d1-l5-017","day":1,"lecture":5,"topic":"依恋长期影响","difficulty":1,"type":"direct","stem":"关于依恋质量的长期影响与稳定性，下列哪一项研究结论符合 PPT？","stem_en":"According to the lecture, which conclusion about the long-term effects and stability of attachment quality is correct?","options":["12 个月安全型的儿童到 6 岁几乎都转为不安全型","早期依恋与青春期领导力、自尊没有关系","混乱型依恋的稳定性高于安全型依恋","安全型依恋儿童更善社交、情绪更成熟，青春期更可能成为领导者"],"options_en":["Children secure at 12 months almost all become insecure by age 6","Early attachment is unrelated to adolescent leadership or self-esteem","Disorganized attachment is more stable than secure attachment","Securely attached children are more sociable and emotionally mature, and are more likely to become leaders in adolescence"],"answer":3,"option_notes":["研究显示 12 个月安全型儿童 100% 在 6 岁仍安全，并非转为不安全。","追踪研究：婴儿期安全型者 11 岁时更自信、社交能力更强、自尊更高。","安全型稳定性最高（100%），混乱型约 66%，故此项说反了。","安全型依恋者更善社交、情绪更成熟，优势延续至青春期：更可能成为领导者、自尊更高。"],"explain":"依恋有高度稳定性（12 个月安全型者 6 岁时 100% 仍安全，混乱型 66%），但存在显著例外。稳定之外，安全型依恋与更好的社交能力、情绪成熟度、青春期领导力与自尊相关。","source":"L5 p.33","tags":["attachment stability","long-term outcomes"]},{"id":"d1-l5-018","day":1,"lecture":5,"topic":"照护质量","difficulty":3,"type":"direct","stem":"按 **caregiving hypothesis**，下列“依恋类型—照护方式”的配对，哪一项正确？","stem_en":"According to the **caregiving hypothesis**, each attachment type is associated with a distinctive pattern of caregiving quality. Which of the following attachment–caregiving pairings described in the lecture material is correct?","options":["**secure**：父母照护前后不一致","**resistant**：父母缺乏耐心、过度刺激","**avoidant**：父母敏感、回应迅速","**disorganized**：常被忽视或虐待"],"options_en":["**secure**: parents are inconsistent in their caregiving","**resistant**: parents lack patience and overstimulate the infant","**avoidant**: parents are sensitive and respond promptly","**disorganized**: the infant is often neglected or abused"],"answer":3,"option_notes":["**secure** 的父母敏感、回应迅速；照护前后不一致对应的是 **resistant**。","**resistant** 的父母照护前后不一致；缺乏耐心、过度刺激对应 **avoidant**。","**avoidant** 的父母缺乏耐心、反应迟钝或过度刺激；敏感回应是 **secure** 的特征。","**disorganized** 婴儿常被忽视或虐待，与 PPT 的照护质量描述完全吻合。"],"explain":"**Caregiving hypothesis** 把依恋类型与照护方式连起来：**secure**—敏感、及时回应；**resistant**—照护前后不一致；**avoidant**—缺乏耐心、反应迟钝或过度刺激；**disorganized**—常被忽视或虐待。四个配对只有一项成立。","source":"L5 p.42","tags":["caregiving hypothesis","attachment quality","caregiving"]},{"id":"d1-l6-001","day":1,"lecture":6,"topic":"自我识别","difficulty":1,"type":"direct","stem":"4–5 岁儿童出现的 **extended self**（扩展自我）指的是什么？","stem_en":"Children aged 4–5 begin to show **extended self**, a further step in the development of self-recognition. What exactly does this concept refer to in the lecture on the development of the self-concept?","options":["能在镜子中认出镜中的影像是自己","把过去、现在与未来的自我表征整合为随时间延续的自我","把自己与周围环境区分开，知道自己能引发事件","能准确说出教师对自己的评价"],"options_en":["Being able to recognise the image in a mirror as oneself","Integrating past, present and future self-representations into a self that endures over time","Distinguishing oneself from the surrounding environment and knowing that one can cause events","Being able to state accurately how teachers evaluate oneself"],"answer":1,"option_notes":["镜中自我识别在 18–24 个月已出现，早于 **extended self**。","**extended self** 整合过去、现在与未来的自我表征，形成随时间延续的“我”，这正是 4–5 岁的特点。","这是约 2 个月出现的 **self-differentiation**（有限自主感），不是扩展自我。","理解他人评价属自我评价与自尊的发展，与扩展自我不同。"],"explain":"自我识别路线：2 个月自我分化（有限自主感）→ 5 个月认识熟悉的自我 → 18–24 个月镜子识别 → 2–3 岁限于当下自我 → 4–5 岁 **extended self**（整合过去、现在与未来）。","source":"L6 p.5","tags":["self-recognition","extended self"]},{"id":"d1-l6-002","day":1,"lecture":6,"topic":"自我识别影响因素","difficulty":1,"type":"direct","stem":"关于 **self-recognition**（自我识别）的影响因素，下列哪项符合 PPT？","stem_en":"Several different factors contribute to the development of **self-recognition** in infancy, and their roles differ. Which of the following statements about these contributors best matches the lecture material on self-recognition?","options":["有无照镜子的经验是决定性因素","不安全型依恋的儿童更早出现自我识别","父母的描述性信息是必要条件，认知发展不是","认知发展是必要条件；强调自主性的文化中自我识别出现更早"],"options_en":["Experience with mirrors is the decisive factor","Insecurely attached children show self-recognition earlier","Parental descriptive information is necessary, whereas cognitive development is not","Cognitive development is necessary, and self-recognition appears earlier in cultures that stress autonomy"],"answer":3,"option_notes":["无镜子经验的游牧部落婴儿与城市儿童同龄即能认出自己，说明经验非决定因素。","安全型依恋儿童自我识别出现更早；依恋安全是促进因素。","认知发展才是必要条件；父母描述性信息只是促进因素之一。","认知发展是必要前提；文化强调自主性时自我识别出现更早（**Keller** 等研究）。"],"explain":"自我识别需要认知成熟作为必要前提，但不是自动发生：安全型依恋、父母提供描述性信息、强调自主性的文化都会让它更早出现。游牧部落婴儿无镜子经验也能同年认出自己，说明经验不是关键。","source":"L6 p.7","tags":["self-recognition","secure attachment","culture"]},{"id":"d1-l6-003","day":1,"lecture":6,"topic":"学龄前自我描述","difficulty":2,"type":"direct","stem":"4 岁儿童回答“我是谁”时说：“我是有红头发的女孩，我有一只狗，会骑自行车，会帮妈妈做事。”这最符合哪一特点？","stem_en":"Asked 'Who am I?', a 4-year-old says: 'I am a girl with red hair, I have a dog, I can ride a bike, and I help mummy.' Which developmental feature does this best illustrate?","options":["3–5 岁儿童只用身体特征、所有物与行为描述自我","已能用心理特质与抽象性格描述自我","已能通过社会比较整合他人评价","已完全整合过去、现在与未来的自我表征"],"options_en":["Children aged 3–5 describe themselves only in terms of physical characteristics, possessions and actions","They can already describe themselves with psychological traits and abstract dispositions","They can already integrate others' evaluations through social comparison","They have fully integrated past, present and future self-representations"],"answer":0,"option_notes":["**Keller** 等发现 3–5 岁儿童仅从外貌、所有物与行为描述自我，与题干完全吻合。","以心理建构描述自我是童年中期至青春期的特点，4 岁尚未达到。","社会比较与整合他人评价属 8 岁以后、学龄期的自我概念发展。","**extended self** 在 4–5 岁萌芽，但题干内容全是当下的身体、所有物与行为描述。"],"explain":"3½–5 岁儿童的“我是谁”答案以身体特征、所有物与行为为主；抽象的心理建构要到童年中期以后才成为自我描述的核心。题干四个描述分别属外貌、所有物与行为三类。","source":"L6 p.9","tags":["self-concept","preschool","Keller"]},{"id":"d1-l6-004","day":1,"lecture":6,"topic":"文化自我概念","difficulty":1,"type":"direct","stem":"**Figure 11.2** 的“我是谁”研究，美国学生与日本学生在自我描述上最典型的差异是什么？","stem_en":"In the 'Who am I?' study shown in **Figure 11.2** of the lecture, what was the most typical difference between the self-descriptions of American and Japanese students, as reported in the study?","options":["美国学生多用社会关系描述，日本学生多用个人特质","两组学生的自我描述完全相同","美国学生更倾向个人／个人主义描述，日本学生更倾向社会／关系描述","日本学生比美国学生更常提到“我很聪明”"],"options_en":["American students described themselves more in terms of social relationships, and Japanese students more in terms of personal traits","The self-descriptions of the two groups were completely identical","American students favoured personal or individualistic descriptions, whereas Japanese students favoured social or relational ones","Japanese students mentioned 'I am smart' more often than American students"],"answer":2,"option_notes":["方向相反：美国偏个人主义（如“我很聪明”），日本偏社会关系（如“我是个好女儿”）。","跨国比较显示两组自我描述的核心维度有明显差异。","美国学生多列个人／个人主义属性，日本学生多列社会／关系属性，是 **Figure 11.2** 的核心发现。","“我很聪明”是 PPT 举的美国学生例子；日本学生更常以社会角色描述自己。"],"explain":"自我概念的内容受文化塑造：个人主义文化把个人特质视为自我核心，关系／集体主义文化更强调社会角色与人际联系。因此美国学生多写“我很聪明”，日本学生多写“我是个好女儿”。","source":"L6 p.11","tags":["self-concept","culture","individualism"]},{"id":"d1-l6-005","day":1,"lecture":6,"topic":"自尊定义","difficulty":2,"type":"direct","stem":"**Self-esteem** 与 **self-concept** 的关系，下列哪项最准确？","stem_en":"**Self-esteem** and **self-concept** are related but distinct constructs in developmental psychology. Which of the following statements most clearly and accurately describes the relationship between them as taught in the lecture material?","options":["两者是同义词，都指“你如何看待自己”","自我概念是“你如何看待自己”；自尊是对自我价值的评价与满意度判断","自尊是“你如何看待自己”；自我概念是对自我价值的评价","自我概念只包含学业能力，自尊包含一切"],"options_en":["They are synonyms, both meaning 'how you view yourself'","Self-concept is 'how you view yourself', whereas self-esteem is the evaluation of one's worth and satisfaction with oneself","Self-esteem is 'how you view yourself', whereas self-concept is the evaluation of one's worth","Self-concept covers only academic ability, whereas self-esteem covers everything"],"answer":1,"option_notes":["PPT 明确区分两者：自我概念侧重“我如何看待自己”，自尊侧重评价与满意感。","自尊＝基于自我概念对自身价值的评价；自我概念＝如何看待自己，属不同层次。","把两个定义对调了：自我概念是描述，自尊才是评价。","自我概念涵盖个人特质、角色、价值观等各层面，不止学业能力。"],"explain":"**Self-concept** 回答“我是谁、我如何看待自己”；**self-esteem** 则是我对自己各项特质的评价与满意程度，包含整体性的价值判断。PPT 特别强调这是两个不同概念，不可混用。","source":"L6 p.12","tags":["self-esteem","self-concept"]},{"id":"d1-l6-006","day":1,"lecture":6,"topic":"自尊成分","difficulty":2,"type":"direct","stem":"按 **Harter** 的划分，4–7 岁儿童在自尊量表各项目上都给自己很高分数。最合理的解释是什么？","stem_en":"According to **Harter**, children aged 4–7 give themselves high scores on every item of a self-esteem scale. What is the most reasonable explanation for this developmental pattern according to the lecture?","options":["此阶段儿童已能准确反映教师的评价","此阶段儿童的自尊正处于最低点","此阶段儿童只看重学业成绩单一维度","反映取悦他人的愿望与不切实际的积极自我认知，而非稳固自我价值感"],"options_en":["Children at this stage can already reflect teachers' evaluations accurately","Children at this stage are at the lowest point of their self-esteem","Children at this stage value academic achievement as the only dimension","This reflects a desire to be liked and unrealistically positive self-views rather than a firm sense of self-worth"],"answer":3,"option_notes":["约 8 岁儿童的评价才更贴近他人（教师）的看法；4–7 岁是膨胀的。","自尊在童年期较高、青春期才下降，4–7 岁不是最低点。","**Harter** 列出学业、社会接纳、外貌、运动能力与行为等成分，并非只有学业。","4–7 岁“各方面都积极”（inflated），反映想被喜欢的愿望，而非稳固的自我价值感。"],"explain":"**Harter** 认为自尊由学业、社会接纳、外貌、运动能力、行为等成分组成。4–7 岁儿童普遍过度积极（inflated），更多是想被喜欢；约 8 岁起才较贴近他人评价，青春期出现**关系型自我价值**。","source":"L6 p.14","tags":["self-esteem","Harter","relational self-worth"]},{"id":"d1-l6-007","day":1,"lecture":6,"topic":"自尊社会因素","difficulty":2,"type":"direct","stem":"关于影响 **self-esteem** 的社会因素，下列哪项符合 PPT？","stem_en":"Parents, peers and broader social experiences all contribute to **self-esteem**. Which of the following statements about these social contributors in childhood and adolescence best matches the lecture material on self-esteem?","options":["温暖、支持、民主的教养与高自尊相关；同伴与双亲支持也有利","只有学业成绩影响自尊，教养与同伴都无关","社会比较在任何社会中都与自尊无关","控制型教养方式最有利于形成高自尊"],"options_en":["Warm, supportive and democratic parenting is associated with higher self-esteem, and support from peers and both parents also helps","Only academic achievement affects self-esteem; parenting and peers are irrelevant","Social comparison is unrelated to self-esteem in any society","Controlling parenting is most conducive to high self-esteem"],"answer":0,"option_notes":["温暖、支持、养育／民主的教养与高自尊相关；同伴（尤其密友）与双亲支持同样促进高自尊。","社会因素包括教养方式与同伴影响；学业只是自尊的成分之一。","社会比较（尤其个人主义社会中）是自尊的重要来源。","控制型教养不是高自尊的有利条件；温暖支持的民主式教养才与高自尊相关。"],"explain":"自尊的社会来源主要有两条：家庭的**教养方式**与同伴／双亲的**社会支持**。温暖、支持、民主的教养，加上密友与父母的支持，都与较高自尊相关；个人主义社会中社会比较尤其重要。","source":"L6 p.15","tags":["self-esteem","parenting styles","social comparison"]},{"id":"d1-l6-008","day":1,"lecture":6,"topic":"自尊毕生发展","difficulty":1,"type":"direct","stem":"关于 **self-esteem** 的毕生变化，下列哪项符合 PPT 的描述？","stem_en":"**Self-esteem** follows a characteristic trajectory across the lifespan, from childhood through adulthood to late life. Which of the following statements about its lifelong pattern best matches what the lecture describes?","options":["童年期最低，青春期大幅上升，老年期继续上升","从童年到老年持续下降，成年期最低","童年期高，青春期下降，成年期上升，约 60 岁末达峰，老年期再降","一生保持稳定，不受身体形象与角色变化影响"],"options_en":["It is lowest in childhood, rises sharply in adolescence and continues to rise in old age","It declines steadily from childhood to old age and is lowest in adulthood","It is high in childhood, declines in adolescence, rises in adulthood to a peak in the late 60s, and declines again in old age","It remains stable throughout life and is unaffected by body image or role changes"],"answer":2,"option_notes":["童年期自尊较高、青春期下降，与“童年最低”相反。","成年期自尊因权力与地位提升而上升，并非持续下降。","童年高→青春期降→成年升（60 岁末达峰）→老年降，与 PPT 一致。","自尊会随身体形象、角色与人际变化而波动，并非一生稳定。"],"explain":"自尊呈曲线：幼儿因不切实际的积极自我认知而高；年长儿童与青春期因外部反馈、身体形象与对未来的抽象思考而下降；成年期因权力与地位上升，约 60 岁末达峰；老年期因角色、人际与身体机能变化再降。","source":"L6 p.19","tags":["self-esteem","lifespan development"]},{"id":"d1-l6-009","day":1,"lecture":6,"topic":"香港自尊研究","difficulty":2,"type":"direct","stem":"**Bagley & Tse**（2018）比较香港华人、英籍华人及英籍欧洲青少年，发现高自尊的协变量是什么？","stem_en":"**Bagley & Tse** (2018) compared Hong Kong Chinese, British-Chinese and British-European adolescents. Which covariate of higher self-esteem did their study identify in these three groups according to the lecture material?","options":["家庭收入与课外活动数量","对学校环境的满意度与感知到的教师支持","学业成绩排名与 IQ 分数","使用社交媒体的小时数"],"options_en":["Family income and the number of extracurricular activities","Satisfaction with the school environment and perceived support from teachers","Academic ranking and IQ scores","Hours spent using social media"],"answer":1,"option_notes":["研究聚焦学校经历与对教师态度，未把收入与活动数量列为协变量。","两组自尊较高，且同步变化的协变量正是学校环境满意度与感知到的教师支持。","研究没有以成绩排名或 IQ 作解释变量，重点在校园体验。","社媒使用不在该研究变量之列，属无根据的干扰项。"],"explain":"**Bagley & Tse** 比较三组青少年：香港华人青少年自尊显著低于英籍华人与英籍欧洲组。协变量指向校园经验——对学校环境的满意度与感知到的教师支持与自尊水平正相关，提示学校氛围是重要切入点。","source":"L6 p.21","tags":["self-esteem","Hong Kong","teacher support"]},{"id":"d1-l6-010","day":1,"lecture":6,"topic":"成就动机定义","difficulty":1,"type":"direct","stem":"**Mastery motivation** 与 **achievement motivation** 应如何区分？","stem_en":"**Mastery motivation** and **achievement motivation** are both important for understanding achievement, but they are not the same. How should the two concepts be clearly distinguished according to the lecture material?","options":["两者都指天生掌握环境的动机，可互换","掌握动机后天学到，成就动机天生","掌握动机指考好成绩，成就动机指掌握环境","掌握动机＝天生想掌控环境；成就动机＝愿为挑战任务努力、达到高标准"],"options_en":["Both refer to an inborn motivation to master the environment and are interchangeable","Mastery motivation is learned later, whereas achievement motivation is inborn","Mastery motivation means getting good grades, whereas achievement motivation means mastering the environment","Mastery motivation is the inborn motivation to master the environment; achievement motivation is the willingness to strive at challenging tasks and meet high standards"],"answer":3,"option_notes":["两者不同：**mastery motivation** 天生，**achievement motivation** 是愿努力达标的倾向。","方向相反：掌握动机才是“天生”的，成就动机是后天发展出来的。","把两者定义完全对调，与 PPT 的表述相反。","**mastery motivation** 天生；**achievement motivation** 是愿为挑战努力达标的倾向。"],"explain":"**Mastery motivation** 是天生的环境掌控动机；**achievement motivation** 是愿意为攻克挑战性任务努力、达到高成就标准的倾向。PPT 的核心问题是：为什么有些人能把先天动机转化为成就动机，有些人不能？","source":"L6 p.22","tags":["achievement motivation","mastery motivation"]},{"id":"d1-l6-011","day":1,"lecture":6,"topic":"成就动机起源","difficulty":2,"type":"direct","stem":"3 岁以上儿童成功时自豪、失败时羞愧，并较少依赖他人评价。这属于成就动机发展的哪个阶段？","stem_en":"Children over 3 years old feel pride after success and shame after failure, and rely less on others' evaluations. Which phase of the early development of achievement motivation is this?","options":["**use of standards**（应用标准）","**joy in mastery**（掌握之乐）","**approval-seeking**（寻求认可）","**learned helplessness**（习得性无助）"],"options_en":["**use of standards**","**joy in mastery**","**approval-seeking**","**learned helplessness**"],"answer":0,"option_notes":["阶段 3 采用客观标准，成功自豪、失败羞愧，较少依赖他人评价，与题干相符。","掌握之乐在 2 岁前：因成功而高兴，不寻求认可，失败无关紧要。","寻求认可是近 2 岁时：因成功争取赞许，预期失败会遭反对。","习得性无助是归因取向，不是成就动机的早期发展阶段。"],"explain":"成就动机早期三阶段：阶段 1“掌握之乐”（2 岁前，不寻求认可）、阶段 2“寻求认可”（近 2 岁，预期失败遭反对）、阶段 3“应用标准”（3 岁以上，以客观标准判断成败，产生自豪／羞愧）。","source":"L6 p.24","tags":["achievement motivation","use of standards"]},{"id":"d1-l6-012","day":1,"lecture":6,"topic":"家庭环境与成就","difficulty":1,"type":"direct","stem":"关于家庭环境对成就动机的影响，PPT 引用的数据说明了什么？","stem_en":"The lecture cites data on how the home environment relates to achievement motivation and school performance. What exactly do the data cited in the lecture show according to the course material?","options":["缺乏智力刺激的家庭中，大多数儿童在校表现优秀","家庭环境与在校表现无关，主要看遗传","重智家庭约 66% 儿童在校表现良好；缺乏智力培养的家庭约 70% 表现不佳","只有母亲的学历能预测儿童在校表现"],"options_en":["In homes lacking intellectual stimulation, most children do well at school","Family environment is unrelated to school performance; genetics is what matters","About 66% of children from intellectually stimulating homes do well at school, whereas about 70% of children from nonstimulating homes do poorly","Only the mother's education predicts children's school performance"],"answer":2,"option_notes":["数据相反：缺乏智力刺激的家庭中 70% 儿童在校表现不佳。","家庭环境被列为关键影响，并塑造内在成就取向，不是无关因素。","重智家庭 66% 表现良好、非刺激家庭 70% 表现不佳，说明家庭环境塑造内在成就取向。","PPT 谈的是家庭智力刺激的整体环境，未把学历单一化。"],"explain":"家庭环境是成就动机的重要来源：智力刺激丰富的家庭中约 66% 儿童在校表现良好，并形成内在成就取向；缺乏刺激的家庭中约 70% 儿童表现不佳。环境通过日常互动塑造“为何而努力”的取向。","source":"L6 p.26","tags":["achievement motivation","home environment","intrinsic orientation"]},{"id":"d1-l6-013","day":1,"lecture":6,"topic":"归因维度","difficulty":2,"type":"direct","stem":"按 **Weiner** 的归因分类，“能力”与“任务难度”的共同点是什么？","stem_en":"In **Weiner**'s attribution classification, what exactly do 'ability' and 'task difficulty' have in common according to the lecture?","options":["两者都是不稳定、可变的因素","两者都是稳定因素；能力为内部，任务难度为外部","两者都是外部因素","两者都是不稳定但内部的因素"],"options_en":["Both are unstable and changeable factors","Both are stable factors; ability is internal, whereas task difficulty is external","Both are external factors","Both are unstable but internal factors"],"answer":1,"option_notes":["稳定性正好相反：能力与任务难度均属稳定因素，努力与运气才不稳定。","能力（内部）与任务难度（外部）同属稳定归因；稳定性影响对未来成功的预期。","只有任务难度属外部归因；能力属于内部因素。","两者都稳定；稳定／不稳定与内部／外部是两个独立维度。"],"explain":"**Weiner** 用两个维度为归因分类：稳定性（能力、任务难度 vs 努力、运气）与内外性（能力、努力 vs 任务难度、运气）。题干两者共同的维度是“稳定”，区别在于能力属内部、任务难度属外部。","source":"L6 p.31","tags":["Weiner","attribution theory","achievement"]},{"id":"d1-l6-014","day":1,"lecture":6,"topic":"习得性无助","difficulty":2,"type":"direct","stem":"按 **Dweck** 的 **learned-helplessness theory**，习得性无助取向的儿童倾向把失败归因于什么？","stem_en":"According to **Dweck**'s **learned-helplessness theory**, to what kind of causes do children with a learned-helplessness orientation typically attribute their own repeated failures and setbacks, as described in the lecture on achievement attribution?","options":["不稳定、外部的因素（如运气）","不稳定的内部因素（如这次不够努力）","稳定的外部因素（如题目太难）","稳定且内部的因素（如自己能力不足）"],"options_en":["Unstable, external factors such as luck","Unstable, internal factors such as not working hard enough this time","Stable, external factors such as the test being too difficult","Stable, internal factors such as a lack of ability"],"answer":3,"option_notes":["把失败归于运气是掌握定向者外化失败的方式；无助取向则内化且稳定。","把失败归于努力不足属不稳定归因，反而有助坚持，不是无助取向。","题目太难是稳定的外部归因；无助取向的关键在于内部且稳定。","无助取向把失败归因于稳定且内部的**能力不足**，因而停止尝试，且这种取向会随时间维持。"],"explain":"**Dweck** 区分两种成就取向：**mastery-oriented** 者成功归因能力、失败归因于不稳定因素（努力不足），因此坚持并加倍努力；**learned helplessness** 者把失败归因于稳定且内部的因素（能力），于是放弃尝试。","source":"L6 p.38","tags":["learned helplessness","Dweck","attribution"]},{"id":"d1-l6-015","day":1,"lecture":6,"topic":"习得性无助预防","difficulty":3,"type":"direct","stem":"要预防儿童的 **learned helplessness**，**Dweck** 建议教师多使用哪一种表扬？","stem_en":"In order to prevent children from developing **learned helplessness**, what kind of praise exactly does **Dweck** recommend that teachers use more often in the classroom, according to the lecture material?","options":["**process-oriented praise**：肯定努力、想法与策略","**person-oriented praise**：强调“你真聪明”","只表扬成绩排名靠前的学生","失败时公开批评能力，以激发上进心"],"options_en":["**process-oriented praise**: affirming effort, ideas and strategies","**person-oriented praise**: stressing 'you are so smart'","Praising only students who rank at the top of the class","Publicly criticising ability after failure to motivate students"],"answer":0,"option_notes":["过程导向表扬肯定努力、想法与策略，把失败引向可控的不稳定因素，有助预防无助。","个人导向表扬（“你真聪明”）把智能当成固定特质，反而易形成无助取向。","只表扬排名靠前者会强化社会比较，无助取向儿童更易被忽略。","失败时批评能力正是无助取向的形成机制之一，不是预防方法。"],"explain":"**Learned helplessness** 与“成功赞努力、失败批能力”的教养有关，可通过**归因训练**（把失败归于不稳定因素）改善。预防关键是过程导向表扬：表扬策略、努力与思路，而非“你真聪明”式的个人表扬。","source":"L6 p.40","tags":["learned helplessness","process-oriented praise","attribution retraining"]},{"id":"d1-l6-016","day":1,"lecture":6,"topic":"同一性阶段","difficulty":1,"type":"direct","stem":"**Erikson** 的心理社会发展理论中，**identity vs. role confusion** 属于第几阶段、约几岁？","stem_en":"In **Erikson**'s theory of psychosocial development, which of the eight stages is **identity vs. role confusion**, and at approximately what age range does it typically occur according to the lecture?","options":["第 4 阶段，6–11 岁","第 3 阶段，3–6 岁","第 5 阶段，12–20 岁","第 6 阶段，20–40 岁"],"options_en":["Stage 4, 6–11 years","Stage 3, 3–6 years","Stage 5, 12–20 years","Stage 6, 20–40 years"],"answer":2,"option_notes":["第 4 阶段是学龄期的勤奋对自卑，不是同一性阶段。","第 3 阶段是幼儿期的主动对内疚，年龄不符。","**Erikson** 第 5 阶段为同一性对角色混乱，约 12–20 岁；青少年探索独立、形成自我感。","第 6 阶段主题是亲密对孤独，出现在成年早期，不是 12–20 岁。"],"explain":"**Erikson** 把青少年期（约 12–20 岁）定为 **identity vs. role confusion**：儿童探索独立性、形成自我感；若无法整合，会出现**identity crisis**——对自己是谁、该成为怎样的人感到焦虑与困惑。","source":"L6 p.42","tags":["Erikson","identity","psychosocial stages"]},{"id":"d1-l6-017","day":1,"lecture":6,"topic":"同一性状态","difficulty":1,"type":"direct","stem":"**Marcia** 的 **identity foreclosure**（同一性早闭）指的是什么？","stem_en":"**Marcia** described four identity statuses in his widely used framework for research on adolescent development. What does **identity foreclosure** specifically refer to in this framework, as presented in the lecture?","options":["尚未思考或解决同一性问题，缺乏方向感","已依外部影响（父母、同伴等）做出承诺，但未经历决策危机","正处于危机中，积极探索各种可能，尚未承诺","经历探索后对目标、信念与价值做出自己的承诺"],"options_en":["Not yet having thought about or resolved identity issues, with a lack of direction","Having made a commitment based on external influences such as parents or peers, without experiencing a decision-making crisis","Being in the midst of a crisis, actively exploring possibilities without yet committing","Having made one's own commitment to goals, beliefs and values after exploration"],"answer":1,"option_notes":["这是 **identity diffusion**（混乱）：尚未思考或解决同一性问题。","**foreclosure** 已承诺但来自外部影响，未经历危机、未形成自己的观点。","这是 **identity moratorium**（延缓）：在危机中积极探索、承诺度低。","这是 **identity achievement**（达成）：经历危机后做出个人承诺。"],"explain":"**Marcia** 用“是否经历危机（探索）”与“是否承诺”交叉出四状态：混乱（无探索无承诺）、早闭（无探索有承诺，但承诺来自外部）、延缓（探索中未承诺）、达成（探索后承诺）。","source":"L6 p.43","tags":["Marcia","identity status","foreclosure"]},{"id":"d1-l6-018","day":1,"lecture":6,"topic":"同一性影响因素","difficulty":3,"type":"direct","stem":"按 PPT 关于养育方式与 **identity formation** 的研究，父母控制欲过强最可能导致哪一种同一性状态？","stem_en":"According to the lecture on parenting styles and **identity formation**, which of **Marcia**'s identity statuses are parents who are too controlling most likely to produce in their adolescent children as a result?","options":["**identity diffusion**（同一性混乱）","**identity moratorium**（同一性延缓）","**identity achievement**（同一性达成）","**identity foreclosure**（同一性早闭）"],"options_en":["**identity diffusion**","**identity moratorium**","**identity achievement**","**identity foreclosure**"],"answer":3,"option_notes":["同一性混乱更与被忽视、被拒绝的养育相关。","关爱、尊重与民主的养育才与延缓（探索）相关。","同一性达成需经历探索后自主承诺，过度控制反而阻碍。","父母控制欲过强常使青少年未经探索即接受外部安排，形成 **foreclosure**。"],"explain":"**Identity formation** 受养育方式影响：被忽视或被拒绝的儿童多处于 **identity diffusion**；控制欲过强的父母易造成 **identity foreclosure**；关爱、相互尊重与民主的养育则与 **moratorium** 和 **achievement** 相关。","source":"L6 p.50","tags":["identity formation","foreclosure","parenting"]},{"id":"d1-l7-001","day":1,"lecture":7,"topic":"性与性别","difficulty":1,"type":"direct","stem":"在性别研究中，**sex** 与 **gender** 的核心区别是什么？","options":["**Sex** 指社会文化属性，**gender** 指生物属性","**Sex** 指生物属性，**gender** 指社会文化属性","**Sex** 与 **gender** 都指生理性别","**Sex** 指性别角色，**gender** 指刻板印象"],"answer":1,"option_notes":["把两者颠倒了：**sex** 是生物属性，**gender** 是社会文化属性。","**Sex**：染色体、生理表现、激素等生物身份；**gender**：社会与文化身份，正确。","两者并非同义；**gender** 不是生理性别，而是社会文化属性。","**Gender** 不等于刻板印象；**sex** 也不指性别角色。"],"explain":"**Sex** 是生物身份（染色体、激素等），**gender** 是社会文化身份。由这组区分衍生出 **gender typing**：获得性别认同，以及被认为适合其生物性别的动机、价值观与行为的过程。","source":"L7 p.2","tags":["sex","gender","gender typing"],"stem_en":"In gender research, what is the core difference between **sex** and **gender**?","options_en":["**Sex** refers to social and cultural attributes, while **gender** refers to biological attributes.","**Sex** refers to biological attributes, while **gender** refers to social and cultural attributes.","Both **sex** and **gender** refer to biological sex.","**Sex** refers to gender roles, while **gender** refers to stereotypes."]},{"id":"d1-l7-002","day":1,"lecture":7,"topic":"言语能力","difficulty":1,"type":"direct","stem":"关于男女在**言语能力**上的差异，下列哪项符合 PPT 的结论？","options":["女孩普遍更优，读写优势随青春期扩大","男孩普遍更优，差距随年龄扩大","两性在言语测验上没有可靠差异","女孩只在读写上占优，言语测验持平"],"answer":0,"option_notes":["**Verbal ability**：女孩通常更优，读写优势随青春期扩大，部分源于生理优势与母亲更多言语刺激。","方向相反：言语能力上的优势属于女孩，而非男孩。","PPT 把言语能力列为“小但可靠”的差异，并非无差异。","女孩在言语测验得分与读写成绩上都占优，并非只在读写。"],"explain":"PPT 将言语能力列为“小而可靠”的性别差异：女孩言语测验得分更高，读写优势随青春期扩大；解释包括生理优势与母亲给予更多言语刺激。","source":"L7 p.4","tags":["verbal ability","sex differences"],"stem_en":"Regarding sex differences in **verbal ability**, which statement matches the conclusion presented in the lecture?","options_en":["Girls are generally superior, and their reading and writing advantage increases over adolescence.","Boys are generally superior, and the gap widens with age.","There is no reliable sex difference on tests of verbal ability.","Girls are superior only in reading and writing, while performance on verbal tests is equal."]},{"id":"d1-l7-003","day":1,"lecture":7,"topic":"空间能力","difficulty":2,"type":"direct","stem":"关于男女在**视觉/空间能力**上的差异，下列哪项符合 PPT？","options":["女孩更优，优势在青春期后才显现","两性无差异，心理旋转结果不稳定","男孩更优，4 岁已显现并持续一生","男孩更优，但只在非空间任务上显现"],"answer":2,"option_notes":["结论方向相反：视觉/空间能力是男孩占优。","PPT 将其列为可靠差异，心理旋转是常用测量任务。","**Visual/spatial abilities**：男孩更优，约 4 岁显现，持续一生。","心理旋转正是空间任务，不是“非空间任务”。"],"explain":"视觉/空间能力是 PPT 列出的可靠性别差异：男孩在心理旋转等任务上更优，约 4 岁已可观察到，并延续一生；注意与“言语能力女孩更优”配对记忆。","source":"L7 p.5","tags":["visual spatial ability","mental rotation"],"stem_en":"Regarding sex differences in **visual/spatial abilities**, which statement matches the lecture?","options_en":["Girls are superior, and the advantage appears only after puberty.","There is no sex difference, and results on mental rotation tasks are unstable.","Boys are superior; the difference is evident by age 4 and persists across the life span.","Boys are superior, but only on non-spatial tasks."]},{"id":"d1-l7-004","day":1,"lecture":7,"topic":"攻击性差异","difficulty":2,"type":"direct","stem":"根据 PPT，关于男女在攻击性上的性别差异，下列哪项最准确？","options":["女孩身体攻击更强，男孩更多关系攻击","男孩只在言语攻击上更强，身体攻击相同","攻击性的性别差异要到青春期才出现","男孩从 2 岁起身体与言语攻击更强；女孩更多隐性攻击"],"answer":3,"option_notes":["方向相反：男孩的身体与言语攻击更强，女孩更多关系/隐性攻击。","男孩在身体与言语攻击上均更强，不只言语。","差异约自 2 岁起出现，青春期并非起点。","**Covert aggression**（隐性攻击，如忽视、排挤）在女孩中更常见，正确。"],"explain":"攻击的性别差异要看形式：男孩在**身体攻击**与**言语攻击**上更强（约 2 岁起），女孩更多使用**隐性/关系攻击**；不能笼统地说“谁更攻击”。","source":"L7 p.7","tags":["aggression","covert aggression","sex differences"],"stem_en":"According to the lecture, which statement most accurately describes sex differences in aggression?","options_en":["Girls are more physically aggressive, while boys show more relational aggression.","Boys are more aggressive only verbally, with no difference in physical aggression.","Sex differences in aggression do not appear until puberty.","From age 2, boys are more physically and verbally aggressive, while girls display more covert aggression."]},{"id":"d1-l7-005","day":1,"lecture":7,"topic":"差异结论","difficulty":2,"type":"direct","stem":"关于两性心理差异的总结，PPT 提出四点结论；下列哪项正确？","options":["两性差异在所有心理特性上都稳定存在且幅度中等以上","差异反映群体平均值、幅度小，极端处最明显","差异在群体平均的极端处最小","性别差异随年龄增长必然消失"],"answer":1,"option_notes":["PPT 的四点结论是差异小、只反映群体平均、在极端处最明显；此选项高估了差异的普遍性与幅度。","**Group averages**：差异小、在极端处最明显，且两性相似远多于相异。","PPT 说差异在极端情况下最明显，不是最小。","PPT 未说差异会随年龄消失，部分差异持续一生。"],"explain":"四点结论：差异反映群体平均值、差异很小、在极端情况下最明显、两性心理相似远多于不同。由此不能把群体统计差异直接套用到个人。","source":"L7 p.9","tags":["sex differences","group averages"],"stem_en":"The lecture summarizes four conclusions about psychological sex differences. Which one is correct?","options_en":["Sex differences exist stably in all psychological traits and are at least moderate in size.","Differences reflect group averages, are small, and are most apparent at the extremes.","Differences are smallest at the extremes of the group averages.","Sex differences necessarily disappear with age."]},{"id":"d1-l7-006","day":1,"lecture":7,"topic":"刻板印象成因","difficulty":1,"type":"direct","stem":"PPT 认为大多数**性别角色刻板印象**属于什么，并如何解释其来源？","options":["“文化迷思”，来自根深蒂固的认知图式与自我实现预言","可靠的生物学事实，来自基因差异","只存在于非工业化社会的现象","随年龄增长会自动减弱消失"],"answer":0,"option_notes":["**Cultural myths**：多为无事实依据的文化迷思，源自认知图式，并经自我实现预言放大差异。","多数刻板印象缺乏事实依据，并非可靠的生物学事实。","刻板印象在现代社会依然普遍，并非只存在于非工业化社会。","儿童早期反而可能夸大刻板印象，不会自动消失。"],"explain":"PPT 用两个概念解释刻板印象：一是**cultural myths**（无事实依据、源于根深蒂固的认知图式并扭曲行为解读），二是**self-fulfilling prophecy**（教师、父母的预期制造出真实的认知差异）。","source":"L7 p.11","tags":["gender-role stereotypes","self-fulfilling prophecy","schema"],"stem_en":"What does the lecture say most **gender-role stereotypes** are, and how does it explain their origin?","options_en":["“**Cultural myths**” that arise from well-ingrained cognitive schemas and self-fulfilling prophecy.","Reliable biological facts that arise from genetic differences.","Phenomena that exist only in non-industrialized societies.","Patterns that automatically weaken and disappear with age."]},{"id":"d1-l7-007","day":1,"lecture":7,"topic":"家庭归因链","difficulty":3,"type":"direct","stem":"按 PPT 的链条，父母把儿子的数学成功归因于能力、女儿的成功归因于努力，最可能导致什么？","options":["儿子更谨慎，女儿更有信心，动机趋同","孩子不受影响，归因只是父母的看法","女儿因被表扬努力而更愿意挑战数学难题","女儿低估自己的能力并对数学失去兴趣"],"answer":3,"option_notes":["方向相反：男孩会变得更自信，女孩低估自己的能力。","PPT 强调孩子会内化父母的观念，归因影响动机。","归因于努力会让女孩更相信“我能力不足”，反而降低能力信念。","**Self-fulfilling prophecy**：孩子内化父母观念，女孩低估能力并失去数学兴趣。"],"explain":"链条是：父母期望 → 归因方式（儿子=能力、女儿=努力）→ 孩子内化 → 男孩自信、女孩低估能力 → 女孩失去数学兴趣 → 刻板印象被进一步强化。","source":"L7 p.13","tags":["self-fulfilling prophecy","attribution","home influences"],"stem_en":"According to the chain described in the lecture, what is most likely to result when parents attribute their son's math success to ability and their daughter's success to hard work?","options_en":["Boys become more cautious and girls more confident, so their motivation converges.","Children are unaffected, because attributions are merely the parents' own views.","Girls become more willing to tackle difficult math problems because their effort is praised.","Girls underestimate their own ability and lose interest in math."]},{"id":"d1-l7-008","day":1,"lecture":7,"topic":"性别概念里程碑","difficulty":2,"type":"direct","stem":"根据 PPT 的发展趋势，下列哪项是 2.5–3 岁阶段新出现的性别概念里程碑？","options":["能配对男性和女性的声音与面孔","能可靠区分男性和女性的静态照片","能准确把自己标记为男孩或女孩","认为性别是永久不变的特征"],"answer":2,"option_notes":["约 4 个月大时即可做到，是性别概念中最早出现的能力。","约满一岁时可做到，仍在自我分类（自我标签）之前。","约 2.5–3 岁能准确把自己标记为男孩或女孩，即 **gender identity**。","约 5–7 岁才把性别视为永久特征，晚于自我标签。"],"explain":"性别概念的发展台阶：4 个月配对声音与面孔 → 1 岁区分男女照片 → 2.5–3 岁自我标签（**gender identity**）→ 5–7 岁视性别为永久特征。年龄顺序是高频考点。","source":"L7 p.17","tags":["gender concept","gender identity","milestones"],"stem_en":"According to the developmental trends in the lecture, which milestone in the gender concept newly emerges at 2½–3 years of age?","options_en":["Being able to match male and female voices with faces","Being able to reliably discriminate still photographs of men and women","Being able to accurately label oneself as a boy or a girl","Believing that gender is a permanent characteristic"]},{"id":"d1-l7-009","day":1,"lecture":7,"topic":"性别角色标准","difficulty":3,"type":"direct","stem":"根据 PPT，儿童对性别角色违背的评判在 8–9 岁左右出现什么变化？","options":["开始区分道德规则与性别角色标准，态度更灵活","认为性别角色违背比道德违背更严重","完全接受跨性别兴趣并鼓励同伴尝试","对男孩的性别违背比对女孩的违背更宽容"],"answer":0,"option_notes":["**Gender-role standards** 与道德规则分开、更灵活；p.19 显示道德违背最错，故不认为它更严重。","3–7 岁才会把性别角色标准当作近乎道德规则；8–9 岁反而更灵活。","灵活化不等于认可，PPT 特别强调这一点。","PPT 指出对女孩的违背更宽容，与选项相反。"],"explain":"3–7 岁的儿童把性别角色标准视为不可违背的道德规则，还会夸大刻板印象以“确认”自己的性别；8–9 岁开始区分道德规则与性别角色标准，态度更灵活，但不等于接受跨性别兴趣。","source":"L7 p.19","tags":["gender-role standards","moral rules","flexibility"],"stem_en":"According to the lecture, what change occurs around age 8–9 in children's judgments of gender-role violations?","options_en":["They begin to distinguish moral rules from gender-role standards and become more flexible.","They consider gender-role violations more serious than moral violations.","They fully accept cross-sex interests and encourage peers to try them.","They are more tolerant of boys' gender-role violations than of girls'."]},{"id":"d1-l7-010","day":1,"lecture":7,"topic":"性别隔离","difficulty":2,"type":"direct","stem":"相较于更早阶段，4–5 岁儿童在性别化行为上新出现的发展是什么？","options":["18–24 个月时拒绝玩异性玩具","开始主动拒绝与异性玩伴玩耍","偏好符合性别的玩具（约 14–22 个月）","与同性玩伴相处时间是异性的 10 倍以上"],"answer":1,"option_notes":["这是 18–24 个月的表现，时间上早于 4–5 岁。","**Gender segregation**：4–5 岁开始主动拒绝异性玩伴。","这是 14–22 个月的表现，早于 4–5 岁。","约 6.5 岁才达到同性互动时间为异性 10 倍以上。"],"explain":"性别化行为与性别隔离的时间线：14–22 个月按性别选玩具 → 18–24 个月拒绝异性玩具 → 2–3 岁偏好同性玩伴 → 4–5 岁主动拒绝异性 → 6.5 岁同性互动时间超过异性 10 倍。","source":"L7 p.22","tags":["gender-typed behavior","gender segregation"],"stem_en":"Compared with earlier stages, what new development in gender-typed behaviour appears in children aged 4–5?","options_en":["Refusing to play with cross-sex toys at 18–24 months","Beginning to actively reject playmates of the other sex","Preferring gender-appropriate toys (around 14–22 months)","Spending more than ten times as much time with same-sex peers"]},{"id":"d1-l7-011","day":1,"lecture":7,"topic":"进化理论","difficulty":2,"type":"direct","stem":"按 PPT 介绍的**进化理论**，男女性别角色差异主要来自什么？","options":["社会化与文化分配角色的结果，与进化无关","激素水平的影响，与自然选择无关","男女面临不同进化压力，自然选择塑造不同角色倾向","儿童主动建构性别图式的认知过程"],"answer":2,"option_notes":["这是**social roles hypothesis**，恰是进化理论受到的批评观点。","激素影响属生物社会理论的证据；进化理论强调的是跨代的选择压力。","**Evolutionary theory**：男女进化压力不同，自然选择造成角色差异（女性养育、男性竞争进取）。","这是 **gender-schema theory** 的主张，不属进化理论。"],"explain":"进化理论（**Buss**）用“不同进化压力 + 自然选择”解释性别角色；主要批评是**social roles hypothesis**：心理性别差异可能来自文化分配角色与社会化实践，而非生物进化倾向。","source":"L7 p.26","tags":["evolutionary theory","Buss","social roles hypothesis"],"stem_en":"According to the **evolutionary theory** introduced in the lecture, what are sex differences in gender roles mainly attributable to?","options_en":["Socialization and the roles that cultures assign, with no relation to evolution","The influence of hormone levels, with no relation to natural selection","Different evolutionary pressures faced by males and females, with natural selection shaping different role tendencies","Children's active construction of gender schemas"]},{"id":"d1-l7-012","day":1,"lecture":7,"topic":"生物社会理论","difficulty":1,"type":"direct","stem":"在**生物社会理论**（Money & Ehrhardt）中，决定胚胎发育出睾丸的关键因素是？","options":["从母亲处继承的 X 染色体","出生后父母标记性别的方式","青春期才分泌的睾酮","从父亲处继承的 Y 染色体"],"answer":3,"option_notes":["无 Y 染色体时胚胎发育出卵巢，X 不是关键开关。","父母的标记发生在出生后，是性别角色社会化的起点。","睾酮在性腺形成后分泌，促进男性内生殖系统发育。","**Y chromosome**：有 Y 则发育出睾丸，无 Y 则发育出卵巢，是关键开关。"],"explain":"生物社会理论强调一连串生物关键事件：受精获 X 或 Y → 有 Y 发展出睾丸 → 分泌睾酮与 **MIS** → 内外生殖系统分化 → 父母据外生殖器标记孩子，性别角色社会化由此开始。","source":"L7 p.28","tags":["biosocial theory","Money & Ehrhardt","testosterone"],"stem_en":"In the **biosocial theory** of Money & Ehrhardt, what is the key factor determining whether an embryo develops testes?","options_en":["The X chromosome inherited from the mother","The way parents label the child's sex after birth","Testosterone secreted only at puberty","The Y chromosome inherited from the father"]},{"id":"d1-l7-013","day":1,"lecture":7,"topic":"社会学习理论","difficulty":2,"type":"direct","stem":"按 **social-learning theory**，儿童习得性别角色主要通过哪两条途径？","options":["直接教导与观察学习","性别同一性、稳定性与一致性","内群体/外群体图式与自身性别图式","自然选择与激素影响"],"answer":0,"option_notes":["**Direct tuition**（对性别相符行为奖惩）+ **observational learning**（观察模仿同性榜样）。","这是 **Kohlberg** 的认知发展理论三阶段。","这是**gender-schema theory**（Martin & Halverson）的内容。","这属于进化理论与生物社会理论的内容，不属社会学习。"],"explain":"社会学习理论强调即时情境与可观察行为：直接教导（父母、兄弟姐妹、同伴都会强化）+ 观察学习。细节考点：观察学习中“行为被贴的标签”比示范者的性别更重要。","source":"L7 p.32","tags":["social-learning theory","direct tuition","observational learning"],"stem_en":"According to **social-learning theory**, through which two main routes do children acquire gender roles?","options_en":["**Direct tuition** and **observational learning**","**Gender identity**, **gender stability**, and **gender consistency**","In-group/out-group schemas and own-sex schemas","Natural selection and hormonal influences"]},{"id":"d1-l7-014","day":1,"lecture":7,"topic":"认知发展理论","difficulty":2,"type":"direct","stem":"按 **Kohlberg** 的理论，儿童约在 5–7 岁达到的是性别概念的哪一步？","options":["**Gender identity**（约 3 岁完成）","**Gender stability**（随时间保持稳定）","**Gender consistency**（跨情境保持一致）","**Gender typing**（获得性别角色）"],"answer":2,"option_notes":["**Gender identity** 约 3 岁出现，早于 5–7 岁。","**Gender stability** 指随时间稳定，但尚未涉及跨情境。","**Gender consistency**：认识到性别跨情境稳定，约 5–7 岁完成，性别概念至此完整。","**Gender typing** 是获得性别认同与角色行为的整体过程，不是阶段名。"],"explain":"**Kohlberg**：**gender identity**（约 3 岁自我标签）→ **gender stability**（性别随时间稳定）→ **gender consistency**（跨情境稳定，5–7 岁）。达到一致性后儿童主动寻找同性榜样。","source":"L7 p.34","tags":["Kohlberg","gender identity","gender consistency"],"stem_en":"According to **Kohlberg**'s theory, which step of the gender concept is reached at about 5–7 years of age?","options_en":["**Gender identity** (completed at about age 3)","**Gender stability** (gender remains stable over time)","**Gender
