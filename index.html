<title>PSY6017 三日通关 · 期末刷题</title>
<style>
/* ============================================================
   PSY6017 三日通关 — 移动优先 · 微信友好
   ============================================================ */
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e6eaf2;
  --soft:#f8fafc;
  --blue:#2563eb;
  --blue-soft:#eef4ff;
  --amber:#d97706;
  --amber-soft:#fff7e6;
  --rose:#e11d48;
  --rose-soft:#fff1f4;
  --green:#16a34a;
  --green-soft:#ecfdf3;
  --red:#dc2626;
  --red-soft:#fef2f2;
  --violet:#7c3aed;
  --radius:18px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.07);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
p{margin:0 0 8px}
p:last-child{margin-bottom:0}
strong{font-weight:700;color:#0b1220}
::selection{background:#dbeafe}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(244,246,251,.88);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid rgba(226,232,240,.7);
}
.topbar .inner{
  max-width:720px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;min-height:52px;
}
.topbar .back{
  width:34px;height:34px;border-radius:12px;border:1px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--muted);cursor:pointer;flex:0 0 auto;
}
.topbar .back:active{transform:scale(.95)}
.topbar .t{flex:1;min-width:0}
.topbar .t .title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* ---------- 首页 ---------- */
.hero{padding:22px 0 6px}
.hero .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hero .logo{
  width:42px;height:42px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px rgba(37,99,235,.28);
}
.hero h1{font-size:23px;line-height:1.3;margin:0;letter-spacing:-.3px}
.hero h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.hero .exam{
  margin-top:14px;background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#e2e8f0;border-radius:var(--radius);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow);
}
.hero .exam .l1{font-size:13px;font-weight:700;color:#fff}
.hero .exam .l2{font-size:12px;color:#94a3b8;margin-top:2px}
.hero .exam .days{text-align:right;flex:0 0 auto}
.hero .exam .days b{display:block;font-size:22px;line-height:1;color:#7dd3fc;font-variant-numeric:tabular-nums}
.hero .exam .days span{font-size:11px;color:#94a3b8}

/* 总进度 */
.overall{margin:16px 0 4px;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.overall .row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.overall .row b{color:var(--text)}
.pbar{height:8px;background:#e9edf5;border-radius:999px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--accent,var(--blue));transition:width .45s cubic-bezier(.22,.61,.36,1)}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-title h2{font-size:16px;margin:0;letter-spacing:-.2px}
.section-title span{font-size:12px;color:var(--muted)}

/* 天卡片 */
.day-card{
  position:relative;background:var(--card);border-radius:var(--radius);
  padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);
  border:1px solid rgba(226,232,240,.8);overflow:hidden;
}
.day-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.day-card .head{display:flex;align-items:flex-start;gap:10px}
.day-card .num{
  flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--accent-soft,#eef4ff);
  color:var(--accent);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.day-card .info{flex:1;min-width:0}
.day-card .info h3{margin:0;font-size:16px;letter-spacing:-.2px}
.day-card .info .desc{font-size:12.5px;color:var(--muted);margin-top:3px}
.day-card .status{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.day-card .status.done{background:var(--green-soft);color:var(--green)}
.day-card .status.lock{background:#f1f5f9;color:#94a3b8}
.day-card .prog{margin-top:12px}
.day-card .prog .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.day-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.day-card .cta{font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}
.day-card.locked{opacity:.72}
.day-card.locked::before{background:#cbd5e1}

/* 关卡行 */
.gate{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:16px;padding:13px 15px;margin:2px 0 12px;box-shadow:var(--shadow);
  border:1px dashed #cbd5e1;position:relative;
}
.gate .ic{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:#fff7ed;
}
.gate .info{flex:1;min-width:0}
.gate .info h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.gate .info p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.gate .go{
  flex:0 0 auto;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:11px;
  background:#0f172a;color:#fff;border:0;cursor:pointer;
}
.gate .go:disabled{background:#e2e8f0;color:#94a3b8}
.gate .go.done{background:var(--green-soft);color:var(--green)}
.gate.locked{opacity:.66}
.gate.locked .go{background:#e2e8f0;color:#94a3b8}
.gate .score{font-size:12px;color:var(--green);font-weight:700}

/* ---------- 通用卡片/按钮 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);
  font-size:14px;font-weight:700;padding:12px 18px;cursor:pointer;
  transition:transform .08s ease,box-shadow .15s ease,background .15s ease;
  text-align:center;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn-dark{background:#0f172a;border-color:transparent;color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:11px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.rose{background:var(--rose-soft);color:var(--rose)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.gray{background:#f1f5f9;color:var(--muted)}

/* ---------- 日详情：讲次列表 ---------- */
.lec-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.lec{
  display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;
  border-bottom:1px solid var(--line);background:#fff;transition:background .12s;
}
.lec:last-child{border-bottom:0;background:#fff}
.lec:active{background:#f8fafc}
.lec .no{
  flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--soft);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.lec .info{flex:1;min-width:0}
.lec .info .t1{font-size:14px;font-weight:650}
.lec .info .t2{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lec .right{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.lec .mini{width:74px;flex:0 0 auto}
.lec .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lec .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.lec .dot.done{background:var(--green)}
.lec .chev{color:#cbd5e1;font-size:16px}

/* ---------- 做题卡 ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qhead .idx{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qhead .chip{font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 9px}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:5px;height:5px;border-radius:50%;background:#e2e8f0}
.diff i.on{background:var(--amber)}

.qcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px 16px}
.scenario{
  background:linear-gradient(180deg,#f8fafc,#f1f5f9);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;font-size:14px;color:#334155;margin:10px 0 14px;
}
.scenario .tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#94a3b8;text-transform:uppercase;margin-bottom:4px}
.stem{font-size:16px;line-height:1.75;font-weight:600;letter-spacing:-.1px;margin:0 0 4px}
.stem p{margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;
  font-size:14.5px;line-height:1.55;color:var(--text);cursor:pointer;
  transition:border-color .12s,background .12s,transform .08s;font-family:inherit;
}
.opt:active{transform:scale(.995)}
.opt .k{
  flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--soft);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px;
}
.opt .txt{flex:1;min-width:0;padding-top:1px}
.opt.picked{border-color:#94a3b8;background:#f8fafc}
.opt.correct{border-color:#86efac;background:var(--green-soft)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:#fca5a5;background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt .mark{flex:0 0 auto;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-top:2px}
.opt.correct .mark{background:#bbf7d0;color:#166534}
.opt.wrong .mark{background:#fecaca;color:#991b1b}
.opt.dim{opacity:.9}

.opt-wrap{border-radius:14px;overflow:hidden}
.opt-note{
  font-size:13px;line-height:1.65;color:#475569;background:#f8fafc;
  border-radius:0 0 14px 14px;padding:9px 13px 10px;margin-top:-4px;
  border:1px solid var(--line);border-top:0;
}
.opt-note.correct{background:var(--green-soft);border-color:#bbf7d0;color:#14532d}
.opt-note.wrong{background:var(--red-soft);border-color:#fecaca;color:#7f1d1d}

.explain{
  margin-top:16px;border-radius:16px;padding:14px;
  background:linear-gradient(180deg,#f0f7ff,#eef4ff);border:1px solid #dbe7ff;
}
.explain .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.03em;margin-bottom:6px}
.explain .bd{font-size:14px;line-height:1.75;color:#1e293b}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.meta-row .src{font-size:11.5px;color:var(--muted)}
.tagchip{font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 8px}

.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.actions .btn.wide{flex:1.6}

/* 题目导航 */
.qnav{display:flex;align-items:center;gap:10px;margin-top:14px}
.qnav .bar{flex:1}
.qnav .bar .pbar{height:6px}

/* ---------- 关卡：答题卡 ---------- */
.exam-bar{
  position:sticky;top:56px;z-index:20;background:rgba(244,246,251,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:9px 0 8px;margin-bottom:4px;
}
.exam-bar .inner{max-width:720px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.exam-bar .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.exam-bar .timer.warn{color:var(--red);border-color:#fecaca;background:var(--red-soft)}
.exam-bar .spacer{flex:1}
.answer-sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.answer-sheet button{
  height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;
  color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;
}
.answer-sheet button.done{background:var(--blue-soft);border-color:#bfdbfe;color:var(--blue)}
.answer-sheet button.cur{outline:2px solid var(--blue);outline-offset:1px}
.sheet-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

/* ---------- 结果页 ---------- */
.score-ring{
  width:120px;height:120px;border-radius:50%;margin:6px auto 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:conic-gradient(var(--score-color,#2563eb) calc(var(--score)*1%),#e9edf5 0);
  position:relative;
}
.score-ring::before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
.score-ring .v{position:relative;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.score-ring .s{position:relative;font-size:11px;color:var(--muted);margin-top:3px}
.result-title{text-align:center;font-size:18px;font-weight:800;letter-spacing:-.2px}
.result-sub{text-align:center;font-size:12.5px;color:var(--muted);margin-top:4px}

.review-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.review-item{background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04);border:1px solid var(--line);overflow:hidden}
.review-item summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;
}
.review-item summary::-webkit-details-marker{display:none}
.review-item .st{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.review-item .st.ok{background:var(--green-soft);color:var(--green)}
.review-item .st.no{background:var(--red-soft);color:var(--red)}
.review-item .rq{flex:1;font-size:13.5px;line-height:1.55}
.review-item .body{padding:0 14px 14px;border-top:1px dashed var(--line);margin-top:2px}
.review-item .body .opt-line{font-size:13px;line-height:1.6;padding:4px 0;color:#475569}
.review-item .body .opt-line b{color:var(--green)}
.review-item .body .opt-line.wrongsel{color:var(--red)}
.review-item .body .opt-line.wrongsel b{color:var(--red)}
.review-item .body .exp{font-size:13px;line-height:1.7;color:#334155;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px}

/* ---------- 错题本 ---------- */
.wrong-item{display:flex;gap:12px;padding:13px 15px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;border:1px solid rgba(226,232,240,.8)}
.wrong-item .info{flex:1;min-width:0}
.wrong-item .t1{font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrong-item .t2{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}
.empty h3{color:var(--text);margin:0 0 6px}

/* ---------- 微信提示条 ---------- */
.wxtip{
  display:flex;align-items:flex-start;gap:8px;margin:12px 0 2px;
  background:linear-gradient(135deg,#fff7ed,#fff1f4);border:1px solid #fed7aa;
  border-radius:14px;padding:10px 12px;font-size:12.5px;color:#9a3412;line-height:1.55;
  animation:fadeIn .3s ease;
}
.wxtip span{flex:1}
.wxtip b{color:#c2410c}
.wxtip button{
  flex:0 0 auto;border:0;background:rgba(154,52,18,.08);color:#9a3412;
  width:22px;height:22px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;margin-top:1px;
}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;max-width:720px;margin:0 auto;
}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#94a3b8;padding:5px 14px;border-radius:12px;font-weight:600}
.tabbar a .ic{font-size:19px;line-height:1}
.tabbar a.active{color:var(--blue);background:var(--blue-soft)}

/* ---------- 杂项 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(15,23,42,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:12px;
  z-index:99;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.hr{height:1px;background:var(--line);margin:16px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.list-plain{margin:0;padding-left:20px;font-size:13.5px;color:#475569}
.list-plain li{margin-bottom:5px}
.kbd{font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-family:ui-monospace,monospace}

.share-box{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.share-box .qr{width:168px;height:168px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px}
.share-box .qr img,.share-box .qr canvas{width:100%;height:100%;display:block;border-radius:8px}
.link-line{display:flex;gap:8px;width:100%;align-items:center}
.link-line input{
  flex:1;min-width:0;font-size:12.5px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--soft);color:var(--muted);font-family:ui-monospace,monospace;
}
.disclaimer{font-size:11.5px;color:#94a3b8;line-height:1.7}

@media (min-width:600px){
  .answer-sheet{grid-template-columns:repeat(10,1fr)}
  .hero h1{font-size:26px}
}
.pulse{animation:pulse 1.6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ============ 互动功能：即时反馈 / 庆祝 / 报告 ============ */
.feedback{
  margin:12px 0 2px;padding:10px 13px;border-radius:12px;font-size:13.5px;font-weight:650;
  line-height:1.55;animation:fbPop .28s ease;
}
.feedback.ok{background:var(--green-soft);color:#14532d;border:1px solid #bbf7d0}
.feedback.no{background:var(--amber-soft);color:#92400e;border:1px solid #fde68a}
@keyframes fbPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.confetti-layer span{position:absolute;top:-40px;animation:confFall linear forwards;will-change:transform}
@keyframes confFall{to{transform:translateY(112vh) rotate(360deg);opacity:.85}}

.celebrate{
  position:fixed;inset:0;z-index:97;display:flex;align-items:center;justify-content:center;
  background:rgba(15,23,42,.34);animation:fadeIn .18s ease;
}
.celebrate-inner{
  background:#fff;border-radius:22px;padding:26px 34px;text-align:center;max-width:82vw;
  box-shadow:0 20px 60px rgba(15,23,42,.32);animation:cePop .34s cubic-bezier(.22,.61,.36,1);
}
@keyframes cePop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.ce-emoji{font-size:46px;line-height:1}
.ce-title{font-size:19px;font-weight:800;margin-top:8px;letter-spacing:-.2px}
.ce-sub{font-size:12.5px;color:var(--muted);margin-top:5px}

/* 报告页 */
.report-head{display:flex;align-items:center;justify-content:space-between}
.big-num{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.report-medal{font-size:44px}
.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.report-stats div{background:var(--soft);border-radius:12px;padding:10px 4px}
.report-stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.report-stats span{font-size:10.5px;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bar-name{width:26px;color:var(--muted);font-weight:700;flex:0 0 auto}
.bar-track{flex:1;height:8px;background:#e9edf5;border-radius:999px;overflow:hidden}
.bar-track i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:999px;transition:width .4s}
.bar-val{width:38px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}

.report-modal{
  position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:120;
  display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;
}
.rm-card{background:#fff;border-radius:18px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.rm-card img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}

/* 通关证书 */
.cert-card{text-align:center;background:linear-gradient(135deg,#fffbeb,#fff7ed);border:1px solid #fde68a}
.cert-emoji{font-size:46px;line-height:1.1}

/* ============ 语言模式 ============ */
.lang-btn{
  flex:0 0 auto;margin-left:6px;border:0;cursor:pointer;
  background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;
  font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;
  box-shadow:0 4px 10px rgba(225,29,72,.3);letter-spacing:.2px;
  display:flex;align-items:center;gap:3px;white-space:nowrap;font-family:inherit;
}
.lang-btn:active{transform:scale(.95)}
.lang-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;
  cursor:pointer;position:relative;font-family:inherit}
.lang-opt b{font-size:14.5px}
.lang-opt span{font-size:12px;color:var(--muted);line-height:1.5;font-weight:400}
.lang-opt.on{border-color:#fb7185;background:#fff1f4}
.lang-opt.on b{color:#be123c}
.lang-opt i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#e11d48;font-style:normal;font-weight:800}
.lang-sub{display:block;font-size:12px;color:#94a3b8;font-weight:400;line-height:1.5;margin-top:3px}
.stem .lang-sub{font-size:12.5px}
.scenario .lang-sub{font-size:12px}
.lang-modal{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:125;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;
}
.lm-card{
  background:#fff;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:720px;animation:sheetUp .26s cubic-bezier(.22,.61,.36,1);
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

</style>
</head>

<script>
window.PS_DATA = {"meta":{"title":"PSY6017 三日通关","course":"PSY6017 Psychology of Childhood and Adolescence","examDate":"2026-11-23T00:00:00+08:00","examInfo":"期末考 · 50 道英文单选题 · 闭卷","version":"1.0","generatedAt":"2026-11-20 00:23","counts":{"day1":164,"day2":60,"day3":50,"gates":{"A":25,"B":25,"C":50}}},"day1":[{"id":"d1-l1-001","day":1,"lecture":1,"topic":"人类发展定义","difficulty":1,"type":"direct","stem":"本讲把 **human development** 界定为从受孕到死亡期间“有秩序、有模式且相对持久”的延续与变化。下列哪一项最符合这一界定？","options":["一名学生因考试焦虑而连续失眠三周，考后逐渐恢复","智力与人格随年龄出现有秩序的变化，且相对持久","一名青少年熬夜后注意力短暂下降，补充睡眠后恢复","婴儿接种疫苗后短暂发烧，两天后完全退烧"],"answer":1,"option_notes":["**temporary mood swing**：短暂的情绪或状态波动，考后即恢复，属本讲明确排除的暂时性变化。","**development**：有秩序、有模式且相对持久的年龄相关变化，正符合定义的三要素。","睡眠不足造成的短暂注意力下降可逆，不属于相对持久的年龄相关变化。","疫苗引起的短暂发烧属身体暂时状态，不是有秩序的发展变化。"],"explain":"**development** 的核心是系统性、有秩序、有模式且相对持久；本讲特别指出它“不是短暂的情绪波动，或外表、思想上的暂时变化”。判断时先看变化是否持久、是否与年龄相关。","source":"L1 p.1","tags":["human development","continuity","change"],"stem_en":"The lecture defines **human development** as systematic, orderly, patterned, and relatively enduring continuities and changes in behaviour, thinking, emotion, and personality from conception to death. Which of the following changes best fits this definition?","options_en":["A student loses sleep for three weeks because of exam anxiety and gradually recovers afterwards","Intelligence and personality change in an orderly way with age and remain relatively enduring","An adolescent's attention declines briefly after staying up late and returns after sleep","An infant has a brief fever after vaccination and fully recovers within two days"]},{"id":"d1-l1-002","day":1,"lecture":1,"topic":"成熟与学习","difficulty":2,"type":"direct","stem":"一名女童在 11 岁时身高与第二性征快速变化；同班另一名女童因参加校队训练，短跑成绩明显进步。按本讲定义，这两种变化分别主要来自？","options":["**learning**；**maturation**","**learning**；**learning**","**maturation**；**learning**","**maturation**；**maturation**"],"answer":2,"option_notes":["**learning** 指经验带来的相对持久改变，**maturation** 才是生物性展开，顺序颠倒。","把两者都归为 **learning** 有误；青春期变化由生物程序推动，不是经验造成。","**maturation** 推动身高与第二性征；**learning** 是训练带来的改变，短跑进步正属此类。","短跑成绩进步来自练习与经验，属 **learning** 而非 **maturation**。"],"explain":"本讲把发展视为 **maturation** 与 **learning** 的结果：前者是基因与生理程序的展开，后者是经验在思想、情感、行为上造成的相对持久改变。两者常同时发生，判断关键在变化的主要来源。","source":"L1 p.1","tags":["maturation","learning","nature and nurture"],"stem_en":"A girl's height and secondary sexual characteristics change rapidly at age 11; a classmate's sprint performance improves noticeably after joining the school team. According to the lecture, these changes mainly result from which pair of processes?","options_en":["**learning**; **maturation**","**learning**; **learning**","**maturation**; **learning**","**maturation**; **maturation**"]},{"id":"d1-l1-003","day":1,"lecture":1,"topic":"早期哲学观","difficulty":1,"type":"direct","stem":"**John Locke** 把儿童的心灵比作一块“白板”，主张人没有先天倾向、人与人之间的所有差异都来自经验。这一立场被称为什么？","options":["**empiricism**（经验主义）","**original sin**（原罪说）","**innate goodness**（性善说）","**maturation**（成熟）"],"answer":0,"option_notes":["**empiricism**：主张人无先天倾向、一切差异归于经验，正出自 **Locke** 的 **blank slate** 观点。","**original sin**：**Augustine** 认为人天生自私，须靠精神重生与宗教修行克制。","**innate goodness**：**Rousseau** 认为人天生善良，成人不应干预其发展。","**maturation** 是生物性展开的发展机制，不是洛克对儿童心灵的比喻。"],"explain":"本讲用三个比喻概括早期哲学观：**original sin**（天生自私）、**blank slate**（白板，即 **empiricism**）、**innate goodness**（天生善良）。洛克属经验主义阵营，主张成人可把儿童塑造成任何样子。","source":"L1 p.2","tags":["Locke","empiricism","blank slate"],"stem_en":"**John Locke** compared the child's mind to a 'blank slate' and argued that humans possess no innate tendencies and that all differences among people are attributable to experience. What is this position called?","options_en":["**empiricism**","**original sin**","**innate goodness**","**maturation**"]},{"id":"d1-l1-004","day":1,"lecture":1,"topic":"早期哲学观","difficulty":2,"type":"direct","stem":"某位早期哲学家认为人天生善良、会主动寻求有助于成长的经验，只要获得养育与保护，环境就不应干预其发展。这位哲学家是？","options":["**Augustine**","**Locke**","**Darwin**","**Rousseau**"],"answer":3,"option_notes":["**Augustine** 主张 **original sin**：人天生自私，须寻求精神重生与宗教修行。","**Locke** 主张 **blank slate**：人无先天倾向，一切差异来自经验。","**Darwin** 是早期科学研究先驱，以 **baby biographies** 支持进化论，不是此说提出者。","**Rousseau** 主张 **innate goodness**：人天生善良，只需养育与保护，环境不应干预。"],"explain":"三种早期观点常被配对考查：**Augustine** 原罪、**Locke** 白板、**Rousseau** 性善。**Rousseau** 的关键词是“天生善良、主动寻求成长、环境不应干预”，与洛克“成人可任意塑造”正好相反。","source":"L1 p.2","tags":["Rousseau","innate goodness"],"stem_en":"An early philosopher argued that humans are naturally good, actively seek experiences that help them grow, and need only nurturing and protection, with the environment refraining from interfering in their development. Who was this philosopher?","options_en":["**Augustine**","**Locke**","**Darwin**","**Rousseau**"]},{"id":"d1-l1-005","day":1,"lecture":1,"topic":"早期科学研究","difficulty":1,"type":"direct","stem":"哪位学者主张发展的发生由 **maturation** 决定，与练习、训练或努力无关，并且最早使用电影摄影机与单向观察装置研究儿童？","options":["**Darwin**","**Hall**","**Gesell**","**Rousseau**"],"answer":2,"option_notes":["**Darwin** 以 **baby biographies** 记录子女发展，为进化论提供证据。","**Hall** 用问卷与访谈研究大量儿童，并提出确定 **norms** 的主张。","**Gesell** 主张发展由 **maturation** 决定，并首创电影与单向观察装置研究儿童。","**Rousseau** 是主张 **innate goodness** 的哲学家，并未做科学研究。"],"explain":"早期科学研究的三位代表分工不同：**Darwin** 婴儿传记与进化论、**Hall** 问卷与 1891 年首项科学研究、**Gesell** 基因程序与成熟决定论。看到“成熟、训练无效、电影”就要想到 **Gesell**。","source":"L1 p.3","tags":["Gesell","maturation","one-way observation"],"stem_en":"Which scholar argued that development is determined by **maturation**, regardless of practice, training, or effort, and was the first to use movie cameras and one-way observation devices to study children?","options_en":["**Darwin**","**Hall**","**Gesell**","**Rousseau**"]},{"id":"d1-l1-006","day":1,"lecture":1,"topic":"早期科学研究","difficulty":1,"type":"direct","stem":"1891 年发表《入学时儿童的心智内容》，并被视为首项儿童发展科学研究的著作，作者是谁？","options":["**Darwin**","**Hall**","**Gesell**","**Watson**"],"answer":1,"option_notes":["**Darwin** 的研究是更早的婴儿传记记录，不是 1891 年的问卷研究。","**Hall** 用问卷与访谈研究大量儿童，1891 年的研究被视为首项科学儿童发展研究。","**Gesell** 的研究在 **Hall** 之后，以电影摄影机与单向观察著称。","**Watson** 是行为主义心理学家，主张环境决定行为，与 1891 年研究无关。"],"explain":"记 **Hall** 抓“问卷 + 大量儿童 + 1891 + 首项科学研究 + norms”；记 **Darwin** 抓“婴儿传记 + 进化论”。两人常被放在同一题中互相干扰。","source":"L1 p.3","tags":["Hall","norms","scientific study"],"stem_en":"In 1891, a scholar published a work titled 'The Contents of Children's Minds on Entering School', which is regarded as the first scientific study of child development. Who was the author of this work?","options_en":["**Darwin**","**Hall**","**Gesell**","**Watson**"]},{"id":"d1-l1-007","day":1,"lecture":1,"topic":"发展领域","difficulty":2,"type":"direct","stem":"按本讲的 **domains of development** 划分，下列哪一项属于 **cognitive domain** 的研究内容？","options":["**memory** 与 **problem solving** 能力的变化","**attachment**（依恋）的形成","**self-concept**（自我概念）的发展","性别角色（**gender development**）的发展"],"answer":0,"option_notes":["**cognitive domain** 关注思维、记忆、问题解决等智力技能的变化，本项正属此类。","**attachment** 属 **social domain**，关注个体与他人关系相关的变量。","**self-concept** 是 **social domain** 的例子，不是认知领域的内容。","性别发展同属 **social domain** 的变量，与依恋、自我概念同类。"],"explain":"三大领域按“变化内容”划分：**physical** 看身体大小形态、**cognitive** 看思维记忆与问题解决、**social** 看依恋、自我概念与性别发展。题干问认知领域，凡涉及人际关系与自我者都属社会领域。","source":"L1 p.4","tags":["domains of development","cognitive domain","social domain"],"stem_en":"According to the lecture's **domains of development**, which of the following is a research topic that belongs to the **cognitive domain**?","options_en":["Changes in **memory** and **problem solving** ability","The formation of **attachment**","The development of **self-concept**","The development of gender roles (**gender development**)"]},{"id":"d1-l1-008","day":1,"lecture":1,"topic":"人生阶段","difficulty":1,"type":"direct","stem":"按本讲的人生阶段划分，**adolescence**（青春期）大致涵盖哪个年龄范围？","options":["约 5 至约 12 岁","约 10 至 15 岁","约 12 至 20 岁","约 20 至 40 岁"],"answer":2,"option_notes":["约 5 至约 12 岁是童年中期（**middle childhood**），直至青春期开始。","约 10 至 15 岁是常见误解；本讲的标准区间是 12 至 20 岁。","**adolescence** 约 12 至 20 岁，结束常以开始工作、摆脱父母约束为标志。","约 20 至 40 岁是成年早期（**early adulthood**）。"],"explain":"本讲人生阶段：产前、婴儿期 0-18 个月、幼儿期 18 个月至 3 岁、学前期 3-5 岁、童年中期 5-12 岁、青春期 12-20 岁、成年早期 20-40 岁。相邻阶段的年龄边界是常见干扰点。","source":"L1 p.4","tags":["adolescence","life stages","age norms"],"stem_en":"The lecture divides the lifespan into a series of stages such as infancy, toddlerhood, preschool, middle childhood, adolescence, and early adulthood. According to this division, which age range roughly corresponds to **adolescence**?","options_en":["About 5 to about 12 years","About 10 to 15 years","About 12 to 20 years","About 20 to 40 years"]},{"id":"d1-l1-009","day":1,"lecture":1,"topic":"先天与后天","difficulty":2,"type":"direct","stem":"本讲引用 **Watson**“给我一打健康的婴儿……我可以把他训练成任何类型的专家”的说法，用来代表哪一立场？","options":["**nature**：遗传决定发展","**nurture**：环境塑造发展","**continuity**：发展是渐进的量变","**active child**：儿童主动塑造自身发展"],"answer":1,"option_notes":["**nature** 立场认为遗传是人的主要标志，本讲以 **Wiggam** 的引文代表此说。","**nurture** 立场认为环境决定行为，**Watson** 的引文正是极端环境论的代表。","**continuity** 谈的是变化形式（量变还是阶段性质变），与此引文无关。","**active/passive** 谈儿童是否主动影响自身发展，并非遗传与环境之争。"],"explain":"先天后天之争常用两句名言配对：**Wiggam**“遗传而非环境是人的主要标志”代表 **nature**；**Watson**“给我一打婴儿”代表 **nurture**。同一页还出现 **active/passive** 与 **continuity/discontinuity**，注意区分三组议题。","source":"L1 p.5","tags":["nature","nurture","Watson","Wiggam"],"stem_en":"The lecture quotes **Watson**'s claim 'Give me a dozen healthy infants ... and I can train any one of them to become any type of specialist'. Which position does this quotation represent?","options_en":["**nature**: heredity determines development","**nurture**: the environment shapes development","**continuity**: development is gradual quantitative change","**active child**: children actively shape their own development"]},{"id":"d1-l1-010","day":1,"lecture":1,"topic":"连续与非连续","difficulty":2,"type":"direct","stem":"若研究者主张发展是缓慢而渐进的过程，成人并非拥有儿童没有的新技能，而是拥有儿童期已具雏形的更高级技能，这属于？","options":["**discontinuous development**","**normative age-graded change**","**nonnormative change**","**continuous development**"],"answer":3,"option_notes":["**discontinuous development** 主张发展发生在性质不同的阶段，并遵循固定的普遍顺序。","**normative age-graded change** 指全物种共有、与特定年龄相连的变化，并非此立场之名。","**nonnormative change** 指独特、非共享事件造成的变化，与渐进与否无关。","**continuous development**：变化是渐进的量变，成人技能由儿童期雏形发展而来。"],"explain":"连续与非连续之争的核心是“量变还是质变”：**discontinuous** 强调性质不同的阶段与普遍顺序，**continuous** 强调渐进累积、成人拥有的是更成熟的旧技能。题干出现“缓慢渐进、雏形”就选连续。","source":"L1 p.5","tags":["continuous development","discontinuous development","stages"],"stem_en":"A researcher argues that development is a slow, gradual process and that adults possess not new skills but more advanced versions of skills already present in childhood. This position is:","options_en":["**discontinuous development**","**normative age-graded change**","**nonnormative change**","**continuous development**"]},{"id":"d1-l1-011","day":1,"lecture":1,"topic":"发展变化类型","difficulty":2,"type":"direct","stem":"“婴儿潮一代”因特定历史时期的社会因素，在多数同辈成员身上出现共同的变化。按本讲，这属于哪种发展变化？","options":["**normative age-graded changes**","**nonnormative changes**","**normative history-graded changes**","**social clock**"],"answer":2,"option_notes":["**normative age-graded changes** 与年龄相连、全物种共有，如从爬行到独立行走。","**nonnormative changes** 由独特、非共享事件造成，如个人意外或疾病。","**normative history-graded changes** 由特定历史时期因素造成，影响同辈群体多数成员。","**social clock** 是文化中的年龄常模，规定人生经历的顺序，不是变化类型的名称。"],"explain":"三种变化按“发生范围”区分：年龄级（全物种、按年龄）、历史级（同辈群体、历史事件）、非常态（个人独特事件）。**cohort**（同辈群体）与 **social clock** 常作干扰项，但它们分别是历史级变化的载体与文化年龄常模。","source":"L1 p.6","tags":["normative history-graded","cohort","social clock"],"stem_en":"Because of social factors in a specific historical period, most members of the Baby Boomer generation experienced common changes. According to the lecture, this is an example of which kind of developmental change?","options_en":["**normative age-graded changes**","**nonnormative changes**","**normative history-graded changes**","**social clock**"]},{"id":"d1-l1-012","day":1,"lecture":1,"topic":"关键期与敏感期","difficulty":2,"type":"direct","stem":"本讲区分了“干扰可能导致大脑结构发生不可逆变化”的时期，与“数月或数年间对某类经验特别敏感”的时期。后者称为什么？","options":["**critical period**（关键期）","**social clock**（社会时钟）","**normative age-graded change**","**sensitive period**（敏感期）"],"answer":3,"option_notes":["**critical period** 指对某类经验特别关键的特定时期，干扰可致不可逆的大脑结构改变。","**social clock** 是文化定义的年龄常模，与经验敏感度无关。","**normative age-graded change** 是变化类型，不是发展中的时段概念。","**sensitive period**：数月或数年的时段，儿童对特定经验特别敏感，缺乏时可受显著影响。"],"explain":"两个期限常被混淆：**critical period** 更严格，强调特定经验缺失会造成不可逆后果；**sensitive period** 较长（数月到数年），强调敏感与受影响程度。本讲以“读《窗边的女孩》”说明关键期的不可逆风险。","source":"L1 p.6","tags":["critical period","sensitive period","irreversibility"],"stem_en":"The lecture distinguishes a period in which disruption may cause irreversible changes in brain structure from a period of months or years during which a child is especially responsive to a particular kind of experience. The latter is called:","options_en":["**critical period**","**social clock**","**normative age-graded change**","**sensitive period**"]},{"id":"d1-l1-013","day":1,"lecture":1,"topic":"信度与效度","difficulty":2,"type":"direct","stem":"同一份智力测验在本周与下周对同一批学生施测，两次分数高度一致。这项证据主要支持该测验的哪一属性？","options":["**validity**（有效性）","**test-retest reliability**（重测信度）","**inter-rater reliability**（评分者间信度）","**objectivity**（客观性）"],"answer":1,"option_notes":["**validity** 指测量到其预期要测量的内容，与前后两次是否一致无关。","**test-retest reliability**：同一测验在不同时间施测得出一致结果，即时间维度的信度。","**inter-rater reliability** 指不同观察者对同一对象的评分是否一致，属跨观察者的信度。","**objectivity** 指所有研究同一数据的人会得出相同结论，属科学方法的要求。"],"explain":"信度（**reliability**）管“一致”：随时间一致是 **test-retest**，跨观察者一致是 **inter-rater**；效度（**validity**）管“测得准不准”。一致性高不代表测的就是目标特质，这是常见混淆点。","source":"L1 p.7","tags":["reliability","validity","test-retest"],"stem_en":"The same intelligence test is administered to the same group of students this week and next week, and the two sets of scores are highly consistent. This evidence mainly supports which property of the test?","options_en":["**validity**","**test-retest reliability**","**inter-rater reliability**","**objectivity**"]},{"id":"d1-l1-014","day":1,"lecture":1,"topic":"理论与假设","difficulty":1,"type":"direct","stem":"研究者根据已有理论提出“观看暴力节目越多的儿童，攻击行为越多”，准备用数据检验。这个可检验的具体预测称为什么？","options":["**theory**（理论）","**operational definition**（操作性定义）","**correlation coefficient**（相关系数）","**hypothesis**（假设）"],"answer":3,"option_notes":["**theory** 是一组描述和解释行为某方面的概念与命题，**hypothesis** 才是由它推出的具体预测。","**operational definition** 是清晰精确可测量的变量定义，不是预测本身。","**correlation coefficient** 是表示关联强度与方向的数值（+1.0 至 -1.0）。","**hypothesis**：基于理论、观察或既有知识提出的可检验具体预测，正符合题干。"],"explain":"本讲把研究流程整理为：**theory** 描述与解释行为、**hypothesis** 提出可检验的预测、再用资料检验。看到“具体预测、可检验”选 **hypothesis**；看到“概念与命题的集合”选 **theory**。","source":"L1 p.7","tags":["theory","hypothesis","scientific method"],"stem_en":"Based on an existing theory, a researcher predicts that 'children who watch more violent programmes will show more aggressive behaviour' and plans to test this with data. What is this testable, specific prediction called?","options_en":["**theory**","**operational definition**","**correlation coefficient**","**hypothesis**"]},{"id":"d1-l1-015","day":1,"lecture":1,"topic":"观察法","difficulty":2,"type":"direct","stem":"研究者在幼稚园自由游戏时段观察儿童，但发现分享等友善行为很少出现，而且儿童察觉被观察后行为改变。这最符合哪种方法的局限？","options":["**naturalistic observation**（自然观察）","**structured observation**（结构式观察）","**structured interview**（结构式访谈）","**case study**（个案研究）"],"answer":0,"option_notes":["**naturalistic observation** 在自然情境观察，罕见或社会不认可行为可能不出现，观察者也可能改变儿童行为。","**structured observation** 在实验室制造情境，优点是所有参与者环境相同，不是上述问题的来源。","**structured interview** 靠问答收集资料，不存在“观察者在场”的问题。","**case study** 深度研究个体生活史，与现场观察的情境不同。"],"explain":"自然观察的长处是真实、可用于不会说话的婴儿；代价是行为可能不出现、观察者效应。结构式观察用实验室解决“等不到行为”的问题，却牺牲真实性与代表性。两者常被要求区分。","source":"L1 p.8","tags":["naturalistic observation","structured observation","observer effect"],"stem_en":"Researchers observe children during free play in a kindergarten, but friendly behaviours such as sharing rarely occur, and the children change their behaviour once they notice being watched. These problems best illustrate the limitations of which method?","options_en":["**naturalistic observation**","**structured observation**","**structured interview**","**case study**"]},{"id":"d1-l1-016","day":1,"lecture":1,"topic":"自我报告法","difficulty":2,"type":"direct","stem":"一份匿名问卷要求学生报告每周吸烟次数。研究者最担心学生为了符合社会期望而低报。这属于 **structured interview/questionnaire** 的哪项局限？","options":["**inter-rater reliability**","**observer effect**","**social desirability**（社会赞许性）","**selective attrition**（选择性流失）"],"answer":2,"option_notes":["**inter-rater reliability** 是观察者之间的评分一致性，属观察法的关切。","**observer effect** 指被观察者因察觉观察而改变行为，发生在观察研究。","**social desirability**：参与者倾向给出符合社会期望的答案，导致低报吸烟量等偏差。","**selective attrition** 是纵向研究中参与者选择性退出，与问卷作答偏差不同。"],"explain":"自我报告法优点是可收集大量资料、匿名可提升准确性；局限包括阅读理解能力、诚实性与 **social desirability**、对问题的解读差异。判断时看资料是否“由受试者自己报告”。","source":"L1 p.8","tags":["self-report","social desirability","questionnaire"],"stem_en":"An anonymous questionnaire asks students to report how many cigarettes they smoke each week. The researcher is most concerned that students will underreport to meet social expectations. Which limitation of the **structured interview/questionnaire** does this illustrate?","options_en":["**inter-rater reliability**","**observer effect**","**social desirability**","**selective attrition**"]},{"id":"d1-l1-017","day":1,"lecture":1,"topic":"个案研究","difficulty":1,"type":"direct","stem":"研究者用两年时间详细记录一名罕见语言障碍儿童的生活史，以检验发展假设。这种方法最主要的限制是？","options":["需要大量参与者才能进行","难以比较研究对象，结果缺乏可推广性","无法获得深度的个人信息","参与者必须随机分配到实验组"],"answer":1,"option_notes":["**case study** 通常只研究一个或少数个体，并不需要大量参与者。","**case study** 的局限正是难以比较不同个案、结果未必能推广到其他人。","深度信息是 **case study** 的优点而非缺点。","随机分配是实验研究的特征，并非个案研究的要求。"],"explain":"**case study** 的长处是深度，短处是比较与 **generalizability**。遇到“个案、生活史、深度”先想它的优点，遇到“能否推广到其他儿童”就想它的局限。","source":"L1 p.9","tags":["case study","generalizability"],"stem_en":"A researcher spends two years recording in detail the life history of a child with a rare language disorder in order to test developmental hypotheses. What is the main limitation of this method?","options_en":["It requires a large number of participants","Subjects are difficult to compare and the findings lack generalizability","It cannot provide in-depth personal information","Participants must be randomly assigned to an experimental group"]},{"id":"d1-l1-018","day":1,"lecture":1,"topic":"相关研究","difficulty":3,"type":"direct","stem":"研究发现儿童每天看电视的时数与其攻击行为得分呈 **+0.62** 的相关。下列解读哪一项最恰当？","options":["两者存在较强的正向关联，但不能据此推断因果","看电视直接导致攻击行为增加","攻击行为导致儿童看更多电视","两者毫无关系，因为相关系数未达 +1.0"],"answer":0,"option_notes":["**+0.62** 表示中强正向相关；但相关研究只能检测关联，不能证明因果。","相关研究不能证明因果关系，这是把相关当因果的常见错误。","反向因果同样无法由相关设计确认，相关方向不等于因果方向。","**0 correlation** 才表示两者无关，**+0.62** 明显存在正向关联。"],"explain":"相关系数由 +1.0 到 -1.0，数值表示强度、符号表示方向；**+0.62** 属正向中强相关。相关研究能提供重要线索，但无法排除第三变量，也不能证明因果。","source":"L1 p.10","tags":["correlation","correlation coefficient","causality"],"stem_en":"A correlational study finds that the number of hours children watch television per day is correlated **+0.62** with their scores on a measure of aggression. Which of the following interpretations of this finding is most appropriate?","options_en":["There is a fairly strong positive association, but causality cannot be inferred","Watching television directly causes an increase in aggression","Aggressive behaviour causes children to watch more television","There is no relationship because the coefficient did not reach +1.0"]},{"id":"d1-l2-001","day":1,"lecture":2,"topic":"遗传基础","difficulty":1,"type":"direct","stem":"按本讲，精子与卵子各含有多少条未配对的染色体？两者结合形成的 **zygote** 又含多少对染色体？","options":["各 46 条；结合后 46 对","各 23 对；结合后 23 对","各 23 条；结合后 23 对","各 23 条；结合后 46 条"],"answer":2,"option_notes":["**zygote** 只有 23 对，即 46 条染色体总数，不是 46 对。","精子与卵子各含 23 条“未配对”染色体，不是 23 对。","精子与卵子各 23 条单染色体，结合成 23 对，存在于 **zygote** 中。","结合后是 23 对（共 46 条），“46 条”的表述混淆了总数与配对单位。"],"explain":"遗传物质以 **chromosome** 为单位：体细胞 23 对，**sperm** 与 **ovum** 各带 23 条未配对染色体，受精形成含 23 对的 **zygote**。**gene** 是染色体上 DNA 的片段，影响特定特征或发展模式。","source":"L2 p.2","tags":["chromosome","zygote","gene"],"stem_en":"According to the lecture on the foundations of genetics, how many unpaired chromosomes do a sperm and an ovum each contain, and how many pairs of chromosomes does the resulting **zygote** contain?","options_en":["46 each; 46 pairs after fusion","23 pairs each; 23 pairs after fusion","23 each; 23 pairs after fusion","23 each; 46 chromosomes after fusion"]},{"id":"d1-l2-002","day":1,"lecture":2,"topic":"性别决定","difficulty":1,"type":"direct","stem":"关于第 23 对性染色体如何决定孩子的性别，下列哪一项符合本讲的说明？","options":["卵子提供 X 或 Y 染色体，精子只提供 X 染色体","卵子必定提供 X 染色体，精子提供 X 或 Y 染色体","卵子与精子都提供 X 染色体，性别由其他基因决定","性别由母亲的第 23 对染色体决定"],"answer":1,"option_notes":["卵子必定提供 X；能提供 Y 的是精子，此选项把方向颠倒了。","**ovum** 必定提供 X，**sperm** 提供 X（XX，女）或 Y（XY，男），此为性别决定机制。","精子确实可提供 Y；第 23 对为 XY 时即发育为男婴。","第 23 对由卵子与精子共同组成，决定权在精子带 X 还是 Y。"],"explain":"第 23 对性染色体由双亲各提供一条：母亲（卵子）固定给 X，父亲（精子）给 X 或 Y。精子给 X 则 XX 为女；给 Y 则 XY 为男。因此在染色体层面，孩子的性别由精子决定。","source":"L2 p.3","tags":["sex determination","chromosome","XX","XY"],"stem_en":"At fertilization, the 23rd pair of sex chromosomes determines whether the child will develop as a girl or as a boy. Which of the following statements about how this happens matches the lecture?","options_en":["The ovum provides either an X or a Y chromosome, and the sperm provides only an X chromosome","The ovum always provides an X chromosome, and the sperm provides either an X or a Y chromosome","Both the ovum and the sperm provide an X chromosome, and sex is determined by other genes","Sex is determined by the mother's 23rd pair of chromosomes"]},{"id":"d1-l2-003","day":1,"lecture":2,"topic":"性别分化","difficulty":2,"type":"direct","stem":"按本讲，男性胚胎的 **SRY** 基因大约在受孕后何时开始发出信号，促使身体分泌 **androgens**？","options":["受孕后 4 至 8 周","受孕后 3 至 8 天","怀孕第 10 至 18 周","怀孕第 26 周"],"answer":0,"option_notes":["**SRY** 位于 Y 染色体，受孕后 4 至 8 周发出信号，促使男性胚胎分泌 **androgens**。","3 至 8 天远早于性别分化，属着床前后的阶段。","10 至 18 周是神经元增殖的快速期，不是 **SRY** 的启动时间。","第 26 周是胶质细胞发育使胎脑外观较成熟的节点。"],"explain":"性别由染色体差异转为生理差异，关键在于 Y 染色体上的 **SRY** 基因：受孕 4 至 8 周启动 **androgens** 分泌，促使男性生殖器发育；若无 **androgens**，无论染色体状态如何都会发育出女性生殖器。","source":"L2 p.4","tags":["SRY","androgens","sex differentiation"],"stem_en":"According to the lecture, when does the **SRY** gene on the Y chromosome of a male embryo begin to signal the body to secrete **androgens**, which promote the development of male genitals?","options_en":["4 to 8 weeks after conception","3 to 8 days after conception","Weeks 10 to 18 of pregnancy","Week 26 of pregnancy"]},{"id":"d1-l2-004","day":1,"lecture":2,"topic":"基因型与表现型","difficulty":1,"type":"direct","stem":"本讲把“个体全部实际性状的集合”这个可观察的结果定义为什么概念？","options":["**genotype**（基因型）","**homozygous**（纯合子）","**heterozygous**（杂合子）","**phenotype**（表现型）"],"answer":3,"option_notes":["**genotype** 是由父母基因形成的独特遗传蓝图，不是可观察的实际性状。","**homozygous** 指一对染色体携带两个显性基因或两个隐性基因。","**heterozygous** 指一对染色体携带一个显性基因、一个隐性基因。","**phenotype**：个体全部实际性状的集合，由基因型与环境共同影响。"],"explain":"**genotype** 是遗传蓝图（内在信息），**phenotype** 是可观察的实际性状。基因型影响表现型受复杂规则调控，例如显隐性、**expressivity** 差异与环境作用。","source":"L2 p.5","tags":["genotype","phenotype"],"stem_en":"The lecture distinguishes between the genetic blueprint inherited from the parents and the individual's whole set of actual characteristics that can be observed. What term does the lecture use for the latter?","options_en":["**genotype**","**homozygous**","**heterozygous**","**phenotype**"]},{"id":"d1-l2-005","day":1,"lecture":2,"topic":"显性与隐性","difficulty":2,"type":"direct","stem":"若儿童从父母一方获得显性基因、另一方获得隐性基因（**heterozygous**），按本讲其表现型通常会？","options":["只表现隐性基因决定的性状","表现显性基因决定的性状","同时完整表现两种性状","两种性状都不表现"],"answer":1,"option_notes":["只有从父母双方都继承隐性基因时，表现型才会只呈现隐性性状。","**heterozygous** 带一个显性、一个隐性；单个显性基因就可使表现型呈现该性状。","显性并非与隐性“混合”表现，本讲未支持两者同时完整呈现。","基因仍会表达并影响表现型，不会两者皆不表现。"],"explain":"本讲规则：带单个显性基因即表现出该性状；隐性性状须从父母双方各得一个隐性基因。**homozygous** 是两显或两隐，**heterozygous** 是一显一隐；基因影响表现型的程度即 **expressivity**，因人而异。","source":"L2 p.6","tags":["homozygous","heterozygous","dominant","recessive"],"stem_en":"If a child inherits a dominant gene for a trait from one parent and a recessive gene for the same trait from the other (**heterozygous**), what will the child's phenotype usually show, according to the lecture?","options_en":["Only the trait determined by the recessive gene","The trait determined by the dominant gene","Both traits fully at the same time","Neither trait"]},{"id":"d1-l2-006","day":1,"lecture":2,"topic":"伴性遗传","difficulty":1,"type":"direct","stem":"**hemophilia**（血友病）与红绿色盲属于本讲的哪一类遗传异常？","options":["**sex-linked disorders**（伴性遗传病）","**autosomal disorders**（常染色体遗传病）","**chromosomal disorders**（染色体异常）","**polygenic inheritance**（多基因遗传）"],"answer":0,"option_notes":["**sex-linked disorders** 由 X 染色体上的基因引起，男性发病率远高于女性，如血友病与红绿色盲。","**autosomal disorders** 由常染色体基因引起、多为隐性，如苯丙酮尿症与镰状细胞病。","**chromosomal disorders** 是染色体数量过多或过少，如唐氏综合征。","**polygenic inheritance** 是多个基因共同影响一个特征，如 ADHD。"],"explain":"产前发展问题分三类：常染色体遗传病、伴性遗传病（X 染色体基因，男性更常见）、染色体异常（数目异常）。血友病与红绿色盲是伴性遗传的经典例子。","source":"L2 p.8","tags":["sex-linked disorders","hemophilia","color blindness"],"stem_en":"The lecture classifies prenatal genetic problems into autosomal disorders, sex-linked disorders, and chromosomal disorders. To which of these categories do **hemophilia** and red-green colour blindness belong, according to the lecture?","options_en":["**sex-linked disorders**","**autosomal disorders**","**chromosomal disorders**","**polygenic inheritance**"]},{"id":"d1-l2-007","day":1,"lecture":2,"topic":"染色体异常","difficulty":1,"type":"direct","stem":"本讲以 **Down's syndrome** 为例说明染色体异常。其成因是？","options":["X 染色体上的隐性基因突变","常染色体上的显性基因突变","第 21 号染色体有 3 个拷贝","多个基因共同作用的结果"],"answer":2,"option_notes":["X 染色体基因异常属 **sex-linked disorders**，不是唐氏综合征的成因。","**autosomal disorders** 由常染色体上的基因引发（本讲举例含亨廷顿病），与唐氏综合征的**染色体数目**异常不同。","**Down's syndrome** 属 **chromosomal disorders**，第 21 号染色体有 3 个拷贝。","多个基因共同作用描述的是 **polygenic inheritance**，如 ADHD。"],"explain":"**chromosomal disorders** 指染色体数量过多或过少，唐氏综合征即第 21 号染色体多出一个拷贝。相对地，常染色体遗传病多为隐性基因所致，伴性遗传病则位于 X 染色体。","source":"L2 p.8","tags":["Down's syndrome","chromosomal disorders","trisomy 21"],"stem_en":"The lecture uses **Down's syndrome** as an example of a chromosomal disorder, in which the number of chromosomes is abnormal. What is the specific cause of this condition, according to the lecture?","options_en":["A recessive gene mutation on the X chromosome","A dominant gene mutation on an autosome","Three copies of chromosome 21","The combined effect of multiple genes"]},{"id":"d1-l2-008","day":1,"lecture":2,"topic":"产前阶段","difficulty":2,"type":"direct","stem":"按本讲对产前发展的划分，**embryo** 期的时间范围与主要事件是？","options":["受孕至着床，约 10 至 14 天","第 9 周至出生，器官系统开始运作","出生后首两年，大脑与神经系统快速发育","第 3 周至第 8 周，主要器官形成、心脏开始跳动"],"answer":3,"option_notes":["这是 **zygote** 期：从受孕到稳固着床于子宫壁，约 10 至 14 天。","这是 **fetus** 期：所有主要器官系统开始运作、快速生长。","这是出生后婴儿期的脑发育，不属于产前阶段。","**embryo** 期为第 3 至 8 周，主要器官形成、心脏开始跳动，正符合。"],"explain":"产前三阶段：**zygote**（受孕至着床，10 至 14 天）、**embryo**（第 3 至 8 周，器官形成、心脏跳动）、**fetus**（第 9 周至出生，器官系统运作、快速生长）。时间边界与主要事件常配对考查。","source":"L2 p.13","tags":["zygote","embryo","fetus","prenatal development"],"stem_en":"The lecture divides prenatal development into the zygote, embryo, and fetus stages. According to this division, what is the time span and the main event of the **embryo** stage, as described in the lecture?","options_en":["From conception to implantation, about 10 to 14 days","From week 9 to birth, when organ systems begin to function","The first two years after birth, when the brain and nervous system develop rapidly","From week 3 to week 8, when major organs form and the heart begins to beat"]},{"id":"d1-l2-009","day":1,"lecture":2,"topic":"婴儿脑发育","difficulty":2,"type":"direct","stem":"出生后最初几年，大脑皮层先快速形成大量突触，随后消除多余的神经连接。这一对过程分别称为什么？","options":["**synaptogenesis**；**pruning**","**pruning**；**synaptogenesis**","**myelinization**；**synaptogenesis**","**neuronal proliferation**；胶质细胞"],"answer":0,"option_notes":["**synaptogenesis** 是突触形成，随后 **pruning** 消除不必要路径，顺序正确。","顺序颠倒：先 **synaptogenesis** 后 **pruning**，每轮突触发生都伴随修剪期。","**myelinization** 是轴突髓鞘化、提升传导效率，不是突触的生成。","**neuronal proliferation** 与胶质细胞发育属产前脑发育，不是这对过程。"],"explain":"婴儿大脑发育有三个关键词：**synaptogenesis**（生成突触）、**pruning**（修剪多余连接，受经验影响）、**myelinization**（轴突髓鞘化，提升传导）。突触发生与修剪交替进行，使大脑运作更有效率。","source":"L2 p.16","tags":["synaptogenesis","pruning","myelinization"],"stem_en":"During the first few years after birth, the cortex first rapidly forms a large number of synapses and then eliminates unnecessary neural connections. What are these two processes, in the order described, called?","options_en":["**synaptogenesis**; **pruning**","**pruning**; **synaptogenesis**","**myelinization**; **synaptogenesis**","**neuronal proliferation**; glial cells"]},{"id":"d1-l2-010","day":1,"lecture":2,"topic":"反射","difficulty":1,"type":"direct","stem":"下列哪一组反射全部属于出生后第一年（约 6 至 8 个月）会消失的 **primitive reflexes**？","options":["呼吸、眨眼、吸吮","**Babinski**、**Moro**、抓握反射","呼吸、吞咽、**Moro**","**Babinski**、眨眼、吞咽"],"answer":1,"option_notes":["呼吸、眨眼、吸吮、吞咽属 **survival reflexes**，具适应价值且不会消失。","**Babinski**、游泳、**Moro**、抓握反射属 **primitive reflexes**，通常 6 至 8 个月消失。","呼吸与吞咽是生存反射，与 **Moro** 混在一起就整组不符。","眨眼与吞咽是生存反射，**Babinski** 才是原始反射。"],"explain":"反射分两类：**survival reflexes**（呼吸、眨眼、吸吮、吞咽，满足需求）与 **primitive reflexes**（**Babinski**、游泳、**Moro**、抓握，出生后第一年消失，约 6 至 8 个月）。分类题要整组判断。","source":"L2 p.17","tags":["primitive reflexes","survival reflexes","Babinski","Moro"],"stem_en":"The lecture distinguishes survival reflexes from primitive reflexes. Which of the following groups consists entirely of **primitive reflexes**, which usually disappear during the first year of life (around 6 to 8 months)?","options_en":["Breathing, blinking, sucking","**Babinski**, **Moro**, grasping reflex","Breathing, swallowing, **Moro**","**Babinski**, blinking, swallowing"]},{"id":"d1-l2-011","day":1,"lecture":2,"topic":"运动发展理论","difficulty":3,"type":"direct","stem":"按 **dynamic systems theory**，婴儿的踏步反射在出生数月后消失，主要原因是？","options":["缺乏练习机会，反射因未被强化而消退","大脑皮层尚未完成 **myelinization**","反射被 **operant conditioning** 取代","肌肉尚未强壮到能承担腿部增加的重量"],"answer":3,"option_notes":["这是 **experiential/practice hypothesis** 的思路；动态系统理论强调身体条件的变化。","髓鞘化影响传导效率，但未解释踏步反射为何随体重变化而消失。","操作性条件作用可塑造行为，但不是本讲对踏步反射消失的解释。","**dynamic systems theory**：先天运动时间表与身体发育互动，腿部肌肉力量追不上体重增加使反射消失。"],"explain":"**dynamic systems theory** 认为运动发展是先天时间表与身体条件（肌肉力量、体重比例）互动的结果；踏步反射消失、独立行走出现都是例证。另有 **experiential/practice hypothesis** 强调经验，两者常作对比。","source":"L2 p.20","tags":["dynamic systems theory","stepping reflex","motor development"],"stem_en":"According to **dynamic systems theory**, the inborn timetable for motor development interacts with other aspects of physical development. On this view, why does the infant stepping reflex disappear a few months after birth?","options_en":["Lack of practice makes the reflex die out because it is not reinforced","The cortex has not completed **myelinization**","The reflex is replaced by **operant conditioning**","The muscles are not yet strong enough to support the increased weight of the legs"]},{"id":"d1-l2-012","day":1,"lecture":2,"topic":"视觉发展","difficulty":1,"type":"direct","stem":"按本讲对婴儿感官发展的描述，各种感官中发育最不成熟的是哪一项？","options":["**hearing**（听觉）","**taste**（味觉）","**vision**（视觉）","**touch**（触觉）"],"answer":2,"option_notes":["新生儿听觉已相当好，能分辨不同频率声音，甚至优于其视敏度。","新生儿已有味觉偏好，偏好甜味，并能以嗅觉识别母亲。","**vision** 是发育最不成熟的感官：视敏度差，新生儿约 20/200 至 20/400。","触觉对婴儿探索环境很重要，并非最不成熟。"],"explain":"**vision** 是出生时最不成熟的感官：对亮度敏感、能看见颜色（2 至 3 个月辨色较好），但视敏度差，新生儿约 20/200 至 20/400，6 个月约 20/100。听觉反而在分辨频率上优于视觉。","source":"L2 p.26","tags":["vision","visual acuity","sensory development"],"stem_en":"The lecture describes the development of vision, hearing, taste, smell, touch, temperature, and pain in infancy. According to that description, which of these senses is the least mature at birth?","options_en":["**hearing**","**taste**","**vision**","**touch**"]},{"id":"d1-l2-013","day":1,"lecture":2,"topic":"听觉发展","difficulty":2,"type":"direct","stem":"3 至 6 个月大的婴儿对音素（**phonemes**）的敏感度有何特点？","options":["对不属成人母语体系的音素，敏感度甚至高于成人","已与成人完全一致，不再有差异","只能分辨母语中出现的音素","对所有频率声音的敏感度都弱于成人"],"answer":0,"option_notes":["研究显示 3 至 6 个月婴儿对不属于成人语言的音素更敏感，甚至优于成人。","与成人一致的是 18 个月时的声音辨别能力，不是 3 至 6 个月的音素敏感度。","相反：婴儿对非母语音素的敏感度较高，之后才逐渐专精于母语。","新生儿只在“高音”方面弱于成人，并非所有频率都弱。"],"explain":"婴儿听觉发展有两条线：一般声音辨别在 18 个月左右接近成人；但 **phonemes** 敏感度在 3 至 6 个月时反而高于成人，尤其是非母语语音。另有偏好母亲声音、听到自己名字会转头等现象。","source":"L2 p.28","tags":["hearing","phonemes","speech perception"],"stem_en":"Studies reviewed in the lecture examined how infants discriminate sounds of varying loudness, duration, direction, and frequency. What is special about the sensitivity of 3- to 6-month-old infants to **phonemes**?","options_en":["They are even more sensitive than adults to phonemes that are not part of the adult's native language","Their sensitivity is already identical to that of adults, with no differences","They can discriminate only phonemes that occur in their native language","They are less sensitive than adults to sounds of all frequencies"]},{"id":"d1-l2-014","day":1,"lecture":2,"topic":"感知运动阶段","difficulty":2,"type":"direct","stem":"婴儿把新玩具放入口中吮吸，用既有的吸吮图式处理新物件。按 **Piaget**，这属于？","options":["**accommodation**（顺应）","**object permanence**（客体永久性）","**assimilation**（同化）","**means-end behavior**（手段-目的行为）"],"answer":2,"option_notes":["**accommodation** 是依经验调整既有图式，本项是沿用旧图式而非调整。","**object permanence** 指理解物体不在眼前仍存在，与吸吮图式无关。","**assimilation**：把新信息纳入既有图式（吮吸、注视、抓握）来处理，正符合。","**means-end behavior** 指记住目标并计划达成，属感知运动阶段较后期能力。"],"explain":"**Piaget** 认为感知运动期婴儿以 **assimilation** 把新信息纳入既有 **schemes**（看、听、抓握、吸吮），再以 **accommodation** 依经验调整图式。两者交替推动认知发展。","source":"L2 p.30","tags":["assimilation","accommodation","scheme","Piaget"],"stem_en":"An infant puts a new toy in its mouth and sucks it, using the existing sucking scheme to deal with the new object rather than changing the scheme. According to **Piaget**, this process is called:","options_en":["**accommodation**","**object permanence**","**assimilation**","**means-end behavior**"]},{"id":"d1-l2-015","day":1,"lecture":2,"topic":"亚阶段2","difficulty":2,"type":"direct","stem":"一个 2 个月大的婴儿反复吸吮自己的拇指并因此感到愉悦，动作以自身身体为中心。按 **Piaget** 的亚阶段，这最符合？","options":["亚阶段 1：以先天反射与世界互动","亚阶段 2：**primary circular reactions**","亚阶段 3：**secondary circular reactions**","亚阶段 4：**means-end behavior**"],"answer":1,"option_notes":["亚阶段 1 的行为多为不自主反射、不会规划；反复的愉悦重复属下一阶段。","**primary circular reactions** 是重复以自身身体为中心的愉悦动作，如吸吮拇指。","**secondary circular reactions** 重复的是能在外界产生有趣效果的动作，如摇铃。","**means-end behavior** 要能协调多个动作达成目标，属亚阶段 4。"],"explain":"亚阶段 1（0 至 1 个月）靠先天反射互动；亚阶段 2（1 至 4 个月）出现 **primary circular reactions**，重复以身体为中心的愉悦动作；亚阶段 3（4 至 8 个月）转向 **secondary circular reactions**，重复能影响外界的动作。","source":"L2 p.32","tags":["primary circular reactions","sensorimotor","substage 2"],"stem_en":"A 2-month-old repeatedly sucks its own thumb and finds it pleasurable, with the action centred on its own body and repeated for its own sake. According to **Piaget**'s substages of the sensorimotor period, this best fits which substage?","options_en":["Substage 1: interacting with the world through innate reflexes","Substage 2: **primary circular reactions**","Substage 3: **secondary circular reactions**","Substage 4: **means-end behavior**"]},{"id":"d1-l2-016","day":1,"lecture":2,"topic":"亚阶段3","difficulty":2,"type":"direct","stem":"6 个月大的婴儿反复摇动摇铃以听声音，会寻找从床上掉落的玩具；但如果看到玩具被布完全盖住，他就不去找。这最符合 **Piaget** 哪个亚阶段？","options":["亚阶段 1：先天反射","亚阶段 2：**primary circular reactions**","亚阶段 4：**means-end behavior**","亚阶段 3：**secondary circular reactions**"],"answer":3,"option_notes":["亚阶段 1 只有先天反射，不会为听声音而重复摇铃。","**primary circular reactions** 以自身身体为中心；摇铃听声已转向外部效果。","**means-end behavior** 与完全遮盖后仍能寻找，属亚阶段 4 的能力。","**secondary circular reactions** 重复能产生有趣外部效果的动作，正是亚阶段 3。"],"explain":"亚阶段 3（4 至 8 个月）焦点由自身转向外界，出现 **secondary circular reactions**；客体永久性只发展到“找部分遮盖的物体”，完全遮盖（即使看见遮盖过程）仍不寻找。亚阶段 4 才出现 **means-end behavior** 与完全遮盖后的寻找。","source":"L2 p.33","tags":["secondary circular reactions","object permanence","substage 3"],"stem_en":"A 6-month-old repeatedly shakes a rattle to hear the sound and searches for toys dropped from the cot; however, if a toy is completely covered by a cloth, the infant does not search for it. Which **Piaget** substage does this best fit?","options_en":["Substage 1: innate reflexes","Substage 2: **primary circular reactions**","Substage 4: **means-end behavior**","Substage 3: **secondary circular reactions**"]},{"id":"d1-l2-017","day":1,"lecture":2,"topic":"亚阶段4","difficulty":3,"type":"direct","stem":"10 个月大的婴儿看到研究员把玩具藏在 A 处并找到它；随后研究员当着他的面把玩具移到 B 处，他仍先到 A 处寻找。这称为什么？","options":["**A-not-B error**","**object permanence** 缺失","**means-end behavior** 尚未出现","**deferred imitation** 的表现"],"answer":0,"option_notes":["**A-not-B error**：到上一次找到物体的位置（A）寻找，而非刚看到物体被移去的位置（B）。","婴儿已能寻找完全遮盖的物体，说明客体永久性已具备，不是缺失。","能移开障碍取玩具即具 **means-end behavior**，与本题错误无关。","**deferred imitation** 是延迟模仿先前观察的动作，与寻找位置无关。"],"explain":"亚阶段 4（8 至 12 个月）出现 **means-end behavior** 与对完全遮盖物体的寻找，但受 **A-not-B error** 限制：仍到上次成功的位置找，而非看到转移后的新位置。到 12 个月多数婴儿已理解物体不在眼前仍存在。","source":"L2 p.34","tags":["A-not-B error","object permanence","means-end behavior"],"stem_en":"A 10-month-old watches a researcher hide a toy in place A and finds it; the researcher then moves the toy to place B in front of the infant, who still searches first in place A. What is this called?","options_en":["**A-not-B error**","Lack of **object permanence**","**means-end behavior** has not yet appeared","A manifestation of **deferred imitation**"]},{"id":"d1-l2-018","day":1,"lecture":2,"topic":"亚阶段5","difficulty":2,"type":"direct","stem":"一个 15 个月大的幼儿把玩具从不同高度丢下，观察它怎样落地，并不断改变玩法。按 **Piaget**，这属于？","options":["亚阶段 3：**secondary circular reactions**","亚阶段 5：**tertiary circular reactions**","亚阶段 6：心理表征","亚阶段 2：**primary circular reactions**"],"answer":1,"option_notes":["**secondary circular reactions** 只是重复原动作，不尝试变化。","**tertiary circular reactions**：不只重复，还尝试各种变化，动作具目的性与实验性。","亚阶段 6 已能用心理符号在脑中想出办法，不必依赖试错。","**primary circular reactions** 以自身身体为中心，不符合丢玩具的实验行为。"],"explain":"亚阶段 5（12 至 18 个月）出现 **tertiary circular reactions**：婴儿像做实验一样改变动作看效果；但此时“没有代表物体的心理符号”，仍依赖试错，与亚阶段 6 的心智表征形成对比。","source":"L2 p.35","tags":["tertiary circular reactions","substage 5","sensorimotor"],"stem_en":"A 15-month-old drops toys from different heights, watches how they fall, and keeps varying the way it plays in order to see what happens. According to **Piaget**'s substages, this behaviour belongs to:","options_en":["Substage 3: **secondary circular reactions**","Substage 5: **tertiary circular reactions**","Substage 6: mental representation","Substage 2: **primary circular reactions**"]},{"id":"d1-l2-019","day":1,"lecture":2,"topic":"亚阶段6","difficulty":2,"type":"direct","stem":"18 至 24 个月大的幼儿能在心中形成物体与事件的心理表征，不必实际尝试就能想出解决办法，并开始假装游戏。这属于？","options":["亚阶段 4：**means-end behavior**","亚阶段 5：**tertiary circular reactions**","亚阶段 6：心理表征能力形成","亚阶段 1：先天反射"],"answer":2,"option_notes":["亚阶段 4 的手段-目的行为仍需实际动作配合，尚不能纯靠思考。","亚阶段 5 以试错实验为主，本讲特别指出此时“没有代表物体的心理符号”。","亚阶段 6 形成心理表征（词语、图像），能靠思考产生解法，并有假装游戏。","亚阶段 1 只有先天反射，远未达到心理表征。"],"explain":"亚阶段 6（18 至 24 个月）的标志是心理表征：以词语或图像代表物体与事件，因而能“想一想”就解决问题、进行假装游戏，手段-目的行为也更复杂；客体永久性亦趋完整。","source":"L2 p.36","tags":["mental representation","substage 6","pretend play"],"stem_en":"An 18- to 24-month-old can form mental representations of objects and events, work out solutions to problems by thinking rather than by trial and error, and begins pretend play. This belongs to which substage?","options_en":["Substage 4: **means-end behavior**","Substage 5: **tertiary circular reactions**","Substage 6: the formation of mental representation","Substage 1: innate reflexes"]},{"id":"d1-l2-020","day":1,"lecture":2,"topic":"经典条件作用","difficulty":2,"type":"direct","stem":"在 **Little Albert** 实验中，白鼠原本是中性刺激，与巨响配对后开始引起恐惧。条件作用完成后，白鼠属于？","options":["**UCS**（无条件刺激）","**UCR**（无条件反应）","**NS**（中性刺激）","**CS**（条件刺激）"],"answer":3,"option_notes":["**UCS** 是本来就能引发反应的无条件刺激；实验中是巨响（噪音）。","**UCR** 是 **UCS** 引起的反应，如巨响引起的恐惧。","**NS** 是配对前不引发反应的中性刺激；白鼠已完成配对，不再只是中性刺激。","**CS**：原本中性的白鼠与 **UCS** 配对后，单独呈现也能引发恐惧，成为条件刺激。"],"explain":"**Little Albert** 的配对是：巨响（**UCS**）引发恐惧（**UCR**）；白鼠（**NS**）与巨响配对后成为 **CS**，单独出现即引发恐惧（**CR**）。此后与白鼠相似的物体也引起恐惧，即 **generalization**（泛化）。","source":"L2 p.40","tags":["classical conditioning","Little Albert","UCS","CS"],"stem_en":"In the **Little Albert** experiment, the white rat was originally a neutral stimulus and began to elicit fear after being paired with a loud noise. After conditioning is complete, the white rat is:","options_en":["**UCS**","**UCR**","**NS**","**CS**"]},{"id":"d1-l3-001","day":1,"lecture":3,"topic":"认知发展","difficulty":1,"type":"direct","stem":"按 **Piaget** 的观点，**intelligence** 是一种帮助有机体完成什么的基本生命功能？","options":["内化所处文化的工具与价值观","提高信息加工的速度与容量","适应环境，并维持认知平衡","在每个阶段积累尽可能多的知识"],"answer":2,"option_notes":["内化文化工具是 **Vygotsky** 的社会文化观点，不是皮亚杰对智力的定义。","信息加工的速度与容量属信息加工取向，皮亚杰关注思维结构而非加工效率。","皮亚杰视智力为帮助有机体适应环境的基本生命功能，**cognitive equilibrium** 即思维与环境的平衡。","皮亚杰不以知识量定义智力，而以适应环境的结构与平衡化过程为核心。"],"explain":"皮亚杰从 **adaptation** 出发定义智力：帮助有机体适应环境的基本生命功能，目标是 **cognitive equilibrium**（思维过程与环境之间的平衡）。见“适应”“平衡”即锁定皮亚杰。","source":"L3 p.3","tags":["Piaget","intelligence","cognitive equilibrium"],"stem_en":"According to **Piaget**'s theory of cognitive development, **intelligence** is a basic life function that helps an organism do which of the following?","options_en":["Internalize the tools and values of one's culture","Increase the speed and capacity of information processing","Adapt to the environment and maintain cognitive equilibrium","Accumulate as much knowledge as possible at each stage"]},{"id":"d1-l3-002","day":1,"lecture":3,"topic":"同化与顺应","difficulty":1,"type":"direct","stem":"儿童用已有 **scheme** 去解释新信息、把新经验纳入原有理解，这一过程称为什么？","options":["**Assimilation**（同化）","**Accommodation**（顺应）","**Organization**（组织）","**Equilibration**（平衡化）"],"answer":0,"option_notes":["**Assimilation**：用既有图式解释新信息，使新经验被快速纳入原有理解，方向是“以旧释新”。","**Accommodation**：修改既有图式以适配新信息，方向与同化相反，通常在同化失败时发生。","**Organization**：把既有图式整合、重组为更复杂的新图式，不涉及新旧信息的取舍。","**Equilibration**：平衡同化与顺应、形成适配环境图式的整体过程，是更高层机制。"],"explain":"皮亚杰的四个认知过程：**assimilation** 以旧释新、**accommodation** 改旧纳新、**organization** 图式重组、**equilibration** 调节两者。题干强调用已有图式解释新信息，故为同化。","source":"L3 p.4","tags":["assimilation","accommodation","Piaget"],"stem_en":"A child uses an existing **scheme** to interpret new information and fits new experience into existing understanding. What is this process called?","options_en":["**Assimilation**","**Accommodation**","**Organization**","**Equilibration**"]},{"id":"d1-l3-003","day":1,"lecture":3,"topic":"同化与顺应","difficulty":1,"type":"direct","stem":"儿童原以为“四足动物都是狗”，见到猫也叫狗；被纠正后，他把猫从“狗”的图式中分离出来、另立一类。**这后半段**所体现的认知过程是？","options":["**Assimilation**（同化）","**Conservation**（守恒）","**Organization**（组织）","**Accommodation**（顺应）"],"answer":3,"option_notes":["**Assimilation** 是把新信息纳入原有图式，如继续把猫叫成狗，图式本身没有改变。","**Conservation** 是具体运算阶段的理解——外观改变而数量不变，与图式修改无关。","**Organization** 是把多个图式整合为层级结构，本例是修改原有图式而非合并。","**Accommodation**：修改既有图式以容纳新信息；把猫从“狗”中分出正是图式被修改。"],"explain":"顺应的触发条件是同化失败：旧图式（四足动物＝狗）无法解释新经验（猫），儿童必须修改图式。皮亚杰认为 **accommodation** 促使图式更复杂、更准确，是认知成长的动力。","source":"L3 p.7","tags":["accommodation","assimilation","Piaget"],"stem_en":"A child first assumes that 'all four-legged animals are dogs' and calls a cat a dog; after being corrected, he separates the cat from his 'dog' scheme and makes it a separate category. Which cognitive process does **this latter part** illustrate?","options_en":["**Assimilation**","**Conservation**","**Organization**","**Accommodation**"]},{"id":"d1-l3-004","day":1,"lecture":3,"topic":"平衡化","difficulty":2,"type":"direct","stem":"“儿童先把马叫成大狗，得知后区分马和狗，重新获得对动物的准确理解”这一整段历程说明？","options":["单一的 **assimilation** 过程","**Equilibration**（平衡化）","**Horizontal décalage**（水平滞差）","**Transitivity**（传递性）"],"answer":1,"option_notes":["同化只是把马叫成大狗这一步，无法概括从失衡到新平衡的完整历程。","**Equilibration**：平衡同化与顺应、形成适配环境图式的过程，正对应失衡→同化→顺应→新平衡。","**Horizontal décalage** 指同一运算技能在不同任务上获得时间不同，与本题无关。","**Transitivity** 指 A<B、B<C 则 A<C 的关系推理，属形式运算，题干没有推理链。"],"explain":"PPT 用“狗—马”例子展示平衡化四步：初始平衡→新经验打破平衡→同化（叫大狗）→顺应（承认是马）→新平衡。平衡化是推动认知阶段前进的自我调节机制。","source":"L3 p.8","tags":["equilibration","assimilation","accommodation"],"stem_en":"A child first calls a horse a 'big dog', then separates horses from dogs after being told the difference, and finally regains an accurate understanding of animals. What does this whole sequence illustrate?","options_en":["A single process of **assimilation**","**Equilibration**","**Horizontal décalage**","**Transitivity**"]},{"id":"d1-l3-005","day":1,"lecture":3,"topic":"组织图式","difficulty":1,"type":"direct","stem":"幼儿形成“飞行物”上位类，把“小鸟”和“飞机”列为下位类，使知识结构更有层次。这是？","options":["**Organization**（组织）","**Assimilation**（同化）","**Accommodation**（顺应）","**Equilibration**（平衡化）"],"answer":0,"option_notes":["**Organization**：把现有图式重新排列为新的、更复杂的结构，如“飞行物—小鸟—飞机”的层级。","**Assimilation** 是用旧图式解释新经验（把飞机叫小鸟），不产生层级重组。","**Accommodation** 是修改图式内容以适配新信息，题干强调的是重新排列结构。","**Equilibration** 是调节同化与顺应的过程，不是层级结构本身。"],"explain":"Table 6.1 把四概念串成一条链：平衡→同化（飞机＝小鸟）→顺应（发现没有羽毛）→组织（形成飞行物层级）。组织关注结构重组，与内容增改不同。","source":"L3 p.9","tags":["organization","schemes","Piaget"],"stem_en":"A young child forms the superordinate category 'flying things' and places 'birds' and 'airplanes' under it, making the knowledge structure more hierarchical. This is:","options_en":["**Organization**","**Assimilation**","**Accommodation**","**Equilibration**"]},{"id":"d1-l3-006","day":1,"lecture":3,"topic":"发展阶段","difficulty":2,"type":"direct","stem":"关于皮亚杰的 **invariant developmental sequence**，下列哪项正确？","options":["每个儿童进入各阶段的年龄必须完全相同","儿童可以跳过某个阶段直接进入更高阶段","阶段顺序与年龄一一对应，没有交叉","阶段顺序固定，但进入/退出各阶段的年龄有个体差异"],"answer":3,"option_notes":["固定的是阶段顺序而非年龄；同龄儿童的发展水平可相差数年。","阶段顺序不可跳越，“不变”正指不能跳级。","顺序固定不等于与年龄完全对应，儿童发展快慢不同。","**Invariant developmental sequence**：智力阶段顺序固定，但进入或退出任一阶段的年龄存在个体差异。"],"explain":"皮亚杰四阶段顺序固定：**sensorimotor**（0–2）→**preoperational**（2–7）→**concrete-operational**（7–11）→**formal-operational**。年龄范围只是平均参照，个体差异不违反“不变序列”。","source":"L3 p.10","tags":["invariant developmental sequence","Piaget","stages"],"stem_en":"According to **Piaget**, which of the following statements about the **invariant developmental sequence** of cognitive stages is correct?","options_en":["Every child must enter each stage at exactly the same age.","Children can skip a stage and move directly to a higher one.","The order of stages corresponds one-to-one with age, with no overlap.","The order of stages is fixed, but the ages at which children enter or leave each stage vary between individuals."]},{"id":"d1-l3-007","day":1,"lecture":3,"topic":"符号功能","difficulty":1,"type":"direct","stem":"语言使学前儿童能表征动作、思考未来、同时考虑多种可能性，主要依赖哪种能力？","options":["**Centration**","**Reversibility**","**Symbolic function**","**Conservation**"],"answer":2,"option_notes":["**Centration** 是只从单一维度思考，属前运算局限，不提供表征功能。","**Reversibility** 是心理上逆转转换，属具体运算阶段。","**Symbolic function**：用符号、词语或物体代表不在场的事物，使儿童能超越当下。","**Conservation** 是具体运算阶段的守恒理解，与符号表征不是同一能力。"],"explain":"**Symbolic function**（符号功能/表征洞察）是前运算阶段的积极成就：假装游戏、语言都以“一物代表另一物”为基础。语言因此让学前儿童能表征动作、思考未来、考虑多种可能。","source":"L3 p.12","tags":["symbolic function","representational insight","language"],"stem_en":"Language enables preschoolers to represent actions, think about the future, and consider several possibilities at the same time. Which ability does this mainly depend on?","options_en":["**Centration**","**Reversibility**","**Symbolic function**","**Conservation**"]},{"id":"d1-l3-008","day":1,"lecture":3,"topic":"前运算思维","difficulty":1,"type":"direct","stem":"四岁儿童说：“今天风很大，它知道我热，所以来给我降温。”这体现前运算思维的哪一特征？","options":["**Egocentrism**","**Animism**","**Centration**","**Conservation**"],"answer":1,"option_notes":["**Egocentrism** 是从自己视角看世界、难采择他人观点，题干重点是赋予风以生命。","**Animism**（泛灵论）：把生命或类似生命的属性赋予无生命物体，风“知道”即典型。","**Centration** 是只考虑一个维度，属守恒失败的机制，与拟人化无关。","**Conservation** 是外观变化而数量不变的理解，本句没有数量比较。"],"explain":"前运算思维有多个并列特征：**animism**（泛灵论）、**egocentrism**（自我中心）、**centration**（集中化）。题干把意图与感受赋予风，是典型泛灵论，不要与自我中心混淆。","source":"L3 p.13","tags":["animism","preoperational stage","Piaget"],"stem_en":"A four-year-old says: 'The wind was very strong today. It knew I was hot, so it came to cool me down.' Which feature of preoperational thought does this illustrate?","options_en":["**Egocentrism**","**Animism**","**Centration**","**Conservation**"]},{"id":"d1-l3-009","day":1,"lecture":3,"topic":"自我中心","difficulty":2,"type":"direct","stem":"皮亚杰认为，前运算儿童的 **egocentrism** 包含哪两种形式？","options":["未察觉他人看到的物理角度不同；也未意识到他人可能有不同想法与感受","只考虑一个维度；无法在心理上逆转转换","把生命赋予无生命物；只用一个标准分类","**conservation**／**class inclusion** 失败"],"answer":0,"option_notes":["自我中心两形式：未意识到他人物理视角不同；未认识到他人有不同想法、感受与观点。","这是 **centration** 与不可逆性，属思维局限而非自我中心的形式划分。","前者是 **animism**，后者属分类局限，都不是自我中心的两形式。","守恒与类别包含是具体运算阶段任务，不能用来描述前运算自我中心。"],"explain":"**Egocentrism** 不只是“自私”：一是看不到别人眼中的景象（物理视角），二是想不到别人有不同的想法与情绪（心理观点）。后者与 **false belief** 任务表现密切相关。","source":"L3 p.15","tags":["egocentrism","preoperational stage","false belief"],"stem_en":"According to **Piaget**, which two forms does **egocentrism** include in children at the preoperational stage of cognitive development?","options_en":["Not realizing that others see things from a different physical perspective; and not realizing that others may have different thoughts and feelings","Considering only one dimension; and being unable to mentally reverse a transformation","Attributing life to inanimate objects; and classifying by only one criterion","Failure on **conservation** and **class inclusion**"]},{"id":"d1-l3-010","day":1,"lecture":3,"topic":"守恒","difficulty":2,"type":"direct","stem":"按 PPT 的守恒研究，儿童平均在几岁才可能掌握液体、质量与数量守恒？","options":["3–4 岁","9–12 岁","12 岁以后","6–7 岁"],"answer":3,"option_notes":["3–4 岁处于前运算早期；PPT 指出 5 岁前无法掌握守恒。","9–12 岁是体积（排水法）守恒的平均年龄，晚于液体与质量。","12 岁后已接近形式运算，明显晚于守恒获得时间。","液体、质量、数量守恒平均在 6–7 岁获得，是 PPT 给出的核心年龄。"],"explain":"守恒年龄梯度：液体/质量/数量约 6–7 岁，体积约 9–12 岁。前运算儿童因 **centration** 只看外观单维度而失败；能说出理由才算真正理解守恒。","source":"L3 p.17","tags":["conservation","centration","age"],"stem_en":"According to the conservation research in the lecture, at about what age can children master the conservation of liquid, mass and number?","options_en":["3–4 years old","9–12 years old","After age 12","6–7 years old"]},{"id":"d1-l3-011","day":1,"lecture":3,"topic":"心理理论","difficulty":1,"type":"direct","stem":"PPT 指出，**theory of mind** 发展的关键里程碑是哪种能力的形成（约 3–5 岁）？","options":["**Conservation**（守恒）","**False belief understanding**（错误信念理解）","**Object permanence**（客体永久性）","**Telegraphic speech**（电报式言语）"],"answer":1,"option_notes":["**Conservation** 是具体运算阶段（约 6–7 岁）的成就，不是 TOM 里程碑。","**False belief understanding**：理解他人可持有与事实不符的信念，是 TOM 关键节点，约 3–5 岁。","**Object permanence** 是感知运动阶段（0–2 岁）成就，早于 TOM。","**Telegraphic speech** 是 18–24 个月的语言里程碑，与本讲 TOM 无关。"],"explain":"TOM 的经典测量是 **false belief** 任务（如 **candy box experiment**）：儿童需理解他人会依据错误信念行动。缺乏 TOM 被认为与自闭症相关，语言与工作记忆也影响表现。","source":"L3 p.19","tags":["theory of mind","false belief","autism"],"stem_en":"The lecture states that the key milestone in the development of **theory of mind** is the emergence of which ability (around 3–5 years of age)?","options_en":["**Conservation**","**False belief understanding**","**Object permanence**","**Telegraphic speech**"]},{"id":"d1-l3-012","day":1,"lecture":3,"topic":"具体运算","difficulty":2,"type":"direct","stem":"按 PPT，**reversibility** 是指下列哪种能力？","options":["理解物体外观改变而数量不变","从具体观察中归纳出一般原则","在心理上逆转某种物理或心理转换","把句子中的词序倒过来理解"],"answer":2,"option_notes":["这是 **conservation**（守恒）的定义；可逆性是守恒的心理基础，但两者不同。","这是 **inductive logic**（归纳逻辑），从特定到一般。","**Reversibility**：在心理上逆转某种物理或心理转换，如把黏土香肠变回球、1+3=3+1。","倒序理解句子属语言操作，不是皮亚杰的认知可逆性。"],"explain":"具体运算的基础图式包括 **conservation**、**decentration**、**reversibility**、类别层级与归纳逻辑。可逆性使儿童能在脑中“倒回去”，所以理解外观变而数量不变。","source":"L3 p.21","tags":["reversibility","concrete operational stage","conservation"],"stem_en":"According to the lecture, which of the following abilities does **reversibility** refer to in concrete operational thought?","options_en":["Understanding that quantity stays the same even when appearance changes","Drawing general principles from specific observations","Mentally undoing some kind of physical or mental transformation","Understanding a sentence by reversing the order of its words"]},{"id":"d1-l3-013","day":1,"lecture":3,"topic":"水平滞差","difficulty":3,"type":"direct","stem":"同一名儿童在液体守恒任务上已正确作答，但在面积守恒与天平任务上仍出错。皮亚杰用什么概念解释这种不同步？","options":["**Horizontal décalage**（水平滞差）","**Centration**（集中化）","**Equilibration**（平衡化）","**Animism**（泛灵论）"],"answer":0,"option_notes":["**Horizontal décalage**：同一运算图式在不同任务上获得先后不同，具体运算图式在 6–12 岁逐步获得。","**Centration** 解释守恒失败的原因（只看一个维度），不能解释任务之间的时间差。","**Equilibration** 是总体发展机制，不够具体解释同一阶段内的任务不同步。","**Animism** 是前运算期把生命赋予无生命物，与本例无关。"],"explain":"水平滞差强调“同一技能跨任务不同步”：液体守恒 6–7 岁、类别包含 7–8 岁、面积 8–10 岁。它不同于阶段之间的“垂直滞差”，本例儿童仍在具体运算阶段内。","source":"L3 p.22","tags":["horizontal décalage","concrete operational stage"],"stem_en":"The same child answers a liquid conservation task correctly but still fails area conservation and balance-scale tasks. Which concept did Piaget use to explain this lack of synchrony?","options_en":["**Horizontal décalage**","**Centration**","**Equilibration**","**Animism**"]},{"id":"d1-l3-014","day":1,"lecture":3,"topic":"问题解决规则","difficulty":3,"type":"direct","stem":"在 **Siegler** 的天平任务中，儿童能同时考虑距离与重量，但两者冲突时只能靠猜。这属于哪种规则？","options":["**Preoperational rule**","**Transitional rule**","**Actual formula**","**Concrete operational rule**"],"answer":3,"option_notes":["前运算规则只考虑一个维度，如只看重量或只看盘数。","过渡规则主要依据数量，可能考虑离支点距离，但仍以数量为主。","实际公式能计算重量与距离的联合效果，从不靠猜。","**Concrete operational rule**：同时考虑距离与重量，但冲突时只能猜测，正合题干。"],"explain":"Siegler 用四条规则刻画认知发展：前运算→过渡→具体运算→实际公式。分界点在“能否同时处理两个维度”以及“冲突时有无系统策略”；靠猜说明尚未掌握联合计算。","source":"L3 p.24","tags":["Siegler","balance task","rules"],"stem_en":"In **Siegler**'s balance task, a child can take both distance and weight into account, but can only guess when the two conflict. Which rule is this?","options_en":["**Preoperational
