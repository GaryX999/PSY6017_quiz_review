恋类型看“分离反应 + 重聚反应”：安全型以照料者为 **secure base**、重聚时寻求安慰；回避型对分离反应平淡、重聚时忽略照料者。子朗“好像什么都没发生”正是回避型的典型样貌，别误以为他不在意。","source":"L5 p.28","tags":["avoidant attachment","Strange Situation","Ainsworth"]},{"id":"d2-l5-004","day":2,"lecture":5,"topic":"内部工作模型","difficulty":3,"type":"scenario","scenario":"5 岁的伟豪在幼儿园走廊被同学不小心撞到。老师还没开口，他已认定“他一定是故意的”，立刻推回去，哭着说大家都想欺负他。老师发现，伟豪在家常被责骂，很少得到温暖回应。","scenario_en":"Five-year-old Wai Ho is accidentally bumped by a classmate in the kindergarten corridor. Before the teacher can say anything, he is certain that 'he did it on purpose', pushes back at once and cries that everyone wants to bully him. The teacher notes that Wai Ho is often scolded at home and rarely receives warm responses.","question":"下列哪项解释最符合 PPT 中依恋与 **internal working model** 的论点？","question_en":"Which explanation best matches the lecture's argument about attachment and the **internal working model**?","options":["**stranger anxiety** 使他把同学当陌生人","缺乏 **object permanence**，无法判断意图","**easy temperament** 使反应强烈","不安全型依恋的儿童更易把模糊事件解读为对方怀有敌意"],"options_en":["**stranger anxiety** makes him treat classmates as strangers","A lack of **object permanence** prevents him from judging intentions","**easy temperament** makes his reactions intense","Insecurely attached children are more likely to interpret ambiguous events as hostile"],"answer":3,"option_notes":["**stranger anxiety** 针对陌生人，题干冲突对象是同学，情境不符。","客体永久性约 7–9 个月已发展，与解读社交意图的偏差无关。","**easy temperament** 的特征是情绪积极、反应温和，与题干相反。","研究显示 5 岁不安全依恋儿童更易把“被撞”这类模糊事件解读为对方故意、怀有敌意。"],"explain":"依恋的**内部工作模型**（他人是否可靠、我是否可爱）会塑造儿童对模糊社交事件的解读。研究发现 5 岁不安全依恋儿童倾向把他人的无意碰撞解读为敌意，这与在家较少得到温暖回应、缺少情绪调节支持的背景一致。","source":"L5 p.35","tags":["internal working model","hostile attribution bias","insecure attachment"]},{"id":"d2-l5-005","day":2,"lecture":5,"topic":"父亲依恋","difficulty":2,"type":"scenario","scenario":"中二学生家豪的父亲长期在外地工作，一年只回家几次，但每次回家都会主动陪他聊天、打球，对他的需求很敏感。母亲一直细心照顾他。老师发现家豪情绪稳定、能自己冷静下来，也很少与同学起冲突。","scenario_en":"Ka Ho, a Form 2 student, has a father who works away from home for long periods and returns only a few times a year. Yet every time he returns, he chats and plays ball with Ka Ho and is sensitive to his needs. His mother has always cared for him attentively. Teachers find Ka Ho emotionally stable, able to calm himself down, and rarely in conflict with classmates.","question":"按 PPT 关于父亲作为照料者的研究，家豪的表现最可能与什么有关？","question_en":"According to the lecture's research on fathers as caregivers, what is Ka Ho's behaviour most likely to be related to?","options":["与父亲形成安全型依恋（即使不常住在一起），有助情绪自我调节与社交能力","父亲长期不在家，必然导致依恋障碍与不良行为","只有母亲参与照顾，父亲的影响可忽略","父亲只要提供物质资源，就足以形成安全依恋"],"options_en":["Forming a secure attachment to his father (even without living together), which supports emotional self-regulation and social competence","His father's long absence inevitably causes attachment disorder and behaviour problems","Only the mother is involved in care, so the father's influence can be ignored","As long as the father provides material resources, a secure attachment will form"],"answer":0,"option_notes":["研究显示与父亲形成安全型依恋（即使不与父亲同住）的儿童，情绪自我调节更好、社交能力更强。","关键在依恋质量而非同住与否；题干中家豪并无依恋障碍迹象。","父亲与父母双方的依恋都有独立贡献，不能忽略。","安全依恋取决于敏感回应与关系质量，物质资源本身不足。"],"explain":"父亲在出生后第一年后半段已能与婴儿建立依恋；与父亲形成安全型依恋的儿童（即使不同住）有更好的情绪自我调节、社交能力与较少不良行为。与父母双方都安全依恋的儿童焦虑更少、学校适应更好。","source":"L5 p.39","tags":["father attachment","emotional self-regulation"]},{"id":"d2-l5-006","day":2,"lecture":5,"topic":"日托与依恋","difficulty":3,"type":"scenario","scenario":"美玲与丈夫为是否把 1 岁女儿送日托而争论。奶奶说：“越早送日托，孩子越容易跟妈妈不亲。”美玲担心得想辞掉工作。他们参观的日托中心师生比例合理、环境安全，老师也常拥抱、回应婴儿。","scenario_en":"Mei Ling and her husband disagree about whether to send their one-year-old daughter to daycare. The grandmother says: 'The earlier a child is sent to daycare, the less close she will be to her mother.' Mei Ling is so worried that she considers quitting her job. The daycare centre they visit has a reasonable child–staff ratio, a safe environment, and teachers who often hug and respond to the infants.","question":"按 **NICHD**（1997）的研究结论，美玲最合理的判断是什么？","question_en":"According to the findings of the **NICHD** (1997) study, what is Mei Ling's most reasonable conclusion?","options":["日托开始年龄与时长本身就是依恋类型的最强预测因素","只要送日托，孩子必然形成不安全依恋","日托起始年龄与时长跟依恋类型无显著相关；质量与家庭教养更关键","母亲必须辞职，否则无法建立安全依恋"],"options_en":["The age at which daycare begins and its duration are themselves the strongest predictors of attachment type","Sending a child to daycare inevitably produces insecure attachment","The age at which daycare begins and its duration are not significantly related to attachment type; quality and family child-rearing matter more","The mother must quit her job, otherwise a secure attachment cannot form"],"answer":2,"option_notes":["**NICHD**（1997）发现起始年龄与时长跟依恋类型没有显著相关，不是最强预测因素。","“必然形成不安全依恋”与“无显著相关”的结论相反。","研究显示起始年龄、时长与心理健康、依恋类型无显著相关；影响来自日托质量与父母教养方式。","研究不支持“必须辞职”；影响依恋的是照护质量而非母亲是否工作。"],"explain":"**NICHD** 早期儿童保育研究网络发现：日托的起始年龄与时长，与心理健康、依恋类型之间没有显著相关。真正有影响的是**日托质量**以及父母的教养方式与对工作的态度，不必用“越早送越伤”来决策。","source":"L5 p.40","tags":["daycare","NICHD","attachment security"]},{"id":"d2-l5-007","day":2,"lecture":5,"topic":"气质九维度","difficulty":3,"type":"scenario","scenario":"4 岁的浩然刚进幼稚园：每天吃饭、睡觉的时间都难以预测；午餐时凡没见过的菜一定先推开，要试很久才肯吃；一旦不开心，哭闹强度总是全班最大。","scenario_en":"Four-year-old Ho Yin has just started kindergarten: the times at which he eats and sleeps vary unpredictably from day to day; at lunch he pushes away any dish he has never seen and takes a long time to try it; and whenever he is unhappy, the intensity of his crying is the greatest in the class.","question":"按 **Thomas & Chess** 的九维度，浩然“拒吃没见过的菜”最突出反映哪一维度？","question_en":"According to **Thomas & Chess**' nine dimensions, which dimension does Ho Yin's refusal to eat unfamiliar dishes most clearly reflect?","options":["**adaptability**（对变化的适应快慢）","**approach/withdrawal**（对新奇事物的反应）","**rhythmicity**（生物节律的规律性）","**threshold of responsiveness**（对刺激的敏感度）"],"options_en":["**adaptability** (how quickly the child adapts to change)","**approach/withdrawal** (response to novelty)","**rhythmicity** (regularity of biological rhythms)","**threshold of responsiveness** (sensitivity to stimulation)"],"answer":1,"option_notes":["**adaptability** 指对环境变化的适应快慢；题干问的是“对新奇食物的反应”，故不最贴合。","**approach/withdrawal** 指对新奇事物的反应，大胆靠近或退缩；拒吃没见过的菜正是退缩。","**rhythmicity** 指生物节律规律性，对应题干“吃睡时间难预测”，非拒吃新菜。","**threshold of responsiveness** 指对刺激的敏感度，与拒绝新食物不是同一维度。"],"explain":"九维度要能对应具体行为：**rhythmicity** 看作息是否规律、**approach/withdrawal** 看对新奇事物的反应、**intensity of reaction** 看情绪反应强弱。“拒吃新菜”属 **approach/withdrawal**（退缩），另两个线索分别对应其余两维度。","source":"L5 p.14","tags":["temperament dimensions","approach/withdrawal","Thomas & Chess"]},{"id":"d2-l6-001","day":2,"lecture":6,"topic":"虚假自我行为","difficulty":2,"type":"scenario","scenario":"中三学生嘉俊平时安静内向、喜欢画画。为了加入班上的“风云人物”圈子，他模仿他们说话的方式，贴出自己其实不感兴趣的球赛照片，还刻意说粗口。回家后他觉得别扭，心想“那不是我”。","scenario_en":"Ka Chun, a Form 3 student, is usually quiet and introverted and enjoys drawing. To join the class's 'cool group', he imitates the way they talk, posts photos of ball games he is not actually interested in, and deliberately swears. Back home he feels awkward and thinks, 'That is not me.'","question":"嘉俊的行为最符合 **self-concept** 发展中的哪个概念？","question_en":"Which concept in the development of **self-concept** does Ka Chun's behaviour best illustrate?","options":["**identity achievement**（同一性达成）","**false self-behavior**（虚假自我行为）","**extended self**（扩展自我）","**learned helplessness**（习得性无助）"],"options_en":["**identity achievement**","**false self-behavior**","**extended self**","**learned helplessness**"],"answer":1,"option_notes":["同一性达成是在探索后对自身价值做出承诺；嘉俊只是模仿他人、并不认同。","**false self-behavior** 指做出与性格不符的行为以提升形象，事后觉得“那不是我”正是典型。","**extended self** 指整合过去、现在与未来的自我表征，与模仿他人无关。","**learned helplessness** 指把失败归因于稳定内部因素而放弃努力，与此无关。"],"explain":"童年中期至青春期的自我概念更抽象、心理化，也更容易意识到“我在不同情境里不一样”。为提升形象，青少年可能做出与性格不符的**false self-behavior**，这可以是自我探索的一部分，但长期伪装会带来不适。","source":"L6 p.10","tags":["false self","self-concept","adolescence"]},{"id":"d2-l6-002","day":2,"lecture":6,"topic":"少数族裔自尊","difficulty":2,"type":"scenario","scenario":"南亚裔学生阿米娜初小时常因口音被取笑，自我评价偏低；升上中学后，她加入文化社团，认识一群同族朋友，父母也常强调家族文化与族群的光荣。到中三，老师发现她的自信明显提升，还主动在周会分享自己的文化。","scenario_en":"Amina, a South Asian student, was often teased about her accent in the early primary years and had low self-evaluation. After entering secondary school, she joined the cultural society and met a group of friends from the same ethnic group, and her parents often stressed the honour of the family's culture and ethnicity. By Form 3, teachers find her confidence clearly higher, and she even volunteers to share her culture at assembly.","question":"按 PPT 关于**种族**对 **self-esteem** 影响的研究，阿米娜的变化最符合哪一描述？","question_en":"According to the lecture's research on the influence of **ethnicity** on **self-esteem**, which description best fits the change in Amina?","options":["少数族裔学生的自尊在任何年龄都必然低于主流群体","族群认同与父母支持会降低自尊","少数族裔学生的自尊在小学阶段较低，但到青春期可持平或更高","自尊一旦在小学阶段偏低，之后不可能回升"],"options_en":["The self-esteem of ethnic-minority students is inevitably lower than that of the mainstream group at every age","Ethnic identity and parental support lower self-esteem","Ethnic-minority students have lower self-esteem in primary school, but by adolescence it may be equal to or even higher","Once self-esteem is low in primary school, it can never recover afterwards"],"answer":2,"option_notes":["“必然低于”过于绝对；青春期可出现持平或更高。","方向相反：父母支持与族群自豪感有助提升自尊。","研究显示少数族裔在小学时自尊较低，但到青春期可持平甚至更高；父母支持与族群自豪感是关键。","青少年期自尊可回升，题干案例正是这种变化。"],"explain":"**种族／族群**会影响自尊的轨迹：少数族裔儿童在小学阶段自尊较低，但到青春期往往追平甚至高于主流群体。**父母支持**与**族群自豪感**是保护因素，这解释了阿米娜在认同资源增加后的变化。","source":"L6 p.17","tags":["self-esteem","ethnicity","adolescence"]},{"id":"d2-l6-003","day":2,"lecture":6,"topic":"独立性训练","difficulty":3,"type":"scenario","scenario":"欣怡自中一起，父母让她自己规划温习时间表、安排零用钱，做错决定也要自己承担后果；同时父母要求她认真对待学业，会与她讨论目标，做到时称赞，偶有失手就一起复盘下次怎么改进。","scenario_en":"Since Form 1, Yan Yee's parents have let her plan her own revision timetable and arrange her own pocket money, and she has to bear the consequences of poor decisions herself. At the same time, her parents require her to take her studies seriously, discuss goals with her, praise her when she succeeds, and when she occasionally slips, review with her how to improve next time.","question":"情景中“让她自己规划、承担后果”的做法，最直接对应哪一项训练？","question_en":"Which kind of training does the practice of 'letting her plan and bear the consequences herself' most directly correspond to in the lecture?","options":["**independence training**（培养自主与自力更生）","**achievement training**（设高标准、鼓励做好）","**mastery motivation**（天生的掌控环境动机）","**process-oriented praise**（表扬努力与策略）"],"options_en":["**independence training** (fostering autonomy and self-reliance)","**achievement training** (setting high standards and encouraging good performance)","**mastery motivation** (the inborn motivation to master the environment)","**process-oriented praise** (praising effort and strategies)"],"answer":0,"option_notes":["让她自己规划时间与金钱并承担后果，正是 **independence training**：培养自主与自力更生。","**achievement training** 是设高标准并鼓励孩子做好；情景中“讨论目标、称赞做到”更贴近它。","**mastery motivation** 是天生的动机，不是父母提供的训练方式。","过程导向表扬是反馈方式，不包括让孩子自己规划与承担后果。"],"explain":"培养成就动机需要双轨：**independence training** 培养自主与自力更生，**achievement training** 设高标准并鼓励做好。情景中父母两者兼备，还做到肯定成功、适度看待失败，并以温暖坚定的 **authoritative** 方式沟通。","source":"L6 p.27","tags":["independence training","achievement training","authoritative parenting"]},{"id":"d2-l6-004","day":2,"lecture":6,"topic":"归因年龄差异","difficulty":2,"type":"scenario","scenario":"同一场数学小测，两个男孩都考差了。6 岁的志伟说：“我下次一定拿 100 分！我只是今天还没学会，多练几次就会变聪明。”10 岁的家俊说：“我数学本来就差，其他同学都比我好，再努力也一样。”","scenario_en":"Two boys both did badly on the same maths quiz. Six-year-old Zhi Wei says: 'I will definitely get 100 next time! I just have not learned it yet; if I practise more I will get smarter.' Ten-year-old Ka Chun says: 'I am just bad at maths. The other students are all better than me; it will be the same even if I try harder.'","question":"按 PPT 关于成就归因的年龄差异，两人差异最恰当的解读是什么？","question_en":"According to the lecture on age differences in achievement attributions, what is the most appropriate interpretation of the difference between the two boys?","options":["志伟属于习得性无助取向，家俊是掌握定向","两人的归因差异完全来自遗传的智力差异","7 岁前多持能力增量观；8–12 岁开始区分努力与能力","两套归因方式都会随年龄增长必然消失"],"options_en":["Zhi Wei has a learned-helplessness orientation, whereas Ka Chun is mastery-oriented","The difference in attribution comes entirely from inherited intelligence","Before age 7, children mostly hold an incremental view of ability; at 8–12 they begin to distinguish effort from ability","Both attribution styles necessarily disappear as children grow older"],"answer":2,"option_notes":["方向相反：志伟相信能力可变、会再努力，属乐观／掌握取向；家俊才偏向无助。","归因差异主要由认知发展、教师反馈与社会比较经验解释，不是遗传智力。","7 岁前持 **incremental view** 且过度乐观；8–12 岁开始区分努力与能力、常用社会比较。","归因会随年龄与经验改变，但不是“必然消失”这种简单说法。"],"explain":"约 7 岁前，儿童是不切实际的乐观者，相信能力可通过努力练习改变（**incremental view**），教师也常表扬努力；8–12 岁开始区分努力与能力，教师更重视能力评价、更多使用社会比较。因此同样考差，6 岁与 10 岁的解释会不同。","source":"L6 p.35","tags":["attribution","age differences","incremental view"]},{"id":"d2-l6-005","day":2,"lecture":6,"topic":"ADHD 归因","difficulty":2,"type":"scenario","scenario":"9 岁的小杰被诊断为 **ADHD**，上课很难坐定。每次默书不合格或忘记交功课，他都说：“老师出得太难，又没提醒我，同学也害我分心。”被问到自己能否改善，他耸肩说：“我这个人就是坐不住，在哪儿都一样。”","scenario_en":"Nine-year-old Xiao Jie has been diagnosed with **ADHD** and finds it very hard to sit still in class. Every time he fails a dictation or forgets to hand in homework, he says: 'The teacher made it too hard and did not remind me, and my classmates distracted me.' When asked whether he can improve, he shrugs: 'I am just a person who cannot sit still, no matter where I am.'","question":"按 PPT 关于 **ADHD** 儿童归因的研究，小杰的归因方式最符合哪一描述？","question_en":"According to the lecture's research on the attributions of children with **ADHD**, which description best fits Xiao Jie's attribution style?","options":["把失败归于内部稳定因素（能力），并把成功归因于努力","认为问题行为只出现在特定情境，且完全可控","把小问题归因于努力不足，因此加倍用功","把负面结果归因于外部因素，并认为问题行为跨情境且不可控"],"options_en":["Attributing failure to internal, stable factors (ability) and success to effort","Believing that the problem behaviour occurs only in specific situations and is entirely controllable","Attributing small problems to insufficient effort and therefore working twice as hard","Attributing negative outcomes to external factors and regarding the problem behaviour as global across situations and uncontrollable"],"answer":3,"option_notes":["**ADHD** 儿童更常把负面结果归因于外部，而非内部稳定的能力因素。","研究恰好相反：他们认为问题行为在不同情境中更具普遍性且无法控制。","题干中是“老师太难、同学害我”的外部归因，不是努力不足的内归因。","两项特征完全吻合：9–12 岁 **ADHD** 儿童视问题行为跨情境且不可控，并常把失败归于外部。"],"explain":"**ADHD** 儿童的归因有独特模式：他们倾向认为自己的问题行为在情境间普遍存在、无法控制，并把负面结果归因于外部因素。这种归因加上同伴污名，会削弱改变动机，也更容易走向**习得性无助**。","source":"L6 p.33","tags":["ADHD","attribution","learned helplessness"]},{"id":"d2-l6-006","day":2,"lecture":6,"topic":"同一性延缓","difficulty":2,"type":"scenario","scenario":"嘉敏中六毕业后顺利入读心仪的护理学系，一路按父母的期望读完两年。最近她主动申请转读社会学，又参加社工体验营、阅读不同职业的访谈，告诉父母：“我想弄清楚自己真正想要什么，现在还不确定。”父母担心她“倒退”了。","scenario_en":"After Form 6, Ka Man was admitted to her preferred nursing programme and completed two years of it following her parents' expectations. Recently she has applied on her own initiative to switch to sociology, joined a social-work experience camp and read interviews with people in different careers, telling her parents: 'I want to work out what I really want; I am still not sure.' Her parents worry that she is 'going backwards'.","question":"按 PPT 关于 **identity formation** 的研究，嘉敏的情况应如何理解？","question_en":"According to the lecture's research on **identity formation**, how should Ka Man's situation be understood?","options":["她已进入 **identity foreclosure**，只是暂时迷惘","大学生可能由达成退回延缓（甚至混乱），属常见的探索","她已永久失去自我，属于无法逆转的同一性混乱","这证明青少年无法建立同一性，应尽早放弃探索"],"options_en":["She has entered **identity foreclosure** and is only temporarily confused","University students may regress from achievement to moratorium (or even diffusion), which is a common form of exploration","She has permanently lost herself and is in an irreversible identity diffusion","This proves that adolescents cannot establish an identity and should give up exploring as early as possible"],"answer":1,"option_notes":["早闭是未经历危机却已承诺；嘉敏正在主动探索、尚未承诺，属延缓。","大学生可从 **identity achievement** 退回 **moratorium** 甚至混乱，重新探索不等于失败。","暂时未承诺不等于永久混乱；**moratorium** 并非充满压力的状态。","研究不支持“无法建立同一性”；探索是达成同一性的必经过程。"],"explain":"**Marcia** 的**同一性延缓**（**moratorium**）是积极提问、尚未承诺的阶段，并不必然充满压力。研究也指出大学生可能从**同一性达成**退回**延缓**甚至混乱；不同领域也可能处于不同状态，因此重新探索是正常发展而非“倒退”。","source":"L6 p.51","tags":["identity moratorium","college","Marcia"]},{"id":"d2-l7-001","day":2,"lecture":7,"topic":"改变刻板印象","difficulty":2,"type":"scenario","scenario":"家教会的社工阿玲准备推行“减少性别刻板印象”计划，正收集意见：甲方案招募高年级学生，认为他们认知成熟、更易明白道理；乙方案招募低年级学生，由男社工带领；丙方案先让学生看大量传统性别广告，再讨论问题；丁方案只派发单张给家长，不安排活动。","question":"按 PPT 对“改变性别角色态度与行为”的建议，哪个方案最可能有效？","options":["乙方案：对象为低年级儿童，且由男性成人带领","甲方案：对象为高年级学生，认知成熟更易改变","丙方案：先大量接触刻板印象，再作讨论","丁方案：只派发单张，不在课堂进行"],"answer":0,"option_notes":["PPT 建议：干预对年幼儿童效果最佳；负责人为男性时项目效果最佳。","与“干预措施对年幼儿童效果最佳”的说法相反。","应推迟接触性别刻板印象，而非先大量接触。","PPT 四点建议中未提「派发单张」；有效方案须针对年幼儿童、且由男性成人带领（p.42）。"],"explain":"PPT 关于改变性别角色态度的建议：父母教导生物性别除生育外并不重要、推迟接触性别刻板印象、干预对年幼儿童效果最佳、由男性成人负责的项目效果最佳。把方案与这四点对齐即可。","source":"L7 p.42","tags":["gender stereotypes","intervention","gender attitudes"],"scenario_en":"A social worker at a parent–teacher association is planning a programme to reduce gender stereotypes and is gathering suggestions. Plan A recruits senior students, on the grounds that they are cognitively mature and will understand the rationale more easily. Plan B recruits junior students and is led by a male social worker. Plan C first shows students many traditional gender advertisements and then discusses the problems. Plan D only distributes leaflets to parents and arranges no activities.","question_en":"According to the lecture's suggestions on changing gender-role attitudes and behaviour, which plan is most likely to be effective?","options_en":["Plan B: younger children, led by a male adult","Plan A: senior students, who are cognitively mature and easier to change","Plan C: first exposing students to many stereotypes and then discussing them","Plan D: distributing leaflets only, with no classroom activities"]},{"id":"d2-l7-002","day":2,"lecture":7,"topic":"学业影响","difficulty":2,"type":"scenario","scenario":"陈老师在数学课上不自觉地认为女生靠努力、男生靠天分：女生做对难题时他说“你很用功”，男生做对时说“你真聪明”。一年后，几位原本喜欢数学的女生开始说“我数学没有天分，文科才适合我”。","question":"按 PPT 对学业影响的分析，这最符合下列哪一项机制？","options":["教师对男女期望一致，性别差异与教师无关","教师奖励女生在数学上的努力，使女生相信才能更偏向语言等非量化领域","家长把女儿的成功归因于能力，因此女儿更自信","课程内容过难，导致所有学生都失去数学兴趣"],"answer":1,"option_notes":["PPT 指出教师持有相似刻板印象，并以类似方式影响儿童。","**Scholastic influence**：教师对女生努力的奖励，使更多女生相信自己的才能在语言等非量化领域。","PPT 的家长归因恰好相反：女儿成功多归因于努力。","题干线索在教师对不同性别的反馈差异，而非课程难度。"],"explain":"学业影响是自我实现预言的延伸：教师强化“女生靠努力”，学生便把它解读为“我缺乏天分”，于是把自我定位转向语言等非量化领域。家庭与学校机制方向一致。","source":"L7 p.15","tags":["scholastic influence","self-fulfilling prophecy","gender stereotypes"],"scenario_en":"In math lessons, Mr Chen unconsciously believes that girls rely on effort while boys rely on talent: when a girl solves a difficult problem he says, “You worked hard,” but when a boy does he says, “You're so smart.” A year later, several girls who used to enjoy math begin to say, “I have no talent for math; humanities suit me better.”","question_en":"According to the lecture's analysis of scholastic influence, which mechanism does this best illustrate?","options_en":["Teachers hold identical expectations for boys and girls, so sex differences have nothing to do with teachers.","Teachers reward girls' effort in math, leading girls to believe that their talents lie more in language and other non-quantitative domains.","Parents attribute their daughter's success to ability, so she becomes more confident.","The curriculum is too difficult, so all students lose interest in math."]},{"id":"d2-l7-003","day":2,"lecture":7,"topic":"性别强化","difficulty":2,"type":"scenario","scenario":"中二女生阿欣原本常和男同学打球。升上中二后，她突然拒绝与男生一起活动，嘲笑班上说话温柔的男生“不似男仔”，又花大量时间打扮、在意别人怎样看自己。妈妈觉得她对性别角色比小学时更严格。","question":"用 PPT 的概念解释阿欣的转变，最贴切的是哪一项？","options":["**Gender segregation** 在青春期增强，因此她排斥异性","**Gender consistency** 尚未完成，所以她对性别角色特别严格","**Gender intensification**：刻板印象更严格、不容忍","**Gender identity** 出现倒退，她需要重新确认自己是女孩"],"answer":2,"option_notes":["性别隔离在青春期随对异性兴趣增加而逐渐减少。","**Gender consistency** 约 5–7 岁已完成，不能解释青春期变化。","**Gender intensification**：青春期早期刻板印象灵活性降低、对跨性别举止容忍度极低，高中后期可能再变灵活。","性别认同并未倒退；这是性别强化而非认同危机。"],"explain":"**Gender intensification** 解释青春期早期为何青少年暂时更严格地遵守性别角色、排斥跨性别举止，也解释为何认知能力的性别差异在此时更显眼；到高中后期，随着身份更自在，灵活度可能回升。","source":"L7 p.21","tags":["gender intensification","adolescence","gender-role stereotypes"],"scenario_en":"Form 2 girl Ah Yan used to play ball games with boys. After entering Form 2, she suddenly refuses to take part in activities with boys, mocks gentle-speaking boys in her class as “not like a boy,” and spends a great deal of time on her appearance and on what others think of her. Her mother feels that she is stricter about gender roles than she was in primary school.","question_en":"Which concept from the lecture best explains Ah Yan's change?","options_en":["**Gender segregation** increases in adolescence, so she rejects the opposite sex.","**Gender consistency** has not yet been completed, so she is especially strict about gender roles.","**Gender intensification**: stereotypes become stricter and cross-sex mannerisms are tolerated less.","**Gender identity** has regressed, and she needs to confirm that she is a girl again."]},{"id":"d2-l7-004","day":2,"lecture":7,"topic":"性别隔离成因","difficulty":3,"type":"scenario","scenario":"小学一年级的班主任发现：小息时男生喜欢追逐跑跳、玩对战游戏，女生多围坐聊天、玩较安静的游戏；两组很少混玩，甚至互相取笑。老师想在班会讨论这个现象，需要先理解成因。","question":"根据 PPT，下列哪项最能解释这种性别隔离？","options":["男女在智力上的巨大差异，使合作游戏无法进行","性别隔离主要由青春期激素变化造成，小学阶段并不存在","学校课程安排将男女分派到不同活动，是唯一原因","游戏风格差异（男孩活动水平高、女孩被期望安静玩耍），并把异性视为同质外群体"],"answer":3,"option_notes":["PPT 强调两性相似多于相异，智力差异不足以解释性别隔离。","性别隔离在学前已出现（2–3 岁），并非青春期才有。","PPT 列出的解释是游戏风格与认知社会认知因素，课程安排不在其列。","**Gender segregation**：**Maccoby** 的游戏风格差异 + 把异性看成有负面特征的同质外群体。"],"explain":"性别隔离有两层解释：行为层面是游戏风格不合（男孩活动量大、女孩被要求安静地玩）；认知层面是把异性视为“同质且负面”的外群体。青春期后随对异性兴趣增加，隔离才逐渐减少。","source":"L7 p.23","tags":["gender segregation","Maccoby","out-group"],"scenario_en":"A Primary 1 class teacher notices that during recess boys like to chase, run, and play fighting games, while girls mostly sit and chat or play quieter games; the two groups rarely play together and even make fun of each other. The teacher wants to discuss this phenomenon in a class meeting and needs to understand its causes first.","question_en":"According to the lecture, which explanation best accounts for this gender segregation?","options_en":["Huge sex differences in intelligence make cooperative play impossible.","Gender segregation is mainly caused by hormonal changes at puberty and does not exist in primary school.","The school timetable assigns boys and girls to different activities, which is the only cause.","Differences in play styles (boys are more active; girls are expected to play quietly), plus viewing the other sex as a homogeneous out-group."]},{"id":"d2-l7-005","day":2,"lecture":7,"topic":"性别规范压力","difficulty":2,"type":"scenario","scenario":"张先生对子女的玩具态度不同：儿子想玩洋娃娃时他立刻制止，说“男仔唔应该玩呢啲”；女儿想玩遥控车时他只说“玩下都无妨”。后来女儿升中后逐渐放弃这些兴趣，开始很在意异性对自己的评价。","question":"根据 PPT，上述差异最符合下列哪项描述？","options":["男性承受更强的性别规范遵从压力；女孩在青春期多会遵从女性角色规范","女孩承受更强的性别规范遵从压力，因此更早放弃跨性别兴趣","男孩与女孩承受完全相同的压力，差异只是个人偏好","女孩被禁止参与跨性别活动，因此无法发展其他兴趣"],"answer":0,"option_notes":["男性承受更强遵从压力；男孩更排斥异性玩具；女孩在青春期多遵从女性角色规范（重视异性吸引与他人评价）。","方向相反：PPT 指出男性承受更大的遵从压力。","PPT 明确指出男性感到更强的遵从压力，并非完全相同。","PPT 说女孩被赋予更多参与跨性别活动的自由，而非被禁止。"],"explain":"关键是“双重标准”：**masculine behavior** 被赋予更高价值，男孩承受更强遵从压力；女孩虽有更多参与跨性别活动的自由，到青春期仍多遵从女性角色规范。","source":"L7 p.24","tags":["gender-typed behavior","gender norms","adolescence"],"scenario_en":"Mr Zhang treats his children's toys differently: when his son wants to play with a doll he stops him at once, saying, “Boys shouldn't play with that kind of thing”; when his daughter wants to play with a remote-control car he only says, “It's fine to play with it.” Later, after entering secondary school, his daughter gradually gives up these interests and begins to care a lot about how the opposite sex evaluates her.","question_en":"According to the lecture, which description best matches the differences shown above?","options_en":["Males face stronger pressure to conform to gender norms; girls mostly conform to the feminine role by adolescence.","Girls face stronger pressure to conform to gender norms and therefore give up cross-sex interests earlier.","Boys and girls face exactly the same pressure; the difference is only personal preference.","Girls are forbidden to take part in cross-sex activities and therefore cannot develop other interests."]},{"id":"d2-l8-001","day":2,"lecture":8,"topic":"反应型攻击","difficulty":2,"type":"scenario","scenario":"小五的浩铭在走廊被同学撞了一下。对方立刻道歉，但浩铭认定对方“一定系故意”，随即大声辱骂并推撞对方。老师发现浩铭常常如此：情况不清楚时总先假设别人有敌意，事后又觉得“全世界都针对我”。","question":"浩铭的行为模式最符合下列哪一项概念描述？","options":["**Proactive aggressor**：把攻击当作获取实际利益的工具","**Reactive aggressor**：模糊情境中过度归因敌意并迅速报复","**Instrumental aggression**：以伤害为手段达成其他目标","**Relational aggression**：以社交排斥与谣言破坏同伴关系"],"answer":1,"option_notes":["这是冷静、工具性的**proactive** 攻击者，与浩铭先假设敌意再冲动报复相反。","**Reactive aggressors**：敌意、报复性；过度把敌意意图归因于同伴，迅速敌意报复，负面经验又强化预期。","工具性攻击以伤害为手段，题干中浩铭并未得到其他目标。","关系攻击以排斥、谣言破坏关系，与身体/言语报复不符。"],"explain":"**Dodge** 的社会信息加工模型解释这条循环：预期他人有敌意 → 有偏差地扫描线索 → 把模糊伤害归因于敌意 → 愤怒并报复 → 同伴敌意反击与拒绝 → 强化“他人对我有敌意”的预期。","source":"L8 p.13","tags":["reactive aggressors","hostile attribution bias","Dodge"],"scenario_en":"In the corridor, Primary 5 student Ho Ming is bumped by a classmate. The classmate apologizes at once, but Ho Ming decides that it “must have been deliberate” and immediately shouts abuse and pushes him. The teacher notices that Ho Ming often behaves like this: when situations are unclear he always assumes hostility first, and afterwards he feels that “the whole world is against me.”","question_en":"Which concept best describes Ho Ming's behavioural pattern?","options_en":["**Proactive aggressor**: using aggression as a tool to obtain tangible benefits","**Reactive aggressor**: over-attributing hostility in ambiguous situations and retaliating quickly","**Instrumental aggression**: using harm as a means to achieve other goals","**Relational aggression**: damaging peer relationships through social exclusion and rumours"]},{"id":"d2-l8-002","day":2,"lecture":8,"topic":"受欢迎与攻击","difficulty":2,"type":"scenario","scenario":"中三的嘉欣是班中“受欢迎”的女生。她联同一两个好友把小美排除在群组外，又在社交平台散播关于小美的谣言，还威胁同学不要跟小美玩。老师发现嘉欣的人缘反而更好，其他同学也不敢得罪她。","question":"根据 PPT，下列哪项最能解释这种现象？","options":["受欢迎与攻击倾向（尤其关系攻击）呈正相关；攻击可提升人气，人气又让攻击免于制裁","受欢迎儿童一定不使用攻击，因为攻击会损害社交地位","关系攻击只出现在被拒绝的儿童身上，与受欢迎无关","青春期后关系攻击会完全消失，这只是短期现象"],"answer":0,"option_notes":["**Popularity and aggression**：正相关，尤其**关系攻击**；攻击先于并紧随受欢迎地位。","PPT 指出受欢迎儿童也会以外显与关系攻击建立、维持地位。","PPT 说的是正相关，并非只出现在被拒绝儿童身上。","女性的关系攻击从儿童中期到青春期会增加，不会完全消失。"],"explain":"这题打破“攻击者一定不受欢迎”的直觉：**关系攻击**（排挤、谣言、威胁）可以是提升人气的手段，人气又反过来提供“不怕制裁”的保护伞，形成双向关系。","source":"L8 p.17","tags":["popularity","relational aggression","Rose"],"scenario_en":"Form 3 student Ka Yan is a “popular” girl in her class. She and one or two friends exclude Siu Mei from group chats, spread rumours about her on social media, and threaten classmates who want to play with her. The teacher finds that Ka Yan's popularity actually increases, and other students dare not offend her.","question_en":"According to the lecture, which explanation best accounts for this phenomenon?","options_en":["Popularity is positively correlated with aggression (especially relational aggression); aggression can raise popularity, and popularity in turn allows aggression to go unpunished.","Popular children certainly do not use aggression, because it damages social status.","Relational aggression appears only in rejected children and is unrelated to popularity.","Relational aggression disappears completely after puberty, so this is only a short-term phenomenon."]},{"id":"d2-l8-003","day":2,"lecture":8,"topic":"受害者类型","difficulty":2,"type":"scenario","scenario":"小四的咏珊身形瘦小、性格退缩，被同学嘲笑时从不还口也不反抗。她多数时间独处，在班中人缘差；母亲对她过度保护，凡事替她出面。老师还发现另一名被霸凌的男生脾气暴躁、常先挑衅同学，被欺负后又冲动还击，但往往失败。","question":"按 PPT 对受欺凌者的分类，咏珊与那名男生分别最接近？","options":["两人都是 **passive**","两人都是 **provocative**","咏珊 **provocative**；男生 **passive**","咏珊 **passive**；男生 **provocative**"],"answer":3,"option_notes":["两人行为模式明显不同，不能都归为被动型。","两人行为模式明显不同，不能都归为挑衅型。","方向相反：咏珊退缩不反抗，男生躁动挑衅。","咏珊符合**passive**（退缩不反抗、受母亲过度保护）；男生符合**provocative**（逆反焦躁、激怒同伴）。"],"explain":"两类受害者的介入方向不同：被动型需要鼓励表达恐惧与自我怀疑、培养社交技能；挑衅型则有敌意归因偏差，常自己“点燃”冲突。区分关键是“是否主动挑衅、冲动还击”。","source":"L8 p.15","tags":["passive victims","provocative victims","bullying"],"scenario_en":"Primary 4 student Wing Shan is small and withdrawn; when classmates mock her she never talks back or fights. She spends most of her time alone and is not well liked in class; her mother is overprotective and handles everything for her. The teacher also notices another bullied boy who is hot-tempered and often provokes classmates first; when bullied he fights back impulsively but usually fails.","question_en":"According to the lecture's classification of victims, which labels best fit Wing Shan and the boy respectively?","options_en":["Both are **passive victims**.","Both are **provocative victims**.","Wing Shan is a **provocative victim**; the boy is a **passive victim**.","Wing Shan is a **passive victim**; the boy is a **provocative victim**."]},{"id":"d2-l8-004","day":2,"lecture":8,"topic":"消除攻击回报","difficulty":2,"type":"scenario","scenario":"幼儿园老师发现 4 岁的志强在自由活动时经常推人抢玩具。每次推人后老师都立刻制止、训话，但情况没有改善。后来老师改变做法：当他安静地与同学一起玩、轮流等候时给予贴纸和称赞，并刻意减少对推人行为的关注。","question":"老师采用的主要是哪一种控制攻击行为的方法？","options":["创造非攻击性环境（前提控制）","消除攻击行为的回报：强化不相容行为、忽视攻击","家庭治疗或夫妻治疗","加强惩罚的即时性与一致性"],"answer":1,"option_notes":["前提控制包括移除攻击性玩具、避免竞争游戏、提供足够玩具等，题干未描述这些。","**Incompatible-response technique**：强化与攻击不相容的亲社会行为并忽视攻击。","题干未涉及家庭治疗或夫妻治疗，可先排除。","老师减少了对攻击的关注，转向强化亲社会行为，并非加强惩罚。"],"explain":"控制幼儿攻击有三类方法：前提控制（改变环境）、消除回报（不相容反应技术、忽视攻击、休息角而非暂停区）、以及家庭治疗/育儿技能训练/儿童团体训练。题干线索是“强化替代行为 + 不再给攻击关注”。","source":"L8 p.23","tags":["incompatible-response technique","antecedent control","aggression control"],"scenario_en":"A kindergarten teacher finds that 4-year-old Chi Keung often pushes others and grabs toys during free play. Each time he pushes, the teacher immediately stops him and lectures him, but the situation does not improve. The teacher then changes her approach: when he plays quietly with classmates and waits his turn, she gives him stickers and praise, and she deliberately pays less attention to pushing.","question_en":"Which method of controlling aggression is the teacher mainly using?","options_en":["Creating a non-aggressive environment (antecedent control)","Eliminating the payoffs for aggression: reinforcing incompatible behaviour and ignoring aggression","Family therapy or couple therapy","Strengthening the immediacy and consistency of punishment"]},{"id":"d2-l8-005","day":2,"lecture":8,"topic":"共情年龄趋势","difficulty":3,"type":"scenario","scenario":"老师发现：4 岁的乐乐看到同学哭会很不安，却转身走开；12 岁的家俊看到同学被排挤，会先安抚对方再找老师商量。老师想理解为何两人的表现差异这么大。","question":"按 PPT 对共情—利他关系的年龄趋势，下列哪项解释最恰当？","options":["共情与利他的关联在学前期已很强，之后逐渐减弱","幼儿缺乏角色采择与情绪洞察，且未学会调节负性情绪，故共情与利他关联较弱","共情与利他的关联与年龄无关，乐乐只是性格问题","家俊的助人行为完全是服从规范的结果，与共情无关"],"answer":1,"option_notes":["方向相反：幼儿阶段关联较弱，随年龄增强。","**Empathy–altruism** 关联在学前与小学低年级较弱，青春期前及以后更强；关键在情绪调节、抑制个人苦恼与角色采择。","PPT 明确指出存在年龄趋势，并非与年龄无关。","共情是利他的重要情感促成因素，不应把家俊的行为只归于服从规范。"],"explain":"年龄趋势的关键是“情绪调节 + 角色采择”：幼儿能感受他人痛苦，却容易把唤起体验为个人苦恼而回避；年长儿童较能把唤起转化为同情共感，进而主动助人。","source":"L8 p.32","tags":["empathy","altruism","age trends"],"scenario_en":"The teacher notices that 4-year-old Lok Lok becomes very upset when a classmate cries, yet turns away; 12-year-old Ka Chun, when he sees a classmate being excluded, first comforts the child and then talks to the teacher. The teacher wants to understand why the two behave so differently.","question_en":"According to the lecture on age trends in the empathy–altruism relationship, which explanation is most appropriate?","options_en":["The link between empathy and altruism is already strong in the preschool years and gradually weakens afterwards.","Young children lack role-taking skills and emotional insight and cannot yet regulate negative emotions, so the empathy–altruism link is weaker.","The link between empathy and altruism is unrelated to age; Lok Lok simply has a personality problem.","Ka Chun's helping behaviour is entirely a result of compliance with norms and has nothing to do with empathy."]},{"id":"d2-l8-006","day":2,"lecture":8,"topic":"阶段 1","difficulty":2,"type":"scenario","scenario":"老师讲完海因茨偷药的故事后问 8 岁的俊杰：“海因茨应不应该偷药？”俊杰说：“不应该，因为偷东西会被警察拉去坐监；如果无人发现就无所谓。”","question":"按 **Kohlberg** 的分类，俊杰的推理属于哪一阶段？","options":["阶段 1：惩罚与服从定向","阶段 2：朴素利己主义","阶段 3：“好孩子/好女孩”定向","阶段 4：维护社会秩序的道德"],"answer":0,"option_notes":["**Stage 1**：行为好坏看后果，服从权威以避免惩罚；若不被发现，可能不认为该行为错。","阶段 2 以奖励与自身利益为理由，而非单纯怕罚。","阶段 3 以获得他人认可、当个好人作理由。","阶段 4 以法律与维护社会秩序为理由，而非只担心坐牢。"],"explain":"阶段 1 的两个标记：一是避免惩罚；二是“若不被发现就不算错”。俊杰说“无人发现就无所谓”正是阶段 1 的典型表述，不同于阶段 4 的“法律必须遵守”。","source":"L8 p.48","tags":["Kohlberg","punishment-and-obedience","preconventional"],"scenario_en":"After telling the story of Heinz and the drug, the teacher asks 8-year-old Chun Kit, “Should Heinz steal the drug?” Chun Kit says, “No, because stealing will get him put in jail by the police; if no one finds out, it doesn't matter.”","question_en":"According to **Kohlberg**'s classification, which stage does Chun Kit's reasoning represent?","options_en":["Stage 1: punishment-and-obedience orientation","Stage 2: naïve hedonism (self-interest)","Stage 3: “good boy/good girl” orientation","Stage 4: social-order-maintaining morality"]},{"id":"d2-l8-007","day":2,"lecture":8,"topic":"阶段 6","difficulty":2,"type":"scenario","scenario":"中六通识课上，学生讨论海因茨困境。阿晴说：“法律禁止偷窃，但如果要我在守法与救一条人命之间选择，保护生命是更高的原则，即使违法也是道德上对的；重点是所有相关者都会认同这个原则。”","question":"按 **Kohlberg** 的分类，阿晴的推理最符合哪一阶段？","options":["阶段 4：维护社会秩序的道德","阶段 5：社会契约取向","阶段 6：个体良心原则的道德","阶段 3：“好孩子/好女孩”定向"],"answer":2,"option_notes":["阶段 4 强调法律高于个人情感，与“可以违法救人”相反。","阶段 5 视法律为社会契约，仍重视多数意志与共识程序；题干诉诸的是超越法律的普遍原则。","**Stage 6**：依良心所选的伦理原则，即超越法律与社会契约的普遍正义；“保护生命”是更高原则。","阶段 3 以他人认可与善意为理由，而非普遍原则。"],"explain":"阶段 5 与 6 常被混淆：阶段 5 用“社会契约、人权、多数意志”论证，仍承认法律程序的价值；阶段 6 则诉诸个人良心所选的**普遍正义原则**，可凌驾于法律之上。","source":"L8 p.55","tags":["Kohlberg","postconventional","universal justice"],"scenario_en":"In a Form 6 liberal studies lesson, students discuss the Heinz dilemma. Ah Ching says, “The law forbids stealing, but if I had to choose between obeying the law and saving a human life, preserving life is the higher principle, so it is morally right even if it is illegal; the key point is that all those concerned would agree with this principle.”","question_en":"According to **Kohlberg**'s classification, which stage does Ah Ching's reasoning best fit?","options_en":["Stage 4: social-order-maintaining morality","Stage 5: social-contract orientation","Stage 6: morality of individual principles of conscience","Stage 3: “good boy/good girl” orientation"]},{"id":"d2-l9-001","day":2,"lecture":9,"topic":"父母与孩子影响","difficulty":3,"type":"scenario","scenario":"中二学生阿俊自小冲动、坐不住、自控力弱，父母说什么他都要顶回去。父母原本教养一致、温暖且有明确要求，也一直按时跟进功课，行为改变发生在其冲动行为之后；但两年下来逐渐松懈，最后索性不再过问他的行踪，母亲说“管不了就算了”。","question":"用本讲的三种影响方向模型来解释，上述发展最符合哪一种？","options":["**Parental effects model**（父母影响模型）","**Child effects model**（孩子影响模型）","**Transactional model**（交互模型）","**Co-parenting**（共同养育）"],"answer":1,"option_notes":["**Parental effects model**：影响由父母指向孩子，强调用“该做什么”培养良好行为；题干的变化方向与此相反。","正解：高冲动、低自控的孩子显得固执难缠，最终使父母管教松懈甚至退出，本讲称之为**孩子影响模型**。","**Transactional model**：社会化是双向影响，但本讲明确指出父母影响仍大于孩子；题干只呈现孩子→父母这一条线。","**Co-parenting**：父母双方互相支持、组成合作团队，讲的是父母之间的协作，与影响方向无关。"],"explain":"三模型的分界在**箭头方向**：parental effects 是父母→孩子；child effects 是孩子→父母；transactional 是双向。本讲的结论要一起记：父母影响大于孩子，但孩子确实也影响父母，所以孩子的好坏不完全由父母负责。","source":"L9 p.16","tags":["child effects","transactional model","parenting"],"scenario_en":"Ah Chun, a Form 2 student, has always been impulsive, restless and low in self-control, and argues back at whatever his parents say. His parents had been consistent, warm and demanding, and had always followed up on his homework; the change in their parenting came after his impulsive behavior. Over two years, however, they gradually relaxed and finally stopped asking about his whereabouts at all. 'I can't manage him any more,' his mother says.","question_en":"Using this lecture's three models of the direction of influence, which one best fits the development described above?","options_en":["**Parental effects model**","**Child effects model**","**Transactional model**","**Co-parenting**"]},{"id":"d2-l9-002","day":2,"lecture":9,"topic":"教养方式","difficulty":2,"type":"scenario","scenario":"小五学生嘉欣想参加校际辩论队。父母说：“我们支持你，但你要先排好温习时间。”他们与她一起定下每周练习上限，并解释为何不能因比赛缺交作业；她不同意时可以提出理由讨论，父母也会调整。冲突时父母会先冷静再谈。","question":"按 **Baumrind** 的分类，嘉欣父母的教养方式属于哪一种？","options":["**Authoritarian**（专制型）","**Permissive**（放任型）","**Authoritative**（权威型）","**Uninvolved**（忽视型）"],"answer":2,"option_notes":["**Authoritarian**：高要求、低回应，强调服从且不解释理由；题干父母会说明理由并允许讨论，不符。","**Permissive**：低要求、高回应，几乎不设限；题干有明确的练习上限与交作业要求，不符。","正解：**Authoritative** 高要求＋高回应，会说明理由、理性民主、可协商；与题干完全吻合，也示范了自控。","**Uninvolved**：低要求、低回应，基本不管；题干父母高度投入、陪伴讨论，不符。"],"explain":"先看两个轴：有没有合理要求（有）、有没有温暖与解释（有）→ authoritative。最易混的是 authoritarian：同样高要求，但它不回应、不解释、只靠惩罚换取服从，孩子的结果也更差。","source":"L9 p.11","tags":["parenting styles","authoritative","Baumrind"],"scenario_en":"Ka Yan, a Primary 5 student, wants to join the inter-school debate team. Her parents say, 'We support you, but you must first schedule your revision time properly.' Together they set a weekly limit on practice and explain why she cannot skip homework because of competitions. If she disagrees, she may give reasons and discuss it, and her parents will adjust. When conflicts arise, her parents calm down before talking.","question_en":"According to **Baumrind**'s classification, which parenting style do Ka Yan's parents use?","options_en":["**Authoritarian**","**Permissive**","**Authoritative**","**Uninvolved**"]},{"id":"d2-l9-003","day":2,"lecture":9,"topic":"心理控制","difficulty":2,"type":"scenario","scenario":"中一学生咏恩成绩下滑。母亲没有与她订立读书计划，也没有跟进她每天做什么，而是常说：“你再这样，我就不理你了”“你考成这样，妈妈这几年都白费，你还有脸玩？”咏恩近来失眠、常说觉得自己很没用。","question":"按本讲对控制方式的区分，母亲主要使用哪一种？","options":["**Psychological control**（心理控制）","**Behavioral control**（行为控制）","**Demandingness/control**（要求与控制维度）","**Power-assertive discipline**（强制型管教）"],"answer":0,"option_notes":["正解：以收回关爱、诱发羞耻与内疚来影响孩子属**心理控制**，常与焦虑、抑郁及学业不佳相关，正合咏恩的反应。","**Behavioral control**：以坚定合理的纪律规范行为并监督活动，通常带来行为端正；母亲既未订计划也未监督。","**Demandingness/control** 是教养两大维度之一，指管教监督的**总量**，不是这种以关系为筹码的手法。","**Power-assertive discipline** 指以权力压制的方式管教，本讲在预测敌意手足互动时提到；题干核心是撤爱与羞辱。"],"explain":"心理控制的要害是“用关系与情感当筹码”：撤爱、羞辱、内疚。行为控制管的是行为与行踪，两者都可能很严格，但结果相反——前者关联焦虑抑郁，后者关联行为端正。","source":"L9 p.15","tags":["psychological control","internalizing","parenting"],"scenario_en":"Wing Yan, a Form 1 student, has seen her grades fall. Instead of making a study plan with her or following up on what she does each day, her mother often says, 'If you keep this up, I'll stop caring about you', and 'After all the years I've put in, you get these marks, and you still dare to play?' Recently Wing Yan has had insomnia and often says that she feels useless.","question_en":"According to this lecture's distinction between types of control, which one does the mother mainly use?","options_en":["**Psychological control**","**Behavioral control**","**Demandingness/control**","**Power-assertive discipline**"]},{"id":"d2-l9-004","day":2,"lecture":9,"topic":"离婚长期反应","difficulty":2,"type":"scenario","scenario":"家俊中一时父母离婚。如今他读大学，接受访谈时说：“我跟爸爸早就不亲了，好像少了一块。”他也坦言很怕自己将来结婚会不快乐，因此一直不敢认真谈恋爱，并说自己对生活的满意度不高。","question":"家俊的情况最符合本讲所述离婚的哪一类反应？","options":["离婚前的婚姻冲突期反应","分居后的急性危机期反应","父母教养方式改变造成的短期反应","成年后的长期反应"],"answer":3,"option_notes":["对同辈的敌意、极度痛苦与焦虑属**离婚前**冲突期的儿童反应；家俊讲的是成年后的回顾。","危机期指分居后一年以上、生活全面被打乱、父母情绪困难的阶段，不是成年后的结果。","本讲确实提到监护母亲易强制、无监护父亲易溺爱，但题干焦点是父子亲密感与婚姻观，不是教养方式。","正解：成年后更多抑郁症状、生活满意度较低、感到与父母（尤其父亲）失去亲密，并更担心自己婚姻不幸——都是本讲列出的**长期反应**。"],"explain":"本讲把离婚影响分三段：离婚前冲突 → 分居后一年以上的**危机期** → 长期反应。家俊说的“与父亲失去亲密感”与“担心自己婚姻不幸”都属第三段（Amato），不是短期危机。","source":"L9 p.24","tags":["divorce","long-term effects","Amato"],"scenario_en":"Ka Chun's parents divorced when he was in Form 1. Now a university student, he said in an interview, 'I stopped being close to my father long ago; it feels like a piece is missing.' He also admits that he is afraid his own marriage will be unhappy, so he has never dared to be serious about a relationship, and says that his satisfaction with life is low.","question_en":"Which type of divorce reaction described in this lecture best fits Ka Chun's case?","options_en":["A reaction during the pre-divorce marital conflict period","An acute crisis reaction after separation","A short-term reaction caused by changes in parenting style","A long-term reaction in adulthood"]},{"id":"d2-l9-005","day":2,"lecture":9,"topic":"同伴接纳","difficulty":2,"type":"scenario","scenario":"小四学生浩然常抢同学的文具、插队，输了游戏就骂人。班内调查中，“最不喜欢和谁同组”有很多人点他，“最喜欢和谁同组”却几乎无人提名。老师发现他这学期开始逃课，说“上学都没人喜欢我”。","question":"浩然的同伴社交地位最可能属于下列哪一类？","options":["**Neglected**（被忽视型）","**Rejected**（被拒绝型）","**Controversial**（有争议型）","**Popular**（受欢迎型）"],"answer":1,"option_notes":["**Neglected**：喜欢与不喜欢都极少被提名、近乎隐形；浩然已被大量同学点名讨厌，不符。","正解：**Rejected** 被多数人讨厌、被少数人喜欢；本讲指出这类儿童日后适应问题与偏差、反社会行为的风险最高。","**Controversial**：同时被很多人喜欢又被很多人讨厌；浩然几乎没有“喜欢”提名，不符。","**Popular**：被多数人喜欢、仅少数人讨厌，与题干完全相反。"],"explain":"先读两条提名：被讨厌高、被喜欢低 = rejected。本讲特别强调被拒型是四类中风险最高的（被忽视型反而没那么孤独，换班后地位还可能改善），所以除了教社交技能，也要留意他已出现的逃课与孤单感。","source":"L9 p.33","tags":["peer acceptance","rejected","sociometric status"],"scenario_en":"Ho Yin, a Primary 4 student, often grabs classmates' stationery, cuts in line, and swears when he loses a game. In a class survey, many classmates named him as the person they least liked to work with, yet almost nobody nominated him as the person they most liked to work with. His teacher finds that he has started skipping school this term, saying, 'Nobody at school likes me.'","question_en":"Which peer sociometric status does Ho Yin most likely belong to?","options_en":["**Neglected**","**Rejected**","**Controversial**","**Popular**"]},{"id":"d2-l9-006","day":2,"lecture":9,"topic":"网络与友谊","difficulty":2,"type":"scenario","scenario":"中四学生美琪每天放学后与两位好友在群组聊到深夜，会分享自己不敢当面讲的烦恼，例如家里的经济压力与对前途的恐惧。她原本担心上网会令朋友疏远，结果却觉得与这两位朋友比从前更亲密。","question":"按本讲引用的 **Valkenburg & Peter**（2007）研究，这最可能如何解释？","options":["网络交流必然取代线下交流，令友谊质量下降","网上分享私密信息会破坏友谊，因为缺乏信任基础","在线交流促进更亲密的友谊，因网上更自由地自我表露","这只是青少年高估友谊的错觉，研究未发现差异"],"answer":2,"option_notes":["研究结果与“取代并下降”相反：经常在线交流的青少年反而觉得与朋友更亲密。","本讲指出人在网上更自由地分享私密信息，而私密的**self-disclosure**是稳固友谊的核心因素。","正解：在线交流促进更亲密的友谊，机制是网上更自由的**自我表露**，而私密 self-disclosure 正是稳固友谊的核心。","本讲引用的是具体的正向发现，不是“没有差异”；但也要同时记住网络欺凌与依赖陌生人的风险。"],"explain":"这一题考互联网的**益处**这一面：网上少了面对面压力，青少年更愿意**自我表露**，于是出现“网上聊得多、觉得更亲密”的效应。别忘了相反面也有 **online bullying**、色情内容与 15% 青少年依赖陌生人社交等担忧。","source":"L9 p.51","tags":["internet","self-disclosure","friendship"],"scenario_en":"Mei Ki, a Form 4 student, chats with two close friends in a group chat late into the night every day after school, sharing worries that she would never voice face to face, such as the financial pressure at home and her fear about the future. She had worried that going online would push her friends away, but she now feels closer to these two friends than before.","question_en":"According to the **Valkenburg & Peter** (2007) study cited in this lecture, what is the most likely explanation?","options_en":["Online communication necessarily replaces face-to-face contact and lowers the quality of friendship","Sharing intimate information online damages friendship because there is no basis for trust","Online communication promotes closer friendship because people disclose themselves more freely online","This is only adolescents' illusion of overestimating friendship; the study found no difference"]},{"id":"d2-l9-007","day":2,"lecture":9,"topic":"手足关系","difficulty":3,"type":"scenario","scenario":"五岁的子谦原本自己睡、会自己收玩具。妹妹出生两个月后，他每晚哭闹要妈妈陪、把玩具丢满地，还常说“你只疼妹妹”。妈妈大部分时间在照顾妹妹，确实少了一对一的陪玩时间，父母之间也常为分工争吵。","question":"按本讲对手足关系的研究，以下解释最恰当的是哪一种？","options":["新生儿到来改变家庭系统，长子女以退行行为表达不安，安全亲子关系有助适应","子谦天生具攻击性，与妹妹出生无关","这是手足竞争的典型，父母应加重惩罚以尽快建立规矩","同胞竞争只在学龄期出现，五岁儿童不会有这种反应"],"answer":0,"option_notes":["**Sibling rivalry** 常见：新生儿到来使母亲给长子女的温暖陪玩减少，孩子变得难管、破坏，安全亲子关系有助适应。","本讲把原因放在家庭系统的改变与注意力重新分配，而不是归因于孩子天生气质。","本讲提供的缓冲是**与父母的安全关系**与父母和睦，而非加重惩罚；强制型管教反而预测更敌意的手足互动。","手足竞争在长子女身上很早就会出现，本讲并未把它限定在学龄期。"],"explain":"标准链条是：新弟妹出生 → 母亲温暖关注减少 → 长子女退行、破坏、嫉妒。解方是保住一对一的温暖时间、维持安全关系，并避免偏宠任一孩子；父母之间的婚姻冲突与不满，更是嫉妒与敌意手足互动的良好预测指标。","source":"L9 p.17","tags":["siblings","sibling rivalry","family systems"],"scenario_en":"Five-year-old Chi Him used to sleep on his own and put his toys away by himself. Two months after his baby sister was born, he cries every night for his mother to stay with him, throws his toys all over the floor, and often says, 'You only love my sister.' His mother spends most of her time caring for the baby and does indeed have less one-to-one play time with him, and his parents also argue often about how to divide the childcare duties.","question_en":"According to this lecture's research on sibling relationships, which explanation is the most appropriate?","options_en":["The newborn changes the family system, the older child regresses to signal distress, and a secure parent-child relationship aids adjustment","Chi Him is naturally aggressive, and this has nothing to do with his sister's birth","This is typical sibling rivalry, so the parents should punish him more severely in order to establish rules quickly","Sibling rivalry appears only in the school years; a five-year-old would not react in this way"]}],"day3":[{"id":"d3-001","lecture":8,"topic":"科尔伯格道德","difficulty":3,"stem":"阿俊谈海因茨偷药：“法律是大家共同生活的约定；公正的法律必须遵守，但损害人权的法律不公正、可以被挑战。所以要看这条法律有没有真正增进人们的福祉。”这段推理最符合 **Kohlberg** 的哪一阶段？","options":["阶段 3：好孩子／好女孩取向","阶段 5：社会契约取向（人权）","阶段 6：个人良心原则","阶段 4：维护社会秩序（法律与秩序）"],"answer":1,"option_notes":["阶段 3：以取悦他人、获得赞许为标准，也看意图；题干谈的是法律与社会契约。","阶段 5：视法律为表达多数意志、增进福祉的社会契约，可区分合法与道德，正是题干立场。","阶段 6：依良心自选的普世伦理原则，超越任何法律；题干仍以社会契约与多数意志为核心。","阶段 4：认为法律维系社会秩序、必须遵守，规则超越特殊利益；题干允许质疑不义法律。"],"explain":"后习俗两阶段的差别：阶段 5 用“社会契约＋人权”衡量法律，承认不义法律可被挑战；阶段 6 诉诸超越法律的抽象正义原则。题干讲到契约与福祉，属阶段 5。","source":"L8 p.54","tags":["Kohlberg","postconventional","social contract"],"day":3,"type":"predict","stem_en":"Ah Jun comments on the Heinz dilemma: “Laws are social contracts by which people live together; just laws must be obeyed, but laws that violate human rights are unjust and can be challenged. So we must ask whether a law truly promotes people’s welfare.” This reasoning best fits which of **Kohlberg**’s stages?","options_en":["Stage 3: “good boy/good girl” orientation","Stage 5: social-contract orientation (human rights)","Stage 6: morality of individual principles of conscience","Stage 4: social-order-maintaining morality (law and order)"]},{"id":"d3-002","lecture":5,"topic":"依恋类型","difficulty":2,"stem":"按 **Ainsworth** 的研究，四种依恋类型中占比最高与最低的分别是？","options":["**Secure** 65%／**Resistant** 10%","**Avoidant** 20%／**Disorganized** 5%","**Secure** 65%／**Disorganized** 5%","**Resistant** 10%／**Avoidant** 20%"],"answer":2,"option_notes":["**Secure** 65% 确为最高，但 **Resistant** 10% 不是最低，混乱型 5% 才最低。","**Avoidant** 20% 不是最高，**Disorganized** 5% 是最低；配对不完整。","**Secure** 约 65% 最高；**Disorganized/disoriented** 约 5% 最低。正确。","题干问最高与最低，抗拒型与回避型都属中间的两类，并非两端。"],"explain":"四型分布：Secure 65%、Avoidant 20%、Resistant 10%、Disorganized/disoriented 5%。安全型在所有文化中都是最常见的类型，但各地比例有差异（如日本、以色列较多矛盾型，德国较多回避型）。（Disorganized 5% 的数据见 L5 p.28）","source":"L5 p.27","tags":["attachment","Ainsworth","percentages"],"day":3,"type":"predict","stem_en":"According to **Ainsworth**’s research on the **Strange Situation**, four attachment types have been identified, and they differ in prevalence across samples. Which two types have the highest and the lowest proportions, respectively?","options_en":["**Secure** 65% / **Resistant** 10%","**Avoidant** 20% / **Disorganized** 5%","**Secure** 65% / **Disorganized** 5%","**Resistant** 10% / **Avoidant** 20%"]},{"id":"d3-003","lecture":8,"topic":"吉利根批评","difficulty":3,"stem":"**Gilligan** 批评 **Kohlberg** 的理论有性别偏见。她认为男性的道德取向与女性的道德取向分别是什么？","options":["男性＝**justice**；女性＝**care**","男性＝**care**；女性＝**justice**","男女都＝**justice**","男女都＝**care**"],"answer":0,"option_notes":["Gilligan：男性视道德困境为利益冲突、靠法律与习俗解决（公正伦理）；女性更关注关怀（关怀伦理）。正确。","顺序颠倒：公正伦理对应男性，关怀伦理对应女性。","Gilligan 主张两性取向不同，并非都属公正伦理。","关怀伦理是女性取向，她并未说两性都只重关怀。"],"explain":"Gilligan（1982/1993）认为 Kohlberg 以男性数据建构理论：男性采公正伦理（约阶段 4），女性采关怀伦理（约阶段 3）。但 PPT 也指出偏见证据不足：多数研究显示女性推理与男性同样复杂。","source":"L8 p.57","tags":["Gilligan","morality of care","Kohlberg"],"day":3,"type":"predict","stem_en":"**Gilligan** criticised **Kohlberg**’s theory for gender bias. She argued that men and women tend to adopt different moral orientations. What are the moral orientations typically associated with men and with women, respectively?","options_en":["Men = **justice**; women = **care**","Men = **care**; women = **justice**","Both men and women = **justice**","Both men and women = **care**"]},{"id":"d3-004","lecture":3,"topic":"理论对比","difficulty":3,"stem":"分组讨论时，甲组主张：“认知发展主要靠儿童独立探索，各文化遵循大致相同的阶段。”乙组主张：“认知发展因文化而异，成人与同伴的指导才是关键。”这两种立场分别对应？","options":["甲＝**Vygotsky**；乙＝**Piaget**","两者都是 **Vygotsky**","两者都是 **Piaget**","甲＝**Piaget**；乙＝**Vygotsky**"],"answer":3,"option_notes":["把两位理论家对调了：强调社会文化互动与指导的才是 Vygotsky。","两组立场（普遍阶段 vs 文化差异）明显对立，不可能都属 Vygotsky。","两组不可能都属 Piaget：他并不认为认知发展因文化而异。","**Piaget**：独立探索、阶段跨文化普遍（甲）；**Vygotsky**：因文化而异、成人／同伴引导（乙）。正确。"],"explain":"PPT 对比表：Vygotsky 认为认知发展因文化而异、源于社会互动、成人是重要推动者；Piaget 认为发展在不同文化间基本普遍、源于儿童独立探索、同伴互动更重要。","source":"L3 p.39","tags":["Piaget","Vygotsky","sociocultural"],"day":3,"type":"predict","stem_en":"In a group discussion, Group A argues that “cognitive development mainly comes from children’s independent exploration, and all cultures pass through broadly the same stages.” Group B argues that “cognitive development varies across cultures, and guidance from adults and peers is the key.” Which theorists do these two positions correspond to?","options_en":["A = **Vygotsky**; B = **Piaget**","Both = **Vygotsky**","Both = **Piaget**","A = **Piaget**; B = **Vygotsky**"]},{"id":"d3-005","lecture":6,"topic":"成就归因","difficulty":3,"stem":"两个学生数学都不及格。小琪说：“我数学能力本来就差，再努力也没用。”子轩说：“这次题目特别难，谁考都低分。”按 **Weiner** 与 **Dweck**，谁更可能出现习得性无助？","options":["子轩，因他把失败归于外部稳定因素（任务难度）","小琪，因她把失败归于内部稳定因素（能力）","两人机会相同，因两人的分数一样低","子轩，因外部归因会让人完全停止尝试"],"answer":1,"option_notes":["子轩归因于任务难度：虽属稳定，却是外部因素；外部归因较不易损害自我价值，也不会导向无助。","小琪把失败归于能力：内部且稳定，正是 **learned helplessness** 的典型归因，最易停止尝试。正确。","归因维度不同，两人的无助风险并不相同，分数一样不等于归因一样。","外部归因通常不会导致完全停止尝试；无助的关键是内部稳定的失败归因。"],"explain":"Weiner 两维：能力＝内部稳定、任务难度＝外部稳定、努力＝内部不稳定、运气＝外部不稳定。Dweck 指出把失败归于内部稳定因素者易习得无助；掌握定向者则把失败归于不稳定因素，失败后更努力。","source":"L6 p.38","tags":["Weiner","Dweck","learned helplessness","attribution"],"day":3,"type":"predict","stem_en":"Two students both fail a maths test. Xiaoqi says, “My maths ability has always been poor; trying harder is useless.” Zixuan says, “The test was exceptionally hard this time; everyone scored low.” According to **Weiner** and **Dweck**, who is more likely to develop **learned helplessness**?","options_en":["Zixuan, because he attributes failure to an external stable factor (task difficulty)","Xiaoqi, because she attributes failure to an internal stable factor (ability)","Both are equally likely, because both received the same low score","Zixuan, because external attribution makes people stop trying completely"]},{"id":"d3-006","lecture":7,"topic":"性别角色化","difficulty":2,"stem":"“获得性别身份，以及被认为适合其生理性别的动机、价值观与行为”的整个历程，按 PPT 称为什么？","options":["**Gender typing**（性别角色化）","**Sex**（生理性别）","**Gender**（社会性别）","**gender consistency**（性别恒常性）"],"answer":0,"option_notes":["**Gender typing**：获得性别身份与合宜动机、价值、行为的过程，正合题意。","**Sex** 是个人的生物身份（染色体、生理表现、激素影响），不是历程。","**Gender** 是作为男性或女性的社会文化身份，不是获得历程。","**gender consistency** 是 Kohlberg 第三阶段（5–7 岁理解性别跨情境稳定）。"],"explain":"三词分工：sex＝生物身份；gender＝社会文化身份；gender typing＝性别角色化的历程（获得性别身份与合宜动机、价值、行为）。PPT 以此统称性别角色的习得。","source":"L7 p.2","tags":["gender typing","sex","gender"],"day":3,"type":"predict","stem_en":"According to the lecture, what is the whole process of acquiring a gender identity, together with the motives, values and behaviours considered appropriate for one’s biological sex, called? It is a core concept in gender development.","options_en":["**Gender typing**","**Sex**","**Gender**","**gender consistency**"]},{"id":"d3-007","lecture":5,"topic":"依恋理论","difficulty":3,"stem":"依恋理论对“婴儿为何依恋”有不同解释。下列理论与主张的配对，哪一项正确？","options":["**Learning**：依恋需要先有客体永久性","**Ethological**：依恋是喂养奖赏带来的条件作用","**Psychoanalytic**：依恋源于喂养带来的口腔满足","**Cognitive-developmental**：依恋是天生的接近性倾向"],"answer":2,"option_notes":["**Learning**：依恋源于喂养作为奖赏（我爱你因为你奖励我），不是客体永久性。","**Ethological**：Lorenz 与 Bowlby 强调先天、具生存价值的接近性倾向，不是条件作用。","**Psychoanalytic**：Freud 认为口唇期口腔满足带来对喂养者的吸引；Erikson 则强调信任。正确。","**Cognitive-developmental**：“要爱你，我必须知道你一直在”，以区分熟人、客体永久性为前提。"],"explain":"四说对照：精神分析＝口腔满足与对喂养者的吸引；学习理论＝喂养即奖赏；认知发展＝须先有客体永久性（7–9 个月）；习性学＝先天接近性纽带。Harlow 的接触安慰研究支持习性学观点。","source":"L5 p.21","tags":["attachment theory","psychoanalytic","ethological"],"day":3,"type":"predict","stem_en":"Theories of attachment offer different explanations for why infants become attached to their caregivers. Which of the following pairings of theory and central claim is correct according to the lecture on attachment theories?","options_en":["**Learning**: attachment requires **object permanence** first","**Ethological**: attachment is conditioning through feeding rewards","**Psychoanalytic**: attachment stems from oral satisfaction through feeding","**Cognitive-developmental**: attachment is an innate tendency to seek proximity"]},{"id":"d3-008","lecture":9,"topic":"同伴群体","difficulty":2,"stem":"升上中二后，小敏与 5 位同班女生形成固定小圈子，常一起逛街、分享心事；到中三，这个圈子与男生圈互动，又与“运动型”“文艺型”等大群体合并。按 PPT，这两种结构分别是？","options":["**Crowds**／**cliques**","**Cliques**／**crowds**","**Crowds**／**peer groups**","**Cliques**／**friendships**"],"answer":1,"option_notes":["顺序颠倒：先出现的是小圈子（4–8 名同性），后合并为群体。","**Cliques**（4–8 名同性、共享价值）先出现，后合并为态度与活动相似的 **crowds**。正确。","**Peer group** 泛指社会平等者群体，不是 PPT 对此两层结构的专名。","**Friendship** 指两人之间的互惠关系；题干问的是由小圈子合并成的大群体结构。"],"explain":"青少年早期先形成 cliques（4–8 名同性、共享价值），同性小圈子互动后形成异性小圈子；小圈子再合并为 crowds（态度与活动相似）。这些结构有助形成同一性，也为约会影响铺路。","source":"L9 p.32","tags":["cliques","crowds","peer groups"],"day":3,"type":"predict","stem_en":"In Form 2, Xiaomin and five female classmates form a stable small circle, often shopping and sharing secrets together. By Form 3, this circle interacts with boys’ circles and merges into larger groups such as “sports” and “arts” crowds. According to the lecture, what are these two structures respectively?","options_en":["**Crowds** / **cliques**","**Cliques** / **crowds**","**Crowds** / **peer groups**","**Cliques** / **friendships**"]},{"id":"d3-009","lecture":3,"topic":"守恒","difficulty":3,"stem":"PPT 列出儿童通过各类守恒任务的年龄。下列哪一项的掌握年龄最晚（约 8–10 岁）？","options":["质量守恒","液体守恒","类别包含（**class inclusion**）","面积守恒"],"answer":3,"option_notes":["质量守恒：约 6–7 岁掌握，是 PPT 所列较早的一类。","液体守恒：约 6–7 岁掌握，并非最晚。","类别包含：约 7–8 岁（红色圆形从属于“所有圆形”），早于面积守恒。","面积守恒：约 8–10 岁，是 PPT 所列最晚掌握的守恒任务，正合题意。"],"explain":"守恒任务并非同时掌握：液体与质量约 6–7 岁、类别包含约 7–8 岁、面积约 8–10 岁。这种同一图式在不同任务上的时间差，即 **horizontal décalage** 的例证。","source":"L3 p.23","tags":["conservation","horizontal décalage","class inclusion"],"day":3,"type":"predict","stem_en":"The lecture lists the ages at which children pass different **conservation** tasks (liquid, mass, class inclusion, area). Which of these tasks is typically mastered last, at about 8–10 years of age?","options_en":["Mass **conservation**","Liquid **conservation**","**Class inclusion**","Area **conservation**"]},{"id":"d3-010","lecture":6,"topic":"关系自尊","difficulty":3,"stem":"按 **Harter** 的架构，青春期的 **relational self-worth** 在男女间的差异，最符合下列哪一项？","options":["女性更看重支持性友谊，男性更看重自己能否影响朋友","男性更看重支持性友谊，女性更看重自己能否影响朋友","男女都只看重学业与外貌，人际关系不再重要","男女的自我价值都已完全不受人际关系影响"],"answer":0,"option_notes":["PPT：青春期女性的关系自尊更多来自支持性友谊，男性更多来自影响朋友。","顺序颠倒：女性是支持性友谊，男性是影响朋友。","学业、社会接纳、外貌、运动与行为是自尊成分，但青春期关系自尊另有所指。","青春期人际关系的重要性上升，并非完全不受影响。"],"explain":"Harter 的自尊成分（学业、社会接纳、外貌、运动、行为）在青春期分化出 relational self-worth：女性重视支持性友谊，男性重视自己能否影响朋友；4–7 岁各方面偏高，8 岁后更贴近他人评价。","source":"L6 p.14","tags":["relational self-worth","Harter","adolescence"],"day":3,"type":"predict","stem_en":"According to **Harter**’s framework of self-esteem, **relational self-worth** emerges during adolescence and reflects the importance of relationships. Which of the following statements best describes the sex difference in **relational self-worth** reported in the lecture?","options_en":["Females value supportive friendships more; males value being able to influence friends","Males value supportive friendships more; females value being able to influence friends","Both sexes value only academic achievement and appearance; relationships no longer matter","For both sexes, self-worth is completely independent of relationships with others"]},{"id":"d3-011","lecture":1,"topic":"实验变量","difficulty":2,"stem":"研究者想检验“减少屏幕时间能否提升小学生专注力”：他规定实验组每天屏幕时间不超过 1 小时，并用课堂专注时长（分钟）作为结果指标。这一研究中“屏幕时间”与“专注时长”分别是？","options":["**DV**（因变量）／**IV**（自变量）","两者都是 **DV**","**IV**（自变量）／**DV**（因变量）","两者都是 **operational definition**"],"answer":2,"option_notes":["顺序颠倒：被操纵的是屏幕时间（IV），被测量的是专注时长（DV）。","两者角色不同：一为操纵的因素，一为被测量的结果。","**IV**：研究者操纵以检验因果的因素；**DV**：随 IV 变化被测量或观察的因素。正确。","**Operational definition** 是把概念转为可测量指标的做法，不是两者各自扮演的变量角色。"],"explain":"实验研究：operational definition 把概念转为清晰可测的指标；IV 是研究者操纵以检验因果的因素，DV 是随 IV 变化而测量的因素。实验控制还包括实验组／控制组与随机分配。","source":"L1 p.10","tags":["independent variable","dependent variable","experiment"],"day":3,"type":"predict","stem_en":"A researcher tests whether reducing screen time improves primary school students’ attention. The experimental group is limited to one hour of screen time per day, and the outcome is measured as classroom attention in minutes. In this study, what are “screen time” and “attention duration” respectively?","options_en":["**DV** / **IV**","Both are **DV**","**IV** / **DV**","Both are **operational definitions**"]},{"id":"d3-012","lecture":2,"topic":"髓鞘化","difficulty":3,"stem":"按 PPT，关于婴儿期的 **myelinization**（髓鞘化），下列哪项正确？","options":["出生后头两年最快；视觉约 6 岁、动作约 2 岁完成","出生后头两年进展最快；视觉约 2 岁、动作约 6 岁","髓鞘化在出生前已完成，出生后不再发生","髓鞘化只影响脑的重量，与电传导效率无关"],"answer":1,"option_notes":["顺序颠倒：PPT 举例是视觉髓鞘化约 2 岁、运动约 6 岁。","髓鞘化在出生后头两年进展最快；视觉约 2 岁、运动约 6 岁完成。正确。","出生时皮层仍持续成熟多年，髓鞘化在出生后数年持续进行。","髓鞘化在轴突外形成绝缘层，使神经元电绝缘并提升传导效率，不只是增重。"],"explain":"髓鞘化是在轴突外形成绝缘层，使神经元彼此电绝缘并改善传导效率；出生后头两年最快，儿童与青少年期转慢。PPT 举例：视觉约 2 岁、运动约 6 岁完成髓鞘化。","source":"L2 p.16","tags":["myelinization","brain development"],"day":3,"type":"predict","stem_en":"According to the lecture, which statement about **myelinization** is correct?","options_en":["Fastest in the first two years; vision completes at about 6 years and motor movement at about 2 years","Fastest in the first two years; vision completes at about 2 years and motor movement at about 6 years","**Myelinization** is completed before birth and does not occur after birth","**Myelinization** only affects brain weight and is unrelated to electrical conduction efficiency"]},{"id":"d3-013","lecture":4,"topic":"词汇风格","difficulty":3,"stem":"美玲的早期词汇以“狗狗、车车、妈妈”等人名物名为主；同龄的志朗则多说“谢谢、拜拜、不要”。按 PPT，头胎与晚生的词汇风格倾向分别是？","options":["两者都偏 **referential**","出生顺序与词汇风格无关","头胎 **expressive**；晚生 **referential**","头胎 **referential**；晚生 **expressive**"],"answer":3,"option_notes":["研究显示确有出生顺序差异，并非两者都偏指称风格。","出生顺序与词汇风格相关；另有亚洲文化促进表达风格的文化差异。","顺序颠倒：头胎／长子偏指称，晚生偏表达。","PPT：头胎偏 **referential style**（人名物名），晚生偏 **expressive style**（社交词）。正确。"],"explain":"指称风格词汇多为人名物名；表达风格多为个人／社交词（谢谢、请）。PPT：头胎偏指称、晚生偏表达；亚洲儿童习得动词与社交词更快，因文化强调人际和谐，倾向促进表达风格。","source":"L4 p.40","tags":["referential style","expressive style","birth order"],"day":3,"type":"predict","stem_en":"Meiling’s early vocabulary consists mainly of names of people and objects (“doggy”, “car”, “mummy”), while Zhilang, of the same age, says mostly social words (“thank you”, “bye-bye”, “no”). According to the lecture, what vocabulary styles do firstborns and later-borns tend to adopt?","options_en":["Both tend to be **referential**","Birth order is unrelated to vocabulary style","Firstborns **expressive**; later-borns **referential**","Firstborns **referential**; later-borns **expressive**"]},{"id":"d3-014","lecture":3,"topic":"智力工具","difficulty":2,"stem":"按 **Vygotsky** 的观点，铅笔、纸张、计算器，以及一种文化中的语言、字母数字系统、数学与科学体系，在认知发展中统称为什么？","options":["**Tools of intellectual adaptation**","**Scaffolding**（支架）","**Elementary mental functions**（低级心理机能）","**Zone of proximal development**（最近发展区）"],"answer":0,"option_notes":["**Tools of intellectual adaptation**：文化提供的实际物品与概念框架，用来转化心理机能。正确。","**Scaffolding** 是他人提供的支持与结构化安排，不是文化工具本身。","**Elementary mental functions** 是天生具备的注意、记忆等低级机能，不是工具。","**ZPD** 是独立水平与受助水平之间的差距，不是文化工具本身。"],"explain":"Vygotsky：儿童天生具备低级心理机能（注意、记忆），文化透过其特有工具——实际物品（铅笔、计算器）与概念框架（语言、数字系统、科学与宗教体系）——将其转化为高级心理机能。","source":"L3 p.34","tags":["Vygotsky","tools of intellectual adaptation"],"day":3,"type":"predict","stem_en":"In **Vygotsky**’s theory, cognitive development is shaped by cultural tools that children internalise. What are pencils, paper and calculators, together with a culture’s language, number systems, mathematics and science, collectively called?","options_en":["**Tools of intellectual adaptation**","**Scaffolding**","**Elementary mental functions**","**Zone of proximal development**"]},{"id":"d3-015","lecture":1,"topic":"实验控制","difficulty":3,"stem":"某研究比较两种阅读教学法，却让家长自行选择孩子参加哪一组，再比较两组成绩。按 PPT，这项设计最关键的缺陷是？","options":["缺乏操作定义，无法测量成绩","没有使用自然观察，缺乏真实性","缺乏随机分配，无法排除组间原有差异","没有跨文化取样，结论不能推广"],"answer":2,"option_notes":["研究已用成绩作为可测量指标，问题不在操作定义。","实验研究以控制换取因果推论，不以自然观察为必要条件。","实验控制包含随机选择与随机分配；家长自选使组间可能有系统差异，难以归因于教学法。正确。","跨文化取样是另一议题；本设计的核心缺陷是没有随机分配。"],"explain":"真实验需操纵 IV、测量 DV、随机选择与随机分配、并设控制组。缺乏随机分配时，组间原有差异（家长动机、孩子基线）无法排除，只能算自然（准）实验，不能证明因果。","source":"L1 p.11","tags":["random assignment","experimental control","quasi-experiment"],"day":3,"type":"predict","stem_en":"A study compares two reading teaching methods, but parents choose which group their child joins; the two groups’ scores are then compared. According to the lecture, what is the most critical flaw of this design?","options_en":["It lacks an **operational definition**, so achievement cannot be measured","It does not use **naturalistic observation**, so it lacks ecological validity","It lacks **random assignment**, so pre-existing group differences cannot be ruled out","It does not sample across cultures, so the conclusion cannot be generalised"]},{"id":"d3-016","lecture":2,"topic":"产前脑发育","difficulty":3,"stem":"按 PPT，关于胎儿的 **neuronal proliferation**（神经元增殖）与 **glial cells**（胶质细胞），下列哪项正确？","options":["神经元在出生后才发育，胎儿期只有胶质细胞生成","神经元第 3 周起发育、第 10–18 周急剧增殖；第 26 周胶质成熟","胶质细胞在第 3 周前已完成发育，之后不再改变","神经形成只在出生后最初两年发生"],"answer":1,"option_notes":["神经元在胎儿第 3 周已开始发育，并非出生后才开始。","神经元第 3 周开始，第 10–18 周神经元增殖急剧发展；第 26 周胶质细胞使胎儿脑更成熟。正确。","胶质细胞持续发育，到第 26 周才足以使胎儿脑外观更成熟。","神经形成主要在胎儿期（第 10–18 周急剧），出生后是突触发生与修剪。"],"explain":"产前脑发育：神经元第 3 周开始；第 10–18 周 neuronal proliferation 急剧发展；新神经元迁移到最终位置后形成突触；glial cells 如胶水般连接神经元，第 26 周时使胎儿脑呈现更成熟外观。","source":"L2 p.15","tags":["neuronal proliferation","glial cells","prenatal brain"],"day":3,"type":"predict","stem_en":"**Neuronal proliferation** and **glial cells** are two key aspects of prenatal brain development. According to the lecture, which statement about their timing and role in the developing fetus is correct?","options_en":["Neurons start developing only after birth; during the fetal period only **glial cells** are produced","Neurons begin in week 3 and proliferate sharply in weeks 10–18; **glial cells** mature enough by week 26","**Glial cells** are fully developed before week 3 and do not change afterwards","Neurogenesis occurs only during the first two years after birth"]},{"id":"d3-017","lecture":5,"topic":"气质遗传","difficulty":2,"stem":"研究者比较同卵双胞胎、异卵双胞胎与一般手足在婴儿气质上的相似程度，发现同卵双胞胎最相似。这一结果最支持？","options":["气质完全由共享环境决定","气质与遗传无关，只是测量误差","气质具有中度遗传力","气质由非共享环境单独决定"],"answer":2,"option_notes":["若完全由共享环境决定，同卵与异卵双胞胎的相似度应相近，与结果不符。","同卵与异卵相似度有系统差异，不能归因于测量误差。","**Heritability**：同卵双胞胎比异卵更相似，显示气质具中度遗传力；正合题意。","非共享环境影响气质的消极面向，但无法解释同卵双胞胎更高的相似度。"],"explain":"气质具中等遗传力：同卵双胞胎比异卵双胞胎更相似。家庭环境方面，共享环境影响气质的积极面向（微笑、社交性、安抚性），非共享环境影响消极面向（对陌生人的不安）。","source":"L5 p.16","tags":["temperament","heritability","twins"],"day":3,"type":"predict","stem_en":"Researchers compare how similar infant temperament is in identical twins, fraternal twins and ordinary siblings, and find identical twins most similar in temperament. Which conclusion does this result best support?","options_en":["Temperament is entirely determined by the shared environment","Temperament is unrelated to heredity and reflects only measurement error","Temperament has moderate **heritability**","Temperament is determined solely by the nonshared environment"]},{"id":"d3-018","lecture":8,"topic":"道德内化","difficulty":3,"stem":"两名幼儿都被要求收拾玩具。小宜在妈妈温和说明原因后主动收拾，妈妈不在时也照做；小欣只在妈妈盯着时才收，妈妈一转身就停。按 PPT，两人的顺从分别是？","options":["**Situational** 顺从／**committed** 顺从","两人都是 **committed** 顺从","两人都是 **situational** 顺从","**Committed** 顺从／**situational** 顺从"],"answer":3,"option_notes":["顺序颠倒：主动内化的是 committed，只在监督下才顺从的是 situational。","小欣在妈妈转身后就停，显示顺从依情境与监督，不可能是 committed。","小宜在妈妈不在时也照做，已超越情境性顺从。","**Committed**：有遵守动机、敏感于是非信号并开始内化（小宜）；**situational** 只在权威在场时顺从（小欣）。正确。"],"explain":"与父母建立相互回应关系的幼儿会发展出 committed compliance（愿意遵守、敏感于父母对错信号、开始内化）；回应迟钝的养育只产生 situational compliance（顺从主要基于父母控制行为的权力）。","source":"L8 p.39","tags":["committed compliance","situational compliance","internalization"],"day":3,"type":"predict","stem_en":"Two toddlers are asked to tidy up toys. Xiaoyi does so on her own after her mother gently explains why, and also tidies when her mother is absent; Xiaoxin tidies only while her mother watches and stops as soon as she turns away. According to the lecture, what kinds of compliance are these respectively?","options_en":["**Situational** compliance / **committed** compliance","Both show **committed** compliance","Both show **situational** compliance","**Committed** compliance / **situational** compliance"]},{"id":"d3-019","lecture":7,"topic":"跨文化证据","difficulty":3,"stem":"**Mead** 研究新几内亚三个部落：阿拉佩什两性都被教成善于表达，蒙杜古马两性都被教成“男性化”，昌布里则与西方标准相反。这组发现最支持？","options":["社会力量对性别角色化有重大影响","性别角色差异主要由生物因素决定","性别恒常性决定性别角色的内容","性别图式的内容由基因决定"],"answer":0,"option_notes":["三个部落的性别角色安排各异，显示社会力量对性别角色化贡献很大；正合题意。","若由生物决定，三个部落应呈现相同的性别分化，与发现不符。","性别恒常性是 Kohlberg 的认知阶段，与跨文化差异无关。","性别图式是儿童组织信念的认知结构，内容来自文化而非基因。"],"explain":"Mead 的跨文化证据显示性别角色可被社会塑造：Arapesh 两性皆表达型、Mundugumor 两性皆“男性化”、Tchambuli 与西方标准相反。PPT 亦提醒激素证据显示生物与社会化都无法单独解释性别角色。","source":"L7 p.31","tags":["Mead","cross-cultural","gender roles"],"day":3,"type":"predict","stem_en":"**Mead** studied three New Guinea tribes: the Arapesh taught both sexes to be expressive, the Mundugumor taught both sexes to be “masculine”, and the Tchambuli reversed Western standards. Which conclusion do these findings best support?","options_en":["Social forces strongly influence **gender typing**","Gender-role differences are mainly determined by biological factors","**gender consistency** determines the content of gender roles","The content of **gender schemas** is determined by genes"]},{"id":"d3-020","lecture":6,"topic":"归因再训练","difficulty":2,"stem":"小志已出现 **learned helplessness**，总说“我就是笨”。按 PPT，下列哪种介入最能直接改变他的归因？","options":["多给他贴“聪明”标签以提升自尊","**Attribution retraining**：把失败重新归因于不稳定因素","降低任务难度，让他一直成功","减少回馈，避免他注意到失败"],"answer":1,"option_notes":["“聪明”属特质导向（person-oriented）表扬，反而可能强化无助取向。","**Attribution retraining**：把失败归因于不稳定因素（努力、策略），可改变无助取向。正确。","一直成功只是回避失败，并未改变归因；PPT 强调归因再训练与过程导向表扬。","减少回馈会让儿童无法判断成败原因，无助取向更难改变。"],"explain":"习得性无助可透过归因再训练改善：把失败归因于不稳定因素（努力不足、策略不当）。预防上 PPT 建议多用过程导向表扬（肯定努力、好想法与有效策略），少用“你真聪明”这类特质导向表扬。","source":"L6 p.40","tags":["attribution retraining","learned helplessness","Dweck"],"day":3,"type":"predict","stem_en":"Xiaozhi has developed **learned helplessness** and keeps saying, “I’m just stupid.” According to the lecture, which of the following interventions would most directly change his attribution style and reduce his helplessness?","options_en":["Give him more “you are clever” labels to raise his self-esteem","**Attribution retraining**: reattribute failure to unstable causes","Make tasks easier so that he always succeeds","Reduce feedback so that he does not notice failure"]},{"id":"d3-021","lecture":3,"topic":"心理理论","difficulty":3,"stem":"关于 **theory of mind** 的发展，下列哪一项最符合 PPT 的说明？","options":["只要认知成熟，ToM 便与语言能力无关地自然出现","ToM 在婴儿期即完全成熟，之后不再发展","儿童须达到一定的语言能力门槛，才能通过错误信念任务","缺乏 ToM 与自闭症没有关联，只与智力有关"],"answer":2,"option_notes":["PPT 指出 ToM 与认知发展相关，但语言能力是独立而关键的条件，不能说无关。","ToM 的关键里程碑错误信念理解在 3–5 岁才发展，婴儿期并未成熟。","语言能力：儿童须达到一定的通用语言能力阈值才能通过错误信念任务；语言障碍儿童 ToM 发展较慢。正确。","PPT 明确：缺乏 ToM 被认为与自闭症相关。"],"explain":"ToM 的关键里程碑是 3–5 岁的错误信念理解，与认知发展（自我中心、外观／现实区分、假装游戏、工作记忆）及语言能力相关：须跨过语言门槛才能通过任务；缺乏 ToM 与自闭症有关。","source":"L3 p.19","tags":["theory of mind","language","autism"],"day":3,"type":"predict","stem_en":"**Theory of mind** develops significantly during the preschool years. Which of the following statements about the development of **theory of mind** best matches the lecture?","options_en":["As long as cognition matures, ToM emerges naturally regardless of language ability","ToM is fully mature in infancy and does not develop further","Children must reach a certain language threshold before they can pass **false-belief** tasks","Lack of ToM is unrelated to autism and depends only on intelligence"]},{"id":"d3-022","lecture":4,"topic":"敏感期","difficulty":3,"stem":"**Genie** 学会约 100 个词，却始终无法掌握语法；**Chelsea** 32 岁才接触正式语言，能造语义丰富的句子，却同样学不会句法。两人的共同点最能说明？","options":["错过早期语言窗口者，语义可学但句法难以掌握","句法可透过密集教学在成年后完全学会","语言能力完全由智力决定，与接触年龄无关","第一语言与第二语言的习得机制完全不同"],"answer":0,"option_notes":["两人都接受密集教学却未掌握句法，可见成年后难以完全补偿：语义可学、句法难掌握。正确。","两人学会许多词汇、甚至语义丰富句子，却都没掌握句法，与“完全学会”相反。","两人的困难主要来自极晚接触语言，而非智力；Genie 的测验亦未显示精神疾病。","题干讨论第一语言迟开始，无法推出两种语言机制完全不同。"],"explain":"Genie 与 Chelsea 的案例支持 sensitive-period hypothesis：错过出生至青春期的语言窗口后，语义仍可学习，但句法（syntax）几乎无法达到母语水平；Johnson & Newport 的移民研究亦显示越早到达英语越好。","source":"L4 p.26","tags":["sensitive period","Genie","Chelsea","syntax"],"day":3,"type":"predict","stem_en":"**Genie** learned about 100 words but never mastered grammar; **Chelsea**, first exposed to a formal language at 32, produced semantically rich sentences but never mastered syntax. What do their commonalities best illustrate?","options_en":["Those who miss the early language window can learn semantics but have difficulty mastering syntax","Syntax can be fully learned in adulthood through intensive teaching","Language ability is determined entirely by intelligence and unrelated to age of exposure","First- and second-language acquisition mechanisms are completely different"]},{"id":"d3-023","lecture":9,"topic":"游戏类别","difficulty":3,"stem":"两组幼儿都在积木区。A 组各搭各的、偶尔交换积木但各做各的作品；B 组共同商量搭一座城堡、分工扮演不同角色。按 PPT 的五类游戏，A、B 分别是？","options":["**Parallel**／**cooperative**","**Cooperative**／**associative**","**Onlooker**／**associative**","**Associative**／**cooperative**"],"answer":3,"option_notes":["**Parallel play** 是并排玩、互动极少；A 组有交换积木，不只是平行游戏。","顺序颠倒：A 组未朝共同目标合作，不是 cooperative；B 组才是。","**Onlooker play** 是观看而不加入，A 组已参与游戏。","**Associative**：分享材料但不朝共同目标合作（A）；**cooperative**：协作、角色互惠、共享目标（B）。正确。"],"explain":"学前期五类游戏：非社交活动、旁观、平行（并排少互动）、联合（分享但不共享目标）、合作（协作、角色互惠、共同目标）。单独与平行游戏随年龄减少，联合与合作游戏增多。","source":"L9 p.30","tags":["play","associative play","cooperative play"],"day":3,"type":"predict","stem_en":"Two groups of young children are in the block area. Group A builds separately and occasionally exchanges blocks but makes separate products; Group B plans a castle together and takes complementary roles. According to the five types of play, what are A and B respectively?","options_en":["**Parallel** / **cooperative**","**Cooperative** / **associative**","**Onlooker** / **associative**","**Associative** / **cooperative**"]},{"id":"d3-024","lecture":1,"topic":"观察法","difficulty":2,"stem":"研究者想比较“有家长陪同”与“无家长陪同”下儿童的分享行为，于是把每位儿童安排在布置相同的实验室情境中，透过单向玻璃观察。这属于？","options":["**Naturalistic observation**","**Structured observation**","**Case study**","**Correlational research**"],"answer":1,"option_notes":["**Naturalistic observation** 在日常环境观察，无法控制情境，与此设计相反。","**Structured observation**：在实验室、让每位参与者经历相同诱发情境并暗中观察，正合题意。","**Case study**：深入收集单一个体的大量资料、缺乏可比性；题干明显比较两组儿童。","**Correlational research** 探测变量间相关强度，不操纵情境、不作实验控制。"],"explain":"结构化观察在实验室制造可引发目标行为的情境、所有人经历相同环境，便于比较；代价是结果可能不代表真实生活。自然观察真实性高，但难以控制变量、罕见行为可能不出现。","source":"L1 p.8","tags":["structured observation","naturalistic observation"],"day":3,"type":"predict","stem_en":"To compare children’s sharing behaviour with and without a parent present, a researcher places each child in an identical laboratory setting and observes through a one-way mirror. What type of method is this?","options_en":["**Naturalistic observation**","**Structured observation**","**Case study**","**Correlational research**"]},{"id":"d3-025","lecture":8,"topic":"主动型攻击","difficulty":3,"stem":"小谚常先锁定班上最弱的同学，冷静评估“欺负他不会有人出头”，再推倒对方抢走玩具，事后还说“抢到就是赢”。按 **Dodge** 的社会信息加工理论，他最符合？","options":["**Reactive aggressor**：过度归因敌意并迅速报复","**Passive victim**：社交退缩、不愿反抗","**Provocative victim**：急躁挑衅但反击失败","**Proactive aggressor**：冷静制定工具性目标并预期正面结果"],"answer":3,"option_notes":["**Reactive** 是对模糊伤害过度归因敌意、愤怒并迅速报复；小谚是预谋而非反应性。","**Passive victim** 是社交退缩、身体弱、不反抗的受欺凌者，不是高攻击儿童。","**Provocative victim** 是受欺凌者类型，虽挑衅但反击常失败，与小谚的算计不符。","**Proactive**：不倾向归因敌意，冷静制定工具性目标，确信武力有效并预期正面结果。正确。"],"explain":"Dodge 的 SIPP 区分两类高攻击儿童：反应型搜寻符合预期的敌意线索、迅速报复；主动型不轻易归因敌意，冷静算计工具性目标、预期攻击带来利益与掌控感，甚至攻击时表现愉快。","source":"L8 p.14","tags":["Dodge","proactive aggression","SIPP"],"day":3,"type":"predict","stem_en":"Xiaoyan often targets the weakest classmate, calmly works out that “no one will stand up for him”, pushes him over and takes his toy, then says, “winning is what counts”. According to **Dodge**’s social information-processing theory, which profile does he best fit?","options_en":["**Reactive aggressor**: over-attributes hostile intent and retaliates quickly","**Passive victim**: socially withdrawn and reluctant to fight back","**Provocative victim**: hot-tempered and provocative but fails to fight back","**Proactive aggressor**: calmly formulates instrumental goals and expects positive outcomes"]},{"id":"d3-026","lecture":5,"topic":"照料风险","difficulty":2,"stem":"按 PPT，下列哪一组人最可能成为“不敏感照料者”，进而影响依恋安全？","options":["高学历、晚育且计划怀孕的父母","经济条件良好且夫妻关系和睦者","临床抑郁、童年被忽视或意外怀孕的照料者","首次当父母但自身有安全依恋经验的成人"],"answer":2,"option_notes":["高学历、晚育与计划怀孕是安全依恋的有利因素，不是风险因素。","良好经济与和睦婚姻属保护因素，与不敏感照料特征相反。","PPT 列出三类风险：临床抑郁、童年未被关爱／受忽视或虐待、意外怀孕；正合题意。","童年被爱的经验属保护因素，不会增加不敏感照料的风险。"],"explain":"不敏感照料的风险群：临床抑郁者、童年未被关爱／被忽视或虐待者、意外怀孕者。照料假说认为照料质量是依恋安全的关键，情感可得性与相倚回应则是安全依恋的两大要件。","source":"L5 p.44","tags":["caregiving","attachment","risk factors"],"day":3,"type":"predict","stem_en":"According to the lecture, which of the following groups is most likely to become “insensitive caregivers”, thereby placing infants’ attachment security at risk? The lecture lists several risk factors for insensitive caregiving.","options_en":["Parents with higher education who are older and had planned pregnancies","Those with good financial conditions and a harmonious marriage","Caregivers who are clinically depressed, were neglected in childhood, or had unplanned pregnancies","First-time parents who themselves had secure attachment experiences"]},{"id":"d3-027","lecture":7,"topic":"性别差异","difficulty":3,"stem":"根据 PPT，关于男女在**情绪表达、顺从性与自尊**上的差异，下列哪项正确？","options":["男孩表达更多愤怒、女孩更顺从；男孩自尊略高","女孩表达更多愤怒、男孩更顺从；女孩自尊略高","男女在情绪表达与顺从性上完全没有差异","女孩自尊明显高于男孩并持续整个成年期"],"answer":0,"option_notes":["PPT：男孩表达更多愤怒，女孩表达其他多数情绪且用更多情绪词；女孩更顺从；男孩自尊略高、始于青春期。正确。","顺序颠倒：更多愤怒的是男孩，男孩自尊也略高而非女孩。","PPT 明确列出情绪表达与顺从性的性别差异，并非没有差异。","男孩自尊略高且差异很小、始于青春期，不是女孩明显更高。"],"explain":"性别差异多为“小而可靠”的平均差异：女孩言语能力较优、男孩视觉空间较佳、男孩身体与言语攻击更多；情绪上男孩表达更多愤怒、女孩更顺从；自尊男孩略高。结论：两性心理相似远多于差异。","source":"L7 p.8","tags":["sex differences","emotional expressivity","self-esteem"],"day":3,"type":"predict","stem_en":"According to the lecture, which statement about boys' and girls' **emotional expressivity**, compliance and **self-esteem** is correct?","options_en":["Boys express more anger and girls are more compliant; boys’ self-esteem is slightly higher","Girls express more anger and boys are more compliant; girls’ self-esteem is slightly higher","There are no sex differences in emotional expressivity or compliance at all","Girls’ self-esteem is clearly higher than boys’ and remains so throughout adulthood"]},{"id":"d3-028","lecture":3,"topic":"形式运算","difficulty":3,"stem":"中四的阿晴在通识课先构想“没有贫富悬殊、人人平等的社会”，再逐条对比现实中的不公，因而感到愤怒，还报名参加环保与公平贸易组织。按 **Piaget**，这最可能是？","options":["**Imaginary audience**","**Naïve idealism**","**Personal fable**","**Centration**"],"answer":1,"option_notes":["**Imaginary audience**：相信别人像自己一样关注自己的外表与行为，题干重点不在此。","**Naïve idealism**：用形式运算在脑中建构理想世界并与现实比较，因现实不足而不满、想改变；正合题意。","**Personal fable**：相信自己独特、无人理解、不会受害；题干是理想社会与现实的对比。","**Centration**：前运算阶段一次只考虑一个维度，题干已是假设演绎层次的高阶思维。"],"explain":"形式运算让青少年能理解抽象原则（如公平、正义），并以假设演绎建构理想世界；当现实达不到理想，便产生不满与改革诉求，Piaget 称之为 naïve idealism。","source":"L3 p.27","tags":["formal operations","naive idealism","adolescence"],"day":3,"type":"predict","stem_en":"Form 4 student Ah Ching first imagines “a society without the wealth gap, where everyone is equal”, then compares it point by point with real injustice, feels angry, and joins environmental and fair-trade organisations. According to **Piaget**, what does this best illustrate?","options_en":["**Imaginary audience**","**Naïve idealism**","**Personal fable**","**Centration**"]},{"id":"d3-029","lecture":6,"topic":"成就动机","difficulty":3,"stem":"15 个月的宝宝完成新拼图时开心大笑，妈妈拍手说“好棒”，他却只看拼图、继续玩；拼不上时也没什么所谓。按 PPT，这属于成就动机的哪个阶段？","options":["阶段 3：**use of standards**（3 岁以上）","阶段 2：**approval-seeking**（约 2 岁）","阶段 1：**joy in mastery**（2 岁前）","**Mastery-oriented** 取向"],"answer":2,"option_notes":["**Use of standards**：3 岁以上采用客观标准，成功自豪、失败羞愧，时间不符。","**Approval-seeking**：接近 2 岁才为成功寻求赞许、预期失败遭反对；题中宝宝不看妈妈。","**Joy in mastery**：2 岁前为成功本身高兴、不寻求认可，失败无关紧要；正合题意。","**Mastery-oriented** 是 Dweck 对学龄后归因取向的描述，不是成就动机的早期阶段。"],"explain":"成就动机三阶段：阶段 1 掌握的喜悦（2 岁前，为成功高兴、不寻求认可）；阶段 2 寻求赞许（约 2 岁，寻求认可、预期失败受责）；阶段 3 运用标准（3 岁后，采纳客观标准、成功自豪失败羞愧）。","source":"L6 p.23","tags":["achievement motivation","joy in mastery","approval-seeking"],"day":3,"type":"predict","stem_en":"A 15-month-old laughs happily when completing a new puzzle; when his mother claps and says “well done”, he just looks at the puzzle and keeps playing, and seems unconcerned when he cannot fit a piece. According to the lecture, which phase of achievement motivation is this?","options_en":["Phase 3: **use of standards** (from about 3 years)","Phase 2: **approval-seeking** (about 2 years)","Phase 1: **joy in mastery** (before 2 years)","**Mastery-oriented** orientation"]},{"id":"d3-030","lecture":4,"topic":"环境支持","difficulty":3,"stem":"互动论者指出，成人对婴儿说话时会使用 **child-directed speech**（儿向语）。下列哪项最符合 PPT 的描述？","options":["语速更快、句子更长、语调平稳","句子短、结构简单、用高音强调关键词","只使用抽象词汇，帮助婴儿发展概念","成人与婴儿交谈的方式没有可观察的差异"],"answer":1,"option_notes":["与 PPT 相反：儿向语是简短、简单、高音，不是更快更长。","**Child-directed speech**：简短简单、用高音强调关键词，婴儿更注意并据语调理解信息。正确。","儿向语靠关键词与语调，不靠抽象词汇；婴儿更注意简短句。","成人与婴儿说话的方式明显不同，这正是环境支持的证据。"],"explain":"环境支持：婴儿更注意父母简短、简单、用高音强调关键词的句子（**child-directed speech**），并据语调理解信息；成人的 **expansion**、**recast** 与延伸帮助语法习得。","source":"L4 p.31","tags":["child-directed speech","interactionist","environmental support"],"day":3,"type":"predict","stem_en":"Interactionists note that adults use **child-directed speech** when talking to infants. Which of the following best matches the lecture’s description of its features as an environmental support for language development?","options_en":["Faster speech, longer sentences and a flat tone","Short sentences, simple structure and a high-pitched voice emphasising key words","Only abstract vocabulary is used to help infants develop concepts","There is no observable difference between how adults talk to infants and to others"]},{"id":"d3-031","lect
