ons as social and cultural rather than biological attributes. The researcher is focusing on:","stem_zh":"研究者研究某文化对男女的期望如何塑造行为，并把这些期望视为社会文化属性而非生物属性。该研究者关注的是：","options":["**Sex**","**Gender**","**Gender identity**","**Gender segregation**"],"options_zh":["**生理性别（sex）**","**社会性别（gender）**","**性别认同**","**性别隔离**"],"answer":1,"explain":"**Sex** 是个体的生物身份（染色体、生理表现、激素影响）；**gender** 是社会与文化身份。**Gender typing** 是获得性别身份及被认为适合其生理性别的动机、价值观与行为的过程。","source":"L7 p.2"},{"id":"gC-35","gate":"C","lecture":7,"topic":"Sex differences","difficulty":2,"stem":"Which statement about actual psychological sex differences is best supported by the lecture?","stem_zh":"关于实际存在的心理性别差异，本讲最支持下列哪项说法？","options":["Boys generally outperform girls in verbal ability.","Girls generally outperform boys in visual/spatial ability.","Girls generally show a verbal advantage, while boys generally show a visual/spatial advantage.","Sex differences in most psychological traits are very large."],"options_zh":["男孩的言语能力普遍优于女孩","女孩的视觉／空间能力普遍优于男孩","女孩普遍有言语优势，男孩普遍有视觉／空间优势","多数心理特质的性别差异非常大"],"answer":2,"explain":"实际差异虽小但可靠：女孩 **verbal ability** 占优（青春期读写优势扩大），男孩 **visual/spatial ability** 占优（4 岁显现、贯穿一生）；数学差距在青少年早期出现、很小且已缩小。差异反映群体平均值、幅度小、两端最明显，男女相似远多于差异。","source":"L7 p.4"},{"id":"gC-36","gate":"C","lecture":7,"topic":"Gender segregation","difficulty":2,"stem":"By about 6½ years of age, how much time do children spend with same-sex peers compared with opposite-sex peers?","stem_zh":"到约 6 岁半时，儿童与同性同伴相处的时间约为与异性同伴的多少倍？","options":["about the same amount","about twice as much","about five times as much","more than ten times as much"],"options_zh":["大致相同","约 2 倍","约 5 倍","10 倍以上"],"answer":3,"explain":"**Gender segregation**：2 岁女孩偏爱女孩、3 岁男孩偏爱男孩、4–5 岁主动拒绝异性玩伴；到 6½ 岁与同性同伴相处时间是异性的 10 倍以上，青春期对异性兴趣增加后隔离减弱。","source":"L7 p.22"},{"id":"gC-37","gate":"C","lecture":7,"topic":"Stereotype development","difficulty":3,"stem":"Compared with children aged 3–7, children aged 8–9 tend to be:","stem_zh":"与 3–7 岁儿童相比，8–9 岁儿童往往：","options":["more rigid about gender-role standards","more flexible and able to distinguish moral rules from gender-role standards","uninterested in gender categories altogether","fully adult-like in their personality stereotypes"],"options_zh":["对性别角色标准更僵化","更灵活，能区分道德规则与性别角色标准","完全不再关注性别类别","人格特质刻板印象已完全达到成人水平"],"answer":1,"explain":"3–7 岁把性别角色标准视为不可违反的规则并夸大刻板印象；8–9 岁更灵活、能区分道德规则与性别标准，但不一定赞同跨性别兴趣，对女孩违规更宽容；10–11 岁人格特质刻板印象才接近成人。","source":"L7 p.19"},{"id":"gC-38","gate":"C","lecture":7,"topic":"Social roles hypothesis","difficulty":3,"stem":"The social roles hypothesis argues that psychological sex differences arise because:","stem_zh":"社会角色假说认为心理性别差异产生的原因是：","options":["cultures assign roles on the basis of gender and socialize people accordingly","natural selection produced different dispositions in men and women","men and women differ in brain lateralization at birth","hormonal differences directly produce all psychological sex differences"],"options_zh":["文化按性别分配角色并据此社会化","自然选择使男女形成不同倾向","男女出生时大脑侧化不同","激素差异直接造成全部心理性别差异"],"answer":0,"explain":"**Social roles hypothesis** 是对 **evolutionary theory** 的批评与替代解释：心理性别差异并非生物进化倾向，而是文化按性别分配角色并相应社会化造成；进化理论主要解释跨文化存在的差异，忽略特定文化或历史时期的差异。","source":"L7 p.27"},{"id":"gC-39","gate":"C","lecture":8,"topic":"Aggression trends","difficulty":2,"stem":"Across childhood, which trend in aggression is described in the lecture?","stem_zh":"关于整个童年期的攻击发展趋势，本讲描述的是：","options":["Instrumental aggression increases steadily while hostile aggression disappears.","Physical aggression increases steadily through middle childhood.","Instrumental aggression becomes more common through middle childhood.","Physical aggression declines while verbal aggression replaces it, and hostile aggression increases slightly."],"options_zh":["工具性攻击持续增加，敌意性攻击消失","身体攻击在整个童年中期持续增加","工具性攻击在童年中期变得更常见","身体攻击下降、被言语攻击取代，敌意性攻击略增"],"answer":3,"explain":"2–3 岁身体报复开始；3–5 岁身体攻击下降、被言语攻击（戏弄、告状）取代，冲突多因占有物故常属 **instrumental**；童年中期身体攻击相对少见（仅 3% 高水平），工具性攻击减少、**hostile aggression** 略增；女孩更常表现关系／隐蔽攻击。","source":"L8 p.7"},{"id":"gC-40","gate":"C","lecture":8,"topic":"Victims of aggression","difficulty":3,"stem":"Which victim profile is oppositional, restless, hot-tempered, often irritates peers, tends to fight back unsuccessfully, and shows hostile attribution bias?","stem_zh":"哪一类受害者表现出对立、坐不住、脾气暴躁、常惹恼同伴、反击但往往不成功，并表现出敌意归因偏差？","options":["**Passive victim**","**Neglected child**","**Provocative victim**","**Proactive aggressor**"],"options_zh":["**被动型受害者**","**被忽视儿童**","**挑衅型受害者**","**主动型攻击者**"],"answer":2,"explain":"**Provocative victims**（挑衅型受害者）对立、坐不住、急躁、常惹恼同伴、反击但不成功，并有敌意归因偏差；**passive victims** 社交退缩、身体弱、不愿反击，常与母亲过度保护有关。","source":"L8 p.15"},{"id":"gC-41","gate":"C","lecture":8,"topic":"Coercive home environment","difficulty":2,"stem":"A family in which members continually needle, threaten, and irritate one another rather than converse amiably, and in which coercive exchanges are negatively reinforced, is described as:","stem_zh":"家庭成员不断彼此刺激、威胁与激怒，而非友善交谈，且强制性互动被负强化。这种家庭环境称为：","options":["a **coercive home environment**","an **authoritative** family environment","a **permissive** family environment","a **coparenting** family environment"],"options_zh":["**强制性家庭环境**","**权威型**家庭环境","**纵容型**家庭环境","**共同养育**家庭环境"],"answer":0,"explain":"**Coercive home environment**（强制性家庭环境）是攻击的滋生地：互动围绕迫使对方停止刺激展开、常被负强化；父母少用社会赞许、基本忽视亲社会行为、过度解读轻微过失并依赖强制手段（含被动攻击），形成敌意家庭环境。","source":"L8 p.20"},{"id":"gC-42","gate":"C","lecture":8,"topic":"Rewards and altruism","difficulty":3,"stem":"What usually happens when adults give children tangible rewards for sharing?","stem_zh":"成人给予儿童有形奖励以鼓励分享时，通常会发生什么？","options":["Later sharing increases even after the rewards stop.","Later sharing decreases, because children attribute their kindness to the reward.","Later sharing is unaffected by the rewards.","Children become more empathic and self-sacrificing."],"options_zh":["奖励停止后分享行为仍会增加","分享行为减少，因为儿童把善行归因于奖励","分享行为不受奖励影响","儿童变得更富共情、更愿自我牺牲"],"answer":1,"explain":"**Verbal reinforcement** 可提升利他，但 **tangible rewards** 反而减少利他：儿童把友善行为归因于挣得奖励而非关心他人，奖励停止后牺牲更少。**Induction** 与示范更有效。","source":"L8 p.35"},{"id":"gC-43","gate":"C","lecture":8,"topic":"Kohlberg stage 5","difficulty":3,"stem":"At Kohlberg's stage 5 (social-contract orientation), laws are viewed as:","stem_zh":"在科尔伯格阶段 5（社会契约取向）中，法律被视为：","options":["unchangeable commands issued by authority figures","rules people follow mainly to avoid punishment","instruments expressing the majority's will and furthering human welfare, which can be challenged if they violate rights","irrelevant to moral judgement at every level"],"options_zh":["权威人物发布的不可更改的命令","人们主要为避免惩罚而遵守的规则","表达多数人意志、增进人类福祉的工具，若侵犯权利可被质疑","在每个水平都与道德判断无关"],"answer":2,"explain":"**Stage 5** 视法律为社会契约：表达多数人意志、增进人类福祉且公正实施者应遵守；侵犯人权或尊严的法律不公正、可受质疑，法律与道德的区分开始出现。**Stage 6** 依个人良心选择的普遍伦理原则，超越任何法律或社会契约。","source":"L8 p.54"},{"id":"gC-44","gate":"C","lecture":8,"topic":"Gilligan's critique","difficulty":3,"stem":"Gilligan's critique of Kohlberg's theory argued that:","stem_zh":"吉利根对科尔伯格理论的批评认为：","options":["women consistently score lower than men on all moral reasoning tasks","Kohlberg's stages were derived mainly from women's responses","moral reasoning develops only after formal operations are complete","the theory was built on male data, and males may adopt a morality of justice while females adopt a morality of care"],"options_zh":["女性在所有道德推理任务上得分都低于男性","科尔伯格的阶段主要来自女性回答","道德推理只有在形式运算完成后才发展","该理论基于男性数据；男性采公正伦理、女性采关怀伦理"],"answer":3,"explain":"**Gilligan**（1982/1993）认为 **Kohlberg** 理论建立在男性数据上：男性偏向 **morality of justice**（约对应阶段 4），女性偏向 **morality of care**（约对应阶段 3）。但性别偏见的说法证据不足，多数研究显示女性推理与男性同样复杂，公正与关怀都是道德成熟的核心。","source":"L8 p.57"},{"id":"gC-45","gate":"C","lecture":9,"topic":"Mesosystem","difficulty":2,"stem":"The supportive connection between a child's family and the child's school, which optimizes development, is an example of the:","stem_zh":"儿童家庭与学校之间的支持性联系能优化发展，这属于：","options":["**Microsystem**","**Mesosystem**","**Exosystem**","**Macrosystem**"],"options_zh":["**微系统**","**中间系统**","**外部系统**","**宏观系统**"],"answer":1,"explain":"**Mesosystem**（中系统）是微系统之间的联系（如家庭—学校），支持性联系可优化发展；**microsystem** 是儿童直接参与的环境（家庭、玩伴）；**exosystem** 是儿童不参与但受影响的环境（父母工作场所）；**macrosystem** 是文化与社会阶层背景。","source":"L9 p.3"},{"id":"gC-46","gate":"C","lecture":9,"topic":"Chronosystem","difficulty":2,"stem":"In Bronfenbrenner's model, changes in the child or in the environment over time — such as the cognitive and biological changes of puberty — constitute the:","stem_zh":"在布朗芬布伦纳模型中，儿童或环境随时间的变化（如青春期的认知与生理变化）构成：","options":["**Chronosystem**","**Microsystem**","**Mesosystem**","**Exosystem**"],"options_zh":["**时间系统**","**微系统**","**中间系统**","**外部系统**"],"answer":0,"explain":"**Chronosystem**（时间系统）指儿童或其他系统随时间发生、可能影响发展方向的变化（如青春期的认知与生理变化）；其余系统分别是 **microsystem**、**mesosystem**、**exosystem** 与 **macrosystem**。","source":"L9 p.4"},{"id":"gC-47","gate":"C","lecture":9,"topic":"Psychological control","difficulty":3,"stem":"Parents who try to influence their adolescent by withdrawing affection and inducing shame or guilt are using ____, which is linked to anxiety, depression, and poor academic performance.","stem_zh":"父母试图通过撤回关爱、引发羞耻或内疚来影响青少年，使用的是____，它与焦虑、抑郁和学业不良相关。","options":["**behavioral control**","parental **acceptance/responsiveness**","**coparenting**","**psychological control**"],"options_zh":["**行为控制**","父母**接纳／回应**","**共同养育**","**心理控制**"],"answer":3,"explain":"**Behavioral control** 以坚定合理的纪律与活动监督规范行为，倾向培养守规矩、不参与偏差同伴活动的儿童；**psychological control** 靠收回关爱、引发羞耻／内疚，与焦虑、抑郁、学业差、结交偏差同伴及反社会行为相关。","source":"L9 p.15"},{"id":"gC-48","gate":"C","lecture":9,"topic":"Peer acceptance","difficulty":2,"stem":"Which sociometric status carries the highest risk of later adjustment problems and antisocial behaviour?","stem_zh":"哪一种同伴社交地位日后出现适应问题与反社会行为的风险最高？","options":["**Popular**","**Neglected**","**Rejected**","**Controversial**"],"options_zh":["**受欢迎**","**被忽视**","**被拒绝**","**有争议**"],"answer":2,"explain":"**Rejected** 儿童（多数人不喜欢、少数人喜欢）日后适应问题与偏差／反社会行为风险最高；**neglected** 儿童在同伴中几乎隐形，但比被拒绝儿童少孤独，转班后社交地位可改善；**popular** 适应最好；**controversial** 评价两极。","source":"L9 p.33"},{"id":"gC-49","gate":"C","lecture":9,"topic":"Child effects model","difficulty":3,"stem":"The child effects model of socialization claims that:","stem_zh":"社会化的儿童效应模型主张：","options":["children's own characteristics, such as high impulsivity and low effortful control, can make parents lax or uninvolved","parents' behaviour fully determines how children turn out","socialization runs only from parents to children","peers replace parents as the main influence in middle childhood"],"options_zh":["儿童自身特征（如高冲动、低努力控制）可使父母变得宽松或冷漠","父母行为完全决定儿童的发展结果","社会化只由父母指向儿童","童年中期同伴取代父母成为主要影响"],"answer":0,"explain":"**Child effects model**：影响方向为儿童 → 父母，冲动高、努力控制低的儿童显得固执，最终使父母管教松懈甚至退出；**parental effects model** 是父母 → 儿童；**transactional model** 认为社会化是双向影响，父母影响大于儿童影响，但儿童确实影响父母。","source":"L9 p.16"},{"id":"gC-50","gate":"C","lecture":9,"topic":"Video games","difficulty":3,"stem":"Compared with television violence, violent video games may be more problematic because:","stem_zh":"与电视暴力相比，暴力电子游戏可能问题更严重，因为：","options":["children simply watch them passively","children actively perform the violence and are reinforced for successful symbolic violence","they contain fewer instances of violence than television programmes","they are played for shorter periods than television programmes"],"options_zh":["儿童只是被动观看","儿童主动实施暴力，并因成功的符号暴力而被强化","它们包含的暴力场面比电视节目更少","它们的游玩时间比电视节目更短"],"answer":1,"explain":"暴力电子游戏与真实攻击有中等相关，可能比电视暴力更严重：儿童主动实施暴力，并因成功实施符号性暴力而获强化。网络接触的其他担忧包括色情内容、网络欺凌与约 15% 青少年自我封闭、依赖与陌生人接触。","source":"L9 p.52"}]}};

<script>
/* ============================================================
   PSY6017 三日通关 · 刷题 SPA
   纯前端 · 无后端 · 进度存 localStorage
   ============================================================ */
(function () {
  'use strict';

  /* ---------------- 常量 ---------------- */
  var DATA = window.PS_DATA || { day1: [], day2: [], day3: [], gates: { A: [], B: [], C: [] }, meta: {} };
  var LS_KEY = 'psy6017_state_v1';
  var GATE_NAMES = { A: '关卡 A · 真题训练', B: '关卡 B · 真题训练', C: '关卡 C · 终极模拟' };
  var GATE_SIZE = { A: 25, B: 25, C: 50 };
  var LECTURE_TITLES = {
    1: '发展导论：发展观与研究法',
    2: '发展基础：遗传·产前·婴儿期',
    3: '认知发展：皮亚杰·心理理论·维果茨基',
    4: '语言发展',
    5: '情绪发展·气质·依恋',
    6: '自我概念·自尊·成就动机·同一性',
    7: '性别差异与性别角色发展',
    8: '攻击·利他·道德发展',
    9: '发展情境：家庭·同伴·学校·科技'
  };
  var DAY_INFO = {
    1: { title: '概念地基', desc: '9 讲直问直答，每个选项都讲透', accent: '#2563eb', soft: '#eef4ff', icon: '📘' },
    2: { title: '情景应用', desc: '真实情境题，把理论用出来', accent: '#d97706', soft: '#fff7e6', icon: '🧩' },
    3: { title: '考前押题', desc: '50 道高命中题打散乱序', accent: '#e11d48', soft: '#fff1f4', icon: '🎯' }
  };
  var GATE_INFO = {
    A: { title: '关卡 A · 真题训练', size: 25, time: 0, desc: '纯英文 · 25 题 · 做完评分', unlock: '通关后解锁第 2 天' },
    B: { title: '关卡 B · 真题训练', size: 25, time: 0, desc: '纯英文 · 25 题 · 做完评分', unlock: '通关后解锁第 3 天' },
    C: { title: '关卡 C · 终极模拟', size: 50, time: 60, desc: '纯英文 · 50 题 · 限时 60 分钟', unlock: '全真模拟，检验最终状态' }
  };
  var ENCOURAGE_OK = ['漂亮！这题稳了', '概念 +1 ✅', '记住了，考场上见', '稳扎稳打，很好', '对！这个辨析你已经分清了',
    '再 +1，手感来了', '不错，继续保持', '这题以后不会错了', '精准命中 👏', '节奏很好，继续'];
  var ENCOURAGE_NO = ['没事，看一遍四个选项的释义，这题就值了', '别急，这正是要补的点', '错误是最好的老师——把它记进错题本',
    '先看看每个选项为什么错，比背答案有用', '差一点，回看解析再来', '这一题暴露了一个易混点，赚了', '不用慌，考前一天把它拿下'];
  var COMBO_WORDS = { 3: '连续 3 题全对 🔥', 5: '连续 5 题！状态火热 🔥🔥', 10: '连续 10 题全对，太稳了 🏆' };
  var LANG_LABELS = { blend: '融合', bilingual: '双语', english: '纯英文' };
  var LANG_DESCS = {
    blend: '中文叙述 + 英文术语（默认）',
    bilingual: '英文主文 + 灰色小中文，选项同样对照',
    english: '题干与选项纯英文，解析保持中文'
  };
  var EXAM_DATE = new Date('2026-11-23T00:00:00+08:00');
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var QS = null;      // 当前做题会话
  var timerId = null; // 倒计时/计时器

  /* ---------------- 工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(s) {
    var out = esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return out.split(/\n{2,}/).map(function (p) {
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function num(n) { return Number(n || 0); }
  function pct(a, b) { return b > 0 ? Math.round(a * 100 / b) : 0; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.hidden = false;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------------- 状态 ---------------- */
  function defaultState() {
    return {
      v: 1, ans: {}, wrong: {}, gates: {}, gateUnlocks: {}, day3Order: null, lastRoute: '#/', createdAt: Date.now(),
      langMode: 'blend',
      streak: { cur: 0, best: 0 },
      stats: { correct: 0, wrong: 0, killed: 0, firstAt: 0, lastAt: 0 },
      celebrated: {}
    };
  }
  var S = loadState();
  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.v === 1) {
          var d = defaultState();
          for (var k in d) if (!(k in o)) o[k] = d[k];
          return o;
        }
      }
    } catch (e) { /* ignore */ }
    return defaultState();
  }
  function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  var QIDX = {}; // id -> question
  (function buildIndex() {
    ['day1', 'day2', 'day3'].forEach(function (d) {
      (DATA[d] || []).forEach(function (q) { QIDX[q.id] = q; });
    });
    Object.keys(DATA.gates || {}).forEach(function (g) {
      (DATA.gates[g] || []).forEach(function (q) { QIDX[q.id] = q; });
    });
  })();

  function dayItems(day) { return day === 1 ? DATA.day1 : day === 2 ? DATA.day2 : DATA.day3; }
  function answeredCount(day) {
    var n = 0;
    dayItems(day).forEach(function (q) { if (S.ans[q.id] != null) n++; });
    return n;
  }
  function allAnswered(day) { var a = dayItems(day); return a.length > 0 && answeredCount(day) >= a.length; }
  function gateAnswered(g) {
    var a = S.gates[g] && S.gates[g].ans ? S.gates[g].ans : {};
    var arr = DATA.gates[g] || [];
    var n = 0; arr.forEach(function (q) { if (a[q.id] != null) n++; });
    return n;
  }
  function dayUnlocked(day) {
    if (day === 1) return true;
    if (day === 2) return !!S.gateUnlocks.A;
    return !!S.gateUnlocks.B;
  }
  function gateAvailable(g) {
    if (g === 'A') return allAnswered(1);
    if (g === 'B') return allAnswered(2);
    return allAnswered(3);
  }
  function gateSubmitted(g) { return !!(S.gates[g] && S.gates[g].submitted); }
  function gateScore(g) { var x = S.gates[g]; return x && x.score != null ? x.score : null; }
  function totalMain() { return DATA.day1.length + DATA.day2.length + DATA.day3.length; }
  function totalGate() { return (DATA.gates.A || []).length + (DATA.gates.B || []).length + (DATA.gates.C || []).length; }
  function overallAnswered() {
    var n = answeredCount(1) + answeredCount(2) + answeredCount(3);
    ['A', 'B', 'C'].forEach(function (g) { n += gateAnswered(g); });
    return n;
  }
  function overallTotal() { return totalMain() + totalGate(); }
  function wrongCount() { return Object.keys(S.wrong || {}).length; }
  function wrongList() {
    var out = [];
    Object.keys(S.wrong || {}).forEach(function (id) {
      if (QIDX[id]) out.push(id);
    });
    return out;
  }
  function daysLeft() {
    var now = new Date();
    var ms = EXAM_DATE - new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.max(0, Math.ceil(ms / 86400000));
  }
  function getDay3Order() {
    if (!S.day3Order || S.day3Order.length !== DATA.day3.length || S.day3Order.some(function (id) { return !QIDX[id]; })) {
      S.day3Order = shuffle(DATA.day3.map(function (q) { return q.id; })).map(function (id) { return id; });
      saveState();
    }
    return S.day3Order.map(function (id) { return QIDX[id]; }).filter(Boolean);
  }
  function resetLecture(day, lecture) {
    dayItems(day).forEach(function (q) {
      if (day === 3 || q.lecture === lecture) { delete S.ans[q.id]; delete S.wrong[q.id]; }
    });
    if (day === 3) S.day3Order = null;
    if (day !== 3 && lecture) delete S.celebrated['L' + lecture];
    saveState();
  }

  /* ---------------- 鼓励 / 连击 / 庆祝 ---------------- */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function feedbackText(ok) {
    if (ok) {
      var msg = '✅ ' + pick(ENCOURAGE_OK);
      if (S.streak && S.streak.cur >= 3) msg += ' · 连对 ' + S.streak.cur + ' 题 🔥';
      return msg;
    }
    return '💡 ' + pick(ENCOURAGE_NO);
  }
  function recordAnswer(ok) {
    var now = Date.now();
    if (!S.stats.firstAt) S.stats.firstAt = now;
    S.stats.lastAt = now;
    if (ok) {
      S.stats.correct++;
      S.streak.cur = (S.streak.cur || 0) + 1;
      if (S.streak.cur > (S.streak.best || 0)) S.streak.best = S.streak.cur;
    } else {
      S.stats.wrong++;
      S.streak.cur = 0;
    }
  }
  function confettiBurst(n) {
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    } catch (e) { /* ignore */ }
    n = n || 28;
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    var emojis = ['🎉', '✨', '⭐', '💙', '🎊', '🟦', '🟨'];
    for (var i = 0; i < n; i++) {
      var sp = document.createElement('span');
      sp.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      sp.style.left = (Math.random() * 100) + '%';
      sp.style.animationDelay = (Math.random() * 0.5) + 's';
      sp.style.animationDuration = (1.4 + Math.random() * 1.2) + 's';
      sp.style.fontSize = (12 + Math.random() * 14) + 'px';
      layer.appendChild(sp);
    }
    document.body.appendChild(layer);
    setTimeout(function () { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 3300);
  }
  function celebrate(title, sub, big) {
    try {
      if (document.querySelector('.celebrate')) return;
      var d = document.createElement('div');
      d.className = 'celebrate' + (big ? ' big' : '');
      d.innerHTML = '<div class="celebrate-inner"><div class="ce-emoji">' + (big ? '🏆' : '🎉') + '</div>' +
        '<div class="ce-title">' + esc(title) + '</div>' + (sub ? '<div class="ce-sub">' + esc(sub) + '</div>' : '') + '</div>';
      d.addEventListener('click', function () { if (d.parentNode) d.parentNode.removeChild(d); });
      document.body.appendChild(d);
      confettiBurst(big ? 60 : 32);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, big ? 3400 : 2200);
    } catch (e) { /* ignore */ }
  }

  /* ---------------- 顶部/底部框架 ---------------- */
  function tabbar(active) {
    var t = [
      ['#/', '🏠', '首页', 'home'],
      ['#/wrong', '📕', '错题本', 'wrong'],
      ['#/about', '💡', '说明', 'about']
    ];
    return '<nav class="tabbar">' + t.map(function (x) {
      return '<a href="' + x[0] + '" class="' + (active === x[3] ? 'active' : '') + '"><span class="ic">' + x[1] + '</span>' + x[2] + '</a>';
    }).join('') + '</nav>';
  }
  function topbar(v) {
    return '<header class="topbar"><div class="inner">' +
      (v.back ? '<button class="back" data-action="go" data-href="' + v.back + '">‹</button>' : '<div class="back" style="visibility:hidden"></div>') +
      '<div class="t"><div class="title">' + esc(v.title || 'PSY6017 三日通关') + '</div>' +
      (v.sub ? '<div class="sub">' + esc(v.sub) + '</div>' : '') + '</div>' +
      (v.pct != null ? '<div class="pct">' + v.pct + '%</div>' : '') +
      '<button class="lang-btn" data-action="lang-menu" aria-label="切换语言模式">🌐 ' + langModeLabel() + '</button>' +
      '</div></header>';
  }

  function render() {
    clearInterval(timerId); timerId = null;
    var hash = location.hash || '#/';
    if (hash === '#' || hash === '#/') hash = '#/';
    if (!/^#\//.test(hash)) hash = '#/';
    var parts = hash.replace(/^#\//, '').split('/').filter(function (x) { return x !== ''; });
    var v;
    try {
      v = routeView(parts);
    } catch (e) {
      if (window.console) console.error(e);
      v = { title: '出错了', body: '<div class="card"><h3>页面加载出错</h3><p class="muted small">' + esc(e.message) + '</p><p class="mt12"><a class="btn btn-primary" href="#/">返回首页</a></p></div>' };
    }
    if (v.redirect) { location.replace(v.redirect); return; }
    if (v.title) document.title = (v.title.indexOf('PSY6017') === 0) ? v.title : (v.title + ' · PSY6017 三日通关');
    S.lastRoute = hash; saveState();
    app.innerHTML = (v.hideTop ? '' : topbar(v)) + '<main class="wrap">' + v.body + '</main>' + (v.hideTab ? '' : tabbar(v.tab));
    window.scrollTo(0, 0);
    if (v.after) { try { v.after(); } catch (e) { if (window.console) console.error(e); } }
  }

  /* ---------------- 首页 ---------------- */
  function dayCard(day) {
    var info = DAY_INFO[day];
    var total = dayItems(day).length;
    var done = answeredCount(day);
    var unlocked = dayUnlocked(day);
    var empty = total === 0;
    var p = pct(done, total);
    var status, statusCls;
    if (empty) { status = '待填充'; statusCls = 'lock'; }
    else if (done >= total) { status = '已完成'; statusCls = 'done'; }
    else if (done > 0) { status = '进行中'; statusCls = ''; }
    else { status = '未开始'; statusCls = ''; }
    if (!unlocked) { status = '🔒 未解锁'; statusCls = 'lock'; }
    var href = '#/day/' + day;
    return '<div class="day-card ' + (unlocked ? '' : 'locked') + '" style="--accent:' + info.accent + ';--accent-soft:' + info.soft + '">' +
      '<div class="head">' +
        '<div class="num">D' + day + '</div>' +
        '<div class="info"><h3>第 ' + day + ' 天 · ' + info.title + '</h3><div class="desc">' + esc(info.desc) + '</div></div>' +
        '<div class="status ' + statusCls + '">' + status + '</div>' +
      '</div>' +

  function resumeRoute() {

  /* ---------------- 某一天：总览 ---------------- */
  function viewDay(day) {
    if (day !== 1 && day !== 2 && day !== 3) return { redirect: '#/' };
    if (!dayUnlocked(day)) {
      return { title: '第 ' + day + ' 天 · 未解锁', back: '#/', hideTab: false, tab: 'home',
        body: '<div class="card center" style="padding:40px 20px"><div style="font-size:44px">🔒</div>' +

        '<div class="mt12"><button class="btn btn-primary btn-block" data-action="go" data-href="#/quiz/3">' + (done === 0 ? '开始押题' : done >= total ? '再刷一遍' : '继续（' + done + '/' + total + '）') + '</button></div>' +

        '<div class="right"><div class="mini"><div class="pbar"><i style="width:' + lp + '%;--accent:' + info.accent + '"></i></div></div>' +
        '<span class="dot ' + (dn >= list.length ? 'done' : '') + '"></span><span class="chev">›</span></div></div>';

        '<button class="go" data-action="go" data-href="#/gate/' + (day === 1 ? 'A' : 'B') + '">去通关</button></div>';

  }

  /* ---------------- 做题：Day1 / Day2 / Day3 ---------------- */
  function quizSetup(day, lecture) {
    var items;
    if (day === 3) items = getDay3Order();
    else items = dayItems(day).filter(function (q) { return q.lecture === lecture; });
    var key = day === 3 ? 'd3' : 'd' + day + '-l' + lecture;
    if (!QS || QS.key !== key) {
      QS = { key: key, mode: 'day', day: day, lecture: lecture, items: items, idx: 0, ans: {} };
      var firstUn = -1;
      for (var i = 0; i < items.length; i++) {
        if (S.ans[items[i].id] != null) QS.ans[items[i].id] = S.ans[items[i].id];
        else if (firstUn < 0) firstUn = i;
      }
      QS.idx = firstUn >= 0 ? firstUn : 0;
    }
    return QS;
  }

  /* ---------------- 语言模式 ---------------- */
  function lang() { return (S && S.langMode) || 'blend'; }
  function langModeLabel() { return LANG_LABELS[lang()] || '融合'; }
  function langSub(html) { return html ? '<span class="lang-sub">' + html + '</span>' : ''; }
  function mainTextHTML(q) {
    var m = lang();
    var zhRaw = q.stem || q.question || '';
    var enRaw = q.stem_en || q.question_en || '';
    var main = (m === 'blend' || !enRaw) ? fmt(zhRaw) : fmt(enRaw);
    var sub = '';
    if (m === 'bilingual') {
      if (enRaw) sub = fmt(zhRaw);
      else if (q.stem_zh) sub = fmt(q.stem_zh);
    }
    return '<div class="stem">' + main + langSub(sub) + '</div>';
  }
  function scenarioHTML(q) {
    if (!q.scenario) return '';
    var m = lang();
    var zh = fmt(q.scenario);
    if (m === 'blend') return '<div class="scenario"><div class="tag">情境 Scenario</div>' + zh + '</div>';
    var en = q.scenario_en ? fmt(q.scenario_en) : zh;
    return '<div class="scenario"><div class="tag">Situation · 情境</div>' + en +
      (m === 'bilingual' && q.scenario_en ? langSub(zh) : '') + '</div>';
  }
  function optionMainSub(q, i) {
    var m = lang();
    var opt = q.options[i];
    if (m === 'blend') return { main: fmt(opt), sub: '' };
    var hasEn = q.options_en && q.options_en[i];
    var main = hasEn ? fmt(q.options_en[i]) : fmt(opt);
    var sub = '';
    if (m === 'bilingual') {
      if (hasEn) sub = fmt(opt);
      else if (q.options_zh && q.options_zh[i]) sub = fmt(q.options_zh[i]);
    }
    return { main: main, sub: sub };
  }
  function primaryText(q) {
    if (lang() === 'blend') return q.stem || q.question || q.scenario || '';
    return q.stem_en || q.question_en || q.stem || q.question || q.scenario || '';
  }
  function showLangMenu() {
    var old = document.querySelector('.lang-modal');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var cur = lang();
    var opts = ['blend', 'bilingual', 'english'];
    var div = document.createElement('div');
    div.className = 'lang-modal';
    div.innerHTML = '<div class="lm-card"><h3 style="margin:0">🌐 语言模式</h3>' +
      '<p class="small muted" style="margin:4px 0 2px">随时切换，选择会保存在本机；题目内容三种模式完全一致。</p>' +
      opts.map(function (k) {
        return '<button class="lang-opt' + (cur === k ? ' on' : '') + '" data-action="set-lang" data-lang="' + k + '">' +
          '<b>' + LANG_LABELS[k] + '模式</b><span>' + LANG_DESCS[k] + '</span>' +
          (cur === k ? '<i>✓</i>' : '') + '</button>';
      }).join('') +
      '<div class="actions" style="margin-top:12px"><button class="btn btn-block" data-action="close-lang">关闭</button></div></div>';
    div.setAttribute('data-action', 'close-lang');
    document.body.appendChild(div);
  }
  function setLang(mode) {
    S.langMode = mode;
    saveState();
    var old = document.querySelector('.lang-modal');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    render();
    toast('已切换：' + (LANG_LABELS[mode] || '') + '模式');
  }

  function optionHTML(q, i, st) {
    var letter = 'ABCD'[i];
    var sel = st.ans;
    var revealed = st.revealed;
    var isCorrect = i === q.answer;
    var isPicked = sel === i;
    var cls = 'opt';
    if (revealed) {
      if (isCorrect) cls += ' correct';
      else if (isPicked) cls += ' wrong';
      else cls += ' dim';
    } else if (isPicked) cls += ' picked';
    var mark = '';
    if (revealed) {
      if (isCorrect) mark = '<span class="mark">✓ 正确</span>';
      else if (isPicked) mark = '<span class="mark">你选的</span>';
    }
    var note = '';
    if (revealed && q.option_notes && q.option_notes[i]) {
      note = '<div class="opt-note ' + (isCorrect ? 'correct' : (isPicked ? 'wrong' : '')) + '">' + fmt(q.option_notes[i]) + '</div>';
    }
    var om = optionMainSub(q, i);
    return '<div class="opt-wrap"><button class="' + cls + '" data-action="option" data-idx="' + i + '"' + (revealed ? ' disabled' : '') + '>' +
      '<span class="k">' + letter + '</span><span class="txt">' + om.main + langSub(om.sub) + '</span>' + mark + '</button>' + note + '</div>';
  }

  function questionCard(q, st, idx, total, opts) {
    opts = opts || {};
    var diff = q.difficulty || 1;
    var diffHTML = '<span class="diff">' + [1, 2, 3].map(function (d) { return '<i class="' + (d <= diff ? 'on' : '') + '"></i>'; }).join('') + '</span>';
    var html = '<div class="qcard fade-in" data-qid="' + q.id + '">' +
      '<div class="qhead"><span class="idx">' + (idx + 1) + ' / ' + total + '</span>' +
      (q.topic ? '<span class="chip">' + esc(q.topic) + '</span>' : '') +
      '<span class="chip">L' + q.lecture + '</span>' + diffHTML + '</div>';
    if (q.scenario) {
      html += scenarioHTML(q);
    }
    html += mainTextHTML(q);
    if (st.feedback) {
      html += '<div class="feedback ' + (st.fbOk ? 'ok' : 'no') + '">' + esc(st.feedback) + '</div>';
    }
    html += '<div class="opts">' + q.options.map(function (_, i) { return optionHTML(q, i, st); }).join('') + '</div>';
    if (st.revealed) {
      html += '<div class="explain"><div class="hd">💡 核心解析</div><div class="bd">' + fmt(q.explain) + '</div>' +
        '<div class="meta-row"><span class="src">出处：' + esc(q.source || '') + '</span>' +
        (q.tags || []).map(function (t) { return '<span class="tagchip">' + esc(t) + '</span>'; }).join('') + '</div></div>';
    }
    return html;
  }

  function viewQuiz(day, lecture) {
    if (!dayUnlocked(day)) return { redirect: day === 2 ? '#/day/2' : '#/day/3' };
    var items = day === 3 ? getDay3Order() : dayItems(day).filter(function (q) { return q.lecture === lecture; });

      '<div class="actions">' +
      '<button class="btn" data-action="prev"' + (qs.idx === 0 ? ' disabled' : '') + '>‹ 上一题</button>' +

    return { title: titleDay, sub: sub, back: '#/day/' + day, pct: pct(done, total), body: body, tab: 'home' };
  }

  function viewWrongOne(id) {

  function startGateTimer(g) {
    var info = GATE_INFO[g];
    if (!info.time) return;
    var st = gateState(g);
    if (!st.startedAt) st.startedAt = Date.now();
    var end = st.startedAt + info.time * 60000;
    function tick() {
      var left = Math.max(0, Math.round((end - Date.now()) / 1000));
      var el = document.getElementById('gate-timer');
      if (el) {
        var m = Math.floor(left / 60), s = left % 60;
        el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        if (left <= 300) el.classList.add('warn');
      }
      if (left <= 0) {
        clearInterval(timerId); timerId = null;
        toast('时间到，自动交卷');
        submitGate(g, true);
      }
    }
    tick();
    timerId = setInterval(tick, 1000);
  }

  function submitGate(g, auto) {

    items.forEach(function (q) {
      if (st.ans[q.id] === q.answer) score++;

      else S.wrong[q.id] = 'g' + g;

    st.submitted = true;
    st.score = score;
    st.submittedAt = Date.now();
    if (g === 'A') S.gateUnlocks.A = true;
    if (g === 'B') S.gateUnlocks.B = true;
    if (g === 'C') S.gateUnlocks.C = true;

  /* ---------------- 随机 10 题 ---------------- */
  function randomItems(n) {
    var all = DATA.day1.concat(DATA.day2).concat(DATA.day3);
    var un = all.filter(function (q) { return S.ans[q.id] == null; });
    var pool = shuffle(un).slice(0, n);
    if (pool.length < n) {
      var rest = shuffle(all.filter(function (q) { return S.ans[q.id] != null; }));
      pool = pool.concat(rest.slice(0, n - pool.length));
    }
    return pool;
  }
  function viewRandom() {
    if (!QS || QS.key !== 'random') {
      var items = randomItems(10);

      QS = { key: 'random', mode: 'random', items: items, idx: 0, ans: {} };
    }
    var qs = QS;
    var q = qs.items[qs.idx];
    var total = qs.items.length;
    var st = { ans: qs.ans[q.id] != null ? qs.ans[q.id] : null, revealed: qs.ans[q.id] != null };
    if (st.revealed) { st.fbOk = st.ans === q.answer; st.feedback = feedbackText(st.fbOk); }

  /* ---------------- 刷题报告 / 通关证书 ---------------- */
  function computeReport() {
    var main = DATA.day1.concat(DATA.day2).concat(DATA.day3);
    var answered = 0, correct = 0;
    var lec = {};
    for (var L = 1; L <= 9; L++) lec[L] = { a: 0, c: 0 };
    main.forEach(function (q) {
      var sel = S.ans[q.id];
      if (sel == null) return;
      answered++;
      var ok = sel === q.answer;
      if (ok) correct++;
      lec[q.lecture].a++;
      if (ok) lec[q.lecture].c++;
    });
    var gates = {};
    ['A', 'B', 'C'].forEach(function (g) {
      var st = S.gates[g] || { ans: {} };
      var arr = DATA.gates[g] || [];
      var a = 0, c = 0;
      arr.forEach(function (q) { if (st.ans && st.ans[q.id] != null) { a++; if (st.ans[q.id] === q.answer) c++; } });
      gates[g] = { a: a, c: c, total: arr.length, score: st.score != null ? st.score : null, submitted: !!st.submitted };
    });
    var dur = (S.stats.firstAt && S.stats.lastAt) ? Math.round((S.stats.lastAt - S.stats.firstAt) / 60000) : 0;
    return {
      answered: answered, correct: correct, mainTotal: main.length,
      acc: answered ? Math.round(correct * 100 / answered) : 0,
      lec: lec, gates: gates, minutes: dur,
      wrong: wrongCount(), killed: S.stats.killed || 0, best: S.streak.best || 0,
      gateUnlocks: S.gateUnlocks || {}
    };
  }
  function reportBars(r) {
    var html = '';
    for (var L = 1; L <= 9; L++) {
      var s = r.lec[L];
      var p = s.a ? Math.round(s.c * 100 / s.a) : 0;
      html += '<div class="bar-row"><span class="bar-name">L' + L + '</span><div class="bar-track"><i style="width:' + p + '%;"></i></div>' +
        '<span class="bar-val">' + (s.a ? p + '%' : '—') + '</span></div>';
    }
    return html;
  }
  function viewReport() {
    var r = computeReport();
    var gateText = ['A', 'B', 'C'].map(function (g) {
      var x = r.gates[g];
      if (x.submitted && x.score != null) return '关卡 ' + g + '：' + x.score + '/' + x.total;
      if (x.a) return '关卡 ' + g + '：已答 ' + x.a + '/' + x.total;
      return '关卡 ' + g + '：未开始';
    }).join(' · ');
    var ready = r.gateUnlocks.C ? '🏆 三日全线通关' : (r.answered ? '进行中' : '还没开始');
    var body =
      '<div class="section-title"><h2>📊 我的刷题报告</h2><span>' + ready + '</span></div>' +
      '<div class="card report-card">' +
        '<div class="report-head"><div><div class="big-num">' + r.acc + '%</div><div class="small muted">主练题正确率（' + r.correct + ' / ' + r.answered + '）</div></div>' +
        '<div class="report-medal">' + (r.gateUnlocks.C ? '🏆' : r.answered > 100 ? '🔥' : '🌱') + '</div></div>' +
        '<div class="hr"></div>' +
        '<div class="report-stats">' +
          '<div><b>' + r.answered + '</b><span>已刷题</span></div>' +
          '<div><b>' + r.wrong + '</b><span>待消灭错题</span></div>' +
          '<div><b>' + r.killed + '</b><span>已消灭错题</span></div>' +
          '<div><b>' + r.best + '</b><span>最佳连对</span></div>' +
        '</div>' +
        '<div class="small muted mt8">' + esc(gateText) + '</div>' +
      '</div>' +
      '<div class="card"><h3 style="margin:0 0 8px">各讲掌握度</h3>' + reportBars(r) + '</div>' +
      '<div class="actions"><button class="btn btn-primary btn-block" data-action="make-report">📷 生成报告卡（可保存/分享）</button></div>' +
      '<p class="small muted center mt12">报告只根据本机数据生成，不会上传任何信息。</p>';
    return { title: '我的刷题报告', back: '#/', body: body, tab: 'home' };
  }
  function makeReport() {
    var r = computeReport();
    var W = 900, H = 1280;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0f172a'); bg.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.12; ctx.fillStyle = '#93c5fd';
    ctx.beginPath(); ctx.arc(760, 140, 220, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(120, 1120, 260, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    var font = '-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif';
    ctx.fillStyle = '#ffffff'; ctx.font = '800 54px ' + font;
    ctx.fillText('PSY6017 三日通关', 60, 120);
    ctx.fillStyle = '#93c5fd'; ctx.font = '600 30px ' + font;
    ctx.fillText('我的刷题报告', 60, 170);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '22px ' + font;
    try { ctx.fillText(new Date().toLocaleDateString('zh-CN'), 700, 120); } catch (e) { /* ignore */ }
    ctx.fillStyle = '#ffffff'; ctx.font = '800 130px ' + font;
    ctx.fillText(r.acc + '%', 60, 360);
    ctx.fillStyle = '#93c5fd'; ctx.font = '26px ' + font;
    ctx.fillText('主练题正确率 · ' + r.correct + ' / ' + r.answered + ' 题', 60, 405);
    var stats = [[r.answered, '已刷题'], [r.wrong, '待消灭错题'], [r.killed, '已消灭错题'], [r.best, '最佳连对']];
    stats.forEach(function (s, i) {
      var x = 60 + (i % 2) * 400, y = 470 + Math.floor(i / 2) * 120;
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, 360, 96, 18); } else { ctx.rect(x, y, 360, 96); }
      ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '800 44px ' + font; ctx.fillText(String(s[0]), x + 24, y + 58);
      ctx.fillStyle = '#93c5fd'; ctx.font = '24px ' + font; ctx.fillText(s[1], x + 130, y + 58);
    });
    ctx.fillStyle = '#ffffff'; ctx.font = '700 30px ' + font;
    ctx.fillText('各讲掌握度', 60, 770);
    for (var L = 1; L <= 9; L++) {
      var s2 = r.lec[L];
      var p = s2.a ? Math.round(s2.c * 100 / s2.a) : 0;
      var yy = 810 + (L - 1) * 44;
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '22px ' + font;
      ctx.fillText('L' + L, 60, yy + 8);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(110, yy - 8, 600, 14);
      if (p > 0) {
        var grad = ctx.createLinearGradient(110, 0, 710, 0);
        grad.addColorStop(0, '#60a5fa'); grad.addColorStop(1, '#a78bfa');
        ctx.fillStyle = grad; ctx.fillRect(110, yy - 8, 600 * p / 100, 14);
      }
      ctx.fillStyle = '#cbd5e1'; ctx.font = '22px ' + font;
      ctx.fillText(s2.a ? p + '%' : '—', 730, yy + 8);
    }
    ctx.fillStyle = '#93c5fd'; ctx.font = '26px ' + font;
    var gtxt = ['A', 'B', 'C'].map(function (g) { var x = r.gates[g]; return '关卡 ' + g + ' ' + (x.score != null ? x.score + '/' + x.total : x.a ? x.a + '/' + x.total : '—'); }).join('   ');
    ctx.fillText(gtxt, 60, 1235);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = '20px ' + font;
    ctx.fillText('PSY6017 三日通关 · 期末刷题', 60, 1272);
    var url = cv.toDataURL('image/png');
    showReportModal(url);
  }
  function showReportModal(url) {
    var old = document.querySelector('.report-modal');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var div = document.createElement('div');
    div.className = 'report-modal';
    div.innerHTML = '<div class="rm-card"><h3 style="margin:0">报告卡已生成</h3>' +
      '<img id="report-img" src="' + url + '" alt="我的刷题报告">' +
      '<div class="small muted">手机上长按图片即可保存；电脑可点下面按钮下载。</div>' +
      '<div class="actions" style="margin-top:4px"><button class="btn" data-action="close-report-modal">关闭</button>' +
      '<a class="btn btn-primary" download="PSY6017-刷题报告.png" href="' + url + '">下载图片</a></div></div>';
    document.body.appendChild(div);
  }

  /* ---------------- 说明页 ---------------- */
  function viewAbout() {
    var url = location.href.split('#')[0];
    var body = '<div class="section-title"><h2>使用说明</h2></div>' +
      '<div class="card"><h3>🗺️ 三天怎么刷</h3><ul class="list-plain">' +
      '<li><b>第 1 天 · 概念地基</b>：9 讲直问直答。选完立刻看到每个选项的释义——哪些是「看起来像」的陷阱。不评分，只攒进度。</li>' +
      '<li><b>第 2 天 · 情景应用</b>：真实校园/家庭情境，练「看到事例能判断是哪个理论」。</li>' +
      '<li><b>第 3 天 · 考前押题</b>：50 道高区分度题打散乱序，最后查漏补缺。</li>' +
      '<li>三天之间各有一道<b>纯英文真题训练</b>（关卡 A/B），做完并评分；<b>做完即解锁</b>下一天。终极关卡 C 是 50 题限时模拟。</li></ul></div>' +
      '<div class="card"><h3>📱 分享给同学</h3><p class="small muted">把链接发到微信群即可，微信内直接打开。进度各自保存在各自手机，互不影响。</p>' +
      '<div class="share-box"><div class="qr" id="qr-box"></div>' +
      '<div class="link-line"><input id="share-link" readonly value="' + esc(url) + '"><button class="btn btn-sm btn-primary" data-action="copy-link">复制</button></div>' +
      '<div class="small muted">扫码或复制链接打开</div></div></div>' +
      '<div class="card"><h3>🌐 三种语言模式</h3><p class="small muted">右上角红色按钮可随时切换，选择保存在本机：</p>' +
      '<ul class="list-plain" style="margin-top:6px"><li><b>融合</b>：中文叙述 + 英文术语（默认，和以前一样）</li>' +
      '<li><b>双语</b>：英文主文 + 灰色小中文，题干和选项都对照</li>' +
      '<li><b>纯英文</b>：题干/选项纯英文，解析与逐选项释义保持中文</li></ul></div>' +
      '<div class="card"><h3>⚙️ 关于本页</h3><p class="small muted">内容依据 2026 年秋季 PSY6017 课堂 PPT（9 讲）整理，并参考多份同学整理的复习资料交叉比对。题目为复习自编，非官方题库。</p>' +
      '<p class="small muted mt8">进度退出后也会自动保存，但只保存在当前浏览器（localStorage），不会收集任何个人资料；换设备或清缓存会丢失进度。</p>' +
      '<div class="hr"></div>' +
      '<div class="row-between"><span class="small muted">进度：' + overallAnswered() + ' / ' + overallTotal() + ' 题 · 错题 ' + wrongCount() + '</span>' +
      '<button class="btn btn-sm btn-ghost" data-action="reset-all">重置全部进度</button></div></div>' +
      '<p class="disclaimer center mt24" data-action="secret-title" id="secret-title">PSY6017 三日通关 · v1.0 · 自制复习工具</p>' +
      '<p class="disclaimer center">长按标题 3 秒可解锁全部（自用调试）</p>';
    return { title: '说明 · 分享', back: '#/', body: body, tab: 'about', after: function () { renderQR(url); } };
  }

  function renderQR(url) {
    var box = document.getElementById('qr-box');
    if (!box) return;
    try {
      if (window.QRCode) {
        box.innerHTML = '';
        new window.QRCode(box, { text: url, width: 152, height: 152, correctLevel: window.QRCode.CorrectLevel.M });
      } else {
        box.innerHTML = '<div class="small muted center">二维码组件未加载<br>直接复制链接即可</div>';
      }
    } catch (e) { box.innerHTML = '<div class="small muted center">复制链接即可分享</div>'; }
  }

  /* ---------------- 路由 ---------------- */
  function routeView(parts) {
    var p = parts[0] || '';
    var q1 = parts[1] || '';
    if (p === '') return viewHome();
    if (p === 'day') return viewDay(parseInt(q1, 10));
    if (p === 'quiz') {
      if (q1 === '3') return viewQuiz(3, null);
      var d = parseInt(q1, 10);
      var lec = parseInt(parts[2] || '0', 10);
      if (d === 1 || d === 2) return viewQuiz(d, lec);
      return { redirect: '#/' };
    }
    if (p === 'gate') {
      var g = (q1 || '').toUpperCase();
      if (!GATE_INFO[g]) return { redirect: '#/' };
      if ((parts[2] || '') === 'result') return viewGateResult(g);
      return viewGate(g);
    }
    if (p === 'random') return viewRandom();
    if (p === 'report') return viewReport();
    if (p === 'wrong') {
      if (q1 === 'quiz') return viewWrongQuiz();
      if (q1 === 'q') { QS = null; return viewWrongOne(decodeURIComponent(parts[2] || '')); }
      QS = null;
      return viewWrong();
    }
    if (p === 'about') return viewAbout();
    return viewHome();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) {
      // 点击选项按钮以外的 opt 也应触发
      return;
    }
    var a = el.getAttribute('data-action');
    try {
      if (a === 'go') { location.hash = el.getAttribute('data-href'); return; }
      if (a === 'option') {
        var i = parseInt(el.getAttribute('data-idx'), 10);
        onOption(i);
        return;
      }
      if (a === 'prev') { if (QS && QS.idx > 0) { QS.idx--; render(); } return; }
      if (a === 'next') { if (QS && QS.idx < QS.items.length - 1) { QS.idx++; render(); } return; }
      if (a === 'finish') { finishDaySet(); return; }
      if (a === 'random-new') { QS = null; render(); return; }
      if (a === 'finish-random') { QS = null; toast('随机 10 题完成 ✓'); location.hash = '#/'; return; }
      if (a === 'make-report') { makeReport(); return; }
      if (a === 'lang-menu') { showLangMenu(); return; }
      if (a === 'set-lang') { setLang(el.getAttribute('data-lang')); return; }
      if (a === 'close-lang') { var lm = document.querySelector('.lang-modal'); if (lm && lm.parentNode) lm.parentNode.removeChild(lm); return; }
      if (a === 'close-report-modal') { var rmm = document.querySelector('.report-modal'); if (rmm && rmm.parentNode) rmm.parentNode.removeChild(rmm); return; }
      if (a === 'next-wrong') { if (QS && QS.idx < QS.items.length - 1) { QS.idx++; render(); } return; }
      if (a === 'finish-wrong') { QS = null; toast('错题重刷完成'); location.hash = '#/wrong'; return; }
      if (a === 'start-gate') { startGate(el.getAttribute('data-gate')); return; }
      if (a === 'toggle-sheet') { if (QS) { QS.showSheet = !QS.showSheet; render(); } return; }
      if (a === 'jump') { if (QS) { QS.idx = parseInt(el.getAttribute('data-idx'), 10); QS.showSheet = false; render(); } return; }
      if (a === 'gate-prev') { if (QS && QS.idx > 0) { QS.idx--; render(); } return; }
      if (a === 'gate-next') { if (QS && QS.idx < QS.items.length - 1) { QS.idx++; render(); } return; }
      if (a === 'submit-gate') { submitGate(QS.gate, false); return; }
      if (a === 'redo-gate') { redoGate(el.getAttribute('data-gate')); return; }
      if (a === 'copy-link') { copyLink(); return; }
      if (a === 'wxtip-close') { try { localStorage.setItem('psy6017_wxtip', 'off'); } catch (e) {} var wp = document.getElementById('wxtip'); if (wp) wp.style.display = 'none'; return; }
      if (a === 'reset-all') { resetAll(); return; }
      if (a === 'clear-wrong') { if (window.confirm('清空错题本？')) { S.wrong = {}; saveState(); render(); toast('已清空'); } return; }
      if (a === 'reset-day') { var dd = parseInt(el.getAttribute('data-day'), 10); if (window.confirm('清空这一天的作答记录？')) { resetLecture(dd, null); render(); toast('已清空'); } return; }
    } catch (err) {
      if (window.console) console.error(err);
    }
  });

  function onOption(i) {
    if (!QS) return;
    var q = QS.items[QS.idx];
    // 关卡考试模式：允许在交卷前修改答案
    if (QS.mode === 'gate') {
      var gst = gateState(QS.gate);
      gst.ans[q.id] = i;
      QS.ans[q.id] = i;
      saveState();
      render();
      return;
    }
    if (QS.ans[q.id] != null) return;
    QS.ans[q.id] = i;
    var ok = (i === q.answer);
    var justCompletedLecture = null;
    if (QS.mode === 'day' || QS.mode === 'random') {
      S.ans[q.id] = i;
      if (!ok) {
        S.wrong[q.id] = QS.mode === 'random' ? 'r' : ('d' + QS.day);
      } else if (S.wrong[q.id]) {
        delete S.wrong[q.id];
        S.stats.killed = (S.stats.killed || 0) + 1;
      }
      recordAnswer(ok);
      saveState();
      if (ok && S.streak.cur > 1 && COMBO_WORDS[S.streak.cur]) {
        setTimeout(function () { toast(COMBO_WORDS[S.streak.cur]); confettiBurst(16); }, 380);
      }
      if (QS.mode === 'day' && QS.lecture) {
        var ck = 'L' + QS.lecture;
        var allDone = QS.items.every(function (x) { return QS.ans[x.id] != null; });
        if (allDone && !S.celebrated[ck]) {
          S.celebrated[ck] = true;
          justCompletedLecture = QS.lecture;
          saveState();
        }
      }
    } else if (QS.mode === 'wrong') {
      if (ok) {
        if (S.wrong[q.id]) { delete S.wrong[q.id]; S.stats.killed = (S.stats.killed || 0) + 1; }
        saveState();
      }
    }
    render();
    if (justCompletedLecture) {
      celebrate('🎉 L' + justCompletedLecture + ' 完成', '「' + (LECTURE_TITLES[justCompletedLecture] || '') + '」已过一遍');
    }
  }

  function finishDaySet() {
    if (!QS) return;
    var unanswered = QS.items.filter(function (q) { return QS.ans[q.id] == null; }).length;
    if (unanswered > 0) {
      toast('还有 ' + unanswered + ' 题未作答');
      var f = QS.items.findIndex(function (q) { return QS.ans[q.id] == null; });
      if (f >= 0) { QS.idx = f; render(); }
      return;
    }
    var day = QS.day;
    QS = null;
    if (day === 3) { toast('押题完成！终极模拟已解锁'); location.hash = '#/day/3'; }
    else { toast('本节完成 ✓'); location.hash = '#/day/' + day; }
  }

  function startGate(g) {
    var st = gateState(g);
    st.started = true;
    st.startedAt = Date.now();
    saveState();
    QS = null;
    render();
  }
  function redoGate(g) {
    var st = gateState(g);
    st.ans = {};
    st.submitted = false;
    st.score = null;
    st.started = true;
    st.startedAt = Date.now();
    saveState();
    QS = null;
    location.hash = '#/gate/' + g;
  }
  function copyLink() {
    var url = location.href.split('#')[0];
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, function () { fallbackCopy(url); });
    } else { fallbackCopy(url); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('链接已复制'); } catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
  function resetAll() {
    if (!window.confirm('确定重置全部进度？此操作不可恢复。')) return;
    S = defaultState();
    saveState(); QS = null;
    location.hash = '#/';
    render();
    toast('已重置');
  }

  /* 长按标题：解锁全部（自用） */
  var pressTimer = null;
  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest && e.target.closest('#secret-title');
    if (!el) return;
    pressTimer = setTimeout(function () {
      if (window.confirm('解锁全部内容（自用调试）？')) {
        S.gateUnlocks.A = S.gateUnlocks.B = S.gateUnlocks.C = true;
        ['A', 'B', 'C'].forEach(function (g) { if (!S.gates[g]) S.gates[g] = { ans: {}, started: false, submitted: false, score: null }; });
        saveState();
        toast('已解锁全部内容');
        render();
      }
    }, 3000);
  });
  document.addEventListener('pointerup', function () { clearTimeout(pressTimer); });
  document.addEventListener('pointercancel', function () { clearTimeout(pressTimer); });

  /* ---------------- 启动 ---------------- */
  window.addEventListener('hashchange', render);
  if (!location.hash) location.hash = '#/';
  render();
})();

</script>
</body>
</html>
