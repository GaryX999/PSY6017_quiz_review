ure":9,"topic":"独生子女","difficulty":2,"stem":"按 **Falbo**（1982；Falbo & Polit, 1986）的研究，独生子女与有手足的儿童相比，下列哪项最符合 PPT？","options":["自尊与成就定向较高、更顺从、智力略高","自尊较低、学业表现明显较差","社交能力普遍较差、易与同伴冲突","智力显著低于有手足的儿童"],"answer":0,"option_notes":["研究发现独生子女自尊与成就定向较高、更顺从、智力略高，并可能建立良好同伴关系；正合题意。","结果与“自尊较低、学业较差”相反：独生子女的成就定向反而较高。","研究指独生子女可能与同伴建立良好关系，并非社交较差。","独生子女智力略高，不是显著低于有手足者。"],"explain":"独生子女研究（Falbo, 1982；Falbo & Polit, 1986）发现：自尊与成就定向较高、更顺从、智力能力略高、较可能建立良好同伴关系——独生子女未必处于劣势。","source":"L9 p.20","tags":["only child","Falbo","siblings"],"day":3,"type":"predict","stem_en":"According to **Falbo**’s research (1982; Falbo & Polit, 1986), how do only children generally compare with children who grow up with siblings on a range of outcomes? Which statement best matches the lecture?","options_en":["They have relatively higher self-esteem and achievement orientation, are more obedient and slightly more intellectually competent","They have lower self-esteem and clearly poorer academic performance","They are generally poorer at social skills and prone to conflict with peers","They are significantly less intelligent than children with siblings"]},{"id":"d3-032","lecture":2,"topic":"视觉发展","difficulty":2,"stem":"按 PPT 对婴儿视觉发展的描述，新生儿与 6 个月大婴儿的视敏度分别约为多少？","options":["两者都约为 20/20","20/50；20/20","20/200–20/400；20/100","20/100；20/200"],"answer":2,"option_notes":["20/20 是成人正常视敏度，新生儿远低于此，PPT 明列 20/200–20/400。","20/50 并非 PPT 给新生儿的数字；新生儿的视敏度差得多。","PPT：新生儿视敏度约 20/200–20/400，6 个月大时改善到 20/100；正合题意。","20/100 是 6 个月大婴儿的数字，不是新生儿的；顺序被颠倒。"],"explain":"视觉是婴儿最不成熟的感觉：对亮度敏感，2–3 个月辨色良好，但视敏度差——新生儿约 20/200 至 20/400，6 个月大时约 20/100，之后持续改善。","source":"L2 p.26","tags":["vision","visual acuity","infancy"],"day":3,"type":"predict","stem_en":"According to the lecture’s description of infant visual development, what are the approximate visual acuities of newborn babies at birth and of six-month-old infants, respectively, expressed in standard Snellen terms?","options_en":["Both are about 20/20","20/50; 20/20","20/200–20/400; 20/100","20/100; 20/200"]},{"id":"d3-033","lecture":1,"topic":"发展变化","difficulty":2,"stem":"某文化中“读书—工作—结婚—生子”被视为应在特定年龄完成的人生顺序，偏离者会被认为“不正常”。按 PPT，这套界定正常人生经历的年龄常模称为什么？","options":["**Normative history-graded change**","**Social clock**","**Nonnormative change**","**Cohort**"],"answer":1,"option_notes":["**Normative history-graded change** 是因特定历史时期影响同一世代的共同变化。","**Social clock**：一套界定文化中正常人生经历顺序的年龄常模，正合题意。","**Nonnormative change** 是独特、非共享事件造成的变化（如遗传差异、意外）。","**Cohort** 指出生于相近年份、共享相同历史经历的群体。"],"explain":"三种发展变化：normative age-graded（物种共有、与年龄相连，如爬行到走路）＋ social clock（文化中的年龄常模）；normative history-graded（因历史时期影响整个世代，如婴儿潮）；nonnormative（独特未共享事件）。","source":"L1 p.6","tags":["social clock","normative age-graded","cohort"],"day":3,"type":"predict","stem_en":"In one culture, “study—work—marry—have children” is seen as a life sequence to be completed at particular ages, and those who deviate are regarded as “abnormal”. According to the lecture, what is this set of age norms called?","options_en":["**Normative history-graded change**","**Social clock**","**Nonnormative change**","**Cohort**"]},{"id":"d3-034","lecture":8,"topic":"攻击稳定性","difficulty":2,"stem":"一项追踪研究发现：3–10 岁间被评定为高攻击的儿童，成年后因暴力犯罪被定罪的次数明显较多，男女皆然。这一结果最能说明？","options":["攻击行为只是暂时现象，与成年表现无关","攻击性完全由青少年期的同伴影响造成","攻击性只在男性身上稳定","攻击对许多人而言是稳定特质，可预测日后反社会行为"],"answer":3,"option_notes":["追踪结果显示童年攻击可预测成年犯罪，与“暂时现象”相反。","研究追踪的是童年特质与成年结果，不能归因于青少年同伴影响。","PPT 的图 13.1 显示男女童年攻击都可预测成年犯罪，不是只有男性。","具攻击性的幼儿易成为攻击性 5 岁儿童，3–10 岁攻击可预测日后攻击与反社会行为。正确。"],"explain":"攻击对许多人而言是稳定特质：具攻击性的幼儿较易成为攻击性 5 岁儿童，3–10 岁的攻击可预测日后的攻击与反社会行为，男女皆然（Huesmann 等追踪研究，图 13.1）。","source":"L8 p.10","tags":["aggression","stability","longitudinal"],"day":3,"type":"predict","stem_en":"A longitudinal study finds that children rated highly aggressive between ages 3 and 10 are convicted of violent crimes significantly more often in adulthood, for both males and females. What does this result best illustrate?","options_en":["Aggression is only a temporary phenomenon unrelated to adult outcomes","Aggression is entirely caused by peer influence in adolescence","Aggression is stable only in males","For many people aggression is a stable trait that predicts later antisocial behaviour"]},{"id":"d3-035","lecture":5,"topic":"照料者特征","difficulty":3,"stem":"“有能力且愿意与婴儿形成情感依恋”这一照料者特征，按 PPT 称为？","options":["**Emotional availability**","**Contingent responsiveness**","**Interactional synchrony**","**Contact comfort**"],"answer":0,"option_notes":["**Emotional availability**：照料者有能力且愿意与婴儿形成情感依恋，正合题意。","**Contingent responsiveness**：对儿童线索敏感并作出恰当回应，是另一项要件。","**Interactional synchrony**：婴儿与照料者之间同步、协调的互动常规。","**Contact comfort**：Harlow 研究中绒布妈妈提供的触觉舒适。"],"explain":"照料者的情感可得性（愿意并能够建立情感联结）与相倚回应（敏感、恰当回应线索）对安全依恋都必不可少；两者正是区分“敏感或不敏感照料”的核心。","source":"L5 p.31","tags":["emotional availability","contingent responsiveness","attachment"],"day":3,"type":"predict","stem_en":"A caregiver who is able and willing to form an emotional attachment with the infant is displaying which caregiver characteristic, according to the lecture? It is one of the two essentials for secure attachment.","options_en":["**Emotional availability**","**Contingent responsiveness**","**Interactional synchrony**","**Contact comfort**"]},{"id":"d3-036","lecture":7,"topic":"刻板印象发展","difficulty":2,"stem":"6 岁的乐乐坚决反对男生玩娃娃，认为“男生玩娃娃是错的，就像说谎一样不可以”；被问理由时他说不出，只说“就是不对”。按 PPT，这反映？","options":["8–9 岁儿童已能区分道德规则与性别角色标准","3–7 岁儿童把性别角色标准视为不可违背的规则","青春期的 **gender intensification**（性别强化）","**gender consistency** 尚未获得"],"answer":1,"option_notes":["8–9 岁才较灵活、能区分道德规则与性别标准；乐乐才 6 岁。","3–7 岁把性别角色标准当成如道德规则般不可违背，并夸大刻板印象以确认自己的性别；正合题意。","**Gender intensification** 是青春期的现象，与 6 岁儿童不符。","**gender consistency**（5–7 岁）指理解性别跨情境稳定，不是此处“视为规则”的重点。"],"explain":"性别角色刻板印象的发展：2–3 岁开始习得；3–7 岁把性别角色标准视为规则、夸大刻板印象；8–9 岁更灵活、能区分道德规则与性别标准；10–11 岁人格特质刻板印象接近成人。","source":"L7 p.19","tags":["gender stereotypes","gender-role standards"],"day":3,"type":"predict","stem_en":"Six-year-old Lele firmly opposes boys playing with dolls, saying “it’s wrong, like telling lies”; when asked why, he cannot explain and just says “it’s just wrong”. According to the lecture, what does this reflect?","options_en":["Children aged 8–9 can already distinguish moral rules from gender-role standards","Children aged 3–7 treat gender-role standards as rules that must not be violated","Adolescent **gender intensification**","**gender consistency** has not yet been achieved"]},{"id":"d3-037","lecture":3,"topic":"具体运算","difficulty":3,"stem":"老师说：“具体运算阶段的儿童能由具体观察得出一般原则，例如知道‘往一组玩具中再加一个，数量一定变多’；但他们仍不擅长什么？”","options":["**Inductive logic**（由具体到一般）","**Reversibility**（心理上逆转转换）","**Deductive logic**（由原则预测结果）","**Class inclusion**（类别包含）"],"answer":2,"option_notes":["**Inductive logic** 正是题干描述的“由特定观察得出一般结论”，是具体运算的强项。","**Reversibility** 是具体运算已获得的图式（泥肠搓回泥球），不是他们缺乏的能力。","**Deductive logic**：由一般原则预测具体结果；PPT 指出具体运算儿童仍不擅长演绎逻辑。正确。","**Class inclusion** 约 7–8 岁随具体运算发展而掌握，不是题干所指的弱项。"],"explain":"具体运算儿童善于处理可见、可想象或可操作的事物：能归纳（specific→general），但弱于演绎（principle→outcome），也不擅抽象观念与可能性——那是形式运算的发展任务。","source":"L3 p.21","tags":["concrete operations","inductive logic","deductive logic"],"day":3,"type":"predict","stem_en":"The teacher says: “Children in the **concrete-operational stage** can derive general principles from specific observations—for example, knowing that adding one more toy always makes the set larger. What are they still not good at?”","options_en":["**Inductive logic** (from specific to general)","**Reversibility** (mentally undoing a transformation)","**Deductive logic** (predicting outcomes from principles)","**Class inclusion**"]},{"id":"d3-038","lecture":2,"topic":"味觉嗅觉","difficulty":2,"stem":"关于婴儿味觉与嗅觉的发展，下列哪一项最符合 PPT 的说明？","options":["偏好咸味、喜欢强烈气味，无法分辨母亲","味觉出生时尚未发展，需到 6 个月才出现","味觉与嗅觉的发展完全由后天经验决定","偏好甜味、避开难闻气味，并能凭气味认出母亲"],"answer":3,"option_notes":["与 PPT 相反：婴儿偏好甜味、避开难闻气味，并能凭嗅觉认出母亲。","新生儿已能分辨基本味觉并偏好甜味（Steiner 研究），并非 6 个月才出现。","味觉与嗅觉有先天基础（偏好甜味），并非完全由后天经验决定。","PPT：婴儿偏好甜味而非酸苦咸，避开难闻气味，可凭嗅觉识别母亲；正合题意。"],"explain":"婴儿感官发展：视觉最不成熟、听觉较佳；味觉偏好甜味、避开酸苦咸；能避开难闻气味并凭气味认出母亲；触觉、温度与疼痛亦已敏感。","source":"L2 p.29","tags":["taste","smell","sensory development"],"day":3,"type":"predict","stem_en":"According to the lecture, which statement about the development of taste and smell in newborn babies and infancy is correct?","options_en":["Infants prefer salty tastes and strong odours and cannot recognise their mother","Taste is not developed at birth and only appears at about 6 months","Taste and smell are determined entirely by postnatal experience","Infants prefer sweet tastes, avoid unpleasant odours and can recognise their mother by smell"]},{"id":"d3-039","lecture":6,"topic":"同一性状态","difficulty":2,"stem":"中六的浩然即将毕业，却从未想过毕业后要做什么，也没探索过升学或就业，只说“随便啦，到时再算”。按 **Marcia**，他属于？","options":["**Identity diffusion**","**Identity foreclosure**","**Identity moratorium**","**Identity achievement**"],"answer":0,"option_notes":["**Diffusion**：尚未思考或解决同一性问题、缺乏方向与自我感，正合题意。","**Foreclosure**：已有承诺但来自外部影响、未经探索；浩然并未承诺任何方向。","**Moratorium**：正处危机、积极探索；浩然没有探索。","**Achievement**：经过探索后作出承诺；浩然两者皆缺。"],"explain":"Marcia 以“危机（探索）× 承诺”区分四态：diffusion＝未探索、未承诺；foreclosure＝未探索、已承诺（多来自父母等外部影响）；moratorium＝探索中、承诺低；achievement＝探索后承诺。","source":"L6 p.44","tags":["Marcia","identity diffusion","identity status"],"day":3,"type":"predict","stem_en":"Form 6 student Haoran is about to graduate but has never thought about what to do afterwards and has not explored further study or work; he just says, “whatever, I’ll decide later”. According to **Marcia**, which identity status is he in?","options_en":["**Identity diffusion**","**Identity foreclosure**","**Identity moratorium**","**Identity achievement**"]},{"id":"d3-040","lecture":8,"topic":"利他机制","difficulty":3,"stem":"按 PPT 的 **felt-responsibility hypothesis**，为什么共情性唤醒能促进利他行为？","options":["它使人感到罪疚，于是以攻击转移不安","它促使人反思社会责任规范、承担帮助受害者的个人责任","它降低生理唤醒，使人冷静评估得失","它使人因害怕惩罚而帮助他人"],"answer":1,"option_notes":["此假说强调责任与规范；罪疚出现在忽视责任时，并非以攻击转移不安。","**Felt-responsibility hypothesis**：共情唤醒使人反思社会规范、承担帮助受害者的责任，忽视则内疚。正确。","共情唤起是情绪唤醒，并非降低唤醒或计算得失。","害怕惩罚属前习俗的惩罚—服从取向，与此假说无关。"],"explain":"责任归因（felt-responsibility）假说：同情性共情唤起使儿童反思已习得的利他原则（如社会责任规范），进而承担帮助受害者的个人责任，若忽视责任会感到内疚；年长儿童已内化更多原则，故共情—利他关联更强。","source":"L8 p.33","tags":["felt-responsibility","empathy","altruism"],"day":3,"type":"predict","stem_en":"According to the **felt-responsibility hypothesis** presented in the lecture, why does sympathetic empathic arousal promote altruistic behaviour, and how does this process lead children to take responsibility for helping a victim?","options_en":["It makes people feel guilty and therefore displace their discomfort into aggression","It prompts people to reflect on social-responsibility norms and to take personal responsibility for helping the victim","It lowers physiological arousal so that people can calmly weigh costs and benefits","It makes people help others because they fear punishment"]},{"id":"d3-041","lecture":2,"topic":"性别决定","difficulty":3,"stem":"一名胎儿为 XY 染色体，但因罕见情况在受孕 4–8 周时未能分泌雄激素。按 PPT，其生殖器官发育最可能是？","options":["发育出男性生殖器官，因 **XY** 已决定","发育出睾丸与沃尔夫管，因 **SRY** 必先作用","发育出女性生殖器官，因无雄激素","性别无法确定，须等青春期"],"answer":2,"option_notes":["**XY** 只是染色体组合；若缺乏雄激素作用，男性生殖器不会发育。","**SRY** 的作用正是促使雄激素分泌；题干已说明未分泌雄激素，男性结构不会出现。","PPT：**SRY** 在受孕 4–8 周促使雄激素分泌；无论染色体如何，无雄激素便发育出女性生殖器。正确。","PPT 未把性别发育视为青春期才决定；外生殖器在胚胎期已分化。"],"explain":"性别决定链：Y 染色体上的 SRY → 睾丸 → 睾酮与 MIS；雄激素促使男性生殖器发育。若胚胎未暴露于雄激素，无论染色体状态如何都会发育出女性生殖器。","source":"L2 p.4","tags":["SRY","androgens","sex determination"],"day":3,"type":"predict","stem_en":"A fetus has XY chromosomes but, in a rare case, does not secrete androgens between 4 and 8 weeks after conception. According to the lecture, what is the most likely development of its reproductive organs?","options_en":["Male reproductive organs develop because **XY** has already determined sex","Testes and Wolffian ducts develop because **SRY** must act first","Female reproductive organs develop because there are no androgens","Sex cannot be determined and must wait until puberty"]},{"id":"d3-042","lecture":1,"topic":"自我报告","difficulty":2,"stem":"与自然观察相比，**structured interview/questionnaire**（结构化访谈／问卷）最主要的优势是？","options":["能避免社会赞许性偏差，答案必然真实","适用于无语言能力的婴儿","能确保行为在自然情境中发生","能在相同顺序下施测，收集大量可比较的资料"],"answer":3,"option_notes":["社会赞许性正是自我报告的局限之一：受访者可能为符合期望而低报或高报。","无语言能力的婴儿无法作答，这正是自然观察较适用的对象。","自然情境中的行为是自然观察的特点，自我报告并不确保。","PPT：自我报告可收集大量资料、保密性提升准确性、且所有参与者按相同顺序回答相同问题以便比较。正确。"],"explain":"自我报告（结构化访谈／问卷）优势：资料量大、保密可提高准确性、回答可比较；局限：阅读理解能力、诚实与准确性、社会赞许性、对问题理解不同。自然观察则便于婴儿、展现日常生活行为。","source":"L1 p.8","tags":["self-report","questionnaire","research methods"],"day":3,"type":"predict","stem_en":"Compared with **naturalistic observation**, what is the main advantage of the **structured interview/questionnaire** in terms of data collection and the comparability of participants’ responses, according to the lecture on research methods?","options_en":["It can avoid social-desirability bias, so answers are always truthful","It is suitable for infants who have no language ability","It ensures that behaviour occurs in natural settings","It asks all participants the same questions in the same order, gathering large amounts of comparable data"]},{"id":"d3-043","lecture":4,"topic":"先天论证据","difficulty":3,"stem":"下列哪一组现象最常被用来支持语言发展的 **nativist** 视角？","options":["跨文化里程碑年龄一致；物种特异性；左脑语言中枢","儿向语与扩展、重述能加快语法习得","父母肯定真实但不合语法的话，却纠正合语法但不真实的话","模仿与强化能有效塑造地区口音"],"answer":0,"option_notes":["语言普遍性（跨文化里程碑同龄）、物种特异性、左半球语言区特化与敏感期，是 PPT 支持先天论的四大证据。","儿向语与扩展、重塑属互动论视角的环境支持，非先天论证据。","父母肯定语义真实而不合语法的句子，是用来说明儿童并非靠强化习得句法，属对学习视角的批评。","模仿与强化能塑造地区口音，是学习视角成立的证据，反而削弱先天论。"],"explain":"先天论证据：语言普遍性（各文化儿童里程碑年龄相近）、物种特异性（唯人类自发形成规则语言）、大脑左半球语言区特化（Broca 管产出、Wernicke 管理解）、敏感期假说。","source":"L4 p.22","tags":["nativist","language universals","LAD"],"day":3,"type":"predict","stem_en":"Which set of phenomena is most often cited as evidence to support the **nativist** perspective on language development in young children, according to the lecture on language acquisition and its theories?","options_en":["Cross-cultural milestones at similar ages; species specificity; left-hemisphere language centres","Child-directed speech, expansions and recasts speed up grammar acquisition","Parents approve truthful but ungrammatical utterances while correcting grammatical but untrue ones","Imitation and reinforcement effectively shape regional accents"]},{"id":"d3-044","lecture":3,"topic":"去中心化","difficulty":2,"stem":"老师把一块海绵涂成石头的样子。6 岁的小美拿起它前先捏一捏，说：“看起来像石头，其实是海绵。”按 **Piaget**，她运用了具体运算的哪一图式？","options":["**Centration**（集中化）","**Decentration**（去中心化）","**Animism**（泛灵论）","**Horizontal décalage**（水平滞差）"],"answer":1,"option_notes":["**Centration** 是前运算阶段只从单一维度思考（只凭外观就判定是石头）。","**Decentration**：同时考虑多个变量（外观 vs 实质），故能判断“看起来像石头，其实是海绵”。正确。","**Animism** 是把生命赋予无生命物，与外观／实质区分无关。","**Horizontal décalage** 指同一图式在不同任务上逐步获得，不是这个判断所用的图式。"],"explain":"具体运算的两个关键图式：conservation（外观变而量不变）与 decentration（同时考虑多个变量，如涂成石头的海绵）。约 6 岁儿童开始理解外观可能具有欺骗性。","source":"L3 p.20","tags":["decentration","concrete operations","appearance-reality"],"day":3,"type":"predict","stem_en":"A teacher paints a sponge to look like a stone. Before picking it up, six-year-old Xiaomei squeezes it and says, “It looks like a stone, but it is actually a sponge.” According to **Piaget**, which concrete-operational scheme is she using?","options_en":["**Centration**","**Decentration**","**Animism**","**Horizontal décalage**"]},{"id":"d3-045","lecture":9,"topic":"生态系统","difficulty":2,"stem":"研究者记录青少年在青春期出现的认知与生理变化，以及家庭与学校系统随时间发生的改变，并分析这些变化如何影响发展方向。按 **Bronfenbrenner**，这属于哪一层次？","options":["**Microsystem**","**Mesosystem**","**Chronosystem**","**Macrosystem**"],"answer":2,"option_notes":["**Microsystem** 是儿童直接参与的活动与互动（家庭、玩伴）。","**Mesosystem** 是微系统之间的联系（家庭—学校），属共时的结构。","**Chronosystem**：儿童或其他系统随时间的变化（如青春期的认知与生理改变）会影响发展方向。正确。","**Macrosystem** 是文化、亚文化与社会阶层背景，不是时间维度。"],"explain":"生态系统论五层：micro（直接环境）、meso（微系统间联系）、exo（儿童不参与但影响他的情境）、macro（文化与社会阶层）、chrono（儿童或系统随时间的变化）。chrono 专门处理“时间”维度。","source":"L9 p.4","tags":["Bronfenbrenner","chronosystem","ecological systems"],"day":3,"type":"predict","stem_en":"A researcher records adolescents’ cognitive and biological changes during puberty, along with changes in family and school systems over time, and analyses how these changes affect the direction of development. According to **Bronfenbrenner**, which level is this?","options_en":["**Microsystem**","**Mesosystem**","**Chronosystem**","**Macrosystem**"]},{"id":"d3-046","lecture":7,"topic":"自我实现预言","difficulty":2,"stem":"研究者对某中学全体学生做智力测验，却随机告诉教师“这几位学生智商很高”（实际与其他学生无差别）。一年后这些学生成绩明显进步。该现象最符合？","options":["**Gender intensification**（性别强化）","**Social roles hypothesis**（社会角色假设）","**Gender segregation**（性别隔离）","**Self-fulfilling prophecy**（自我实现预言）"],"answer":3,"option_notes":["**Gender intensification** 指青春期性别刻板印象与对跨性别举止的排斥强化，与此实验无关。","**Social roles hypothesis**：性别心理差异源于文化分配角色与社教化，属进化理论的批评，非此实验。","**Gender segregation** 指偏好同性玩伴的现象，题干未涉及玩伴选择。","**Self-fulfilling prophecy**：教师预期改变投入（情感、教材、反馈与课堂机会），使学生真的进步。正确。"],"explain":"Rosenthal & Jacobson（1968）的自我实现预言：教师被告知某些学生“高智商”后，给予更多情感投入、教材、反馈与课堂机会，这些学生真的进步；刻板印象因而助长能力上的性别差异。","source":"L7 p.12","tags":["self-fulfilling prophecy","Rosenthal & Jacobson","stereotype"],"day":3,"type":"predict","stem_en":"Researchers give all students in a secondary school an intelligence test but randomly tell teachers that several pupils have very high IQs (in fact they do not differ from others). A year later these pupils improve markedly. Which phenomenon does this best illustrate?","options_en":["**Gender intensification**","**Social roles hypothesis**","**Gender segregation**","**Self-fulfilling prophecy**"]},{"id":"d3-047","lecture":5,"topic":"情绪理解","difficulty":2,"stem":"按 PPT，儿童能理解“同一个人可以同时拥有多种情绪”，大约在几岁？","options":["3–4 岁","6–9 岁","4–5 岁","10–12 岁"],"answer":1,"option_notes":["3–4 岁的重点在情绪自我调节与开始掩饰真实情绪，还不是同时多种情绪。","PPT：6–9 岁儿童能理解人可以同时拥有多种情绪。正确。","4–5 岁能从身体动作推断他人情绪；理解同时多种情绪更晚。","10 岁以后已超过该里程碑；PPT 未把它列为青春期的任务。"],"explain":"情绪理解随年龄精细化：4–5 岁由身体动作推断情绪；8 岁理解同一情境可引发不同情绪；6–9 岁理解人可同时拥有多种情绪。","source":"L5 p.11","tags":["emotion understanding","emotional development"],"day":3,"type":"predict","stem_en":"According to the lecture, at about what age can children understand that one person may experience several different emotions at the same time, for example feeling both happy and worried?","options_en":["3–4 years","6–9 years","4–5 years","10–12 years"]},{"id":"d3-048","lecture":7,"topic":"社会学习","difficulty":3,"stem":"4 岁的男孩看到爸爸做饭、妈妈修水管。若按 **social-learning** 理论的观察学习机制，下列哪项最能预测他会不会模仿？","options":["行为被贴上“男孩的”还是“女孩的”标签","示范者是否与自己同性","他是否已获得 **gender consistency**","他的 **gender schema** 是否已完全形成"],"answer":0,"option_notes":["PPT 明确：与行为挂钩的标签（“男孩的”与否）比示范者的性别更重要；正合题意。","社会学习理论指出，标签比示范者本人的性别更重要，故示范者性别并非关键。","**gender consistency** 属 Kohlberg 认知发展理论，社会学习理论不以此解释模仿。","**Gender schema** 属 Martin & Halverson 理论，强调图式处理信息，非社会学习的预测因子。"],"explain":"社会学习理论用直接教导（对性别合宜行为奖惩）与观察学习解释性别角色化：儿童模仿的是“被标为适合自己性别的行为”，标签比示范者性别更关键；5–7 岁后同性榜样才更重要。","source":"L7 p.33","tags":["social-learning theory","gender typing","modeling"],"day":3,"type":"predict","stem_en":"A four-year-old boy sees his father cooking and his mother repairing a pipe at home. According to the observational-learning mechanism of **social-learning** theory, which factor best predicts whether he will imitate?","options_en":["Whether the behaviour is labelled as “for boys” or “for girls”","Whether the model is of the same sex as the child","Whether he has already achieved **gender consistency**","Whether his **gender schema** has been fully formed"]},{"id":"d3-049","lecture":9,"topic":"同伴接纳","difficulty":3,"stem":"按 PPT，下列哪一组是**促进**儿童在同伴中被接纳／喜欢的因素，且最完整正确？","options":["身体虚弱、角色采择差、专制型父母、排行靠前","只有学业成绩，教养方式与排行位置无关","攻击性越强越受欢迎，与角色采择无关","运动型体格、成熟的角色采择、权威型父母、排行靠后"],"answer":3,"option_notes":["这些都与促进接纳的因素相反：身体弱、角色采择差、专制型父母、排行靠前都不利。","教养方式与出生顺序都列在影响因素中，并非只有学业成绩。","PPT 指出人际技能（冷静、外向、合作）才是最重要因素，不是攻击性。","PPT：运动型体格（男孩）、角色采择成熟、IQ 与学业、权威型父母、排行靠后较受欢迎。正确。"],"explain":"影响同伴接纳的因素：身体特征（男孩运动型体格、早熟）、认知技能（角色采择、IQ/学业）、教养方式（权威型→被喜爱；专制与放任型→不被喜欢）、出生顺序（晚生更受欢迎），其中人际技能最重要。","source":"L9 p.35","tags":["peer acceptance","parenting","birth order"],"day":3,"type":"predict","stem_en":"According to the lecture, which of the following is the most complete and correct set of factors that **promote** children's acceptance and liking by their peers?","options_en":["Physical weakness, poor role-taking, authoritarian parents, early-born position","Only academic achievement; parenting style and birth order are unrelated","The more aggressive, the more popular; role-taking is unrelated","Athletic build, mature role-taking, authoritative parents, later-born position"]},{"id":"d3-050","lecture":4,"topic":"元语言意识","difficulty":3,"stem":"老师问：“说 mice 时把 /m/ 拿掉，剩什么？”又请学生把“火车站”去掉“站”。能完成这类任务，主要显示哪种能力？","options":["**Fast-mapping**","**Syntactical bootstrapping**","**Phonological awareness**（语音意识）","**Telegraphic speech**"],"answer":2,"option_notes":["**Fast-mapping** 是快速学会新词词义，与拆解语音单位无关。","**Syntactical bootstrapping** 是从句法结构推断词义，不是操作语音。","**Phonological awareness** 属元语言意识：能操作语音单位（去掉 /m/），与阅读成绩相关。正确。","**Telegraphic speech** 是电报句（省略虚词的早期句子），与本任务无关。"],"explain":"元语言意识（metalinguistic awareness）是对语言及其属性的认知：语音意识（去掉 /m/ 说 mice→ice）与词法意识都与阅读成绩相关；童年中期随语言学习显著提升。","source":"L4 p.51","tags":["metalinguistic awareness","phonological awareness","reading"],"day":3,"type":"predict","stem_en":"The teacher asks: “Say ‘mice’ without the /m/—what is left?” and then asks pupils to remove “站” from “火车站” (railway station). What metalinguistic ability does completing such tasks mainly demonstrate in young learners?","options_en":["**Fast-mapping**","**Syntactical bootstrapping**","**Phonological awareness**","**Telegraphic speech**"]}],"gates":{"A":[{"id":"gA-01","gate":"A","lecture":1,"topic":"Philosophical views","difficulty":2,"stem":"A 17th-century English philosopher claimed that humans possess no innate tendencies and that all differences among people are attributable to experience. This view is known as:","options":["**Original sin** (Augustine)","**The blank slate** (Locke)","**Innate goodness** (Rousseau)","**Maturation** (Gesell)"],"answer":1,"explain":"**The blank slate**（白板说，又称 **tabula rasa**）由 **Locke** 提出：心灵如白板、无先天倾向、一切差异来自经验。**Original sin** 是 **Augustine** 的原罪说；**innate goodness** 是 **Rousseau** 的性善说；**Gesell** 的 **maturation** 强调基因编程，不属这一哲学观点。","source":"L1 p.2","stem_zh":"17 世纪一位英国哲学家主张人没有先天倾向、人与人之间的所有差异都来自经验。这种观点称为什么？","options_zh":["**原罪说**（奥古斯丁）","**白板说**（洛克）","**性善说**（卢梭）","**成熟**（格塞尔）"]},{"id":"gA-02","gate":"A","lecture":1,"topic":"Measurement quality","difficulty":2,"stem":"A new observation schedule produces the same scores when the same children are retested two weeks later, and two coders scoring the same videos also agree. Which measurement quality does this best demonstrate?","options":["**Validity**","**Objectivity**","**Replicability**","**Reliability**"],"answer":3,"explain":"**Reliability**（信度）包含跨时间的 **test-retest** 一致性与跨观察者的 **inter-rater** 一致性；**validity** 指测到本意要测的内容；**objectivity** 是所有人检视同一数据得同一结论；**replicability** 指方法每次使用都得同样数据与结论。题干同时给出重测与评分者一致，故为信度。","source":"L1 p.7","stem_zh":"同一份新观察量表在两周后对同一批儿童重测得到相同分数，两位编码者对同一批视频的评分也一致。这最能说明哪项测量质量？","options_zh":["**有效性**","**客观性**","**可重复性**","**可靠性**"]},{"id":"gA-03","gate":"A","lecture":1,"topic":"Research design","difficulty":2,"stem":"To examine age differences in generosity, a researcher tests 5-, 8-, and 11-year-olds from the same school during a single month. Which research design is this?","options":["**Cross-sectional design**","**Longitudinal design**","**Sequential design**","**Naturalistic observation**"],"answer":0,"explain":"**Cross-sectional design**（横断设计）在同一时间点比较不同年龄组；**longitudinal** 追踪同一批人，**sequential** 对多个世代群体长期追踪；横断设计的主要威胁是 **cohort effects**（世代效应）。**Naturalistic observation** 是资料收集方法而非发展研究设计。","source":"L1 p.12","stem_zh":"为了考察慷慨行为随年龄的差异，研究者在同一个月内测试同一所学校的 5 岁、8 岁与 11 岁儿童。这是什么研究设计？","options_zh":["**横断设计**","**纵向设计**","**序列设计**","**自然观察**"]},{"id":"gA-04","gate":"A","lecture":2,"topic":"Sex determination","difficulty":2,"stem":"In prenatal sexual differentiation, what happens to an embryo that is not exposed to androgens?","options":["It develops male genitalia if it carries a Y chromosome.","It develops male genitalia only if androgens are given later in childhood.","It develops female genitalia regardless of its chromosomal sex.","It develops testes together with male external genitalia."],"answer":2,"explain":"受孕后 4–8 周，Y 染色体上的 **SRY gene** 促使男性胚胎分泌 **androgens**；若无 **androgens**，无论胚胎的染色体状态如何都会发育女性生殖器官。选项 A 误以为 Y 染色体本身直接决定生殖器，B、D 与 PPT 描述不符。","source":"L2 p.4","stem_zh":"在产前性别分化中，未暴露于雄激素的胚胎会如何发育？","options_zh":["若带有 Y 染色体，就发育出男性生殖器官。","只有在童年后期补充雄激素时，才发育男性生殖器官。","无论染色体性别如何，都发育出女性生殖器官。","发育出睾丸以及男性外生殖器官。"]},{"id":"gA-05","gate":"A","lecture":2,"topic":"Genotype and phenotype","difficulty":2,"stem":"A child carries one dominant and one recessive gene for a trait, and only the dominant trait appears in the phenotype. For this trait the child is:","options":["**Homozygous dominant**","**Heterozygous**","**Homozygous recessive**","**Polygenic**"],"answer":1,"explain":"**Heterozygous**（杂合）指一对染色体上携带一个显性、一个隐性基因；**homozygous** 是两个显性或两个隐性基因；**polygenic inheritance** 指多个基因共同影响一个性状。单个显性基因即可在表现型中呈现该性状。","source":"L2 p.6","stem_zh":"一名儿童某性状带有一个显性基因和一个隐性基因，表现型中只出现显性性状。就这个性状而言，该儿童属于：","options_zh":["**显性纯合**","**杂合**","**隐性纯合**","**多基因遗传**"]},{"id":"gA-06","gate":"A","lecture":2,"topic":"Sensorimotor substages","difficulty":3,"stem":"A 6-month-old repeatedly shakes a rattle to hear the sound and drops toys to watch them fall, but makes no attempt to search for a toy that has been completely covered by a cloth. Which of Piaget's sensorimotor substages is this?","options":["**Secondary circular reactions** (4–8 months)","**Primary circular reactions** (1–4 months)","**Coordination of secondary schemes** (8–12 months)","**Tertiary circular reactions** (12–18 months)"],"answer":0,"explain":"4–8 个月为 **secondary circular reactions**：重复能产生环境效果的动作，焦点从自身转向外部；会找部分遮盖物，完全遮盖就不找。完全遮盖仍会寻找属 8–12 个月的 **coordination of secondary schemes**；**primary circular reactions** 以自身身体为中心；**tertiary circular reactions** 才开始主动尝试变化。","source":"L2 p.33","stem_zh":"一名 6 个月大的婴儿反复摇动摇铃以听声音，并把玩具丢下观察其落下，但对被布完全遮住的玩具不会尝试寻找。这是 **Piaget** 感知运动阶段的哪个亚阶段？","options_zh":["**次级循环反应**（4–8 个月）","**初级循环反应**（1–4 个月）","**次级图式的协调**（8–12 个月）","**三级循环反应**（12–18 个月）"]},{"id":"gA-07","gate":"A","lecture":3,"topic":"Preoperational thought","difficulty":3,"stem":"A 4-year-old insists that the tall narrow glass holds more juice than the short wide glass, even after watching the same juice being poured. Which preoperational limitation most directly explains this?","options":["**Animism**","**Egocentrism**","Lack of **object permanence**","**Centration**"],"answer":3,"explain":"**Centration**（集中化）指一次只考虑一个维度：儿童只看高度而忽略宽度，因此无法完成 **conservation**（守恒）任务。**Animism** 是赋予无生命物体生命属性；**egocentrism** 是难以采纳他人视角；**object permanence** 在感知运动期已发展。","source":"L3 p.16","stem_zh":"一名 4 岁儿童坚持认为高瘦杯子里的果汁比矮宽杯子多，即使亲眼看着同样的果汁被倒入。前运算阶段的哪种局限最能解释这一现象？","options_zh":["**泛灵论**","**自我中心**","缺乏**客体永久性**","**集中化**"]},{"id":"gA-08","gate":"A","lecture":3,"topic":"Theory of mind","difficulty":2,"stem":"Which accomplishment is the key milestone of theory of mind, typically developing between 3 and 5 years of age?","options":["**Object permanence**","**Conservation** of liquid","**False-belief understanding**","**Stranger anxiety**"],"answer":2,"explain":"**Theory of mind**（心理理论）的关键里程碑是 **false-belief understanding**（糖果盒实验），约 3–5 岁出现，其缺失与 **autism** 有关，且需要达到一定语言能力阈值。**Object permanence** 属感知运动期，**conservation** 属具体运算期，**stranger anxiety** 属依恋发展主题。","source":"L3 p.19","stem_zh":"哪种能力是心理理论的关键里程碑，通常在 3 至 5 岁之间发展出来？","options_zh":["**客体永久性**","液体的**守恒**","**错误信念理解**","**陌生人焦虑**"]},{"id":"gA-09","gate":"A","lecture":3,"topic":"Vygotsky","difficulty":3,"stem":"A student solves 8 + 5 alone but needs hints and prompts to solve 15 + 7. For Vygotsky, the gap between what the student can do alone and what the student can do with guidance is the:","options":["**Scaffolding**","**Zone of proximal development**","**Horizontal décalage**","**Equilibration**"],"answer":1,"explain":"**Zone of proximal development (ZPD)** 是独立能完成的水平与在指导下可达到的水平之间的差距；**scaffolding** 是在 ZPD 内按学习者能力上限量身提供的支持；**horizontal décalage** 是具体运算技能逐步获得的现象；**equilibration** 是同化与顺应之间的平衡化过程。","source":"L3 p.35","stem_zh":"一名学生独自能解出 8 + 5，却需要提示与引导才能解出 15 + 7。按 **Vygotsky** 的观点，学生独立能做到与在引导下能做到之间的差距是：","options_zh":["**支架**","**最近发展区**","**水平滞差**","**平衡化**"]},{"id":"gA-10","gate":"A","lecture":4,"topic":"Language components","difficulty":2,"stem":"What is the basic unit of sound that can distinguish meaning in a spoken language called?","options":["**Morpheme**","**Syllable**","**Phoneme**","**Lexicon**"],"answer":2,"explain":"**Phonology**（音系学）研究语言的声音系统，基本单位是 **phoneme**（音位）；**morpheme** 是最小意义单位（属 **morphology**）；**lexicon** 是一个人理解的全部词汇。拼音文字用音位，汉语用音节。","source":"L4 p.6","stem_zh":"在口语中，能够区分意义的声音的基本单位叫什么？","options_zh":["**语素**","**音节**","**音位**","**词汇库**"]},{"id":"gA-11","gate":"A","lecture":4,"topic":"Nativist theory","difficulty":2,"stem":"Chomsky proposed that children are born with a language acquisition device (LAD) that is activated by verbal input and contains:","options":["**Universal grammar**","**Child-directed speech**","**Metalinguistic awareness**","**Recast** utterances"],"answer":0,"explain":"**LAD**（**Chomsky**, 1959/1968）由言语输入激活，内含 **universal grammar**；**LMC**（**Slobin**, 1985）是一套专门用于语言学习的认知与知觉能力。**Child-directed speech** 与 **recast** 属互动论视角，**metalinguistic awareness** 属童年中期的语言发展。","source":"L4 p.20","stem_zh":"**Chomsky** 提出儿童天生具有语言获得装置（LAD），它由言语输入激活，并包含：","options_zh":["**普遍语法**","**儿童指向言语**","**元语言意识**","**重塑**的话语"]},{"id":"gA-12","gate":"A","lecture":4,"topic":"Word learning","difficulty":3,"stem":"A 14-month-old hears an adult call a novel colour 'celadon' while choosing between two blocks, and a week later correctly picks out that colour. This rapid learning of a word after only a few exposures is called:","options":["**Overextension**","**Underextension**","**Overregularization**","**Fast-mapping**"],"answer":3,"explain":"**Fast-mapping**（快速映射）指听过某一词被使用几次后迅速掌握，约 13–15 个月出现；**overextension** 是词义过度扩大（用‘猫’指所有毛茸茸动物）；**underextension** 是词义范围过窄；**overregularization** 是把规则过度套用到不规则形式（mouses）。","source":"L4 p.42","stem_zh":"一名 14 个月大的婴儿在两块积木之间做选择时，听到成人把一种新颜色称作“青瓷色”；一周后他能正确挑出该颜色。这种只接触几次就迅速学会一个词的现象称为：","options_zh":["**过度扩展**","**扩展不足**","**过度规则化**","**快速映射**"]},{"id":"gA-13","gate":"A","lecture":5,"topic":"Temperament","difficulty":2,"stem":"According to Thomas and Chess, which temperament type shows a negative mood, irregular biological rhythms, slow adaptation, and intense reactions?","options":["**Easy** temperament","**Difficult** temperament","**Slow-to-warm-up** temperament","**Other** (unclassified) temperament"],"answer":1,"explain":"**Difficult**（困难型）约占 10%：心境消极、身体节律不规律、难以适应、反应强烈；**easy**（40%）心境积极、节律规律、适应良好；**slow-to-warm-up**（15%）活动水平低、对新异事物退缩；**other** 约占 35%。","source":"L5 p.13","stem_zh":"按 **Thomas** 与 **Chess** 的分类，哪种气质类型表现为心境消极、生理节律不规律、适应缓慢、反应强烈？","options_zh":["**容易型**气质","**困难型**气质","**慢热型**气质","**其他型**（无法归类）气质"]},{"id":"gA-14","gate":"A","lecture":5,"topic":"Harlow's studies","difficulty":2,"stem":"What did Harlow's studies with wire and cloth surrogate mothers mainly show?","options":["**Contact comfort** matters more than feeding for attachment.","Feeding is the primary basis of attachment, as learning theory claims.","**Object permanence** must develop before attachment can form.","Attachment is a one-way bond from the infant to the caregiver."],"answer":0,"explain":"**Harlow** 发现幼猴更依恋提供 **contact comfort** 的绒布妈妈而非供奶的铁丝妈妈，说明建立强烈情感联结的能力是天生的、具生存价值。精神分析与学习理论才强调喂养；**object permanence** 属认知发展理论对依恋的解释，而依恋是双向关系而非单向。","source":"L5 p.23","stem_zh":"**Harlow** 用铁丝妈妈与绒布妈妈进行的幼猴研究主要说明了什么？","options_zh":["对依恋而言，**接触安慰**比喂养更重要。","正如学习理论所主张的，喂养是依恋的首要基础。","依恋形成之前必须先发展出**客体永久性**。","依恋只是婴儿对照顾者的单向联结。"]},{"id":"gA-15","gate":"A","lecture":5,"topic":"Attachment types","difficulty":3,"stem":"In Ainsworth's Strange Situation, an infant explores very little, is extremely distressed at separation, and at reunion both seeks closeness and resists physical contact. This pattern is classified as:","options":["**Secure attachment**","**Avoidant attachment**","**Resistant (ambivalent) attachment**","**Disorganized/disoriented attachment**"],"answer":2,"explain":"**Resistant**（抗拒／矛盾型，约 10%）表现为分离时极度痛苦、重聚时既想亲近又抗拒身体接触；**secure**（65%）重聚热情迎接并寻求安慰；**avoidant**（20%）分离少痛苦、重聚忽视母亲；**disorganized**（5%）在接近与回避之间困惑。","source":"L5 p.27","stem_zh":"在 **Ainsworth** 的陌生情境实验中，一名婴儿很少探索，分离时极度痛苦，重聚时既想亲近又抗拒身体接触。这种模式属于：","options_zh":["**安全型依恋**","**回避型依恋**","**抗拒型（矛盾型）依恋**","**混乱/迷惘型依恋**"]},{"id":"gA-16","gate":"A","lecture":6,"topic":"Self-recognition","difficulty":2,"stem":"In the rouge (mirror) test, most infants first recognize the mirror image as themselves at about:","options":["2–3 months","5 months","12 months","18–24 months"],"answer":3,"explain":"多数婴儿在 18–24 个月通过 **rouge test**（红点测验）认出镜中人是自己；2 个月只有有限的个人能动感，5 个月把自我识别为熟悉对象。2–3 岁的自我局限于 **present self**，4–5 岁才发展出 **extended self**。","source":"L6 p.5","stem_zh":"在红点（镜像）测验中，多数婴儿最早在多大时能认出镜中影像是自己？","options_zh":["2–3 个月","5 个月","12 个月","18–24 个月"]},{"id":"gA-17","gate":"A","lecture":6,"topic":"Learned helplessness","difficulty":3,"stem":"In Dweck's theory, a learned-helplessness orientation is characterized by attributing failure to:","options":["unstable, external causes such as bad luck","stable, internal causes such as lack of ability","unstable, internal causes such as insufficient effort","stable, external causes such as task difficulty"],"answer":1,"explain":"**Learned helplessness** 定向把失败归因于稳定、内部因素（能力不足），因此停止尝试且倾向长期持续；**mastery-oriented** 儿童把成功归因于能力、把失败外化或归因于不稳定的努力不足，失败后坚持并加倍努力。**Weiner** 的稳定／不稳定、内部／外部两维度是判断关键。","source":"L6 p.38","stem_zh":"在 **Dweck** 的理论中，习得性无助取向的特征是把失败归因于：","options_zh":["不稳定、外部的原因，如运气不好","稳定、内部的原因，如能力不足","不稳定、内部的原因，如努力不够","稳定、外部的原因，如任务难度"]},{"id":"gA-18","gate":"A","lecture":6,"topic":"Identity statuses","difficulty":2,"stem":"In Marcia's identity framework, an adolescent who has made a commitment without ever experiencing a crisis, usually by adopting parental expectations, is in:","options":["**Identity foreclosure**","**Identity diffusion**","**Identity moratorium**","**Identity achievement**"],"answer":0,"explain":"**Foreclosure**（早闭）是有承诺但未经历危机，承诺多源自父母、权威或媒体（如乔伊斯遵从父母放弃舞蹈进医学院）；**diffusion** 未探索也无承诺；**moratorium** 正在危机中积极探索、承诺低；**achievement** 经历危机后形成自己的承诺。","source":"L6 p.45","stem_zh":"在 **Marcia** 的同一性框架中，一名青少年已作出承诺却从未经历危机，通常是采纳了父母的期望。他处于：","options_zh":["**同一性早闭**","**同一性混乱**","**同一性延缓**","**同一性达成**"]},{"id":"gA-19","gate":"A","lecture":7,"topic":"Gender concept","difficulty":2,"stem":"By what age do most children accurately label themselves as a boy or a girl?","options":["4 months","12 months","2½–3 years","5–7 years"],"answer":2,"explain":"性别概念里程碑：4 个月能把男女声音与面孔匹配；1 岁末可可靠区分男女静态照片；2½–3 岁能准确把自己标为男孩／女孩；5–7 岁才理解性别是永久特征（**gender consistency**）。","source":"L7 p.17","stem_zh":"多数儿童到几岁能准确把自己标为男孩或女孩？","options_zh":["4 个月","12 个月","2½–3 岁","5–7 岁"]},{"id":"gA-20","gate":"A","lecture":7,"topic":"Kohlberg gender theory","difficulty":3,"stem":"According to Kohlberg's cognitive-developmental theory, what is the correct order of the three gender concepts?","options":["**Gender stability** → **gender identity** → **gender consistency**","**Gender identity** → **gender stability** → **gender consistency**","**Gender consistency** → **gender identity** → **gender stability**","**Gender identity** → **gender consistency** → **gender stability**"],"answer":1,"explain":"**Kohlberg** 的顺序是 **gender identity**（3 岁前能给自己贴男孩／女孩标签）→ **gender stability**（认为性别随时间不变）→ **gender consistency**（5–7 岁跨情境不变）；获得恒常性后儿童主动寻找同性榜样。错序的两个选项把稳定性和恒常性互换了位置。","source":"L7 p.34","stem_zh":"按 **Kohlberg** 的认知发展理论，三种性别概念的正确顺序是？","options_zh":["**性别稳定性**→**性别同一性**→**性别一致性**","**性别同一性**→**性别稳定性**→**性别一致性**","**性别一致性**→**性别同一性**→**性别稳定性**","**性别同一性**→**性别一致性**→**性别稳定性**"]},{"id":"gA-21","gate":"A","lecture":8,"topic":"Aggression types","difficulty":2,"stem":"A boy pushes a classmate and takes the toy the classmate was holding. This is best classified as:","options":["**Hostile aggression**","**Relational aggression**","**Verbal aggression**","**Instrumental aggression**"],"answer":3,"explain":"**Instrumental aggression** 把伤害他人当作达成另一目的的手段（抢玩具）；**hostile aggression** 的目标就是伤害受害者；**relational aggression** 用社交排斥、恶意八卦破坏同伴关系；**verbal aggression** 用威胁、辱骂、敌意戏弄。界定攻击看行为者意图而非后果。","source":"L8 p.3","stem_zh":"一名男孩推倒同学，并抢走同学手里的玩具。这最应归类为：","options_zh":["**敌意性攻击**","**关系攻击**","**言语攻击**","**工具性攻击**"]},{"id":"gA-22","gate":"A","lecture":8,"topic":"Piaget moral stages","difficulty":3,"stem":"According to Piaget, children in the heteronomous morality stage judge a misdeed mainly by:","options":["its objective consequences","the actor's intentions","whether the act was rewarded","whether the rules could be changed by agreement"],"answer":0,"explain":"**Heteronomous morality**（他律道德，5–10 岁）依据客观后果判断、绝对服从权威、认为规则不可更改、赞成赎罪式惩罚；**autonomous morality**（10–11 岁后）才看意图、视规则为可协商的约定。故他律儿童会判打碎 15 只杯的约翰更淘气。","source":"L8 p.40","stem_zh":"按 **Piaget** 的理论，处于他律道德阶段的儿童主要依据什么判断过失？","options_zh":["行为的客观后果","行为者的意图","行为是否得到奖励","规则能否经协商改变"]},{"id":"gA-23","gate":"A","lecture":8,"topic":"Discipline strategies","difficulty":2,"stem":"Which discipline strategy is recommended because it explains why a behaviour is wrong, emphasizes its effects on other people, and suggests how to make amends?","options":["**Love withdrawal**","**Power assertion**","**Induction**","**Expiatory punishment**"],"answer":2,"explain":"**Induction**（引导说理）解释行为为何错、强调对他人的影响，并提示如何弥补，最能促进道德内化；**love withdrawal**（收回关爱）与 **power assertion**（权力压制）都不推荐；**expiatory punishment** 是为惩罚而惩罚，属他律道德特征。","source":"L8 p.63","stem_zh":"哪种管教策略因能解释行为为何错误、强调其对他人的影响，并提示如何弥补而被推荐？","options_zh":["**爱的收回**","**权力主张**","**引导**","**赎罪式惩罚**"]},{"id":"gA-24","gate":"A","lecture":9,"topic":"Ecological systems","difficulty":3,"stem":"A parent's workplace is a setting the child never enters, yet it affects the child through the parent's mood and income. In Bronfenbrenner's model this is the:","options":["**Microsystem**","**Mesosystem**","**Macrosystem**","**Exosystem**"],"answer":3,"explain":"**Exosystem**（外系统）是儿童不参与但可能影响其发展的环境（如父母的工作环境）；**microsystem** 是儿童直接参与的家庭、玩伴等；**mesosystem** 是微系统之间的联系（如家庭与学校）；**macrosystem** 是文化、亚文化与社会阶层背景。","source":"L9 p.4","stem_zh":"父母的工作场所是儿童从不进入的环境，却通过父母的情绪与收入影响儿童。在 **Bronfenbrenner** 的模型中，这属于：","options_zh":["**微系统**","**中系统**","**宏系统**","**外系统**"]},{"id":"gA-25","gate":"A","lecture":9,"topic":"Parenting styles","difficulty":3,"stem":"Parents set firm rules and enforce them strictly, rarely explain why the rules exist, and dismiss their daughter's point of view. This parenting style is:","options":["**Authoritative**","**Authoritarian**","**Permissive**","**Uninvolved**"],"answer":1,"explain":"**Authoritarian**（专制型）高要求、低回应：严格限制、要求服从、不解释限制原因、不顾儿童观点，更多采用惩罚；**authoritative** 高要求高回应、会说明理由；**permissive** 低要求高回应；**uninvolved** 低要求低回应。","source":"L9 p.11","stem_zh":"父母订立严格规则并严格执行，很少解释规则为何存在，也不理会女儿的观点。这种教养方式属于：","options_zh":["**权威型**","**专制型**","**放任型**","**忽视型**"]}],"B":[{"id":"gB-01","gate":"B","lecture":1,"topic":"Early researchers","difficulty":2,"stem":"Which early researcher argued that development is a genetically programmed sequence determined by maturation, regardless of practice, training, or effort?","options":["**Charles Darwin**","**G. Stanley Hall**","**Arnold Gesell**","**John Locke**"],"answer":2,"explain":"**Gesell** 认为发展是由基因编程的连续变化模式、由 **maturation** 决定，与练习／训练无关，并最早使用电影摄影机与单向观察装置。**Darwin** 做婴儿传记；**Hall** 完成首项儿童发展科学研究并提出常模；**Locke** 提出白板说。","source":"L1 p.3","stem_zh":"哪位早期研究者主张发展是由基因编程的连续变化序列、由成熟决定，与练习、训练或努力无关？","options_zh":["**Charles Darwin**（达尔文）","**G. Stanley Hall**（霍尔）","**Arnold Gesell**（格塞尔）","**John Locke**（洛克）"]},{"id":"gB-02","gate":"B","lecture":1,"topic":"Correlation and causation","difficulty":2,"stem":"A researcher finds that children who watch more violent television are also rated as more aggressive by teachers. What conclusion is most justified?","options":["The two variables are positively correlated, but causality cannot be established.","Watching violent television causes aggression.","The finding proves that aggressive children choose violent programmes.","This is a natural experiment, so causal conclusions are warranted."],"answer":0,"explain":"**Correlational research** 只能显示变量间的关系、不能证明因果（相关 ≠ 因果）；要建立因果需操纵 **independent variable**、测量 **dependent variable**、随机分配并设控制组。B、C 都做了因果推断，D 误认研究设计。","source":"L1 p.10","stem_zh":"一名研究者发现，观看暴力电视节目越多的儿童，被教师评定为越具攻击性。下列哪项结论最站得住脚？","options_zh":["两个变量存在正相关，但不能据此确立因果关系。","观看暴力电视节目会导致攻击行为。","该发现证明攻击性强的儿童会选择暴力节目。","这是自然实验，因此可以作出因果结论。"]},{"id":"gB-03","gate":"B","lecture":2,"topic":"Genetic disorders","difficulty":2,"stem":"Which of the following is a sex-linked disorder caused by a gene on the X chromosome and far more common in males?","options":["**Phenylketonuria (PKU)**","**Down syndrome**","**Sickle-cell disease**","**Red-green colour blindness**"],"answer":3,"explain":"**Sex-linked disorders** 的基因位于 X 染色体，男性发病率远高于女性，例如红绿色盲、血友病、脆性 X 综合征；**PKU** 与镰状细胞病属常染色体隐性遗传病；**Down syndrome** 是 21 号染色体三体，属染色体异常。","source":"L2 p.8","stem_zh":"下列哪一项是由 X 染色体上的基因引起、且男性发病率远高于女性的伴性遗传病？","options_zh":["**苯丙酮尿症（PKU）**","**唐氏综合征**","**镰状细胞病**","**红绿色盲**"]},{"id":"gB-04","gate":"B","lecture":2,"topic":"Classical conditioning","difficulty":2,"stem":"In Watson and Rayner's Little Albert experiment, the loud noise that naturally elicited fear was the:","options":["**Conditioned stimulus (CS)**","**Unconditioned stimulus (UCS)**","**Conditioned response (CR)**","**Neutral stimulus (NS)**"],"answer":1,"explain":"小阿尔伯特实验中：巨响是 **UCS**（自然引发恐惧＝**UCR**），白鼠先为 **NS**、配对后成为 **CS**，对白鼠的恐惧是 **CR**；**generalisation** 使条件反应扩展到与白鼠特征相似的物体。","source":"L2 p.40","stem_zh":"在 **Watson** 与 **Rayner** 的小阿尔伯特实验中，自然引发恐惧的巨响是：","options_zh":["**条件刺激（CS）**","**无条件刺激（UCS）**","**条件反应（CR）**","**中性刺激（NS）**"]},{"id":"gB-05","gate":"B","lecture":2,"topic":"Infant reflexes","difficulty":2,"stem":"Which of the following is classified as a primitive reflex that normally disappears during the first year of life?","options":["Breathing reflex","Eye-blinking reflex","**Moro reflex**","Sucking reflex"],"answer":2,"explain":"**Primitive reflexes**（巴宾斯基反射、游泳反射、莫罗反射、抓握反射）用处较小，通常在出生后 6–8 个月消失；**survival reflexes**（呼吸、眨眼、吸吮、吞咽）具适应价值、满足生存需要。","source":"L2 p.17","stem_zh":"下列哪一项属于通常在出生后第一年内消失的原始反射？","options_zh":["呼吸反射","眨眼反射","**莫罗反射**","吸吮反射"]},{"id":"gB-06","gate":"B","lecture":3,"topic":"Assimilation and accommodation","difficulty":3,"stem":"A toddler who calls every four-legged animal 'doggy' is corrected several times and gradually forms a separate category for horses. Creating that new category is an example of:","options":["**Assimilation**","**Organization**","**Equilibration**","**Accommodation**"],"answer":3,"explain":"**Assimilation** 是用已有图式解释新信息；**accommodation** 是修改已有图式／新建类别以纳入新信息（分出“马”类别）；**organization** 是把已有图式组合成更复杂的图式；**equilibration** 是平衡同化与顺应、形成适配环境图式的过程。","source":"L3 p.4","stem_zh":"一名幼儿把所有四足动物都叫“狗狗”，经多次纠正后逐渐为马单独建立一个类别。建立这个新类别属于：","options_zh":["**同化**","**组织**","**平衡化**","**顺应**"]},{"id":"gB-07","gate":"B","lecture":3,"topic":"Adolescent egocentrism","difficulty":3,"stem":"A teenager believes that only she can feel emotions as intensely as she does, that her experiences are unique, and that nothing bad can really happen to her. This belief is the:","options":["**Personal fable**","**Imaginary audience**","**Naïve idealism**","**Hypothetical-deductive reasoning**"],"answer":0,"explain":"**Personal fable**（个人神话）认为自己独特、特别、不会受伤害，与饮酒、无保护性行为等风险行为以及焦虑抑郁相关；**imaginary audience**（假想观众）是认为别人都像自己一样关注自己的外表；两者都是 **adolescent egocentrism** 的表现。","source":"L3 p.30","stem_zh":"一名青少年认为只有自己能感受到如此强烈的情绪、自己的经历独一无二，而且坏事不会真的发生在自己身上。这种信念是：","options_zh":["**个人寓言**","**假想观众**","**天真理想主义**","**假设演绎推理**"]},{"id":"gB-08","gate":"B","lecture":3,"topic":"Concrete operations","difficulty":2,"stem":"Which accomplishment best indicates that a child has entered Piaget's concrete operational stage?","options":["Recognizing that an object still exists when it is hidden.","Understanding that a ball of clay keeps the same amount of clay when it is reshaped.","Reasoning about abstract principles such as justice and freedom.","Using hypothetical-deductive reasoning to test all possibilities."],"answer":1,"explain":"**Concrete operational stage**（约 6–12 岁逐步获得）的标志是 **conservation**、**decentration** 与 **reversibility**，善于处理具体可见或可操作的事物；**object permanence** 属感知运动期；抽象原则与 **hypothetical-deductive reasoning** 属形式运算期。（阶段年龄表亦常写 7–11 岁；本讲 p.22 指出具体运算图式在 6–12 岁间逐步获得，p.20 称多数儿童约 6 岁进入。）","source":"L3 p.20","stem_zh":"哪种表现最能说明儿童已进入 **Piaget** 的具体运算阶段？","options_zh":["认识到物体被藏起来后依然存在。","理解橡皮泥球被重新捏形后泥量不变。","能对正义、自由等抽象原则进行推理。","使用假设演绎推理检验所有可能性。"]},{"id":"gB-09","gate":"B","lecture":4,"topic":"Pragmatics","difficulty":2,"stem":"Which component of language covers the rules for using language appropriately in social contexts, including implied meanings such as answering 'Ice cream is good this time of year' when asked what one wants to eat?","options":["**Syntax**","**Semantics**","**Pragmatics**","**Morphology**"],"answer":2,"explain":"**Pragmatics**（语用学）研究社会情境中有效得体的语言使用与言外之意（如‘这里真冷’、粤语‘食咗饭未啊’）；**syntax** 是词语组合成句的结构规则；**semantics** 研究词与句的意义；**morphology** 研究语素构词的规则。","source":"L4 p.13","stem_zh":"语言五大成分中，哪一项涉及在社会情境中得体使用语言的规则，包括像被问到想吃什么时回答“这个时节吃冰淇淋不错”这类言外之意？","options_zh":["**句法学**","**语义学**","**语用学**","**形态学**"]},{"id":"gB-10","gate":"B","lecture":4,"topic":"Sensitive period","difficulty":3,"stem":"Genie and Chelsea both learned many words but never mastered the syntax of a first language. These cases are most often used to support:","options":["the **sensitive-period hypothesis** for first-language acquisition","the behaviourist claim that imitation alone is sufficient","the claim that grammar is learned entirely through reinforcement","the view that language develops without any biological constraints"],"answer":0,"explain":"两人都在剥夺／隔绝后才接触语言：词汇可学，但句法始终未掌握，支持 **sensitive-period hypothesis**（**Lenneberg**；出生至青春期）；**Johnson & Newport**（1989）的第二语言移民数据也显示 3–7 岁习得者与母语者相当，青春期后到达者表现较差。（Genie 见 L4 p.25、Chelsea 见 L4 p.26、Johnson & Newport 见 L4 p.27）","source":"L4 p.24","stem_zh":"**Genie** 与 **Chelsea** 都学会了许多词，却始终未掌握第一语言的句法。这些案例最常被用来支持：","options_zh":["第一语言习得的**敏感期假说**","行为主义关于单靠模仿即足够的说法","语法完全通过强化习得的说法","语言发展不受任何生物限制的观点"]},{"id":"gB-11","gate":"B","lecture":4,"topic":"Expansion and recast","difficulty":3,"stem":"A child says 'Doggy go', and the mother replies 'Yes, the doggie is going away.' This is an example of:","options":["**Recast**","**Telegraphic speech**","**Overextension**","**Expansion**"],"answer":3,"explain":"**Expansion** 是把儿童不合语法的表述改成语法正确且更丰富的版本；**recast** 是把儿童的句子改造成新的语法形式（如改成问句 'What is the doggie eating?'）；**telegraphic speech** 是儿童自己的电报句；二者都属互动论的语言支持方式。","source":"L4 p.32","stem_zh":"孩子说“狗狗走”，妈妈回答“是的，狗狗正要走开了”。这属于：","options_zh":["**重塑**","**电报句**","**过度扩展**","**扩展**"]},{"id":"gB-12","gate":"B","lecture":5,"topic":"Secure attachment","difficulty":2,"stem":"In the Strange Situation, which attachment pattern is shown by about 65% of infants, who explore while the caregiver is present, may be upset at separation, and greet the caregiver warmly on reunion?","options":["**Resistant attachment**","**Secure attachment**","**Avoidant attachment**","**Disorganized attachment**"],"answer":1,"explain":"**Secure attachment** 约占 65%：把照顾者当 **secure base** 探索环境，分离时可能难过，重聚时热情迎接并寻求安慰；**resistant** 约 10%（重聚矛盾）、**avoidant** 约 20%（重聚忽视母亲）、**disorganized** 约 5%（最不安全、接近与回避困惑）。","source":"L5 p.27","stem_zh":"在陌生情境实验中，哪一种依恋模式约占 65%，表现为照顾者在场时探索、分离时可能难过、重聚时热情迎接照顾者？","options_zh":["**抗拒型依恋**","**安全型依恋**","**回避型依恋**","**混乱型依恋**"]},{"id":"gB-13","gate":"B","lecture":5,"topic":"Attachment fears","difficulty":2,"stem":"**Stranger anxiety** in infancy typically peaks at which age?","options":["2–4 months","6–8 months","8–10 months","14–18 months"],"answer":2,"explain":"**Stranger anxiety** 始于形成主要依恋关系之时，在 8–10 个月达峰后逐渐下降；**separation anxiety** 6–8 个月出现、14–18 个月达峰。题干问的是陌生人焦虑，故不能选 14–18 个月的分离焦虑峰值。","source":"L5 p.25","stem_zh":"婴儿期的**陌生人焦虑**通常在多大时达到高峰？","options_zh":["2–4 个月","6–8 个月","8–10 个月","14–18 个月"]},{"id":"gB-14","gate":"B","lecture":5,"topic":"Attachment theory","difficulty":3,"stem":"The cognitive-developmental theory of attachment argues that infants can become attached only after they can distinguish familiar from unfamiliar people, which depends on:","options":["**Object permanence** (around 7–9 months)","**Contact comfort** from a soft surrogate","**Imprinting** during a critical period","**Reinforcement** through feeding"],"answer":0,"explain":"认知发展理论的口号是‘要爱你，我必须知道你一直在’：依恋依赖区分熟人与陌生人，以及 **object permanence**（7–9 个月）。**Contact comfort** 属 **Harlow**／习性学观点；**imprinting**（印刻）属 **Lorenz** 的习性学传统；**reinforcement** 属学习理论。","source":"L5 p.24","stem_zh":"依恋的认知发展理论认为，婴儿必须先能区分熟悉者与陌生人，才可能形成依恋；这依赖：","options_zh":["**客体永久性**（约 7–9 个月）","柔软替代物提供的**接触安慰**","关键期内的**印刻**","通过喂养形成的**强化**"]},{"id":"gB-15","gate":"B","lecture":6,"topic":"Self-esteem components","difficulty":2,"stem":"According to Harter, which set of domains contributes to children's self-esteem in middle childhood?","options":["Only global self-worth, with no separate domains","Attachment security and temperament","Physical growth and motor milestones","Academic competence, social acceptance, appearance, athleticism, and behaviour"],"answer":3,"explain":"**Harter**（1982/1995/2005）指出自尊包含学业、社会接纳、外貌、运动能力与行为等成分；4–7 岁在各维度都偏积极（膨胀、反映取悦愿望而非稳固自我价值），8 岁起更贴近他人评价，青春期出现 **relational self-worth**。","source":"L6 p.14","stem_zh":"按 **Harter** 的划分，儿童中期自尊由哪一组领域构成？","options_zh":["只有整体自我价值，没有分领域","依恋安全与气质","身体生长与动作里程碑","学业能力、社会接纳、外貌、运动能力与行为"]},{"id":"gB-16","gate":"B","lecture":6,"topic":"Achievement motivation","difficulty":2,"stem":"In the early development of achievement motivation, children before about age 2 are best described as:","options":["adopting objective standards and feeling shame after failure","pleased by success but not seeking recognition, with failure not mattering much","actively comparing their performance with peers","dependent on adults' evaluations of their ability"],"answer":1,"explain":"成就动机三阶段：**joy in mastery**（2 岁前，为成功高兴、不寻求认可、失败无关紧要）→ **approval-seeking**（近 2 岁，寻求赞许、预期失败会受责）→ **use of standards**（3 岁以上，采用客观标准、成功自豪失败羞愧、较少依赖他人评价）。","source":"L6 p.23","stem_zh":"在成就动机的早期发展中，约 2 岁前的儿童最符合下列哪项描述？","options_zh":["采用客观标准，失败后感到羞愧","为成功高兴但不寻求认可，失败也不太要紧","主动与同伴比较表现","依赖成人对自己能力的评价"]},{"id":"gB-17","gate":"B","lecture":7,"topic":"Self-fulfilling prophecy","difficulty":3,"stem":"In Rosenthal and Jacobson's (1968) classic study, teachers were told that certain ordinary pupils had exceptionally high IQs (in fact they were no different from classmates), and those pupils improved the most during the year. This best illustrates:","options":["**Gender intensification**","**Observational learning** of gender roles","the **self-fulfilling prophecy**","**Gender-schema** processing"],"answer":2,"explain":"**Self-fulfilling prophecy**（自证预言）：教师的期望使其向这些学生投入更多情感、学习材料、反馈与课堂机会，学生因此真的进步；它也可能助长认知能力的性别差异，属刻板印象的成因。**Gender intensification** 是青春期性别刻板印象强化的现象。","source":"L7 p.12","stem_zh":"在 **Rosenthal** 与 **Jacobson**（1968）的经典研究中，教师被告知某些普通学生智商极高（实际与其他同学并无差异），结果这些学生一年内进步最大。这最能说明：","options_zh":["**性别强化**","性别角色的**观察学习**","**自我实现预言**","**性别图式**加工"]},{"id":"gB-18","gate":"B","lecture":7,"topic":"Gender-schema theory","difficulty":3,"stem":"According to Martin and Halverson's gender-schema theory, once children acquire a basic gender identity they:","options":["form an own-sex schema and remember gender-consistent information better than inconsistent information","wait until gender consistency is achieved before seeking same-sex models","learn gender roles mainly through direct tuition and reinforcement","pass through identity, stability, and consistency in a fixed order"],"answer":0,"explain":"**Gender-schema theory** 认为儿童以性别作为 **schema** 组织并引导对世界的看法：先有内群体／外群体图式，再形成 **own-sex schema**，编码并记住与图式一致的信息、遗忘不一致的信息。B、D 属 **Kohlberg** 认知发展理论，C 属社会学习理论。","source":"L7 p.36","stem_zh":"按 **Martin** 与 **Halverson** 的性别图式理论，儿童一旦获得基本的性别认同，就会：","options_zh":["形成自身性别图式，更容易记住性别一致的信息、遗忘不一致的信息","等到获得性别一致性后才寻找同性榜样","主要通过直接教导与强化学习性别角色","按认同、稳定、一致的固定顺序发展"]},{"id":"gB-19","gate":"B","lecture":7,"topic":"Biosocial theory","difficulty":2,"stem":"According to Money and Ehrhardt's biosocial theory, at about 3 to 4 months after conception testosterone promotes:","options":["development of the ovaries and female internal organs","parents' gender labelling of the newborn","sex-typed toy preferences in toddlerhood","growth of the penis and scrotum and changes in brain development"],"answer":3,"explain":"**Biosocial theory**（**Money & Ehrhardt**, 1972）：Y 染色体使胚胎发育出睾丸，分泌 **testosterone**（促进男性内生殖系统）与 **MIS**（抑制女性器官）；约受孕后 3–4 个月睾酮促使阴茎与阴囊发育并改变脑与神经系统发育。父母按外生殖器贴标签、**gender typing** 由此开始，但并非睾酮的直接作用。","source":"L7 p.29","stem_zh":"按 **Money** 与 **Ehrhardt** 的生物社会理论，受孕约 3 至 4 个月后，睾酮会促进：","options_zh":["卵巢与女性内生殖器官的发育","父母对新生儿的性别标记","幼儿期的性别化玩具偏好","阴茎与阴囊的生长以及脑部发育的改变"]},{"id":"gB-20","gate":"B","lecture":8,"topic":"Dodge's SIP theory","difficulty":3,"stem":"According to Dodge's social information-processing theory, reactive aggressors are most likely to:","options":["calmly plan instrumental aggression to achieve personal goals","interpret ambiguous harm as hostile and retaliate angrily","show positive emotion while aggressing against peers","use relational aggression to maintain their popularity"],"answer":1,"explain":"**Reactive aggressors** 有敌意归因偏差：搜寻与预期相符的线索、把敌意意图归于对方，于是大怒并迅速报复，同伴的敌意反应又强化其预期；**proactive aggressors** 才冷静制定工具性目标、预期正面结果，并可能在攻击时表现愉快。","source":"L8 p.13","stem_zh":"按 **Dodge** 的社会信息加工理论，反应型攻击者最可能：","options_zh":["冷静计划工具性攻击以达成个人目标","把含糊的伤害解读为敌意并愤怒报复","攻击同伴时表现出积极情绪","使用关系攻击以维持人气"]},{"id":"gB-21","gate":"B","lecture":8,"topic":"Empathy and altruism","difficulty":2,"stem":"Which emotional reaction promotes altruism by focusing on the distressed other rather than on relieving one's own discomfort?","options":["**Personal (self-oriented) distress**","**Emotional display rules**","**Sympathetic empathetic arousal**","**Immanent justice**"],"answer":2,"explain":"**Sympathetic empathetic arousal**（同情性共情唤醒）是对困境中他人的关心，会促进利他；**personal (self-oriented) distress**（个人困扰）使人只想缓解自身不适，反而忽视有需要者。**Felt-responsibility hypothesis** 解释共情如何转化为责任与内疚。","source":"L8 p.30","stem_zh":"哪种情绪反应通过关注受苦的他人（而非缓解自己的不适）来促进利他？","options_zh":["**个人（自我导向）困扰**","**情绪表达规则**","**同情性共情唤醒**","**内在公正**"]},{"id":"gB-22","gate":"B","lecture":8,"topic":"Kohlberg stages","difficulty":2,"stem":"At Kohlberg's stage 3 ('good boy/good girl' orientation), moral behaviour is motivated primarily by:","options":["the desire to please others and win their approval","fear of punishment from authority","belief in maintaining social order and law","self-chosen universal ethical principles"],"answer":0,"explain":"**Stage 3** 属习俗水平：道德行为是取悦、帮助他人或获他人赞许，并常按意图评判人；**stage 1** 为避免惩罚，**stage 4** 为维护法律与社会秩序，**stage 6** 依个人良心选择的普遍伦理原则。","source":"L8 p.51","stem_zh":"在 **Kohlberg** 的阶段 3（“好孩子/好女孩”取向），道德行为主要受什么驱动？","options_zh":["取悦他人、获得他人赞许的愿望","对权威惩罚的恐惧","维护社会秩序与法律的信念","自己选择的普世伦理原则"]},{"id":"gB-23","gate":"B","lecture":9,"topic":"Divorce","difficulty":2,"stem":"Which statement best reflects the developmental view of divorce presented in this course?","options":["It is a single event whose effects are limited to the first year after separation.","It affects only the custodial mother, not the children or the non-custodial father.","It has no long-term consequences for children once they reach adulthood.","It is a series of stressful experiences for the whole family rather than a single event."],"answer":3,"explain":"**Divorce** 不是单一事件，而是整个家庭的一系列压力经历：始于分居前的婚姻冲突，之后家庭资源减少、角色与责任改变、新互动模式与继父母关系等；多数家庭经历一年或更久的危机期，长期可能出现更多抑郁症状与较低生活满意度。","source":"L9 p.21","stem_zh":"下列哪项陈述最符合本课程对离婚的发展观？","options_zh":["离婚是单一事件，其影响仅限分居后第一年。","离婚只影响取得监护权的母亲，不影响孩子或无监护权的父亲。","孩子成年后，离婚便不再有任何长期影响。","离婚是整个家庭的一系列压力经历，而非单一事件。"]},{"id":"gB-24","gate":"B","lecture":9,"topic":"Play types","difficulty":2,"stem":"Two four-year-olds sit side by side building separate towers with the same blocks but do not interact or share a goal. This is:","options":["**Cooperative play**","**Parallel play**","**Associative play**","**Onlooker play**"],"answer":1,"explain":"**Parallel play** 是并排玩耍、互动极少；**associative play** 会分享但不朝共同目标合作；**cooperative play** 在想象游戏中协作、角色互惠并共享目标；**onlooker play** 只是观看不加入。独自与平行游戏随年龄增长而减少。","source":"L9 p.30","stem_zh":"两名四岁幼儿并排各搭各的塔，使用同样积木，但互不互动、也没有共同目标。这属于：","options_zh":["**合作游戏**","**平行游戏**","**联合游戏**","**旁观游戏**"]},{"id":"gB-25","gate":"B","lecture":9,"topic":"Media effects","difficulty":3,"stem":"The desensitization hypothesis proposes that prolonged exposure to television violence:","options":["increases aggression only when children watch television alone","makes children avoid television and prefer peer play","reduces children's emotional responsiveness to violence and makes them more willing to tolerate it in real life","increases prosocial behaviour when adults co-view the programme"],"answer":2,"explain":"**Desensitization hypothesis**（脱敏假说）：长期接触电视暴力使儿童对暴力的情绪反应减弱，更愿意在现实生活中容忍暴力。电视暴力与攻击有正相关、实验与纵向证据；亲社会节目的效果需成人监督并鼓励儿童复述与践行才持久。","source":"L9 p.43","stem_zh":"脱敏假说认为，长期接触电视暴力会：","options_zh":["只在儿童独自看电视时增加攻击性","使儿童回避电视、更愿意与同伴玩耍","减弱儿童对暴力的情绪反应，使其更愿意容忍现实生活中的暴力","在成人陪同观看时增加亲社会行为"]}],"C":[{"id":"gC-01","gate":"C","lecture":1,"topic":"Kinds of change","difficulty":2,"stem":"The baby-boom generation's shared experience of growing up during a period of rapid social and economic change is an example of:","stem_zh":"婴儿潮一代在快速社会与经济变革时期共同成长的经历，属于下列哪一类？","options":["**Normative history-graded change**","**Normative age-graded change**","**Nonnormative change**","The **social clock**"],"options_zh":["**常模历史级变化**","**常模年龄级变化**","**非常规变化**","**社会时钟**"],"answer":0,"explain":"**Normative history-graded changes** 因特定历史时期的因素影响同一 **cohort**（如婴儿潮一代）；**normative age-graded changes** 与特定年龄相连（爬行→走路、第一个词）；**nonnormative changes** 由独特、非共享事件造成；**social clock** 是文化中界定正常人生顺序的年龄常模。","source":"L1 p.6"},{"id":"gC-02","gate":"C","lecture":1,"topic":"Critical period","difficulty":3,"stem":"A period during which an organism is especially sensitive to the presence or absence of a particular experience, and in which disruption may cause irreversible brain changes, is called a:","stem_zh":"机体对某种经验的存在或缺失特别敏感、且受干扰可能导致脑结构不可逆改变的特定时期，称为：","options":["**Sensitive period**","**Critical period**","**Social clock**","**Cohort**"],"options_zh":["**敏感期**","**关键期**","**社会时钟**","**同辈群体**"],"answer":1,"explain":"**Critical period**（关键期）对某经验特别敏感，干扰可能导致不可逆的脑结构改变；**sensitive period**（敏感期）是数月或数年的较长时段，对特定经验反应较强。题干中的‘不可逆’指向关键期，别与敏感期混淆。","source":"L1 p.6"},{"id":"gC-03","gate":"C","lecture":1,"topic":"Case study","difficulty":3,"stem":"A researcher collects extremely detailed information about one child's entire life history in order to test developmental hypotheses. The main limitation of this case-study approach is:","stem_zh":"研究者收集某名儿童全部生活史的极详尽资料，以检验发展假设。这种个案研究法的主要局限是：","options":["inability to use objective measures","observers may change the child's behaviour","difficulty comparing subjects and lack of generalizability","social desirability in questionnaire responses"],"options_zh":["无法使用客观测量","观察者可能改变儿童的行为","难以比较被试、缺乏可推广性","问卷回答中的社会赞许性"],"answer":2,"explain":"**Case study** 的优点是信息深入，局限是难以比较不同个案、结果缺乏 **generalizability**（可能不适用于他人）。观察者效应属 **naturalistic observation** 的局限；社会赞许性属 **self-report** 的局限。","source":"L1 p.9"},{"id":"gC-04","gate":"C","lecture":1,"topic":"Experiment variables","difficulty":2,"stem":"In an experiment testing a new reading programme, the researcher randomly assigns students to the new programme or the usual programme and later measures reading scores. The reading score is the:","stem_zh":"在一项检验新阅读课程的实验中，研究者随机把学生分配到新课程组或原课程组，之后测量阅读成绩。阅读成绩是：","options":["**Independent variable**","**Control group**","**Random assignment**","**Dependent variable**"],"options_zh":["**自变量**","**控制组**","**随机分配**","**因变量**"],"answer":3,"explain":"**Independent variable** 是研究者操纵或控制的因素（新旧教学方案）；**dependent variable** 是因自变量变化而被测量或观察的因素（阅读分数）；**random assignment** 与 **control group** 是实验控制手段。","source":"L1 p.10"},{"id":"gC-05","gate":"C","lecture":1,"topic":"Research ethics","difficulty":2,"stem":"Which statement about research ethics in developmental studies is correct?","stem_zh":"关于发展研究中的研究伦理，下列哪项说法正确？","options":["Deception is never permitted under any circumstances.","Participants must give informed consent before involvement and may withdraw at any time.","Identifiable data may be published freely without consent.","Parents may not withdraw their children from a study once it has begun."],"options_zh":["任何情况下都不允许使用欺骗","参与前须获知情同意，且可随时退出","可识别身份的数据可未经同意发表","研究开始后父母不得让孩子退出"],"answer":1,"explain":"研究伦理要求：保护参与者免受身体与心理伤害、事前取得 **informed consent**、欺骗须有正当理由且不造成伤害（参照 1971 年斯坦福监狱实验）、参与者可随时退出、资料妥善保存并保密。欺骗并非绝对禁止，故 A 错。","source":"L1 p.14"},{"id":"gC-06","gate":"C","lecture":2,"topic":"Prenatal stages","difficulty":2,"stem":"Which prenatal period is defined as the stage in which all major organs are formed and the heart begins to beat?","stem_zh":"下列哪个产前阶段定义为：所有主要器官形成、心脏开始跳动的时期？","options":["The **embryonic** period (3rd–8th week)","The **zygotic** period (10–14 days)","The **fetal** period (9th week to birth)","The **neonatal** period (first month after birth)"],"options_zh":["**胚胎期**（第 3–8 周）","**受精卵期**（10–14 天）","**胎儿期**（第 9 周至出生）","**新生儿期**（出生后第一个月）"],"answer":0,"explain":"**Zygote** 期从受孕到着床（10–14 天）；**embryo** 期第 3–8 周主要器官形成、心脏开始跳动；**fetus** 期第 9 周至出生，主要器官系统开始运作、机体快速生长。","source":"L2 p.13"},{"id":"gC-07","gate":"C","lecture":2,"topic":"Brain development","difficulty":3,"stem":"Which statement about the development of the infant brain is correct?","stem_zh":"关于婴儿大脑的发育，下列哪项说法正确？","options":["**Pruning** increases the total number of synapses formed.","**Myelinization** insulates axons and improves the speed and efficiency of neural conduction.","**Synaptogenesis** means the elimination of unnecessary connections.","The **cortex** is fully mature at birth and changes little afterwards."],"options_zh":["**突触修剪**会增加形成的突触总数","**髓鞘化**使轴突绝缘，提高神经传导的速度与效率","**突触发生**指消除不必要的连接","**皮层**出生时已完全成熟，此后变化很小"],"answer":1,"explain":"**Synaptogenesis** 是形成突触；**pruning** 是淘汰不必要的通路与连接（受经验影响）；**myelinization** 为轴突包髓鞘、提升传导效率。出生时中脑与延髓发育最成熟，**cortex** 在出生前最后几个月才发育，出生后仍持续成熟多年。","source":"L2 p.16"},{"id":"gC-08","gate":"C","lecture":2,"topic":"Object permanence","difficulty":3,"stem":"An 8–12-month-old sees a toy hidden at position A, then watches it being moved to position B, but searches again at position A. This error is called:","stem_zh":"一名 8–12 个月大的婴儿看到玩具被藏在 A 处，随后看着它被移到 B 处，却仍回到 A 处寻找。这一错误称为：","options":["failure of **object permanence**","**deferred imitation**","the **A-not-B error**","**means-end behaviour**"],"options_zh":["**客体永久性**缺失","**延迟模仿**","**A 非 B 错误**","**手段—目的行为**"],"answer":2,"explain":"8–12 个月（substage 4）已能寻找完全遮盖的物体、理解客体永久性，但仍受 **A-not-B error** 限制：到上次看见物体的 A 处找，而不是移到 B 处找。该子阶段的正面能力是 **means-end behaviour**、因果关系与客体永久性；**deferred imitation** 要到子阶段 6（18–24 个月）才出现。","source":"L2 p.34"},{"id":"gC-09","gate":"C","lecture":2,"topic":"Sensory development","difficulty":2,"stem":"Which sense is the least mature at birth, with newborn acuity of about 20/200 to 20/400?","stem_zh":"出生时最不成熟、新生儿视敏度约为 20/200 至 20/400 的是哪种感觉？","options":["**Hearing**","**Taste**","**Smell**","**Vision**"],"options_zh":["**听觉**","**味觉**","**嗅觉**","**视觉**"],"answer":3,"explain":"**Vision** 是最不成熟的感觉：新生儿视敏度约 20/200–20/400，6 个月约 20/100，2–3 个月辨色才较好；听觉在频率辨别上甚至优于视觉，新生儿已能判断声音方向并偏好母亲声音；味觉、嗅觉出生时已相当敏感。","source":"L2 p.26"},{"id":"gC-10","gate":"C","lecture":2,"topic":"Operant conditioning","difficulty":2,"stem":"When a toddler's whining is followed by a snack that stops the whining, and the whining then increases in frequency, this illustrates:","stem_zh":"幼儿哭闹之后得到零食、哭闹停止，此后哭闹频率反而增加。这最能说明：","options":["**Punishment**","**Positive reinforcement**","**Observational learning**","**Classical conditioning**"],"options_zh":["**惩罚**","**正强化**","**观察学习**","**经典条件作用**"],"answer":1,"explain":"操作性条件作用：被强化的反应倾向重复、未被强化的反应倾向消退。给予愉悦结果而使行为增加＝**positive reinforcement**；**punishment** 使行为减少；**observational learning** 靠观察榜样；**classical conditioning** 是刺激配对（如小阿尔伯特）。","source":"L2 p.45"},{"id":"gC-11","gate":"C","lecture":2,"topic":"Motor development","difficulty":3,"stem":"Dynamic systems theory explains why the stepping reflex disappears in infancy by pointing to:","stem_zh":"动力系统理论认为婴儿期踏步反射消失的原因是：","options":["the increasing weight of the legs relative to infants' muscle strength","maturation of the cerebral cortex alone","imitation of caregivers' walking","reinforcement of walking by parents"],"options_zh":["腿部重量相对于婴儿肌肉力量的增加","仅由大脑皮层成熟决定","模仿照料者的行走","父母对行走的强化"],"answer":0,"explain":"**Dynamic Systems Theory** 认为先天的动作时间表与身体其他发展相互作用：踏步反射消失是因为腿部肌肉尚不足以支撑增加的腿重。走路既依赖遗传动作计划，也依赖肌肉力量／体重比的变化。","source":"L2 p.20"},{"id":"gC-12","gate":"C","lecture":3,"topic":"Piaget's stages","difficulty":2,"stem":"Which sequence correctly matches Piaget's stages with their typical age ranges?","stem_zh":"下列哪项正确对应皮亚杰各阶段与其典型年龄范围？","options":["preoperational (0–2), sensorimotor (2–7), concrete operational (7–11), formal operational (adolescence)","sensorimotor (0–2), concrete operational (2–7), preoperational (7–11), formal operational (adolescence)","sensorimotor (0–2), preoperational (2–7), formal operational (7–11), concrete operational (adolescence)","sensorimotor (0–2), preoperational (2–7), concrete operational (7–11), formal operational (adolescence)"],"options_zh":["前运算0–2、感知运动2–7、具体运算7–11、形式运算","感知运动0–2、具体运算2–7、前运算7–11、形式运算","感知运动0–2、前运算2–7、形式运算7–11、具体运算","感知运动0–2、前运算2–7、具体运算7–11、形式运算"],"answer":3,"explain":"皮亚杰四阶段：**sensorimotor**（0–2，六个亚阶段）、**preoperational**（2–7）、**concrete operational**（7–11）、**formal operational**（青少年期）。顺序固定（**invariant developmental sequence**），但进入或离开任一阶段的年龄存在个体差异。","source":"L3 p.10"},{"id":"gC-13","gate":"C","lecture":3,"topic":"Animism","difficulty":2,"stem":"A 4-year-old says: 'The wind knew I was hot, so it came to cool me down.' This best illustrates:","stem_zh":"一名 4 岁儿童说：“风知道我热，所以来给我凉快。”这最能说明：","options":["**Centration**","**Animism**","**Egocentrism**","**Reversibility**"],"options_zh":["**集中化**","**泛灵论**","**自我中心**","**可逆性**"],"answer":1,"explain":"**Animism**（泛灵论）把生命或类生命属性赋予无生命物体，是前运算期特征；**centration** 是一次只从一个变量思考世界；**egocentrism** 是难以认识他人观点；**reversibility** 是具体运算期才获得的心理逆转能力。","source":"L3 p.13"},{"id":"gC-14","gate":"C","lecture":3,"topic":"Horizontal décalage","difficulty":3,"stem":"Piaget's observation that concrete operational schemes are acquired gradually over ages 6–12, so children master conservation of liquid at 6–7 but conservation of area at 8–10, is called:","stem_zh":"皮亚杰指出具体运算图式在 6–12 岁间逐步获得，因此儿童 6–7 岁掌握液体守恒、8–10 岁才掌握面积守恒。这一现象称为：","options":["**Horizontal décalage**","**Centration**","**Reversibility**","**Equilibration**"],"options_zh":["**水平滞差**","**集中化**","**可逆性**","**平衡化**"],"answer":0,"explain":"**Horizontal décalage**（水平滞差）指同一认知技能在不同任务上逐步获得、需要数年时间；**centration** 是前运算期的单一维度思维；**reversibility** 是具体运算的基础图式之一；**equilibration** 是同化与顺应的平衡化过程。（守恒任务获得年龄见 L3 p.23：液体/质量 6–7 岁、类别包含 7–8 岁、面积 8–10 岁、体积 9–12 岁）","source":"L3 p.22"},{"id":"gC-15","gate":"C","lecture":3,"topic":"Balance-scale rules","difficulty":3,"stem":"On Siegler's balance-scale task, children using the concrete operational rule:","stem_zh":"在西格勒的天平任务中，使用具体运算规则的儿童会：","options":["consider only one dimension","mainly judge by number of disks and may consider distance","use the actual formula combining weight and distance","take both distance and weight into account but guess when the two conflict"],"options_zh":["只考虑一个维度","主要按圆盘数量判断，也可能考虑距离","使用重量与距离联合计算的实际公式","同时考虑距离与重量，但两者冲突时只能猜测"],"answer":3,"explain":"**Siegler** 的天平任务四规则：**preoperational**（只看一个维度）→ **transitional**（主要按数量判断，可能考虑距离）→ **concrete operational**（同时考虑距离与重量，冲突时靠猜）→ **actual formula**（理解重量与距离的联合计算）。","source":"L3 p.24"},{"id":"gC-16","gate":"C","lecture":3,"topic":"Formal operations","difficulty":3,"stem":"Hypothetical-deductive reasoning, which emerges in Piaget's formal operational stage, is best described as:","stem_zh":"皮亚杰形式运算阶段出现的假设演绎推理，最准确的描述是：","options":["learning by trial and error in concrete situations","drawing general conclusions from specific observations","starting from a general principle and deriving specific, testable conclusions","mentally undoing a physical transformation"],"options_zh":["在具体情境中试错学习","由具体观察得出一般结论","由一般原则推出具体、可检验的结论","在心理上逆转某种物理转换"],"answer":2,"explain":"**Hypothetical-deductive reasoning** 从一般原则推出具体结论，并能先想遍所有可能性再系统检验；从具体观察得出一般结论是 **inductive logic**（具体运算期较强）；在心理上撤销转换是 **reversibility**。","source":"L3 p.26"},{"id":"gC-17","gate":"C","lecture":3,"topic":"Vygotsky vs Piaget","difficulty":3,"stem":"Compared with Piaget, Vygotsky's theory emphasizes more strongly that cognitive development arises from:","stem_zh":"与皮亚杰相比，维果茨基的理论更加强调认知发展源于：","options":["social interaction and culture-specific tools","children's independent exploration of the physical world","the maturational unfolding of universal stages","individual discovery learning"],"options_zh":["社会互动与文化特有的工具","儿童对物理世界的独立探索","普遍阶段的成熟展开","个体发现学习"],"answer":0,"explain":"对比表：**Vygotsky** 认为认知发展因文化而异、源于社会互动（在 **ZPD** 内通过指导性学习共同建构知识），成人传递的文化工具被儿童内化；**Piaget** 认为发展基本普世、主要源于儿童独立探索，同伴是重要推动者。","source":"L3 p.39"},{"id":"gC-18","gate":"C","lecture":4,"topic":"Morphemes","difficulty":2,"stem":"In the English word 'unhappiness', the elements un-, happy, and -ness are:","stem_zh":"在英语单词“unhappiness”中，un-、happy 与 -ness 属于：","options":["**Phonemes**","**Morphemes**","**Syllables**","**Syntactic rules**"],"options_zh":["**音位**","**语素**","**音节**","**句法规则**"],"answer":1,"explain":"**Morpheme**（语素）是最小意义单位，unhappiness = un/happy/ness 三个语素；**phoneme** 是语音的基本单位（属 **phonology**）；语素构词规则属 **morphology**。汉语中一个汉字＝一个音节＝一个语素。","source":"L4 p.8"},{"id":"gC-19","gate":"C","lecture":4,"topic":"Nativist evidence","difficulty":3,"stem":"Which finding is offered as support for the nativist perspective on language development?","stem_zh":"下列哪项发现被用来支持语言发展的先天论视角？","options":["Children learn grammar mainly by imitating adult sentences.","Parents reinforce and recast children's early utterances.","Children reach language milestones at about the same age across cultures with very different languages.","Regional accents are shaped by imitation and reinforcement."],"options_zh":["儿童主要靠模仿成人句子学会语法","父母强化并重塑儿童早期话语","不同语言文化中的儿童达到语言里程碑的年龄大致相同","地区口音由模仿与强化塑造"],"answer":2,"explain":"先天论证据包括：**linguistic universals**（各文化里程碑年龄相近）、**species-specific**（只有人类自发形成语言）、脑区专门化与 **sensitive-period hypothesis**。B、D 是互动／学习视角的证据；A 是典型的模仿说主张，而儿童从未听过的创造性错误（如 'It broked'）恰恰反驳了“靠模仿学习”。","source":"L4 p.22"},{"id":"gC-20","gate":"C","lecture":4,"topic":"Overregularization","difficulty":2,"stem":"A child who has learned the regular plural rule says 'mouses' instead of 'mice'. This error is called:","stem_zh":"已学会规则复数形式的儿童把 mice 说成“mouses”。这种错误称为：","options":["**Overextension**","**Underextension**","**Telegraphic speech**","**Overregularization**"],"options_zh":["**过度扩展**","**过度缩小**","**电报式语言**","**过度规则化**"],"answer":3,"explain":"**Overregularization**（过度规则化）把语法规则过度推广到不适用的不规则情况（mice → mouses），说明儿童是主动建构语法规则而非单纯模仿成人；**overextension**／**underextension** 是词义范围错误，**telegraphic speech** 是省略次要词类的早期句子。","source":"L4 p.47"},{"id":"gC-21","gate":"C","lecture":4,"topic":"Telegraphic speech","difficulty":2,"stem":"Telegraphic speech, which emerges at 18–24 months, is characterized by:","stem_zh":"18–24 个月出现的电报式语言，其特征是：","options":["single words that express a whole sentence's meaning","content words with the less meaningful parts of speech omitted","full adult-like grammatical sentences","vowel-plus-consonant babbling"],"options_zh":["一个词表达整句意义","只保留实词、省略意义较弱的词类","接近成人的完整语法句","元音加辅音的咿呀语"],"answer":1,"explain":"**Telegraphic speech**（电报句）由实词构成、省略意义较弱的词类，并已体现词序重要性（'Mommy drink' 而非 'Drink Mommy'）；单个词表达整句是 **holophrase**；元音＋辅音是 **babbling**。","source":"L4 p.45"},{"id":"gC-22","gate":"C","lecture":4,"topic":"Vocabulary style","difficulty":3,"stem":"Compared with American children, Asian children tend to acquire verbs and personal-social words such as 'thank you' and 'please' faster. This difference is attributed to:","stem_zh":"与美国儿童相比，亚洲儿童更快习得动词以及“谢谢”“请”等个人—社交词。这一差异被归因于：","options":["cultural emphasis on interpersonal harmony, which promotes an expressive style","differences in phonological development","larger vocabularies learned by rote","genetic differences in language ability"],"options_zh":["文化强调人际和谐，促进表达型风格","语音发展的差异","通过死记硬背学会的更大词汇量","语言能力的遗传差异"],"answer":0,"explain":"词汇风格存在文化差异：亚洲文化强调人际和谐，促进 **expressive style**（大量个人／社交词），动词习得也更快；**referential style**（以人名物名为主）在头胎中更常见。","source":"L4 p.40"},{"id":"gC-23","gate":"C","lecture":5,"topic":"Attachment phases","difficulty":2,"stem":"The phase of specific attachment (7–9 months) is marked by:","stem_zh":"特定依恋阶段（7–9 个月）的标志是：","options":["positive reactions to both social and nonsocial stimuli","favouritism toward people in general rather than one person","attachment to several family members and regular babysitters","preference for one person, who serves as a secure base for exploration"],"options_zh":["对社会与非社会刺激都作积极反应","一般地偏爱人类而非某一个人","依恋多名家庭成员与固定保姆","偏爱某一个人，并以其作为探索的安全基地"],"answer":3,"explain":"依恋阶段：**asocial phase**（0–6 周，社会与非社会刺激都引发积极反应）→ **indiscriminate attachment**（6 周–6/7 个月，偏爱人不挑人）→ **specific attachment**（7–9 个月，第一份真正依恋、**secure base**）→ **multiple attachments**（9–18 个月，扩展到其他家人与保姆）。","source":"L5 p.20"},{"id":"gC-24","gate":"C","lecture":5,"topic":"Internal working models","difficulty":3,"stem":"According to attachment theory, the mechanism through which early attachment quality predicts later social and emotional outcomes is:","stem_zh":"依恋理论认为，早期依恋质量预测日后社会与情绪结果的机制是：","options":["feeding reinforcement from the caregiver","temperament stability across childhood","**internal working models** of self and others","imitation of the caregiver's behaviour"],"options_zh":["照料者的喂养强化","气质在整个童年期的稳定性","对自我与他人的**内在运作模式**","对照料者行为的模仿"],"answer":2,"explain":"**Internal working models**（内部工作模型）是关于他人是否可靠、自己是否值得被爱的认知表征，被认为是依恋影响后期发展的机制；不安全依恋的 5 岁儿童更易把含糊事件解读为敌意，安全儿童更善于理解与调节情绪。","source":"L5 p.30"},{"id":"gC-25","gate":"C","lecture":5,"topic":"Heritability of temperament","difficulty":2,"stem":"Which finding supports a hereditary contribution to temperament?","stem_zh":"下列哪项发现支持气质具有遗传基础？","options":["Identical twins are more similar in temperament than fraternal twins.","Adopted children resemble their adoptive parents in temperament.","Temperament is unrelated to any genetic factor.","Shared environment fully explains differences in negative emotionality."],"options_zh":["同卵双胞胎的气质比异卵双胞胎更相似","被收养儿童的气质与养父母相似","气质与任何遗传因素无关","共享环境完全解释了消极情绪性的差异"],"answer":0,"explain":"气质具有中等 **heritability**：同卵双生子比异卵双生子更相似。除遗传影响外，家庭环境（共享与非共享环境）与文化也参与塑造气质的表现方式。","source":"L5 p.16"},{"id":"gC-26","gate":"C","lecture":5,"topic":"Emotion regulation","difficulty":3,"stem":"**Effortful control**, which improves with cortical development and caregiver support, involves:","stem_zh":"随皮层发育与照料者支持而改善的**努力控制**，主要涉及：","options":["acquiring display rules automatically at birth","inhibiting impulses and shifting attention to regulate emotion","inheriting an easy temperament","relying on caregivers to soothe the infant"],"options_zh":["出生时自动获得表达规则","抑制冲动并转移注意以调节情绪","遗传到容易型气质","依赖照料者安抚婴儿"],"answer":1,"explain":"**Effortful control**（努力控制）指抑制冲动并转移注意力，是情绪自我调节的核心能力；3–4 岁儿童能用语言说出策略、把唤醒调整到舒适水平，情绪爆发因此减少。","source":"L5 p.7"},{"id":"gC-27","gate":"C","lecture":5,"topic":"Display rules","difficulty":2,"stem":"**Emotional display rules** refer to:","stem_zh":"**情绪表达规则**是指：","options":["innate reflex patterns present at birth","the sequence of attachment phases in infancy","cultural norms about when and how to express emotions, enabling a 3-year-old to mask true feelings","the age at which stranger anxiety peaks"],"options_zh":["出生即有的先天反射模式","婴儿期依恋阶段的顺序","关于表达情绪时机的文化规范；3 岁儿童可掩饰真实感受","陌生人焦虑达到高峰的年龄"],"answer":2,"explain":"**Display rules**（表达规则）是情绪表达的社会规范：3 岁可掩饰真实感受，13 岁仍难以压抑愤怒；年长青少年掌握该能力者更亲社会、更能抵抗同伴压力。","source":"L5 p.10"},{"id":"gC-28","gate":"C","lecture":5,"topic":"Caregiver characteristics","difficulty":3,"stem":"Which caregiver characteristic is most essential for the formation of a secure attachment?","stem_zh":"对安全依恋的形成而言，下列哪项照料者特征最重要？","options":["high family income","a strict feeding schedule","living in a collectivist culture","sensitive, contingent responsiveness to the infant's cues"],"options_zh":["家庭收入高","严格的喂养时间表","生活在集体主义文化中","对婴儿线索作出敏感、相倚的回应"],"answer":3,"explain":"安全依恋需要两类照料者特征：**emotional availability**（能够且愿意形成情感依恋）与 **contingent responsiveness**（对儿童线索敏感并恰当回应），两者都不可缺少；这些特征比收入、喂养安排或文化类型更直接。","source":"L5 p.31"},{"id":"gC-29","gate":"C","lecture":6,"topic":"Self-description","difficulty":2,"stem":"Preschool children (about 3½–5 years) typically describe themselves in terms of:","stem_zh":"学前儿童（约 3 岁半至 5 岁）通常从哪个角度描述自己？","options":["abstract psychological traits and inner feelings","physical characteristics, possessions, and actions","their future careers and ideals","how they compare with peers on tests"],"options_zh":["抽象的心理特质与内在感受","身体特征、所有物与行为","未来的职业与理想","自己在测验中与同伴的比较"],"answer":1,"explain":"3½–5 岁儿童只用身体与行为维度描述自我（红头发、有一只狗、骑车、帮妈妈）；到童年中期与青少年期描述才变得抽象、心理化，并可能使用 **false self-behaviours** 来改善形象。","source":"L6 p.9"},{"id":"gC-30","gate":"C","lecture":6,"topic":"Self-esteem","difficulty":2,"stem":"How does self-esteem differ from self-concept?","stem_zh":"自尊与自我概念有何不同？","options":["**Self-esteem** is the evaluation of one's worth based on the self-concept.","**Self-esteem** is simply another name for self-concept.","**Self-esteem** refers to knowledge of one's physical appearance.","**Self-esteem** is a cognitive stage that appears in adolescence."],"options_zh":["**自尊**是基于自我概念对自身价值的评价","**自尊**只是自我概念的另一个名称","**自尊**指对自身体貌的认识","**自尊**是青春期才出现的认知阶段"],"answer":0,"explain":"**Self-concept** 是‘你如何看待自己’；**self-esteem** 是对自身价值的评价与满意度判断。自尊轨迹：童年较高、青春期下降、成年回升、老年再降；高自尊与较少抑郁、较好身心健康相关。","source":"L6 p.12"},{"id":"gC-31","gate":"C","lecture":6,"topic":"Weiner's attributions","difficulty":3,"stem":"In Weiner's attribution theory, which cause is classified as internal and unstable?","stem_zh":"在韦纳的归因理论中，下列哪种原因被归为内部且不稳定？","options":["**Ability**","**Task difficulty**","**Luck**","**Effort**"],"options_zh":["**能力**","**任务难度**","**运气**","**努力**"],"answer":3,"explain":"**Weiner** 两维度：稳定（能力、任务难度）／不稳定（努力、运气）；内部（能力、努力）／外部（任务难度、运气）。因此努力＝内部＋不稳定；把成功归因于内部稳定因素（能力）是适应性归因。","source":"L6 p.31"},{"id":"gC-32","gate":"C","lecture":6,"topic":"Praise and helplessness","difficulty":3,"stem":"To reduce the risk of learned helplessness, adults should give children:","stem_zh":"为降低习得性无助的风险，成人应给孩子：","options":["**person-oriented praise** such as 'You are a smart boy'","criticism of ability after failure","**process-oriented praise** focused on effort, good ideas, and strategies","tangible rewards for every success"],"options_zh":["“你真聪明”这类**个人取向表扬**","失败后批评其能力","针对努力、好想法与策略的**过程取向表扬**","每次成功都给予有形奖励"],"answer":2,"explain":"预防 **learned helplessness** 应多用 **process-oriented praise**（表扬努力、好想法、有效策略），少用 **person-oriented praise**（‘你真聪明’）；成功只表扬努力、失败时批评能力会助长无助，可通过 **attribution retraining**（把失败归因于不稳定因素）改善。","source":"L6 p.40"},{"id":"gC-33","gate":"C","lecture":6,"topic":"Identity achievement","difficulty":3,"stem":"According to Marcia's framework, which statement about identity achievement is correct?","stem_zh":"按玛西亚的框架，关于同一性达成，下列哪项正确？","options":["It is healthy and is associated with higher self-esteem and fewer personal concerns.","It is the most stressful identity status.","It means never having experienced a crisis.","It is only found in early adolescence."],"options_zh":["它是健康的，与更高自尊、更少个人困扰相关","它是最有压力的同一性状态","它意味着从未经历危机","它只出现在青少年早期"],"answer":0,"explain":"**Identity achievement**（达成）是健康状态，自尊较高、个人困扰较少；**moratorium**（延缓）并非压力状态，而是积极探索期；12–18 岁多数为 **diffusion** 或 **foreclosure**，21 岁及以上多为 moratorium 或稳定达成。","source":"L6 p.49"},{"id":"gC-34","gate":"C","lecture":7,"topic":"Sex and gender","difficulty":2,"stem":"A researcher studies how a culture's expectations about men and women shape behaviour, treating these expectati
