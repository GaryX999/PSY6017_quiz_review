consistency** (gender stays consistent across situations)","**Gender typing** (acquiring a gender role)"]},{"id":"d1-l7-015","day":1,"lecture":7,"topic":"性别图式理论","difficulty":2,"type":"direct","stem":"按 **gender-schema theory**，儿童把性别当作图式后会怎样处理信息？","options":["只关注与自己性别无关的信息，以扩大视野","记住与性别图式一致的信息，遗忘不一致的信息","先建立道德判断图式，再建立性别图式","停止学习性别知识，以免刻板印象加深"],"answer":1,"option_notes":["图式会引导注意与记忆，但方向是偏向与图式一致的信息。","**Gender schema** 作为加工社会信息的脚本：编码并记住一致信息，遗忘不一致信息。","图式理论不以道德判断为前提；儿童获得基本性别认同后即建构性别图式。","获得基本性别认同会促使儿童主动学习性别知识，而非停止。"],"explain":"**Martin & Halverson** 的性别图式理论：儿童把性别当图式组织世界，先有基本性别认同 → 主动学性别知识 → 形成内群体/外群体图式与 **own-sex schema** → 图式成为编码、记忆社会信息的脚本。","source":"L7 p.36","tags":["gender-schema theory","Martin & Halverson","own-sex schema"],"stem_en":"According to **gender-schema theory**, how do children process information once they use gender as a schema?","options_en":["They focus only on information unrelated to their own sex in order to broaden their horizons.","They encode and remember information consistent with their gender schemas and forget schema-inconsistent information.","They first build a moral-judgment schema and then a gender schema.","They stop learning gender-related knowledge so that stereotypes do not deepen."]},{"id":"d1-l7-016","day":1,"lecture":7,"topic":"减少刻板印象","difficulty":3,"type":"direct","stem":"为减少性别刻板印象对表现的影响，PPT 建议“预先告知学生刻板印象的危害”，其作用机制是什么？","options":["让学生相信能力由遗传决定，以降低考试焦虑","用奖励让学生忽视刻板印象的存在","要求女生考前额外练习，以抵消刻板印象","让学生把焦虑与自身能力分开，把焦虑归因于刻板印象"],"answer":3,"option_notes":["能力遗传论反而会强化刻板印象与无助感，无助于减焦虑。","PPT 建议的是平等机会与更多鼓励，而非用奖励掩盖问题。","额外练习曲解了“提供平等成功机会”的原意。","**Forewarning**：学生了解刻板印象的负面影响后，可把焦虑归因于刻板印象，减弱其对表现的影响。"],"explain":"减少刻板印象的方向有四个：提供平等成功机会、对处于负面刻板印象中的学生给予更多鼓励、预先告知刻板印象的危害（分离归因），以及教师觉察并挑战自身的性别刻板印象。","source":"L7 p.41","tags":["forewarning","gender equity","stereotype"],"stem_en":"To reduce the impact of gender stereotypes on performance, the lecture suggests “forewarning students about the dangers of stereotypes.” What is the mechanism behind this strategy?","options_en":["Having students believe that ability is genetically determined, so that test anxiety decreases.","Using rewards to make students ignore the existence of stereotypes.","Requiring girls to practise extra before examinations to offset stereotypes.","Helping students separate anxiety from their own ability and attribute it to stereotypes."]},{"id":"d1-l8-001","day":1,"lecture":8,"topic":"攻击定义","difficulty":1,"type":"direct","stem":"按 PPT 的定义，判断某行为是否属于 **aggression**，关键依据是什么？","options":["行为造成的后果是否严重","行为者是否有意伤害一个想避免此对待的活着的个体","行为是否被旁观者视为暴力","行为是否违反校规或法律"],"answer":1,"option_notes":["定义强调**意图**而非后果：无意造成伤害不算攻击。","**Aggression**：旨在伤害或损害一个想避免此对待的活着的个体；看意图不看后果。","旁观者是否视为暴力，并非心理学定义的标准。","法律或校规的标准，与攻击行为的心理学定义并不相同。"],"explain":"PPT 用四个短句作判断：有意图但没打中（missed）仍算攻击；无意图但造成伤害（rough-and-tumble play）不算。核心是“**intent**, not consequences”（看意图不看后果）。","source":"L8 p.2","tags":["aggression","intent"],"stem_en":"According to the lecture's definition, what is the key criterion for deciding whether a behaviour counts as **aggression**?","options_en":["Whether the consequences of the behaviour are serious","Whether the actor intends to harm a living being who is motivated to avoid such treatment","Whether onlookers regard the behaviour as violence","Whether the behaviour violates school rules or the law"]},{"id":"d1-l8-002","day":1,"lecture":8,"topic":"攻击类型","difficulty":1,"type":"direct","stem":"男孩抢玩具时把对方推倒；另一男孩打妹妹是为了让她哭。这两种攻击分别是？","options":["两者都是 **hostile aggression**","两者都是 **instrumental aggression**","前者 **hostile**，后者 **instrumental**","前者 **instrumental**，后者 **hostile**"],"answer":3,"option_notes":["两种行为目的不同，不能都归为敌意型攻击。","前者以伤害为手段，后者以伤害为目的，不能都归为工具型。","方向相反：抢玩具者的伤害是手段，打妹妹者的伤害是目的。","推倒对方以抢玩具=**instrumental**；打妹妹让她哭=**hostile**。"],"explain":"区分标准是“伤害是不是目的”：**hostile aggression** 以伤害受害者为目标；**instrumental aggression** 把伤害当作达到其他目标（如抢玩具）的手段。","source":"L8 p.3","tags":["hostile aggression","instrumental aggression"],"stem_en":"A boy pushes another child over while grabbing a toy; another boy hits his sister in order to make her cry. What type of aggression does each act represent?","options_en":["Both are **hostile aggression**.","Both are **instrumental aggression**.","The first is **hostile**; the second is **instrumental**.","The first is **instrumental**; the second is **hostile**."]},{"id":"d1-l8-003","day":1,"lecture":8,"topic":"关系攻击","difficulty":1,"type":"direct","stem":"下列哪项最符合 **relational aggression**（关系攻击）的定义？","options":["推撞同学、破坏对方的财物","以暴力威胁、辱骂或恶意嘲笑伤害他人","以社交排斥、恶意八卦或操纵友谊破坏同伴关系","因愤怒而冲动打人，事后感到后悔"],"answer":2,"option_notes":["这属于**physical aggression**（身体攻击）。","这属于**verbal aggression**（言语攻击）。","**Relational aggression**：以社交排斥、恶意八卦、操纵友谊破坏同伴关系。","这是冲动性的身体攻击描述，不只是关系攻击。"],"explain":"PPT 把攻击分为身体、言语、关系三类。关系攻击的独特之处是不直接动手或当面辱骂，而是利用人际关系网络（排挤、谣言、友谊操纵）伤害对方。","source":"L8 p.4","tags":["relational aggression","physical aggression","verbal aggression"],"stem_en":"Which of the following best matches the definition of **relational aggression**?","options_en":["Pushing classmates and destroying their property","Harming others through threats of physical aggression, name-calling, or hostile teasing","Damaging peer relationships through social exclusion, malicious gossip, or friendship manipulation","Hitting others impulsively out of anger and feeling regret afterwards"]},{"id":"d1-l8-004","day":1,"lecture":8,"topic":"发展趋势","difficulty":2,"type":"direct","stem":"根据 PPT，关于儿童期攻击行为的发展趋势，下列哪项描述正确？","options":["3–5 岁身体攻击下降，被言语攻击取代","身体攻击在 3–5 岁后一路上升至青春期","工具性攻击在儿童中期增加","多数儿童在儿童中期仍维持高水平身体攻击"],"answer":0,"option_notes":["2–3 岁身体报复出现；3–5 岁身体攻击下降，被戏弄、打小报告等言语攻击取代。","多数儿童在儿童中期身体攻击已相对少见，不会一路上升。","PPT 说工具性攻击减少、敌意性攻击略增。","仅约 3% 儿童有高水平攻击，并非多数。"],"explain":"发展轨迹可记为“身体→言语、工具→敌意”：幼儿争玩具多为工具性攻击，3–5 岁后言语攻击增多，到儿童中期身体攻击变少，工具性攻击减少而敌意性攻击略升。","source":"L8 p.7","tags":["developmental trends","verbal aggression","instrumental aggression"],"stem_en":"According to the lecture, which description of developmental trends in childhood aggression is correct?","options_en":["Physical aggression declines at 3–5 years and is replaced by verbal aggression.","Physical aggression keeps rising after 3–5 years until adolescence.","Instrumental aggression increases during middle childhood.","Most children maintain high levels of physical aggression in middle childhood."]},{"id":"d1-l8-005","day":1,"lecture":8,"topic":"性别差异","difficulty":2,"type":"direct","stem":"根据 PPT，关于攻击性的性别差异，下列哪一项描述是正确的？","options":["非常年幼的男孩已明显比女孩更具攻击性","约 2.5–3 岁起男孩身体与言语攻击更强，女孩更倾向关系攻击","睾酮水平与攻击性没有关系","女孩更多使用身体攻击"],"answer":1,"option_notes":["PPT 引用 **Hay** 等（2000）：很小的男孩并不比女孩更具攻击性。","约 2.5–3 岁起男孩身体/言语攻击更强，女孩更倾向**关系攻击**（隐性攻击）。","PPT 把睾酮水平较高列为造成差异的因素之一。","方向相反：身体与言语攻击以男孩更为突出。"],"explain":"性别差异在攻击形式上最清楚：男孩外显攻击（身体、言语）更强，女孩关系/隐性攻击更多。PPT 提醒很小的男孩并不比女孩更具攻击性，差异约在 2.5–3 岁才明确。","source":"L8 p.8","tags":["sex differences","relational aggression","testosterone"],"stem_en":"According to the lecture, which statement about sex differences in aggression is correct?","options_en":["Very young boys are already clearly more aggressive than girls.","From about 2½–3 years, boys are more physically and verbally aggressive, while girls are more relationally aggressive.","Testosterone levels are unrelated to aggression.","Girls use physical aggression more often."]},{"id":"d1-l8-006","day":1,"lecture":8,"topic":"攻击者类型","difficulty":2,"type":"direct","stem":"按 PPT 的分类，**reactive aggressor** 的核心特点是什么？","options":["敌意、报复性攻击，对他人保持警惕","把攻击当作获取实际利益、提升自尊的工具","冷静计算攻击是否最有效，冲突中感到快乐","极少使用攻击，只在被指派时才行动"],"answer":0,"option_notes":["**Reactive aggressors**：敌意、报复性攻击，对他人警惕，常带敌意归因偏差。","这是**proactive aggressors** 的特点：攻击带来实际利益、提升自尊。","这也是**proactive aggressors**：冷静评估、预期武力有效、冲突中可能出现积极情绪。","两类高攻击儿童都频繁使用攻击，此描述与两类都不符。"],"explain":"两类高攻击儿童：**proactive**（工具性、冷静、追求利益与掌控）与 **reactive**（敌意、报复、警惕）。后续 PPT 用社会信息加工理论说明 reactive 攻击者的敌意归因偏差。","source":"L8 p.11","tags":["proactive aggressors","reactive aggressors"],"stem_en":"According to the lecture's classification, what is the core characteristic of a **reactive aggressor**?","options_en":["Hostile, retaliatory aggression and a wary attitude towards others","Using aggression as a tool to obtain tangible benefits and enhance self-esteem","Calmly calculating whether aggression is most effective and feeling happy during conflict","Rarely using aggression unless instructed to do so"]},{"id":"d1-l8-007","day":1,"lecture":8,"topic":"高压家庭","difficulty":3,"type":"direct","stem":"下列哪项最符合 PPT 对“**coercive home environment**”的描述？","options":["父母以温暖、理性、非惩罚的方式管教并解释规则","家庭冲突多以友好而双方满意的解决方式收场","成员互相刁难、威胁或激怒；父母忽视亲社会、放大轻微不当","父母对孩子的行为完全放任，不做任何回应"],"answer":2,"option_notes":["这是书中提倡的理性、非惩罚管教，与高压家庭相反。","高压家庭的孩子恰恰缺少这种友好的冲突解决示范。","**Coercive home environments**：成员互相刁难/威胁/激怒，高压互动被负强化；忽视亲社会、放大轻微不当。","高压家庭是高介入、高控制的，并非放任不管。"],"explain":"高压家庭的核心是“负强化循环”：一方施压、另一方停止被激怒的行为，施压行为因此被强化；父母忽略亲社会行为、放大轻微不当行为，最终形成敌意家庭氛围，滋生攻击。","source":"L8 p.20","tags":["coercive home environments","negative reinforcement"],"stem_en":"Which of the following best matches the lecture's description of a **coercive home environment**?","options_en":["Parents discipline with warmth, reason, and non-punitive methods and explain the rules.","Family conflicts are usually resolved in an amicable and mutually satisfying way.","Members needle, threaten, or irritate one another; parents ignore prosocial behaviour and overinterpret minor misconduct.","Parents are completely permissive and never respond to their child's behaviour."]},{"id":"d1-l8-008","day":1,"lecture":8,"topic":"利他定义","difficulty":1,"type":"direct","stem":"按 PPT 的定义，**altruism**（利他主义）指的是什么？","options":["任何旨在使他人受益的行为","以获得奖励为目的的助人行为","只针对家人、不针对陌生人的帮助行为","通过亲社会行为表现的对他人福祉的关怀"],"answer":3,"option_notes":["这是**prosocial behavior**（亲社会行为）的定义，范围更广。","利他关注的是他人福祉，并不以获取奖励为目的。","利他的定义并不以家人或陌生人来区分帮助对象。","**Altruism**：通过亲社会行为表现出的对他人福祉的关怀，正确。"],"explain":"记忆要点：**prosocial behavior** 是行为层（任何意在使他人受益的行动），**altruism** 是关怀层（对他人福祉的关心，透过亲社会行为表现）。两者相关但不等义。","source":"L8 p.24","tags":["altruism","prosocial behavior"],"stem_en":"According to the lecture's definition, what does **altruism** refer to?","options_en":["Any action intended to benefit another","Helping behaviour performed in order to obtain rewards","Helping that is directed only at family members and not at strangers","Concern for the welfare of others that is expressed through prosocial behaviour"]},{"id":"d1-l8-009","day":1,"lecture":8,"topic":"利他起源","difficulty":2,"type":"direct","stem":"根据 PPT，父母的管教方式与幼儿的共情能力之间，存在什么关系？","options":["口头斥责与体罚降低共情；情感解释的管教提升共情","体罚能有效提升共情，因为让孩子记住后果","管教方式与共情无关，共情完全由气质决定","只有口头表扬能提升共情，解释没有作用"],"answer":0,"option_notes":["**Affective explanation**（如“你把弟弟弄哭了；掐人是不对的”）有助共情；斥责与体罚会降低共情。","PPT 明确指出体罚降低共情，而非提升共情。","气质确有影响（如行为抑制型），但父母影响同样重要。","关键是以情感解释说明行为后果，而非只有口头表扬。"],"explain":"利他的起源有两个来源：气质差异（行为抑制型儿童易被他人的痛苦困扰或回避）与父母影响（斥责、体罚降低共情；以情感解释为主的管教提升共情）。","source":"L8 p.26","tags":["altruism","empathy","affective explanation"],"stem_en":"According to the lecture, what relationship exists between parents' discipline practices and young children's compassion?","options_en":["Verbal rebukes and physical punishment reduce compassion, whereas affective explanation increases it.","Physical punishment effectively increases compassion because it makes children remember the consequences.","Discipline is unrelated to compassion; compassion is determined entirely by temperament.","Only verbal praise increases compassion; explanation has no effect."]},{"id":"d1-l8-010","day":1,"lecture":8,"topic":"共情与苦恼","difficulty":2,"type":"direct","stem":"按 PPT，**sympathetic empathic arousal** 与 **self-oriented distress** 对利他的作用分别是？","options":["前者抑制利他，后者促进利他","前者促进利他，后者抑制利他","两者都促进利他","两者都抑制利他"],"answer":1,"option_notes":["两者作用正好颠倒：前者促进、后者抑制利他。","前者（对困境中他人的关心）促进利他；后者（个人苦恼）使人只顾缓解自身不适。","**Self-oriented distress**（个人苦恼）会抑制利他，不会促进。","**Sympathetic empathic arousal** 会促进利他，不会抑制。"],"explain":"**Empathy** 是体验他人情绪的能力，本身不保证助人：若唤起被解读为“个人苦恼”，儿童会为减轻自己的不适而回避；只有转化为对困境者的关心（**sympathetic empathic arousal**）才促进利他。","source":"L8 p.30","tags":["empathy","sympathetic empathic arousal","personal distress"],"stem_en":"According to the lecture, what are the respective effects of **sympathetic empathic arousal** and **self-oriented distress** on altruism?","options_en":["The former inhibits altruism, while the latter promotes it.","The former promotes altruism, while the latter inhibits it.","Both promote altruism.","Both inhibit altruism."]},{"id":"d1-l8-011","day":1,"lecture":8,"topic":"奖励与利他","difficulty":3,"type":"direct","stem":"根据 PPT，用有形奖励（如贴纸、礼物）鼓励儿童助人，长期效果最可能是？","options":["儿童把善行归因于想获奖，奖励停止后更少牺牲","儿童内化利他价值观，奖励停止后仍持续助人","有形奖励与言语强化的效果完全相同","有形奖励只在短期内降低助人，长期无效"],"answer":0,"option_notes":["**Tangible rewards**：儿童把友善行为归因于获取奖励，而非关心他人；奖励停止后较少为他人牺牲。","价值观内化来自有理由的言语强化与示范，而非有形奖励。","PPT 区分二者：言语强化提升利他，有形奖励降低利他。","负面效果主要在奖励停止后显现，而非“长期无效”。"],"explain":"PPT 把强化分成两类：可亲可敬的成人给予**言语强化**能提升利他；**有形奖励**反而降低利他，因为儿童把行为归因于奖励而非对他人的关心。这提示培养内化动机比外诱因更重要。","source":"L8 p.35","tags":["reinforcement","tangible rewards","altruism"],"stem_en":"According to the lecture, what is the most likely long-term effect of giving children tangible rewards (such as stickers or gifts) for helping others?","options_en":["Children attribute their kind acts to earning a reward and are less likely to make sacrifices once rewards stop.","Children internalize altruistic values and keep helping after rewards stop.","Tangible rewards and verbal reinforcement have exactly the same effect.","Tangible rewards reduce helping only in the short term and have no long-term effect."]},{"id":"d1-l8-012","day":1,"lecture":8,"topic":"道德三成分","difficulty":1,"type":"direct","stem":"发展学家把道德分为情感、认知、行为三个成分，下列对应正确的是？","options":["情感=推理；认知=内疚与关心；行为=实际表现","情感=实际表现；认知=内疚；行为=推理","三个成分只适用于成人，儿童只有行为成分","情感=内疚与关心；认知=对错推理；行为=面对诱惑的实际表现"],"answer":3,"option_notes":["把情感与认知对调了：推理与判断属于认知成分。","三个成分被完全错配：情感不是行为，行为也不是推理。","该三成分框架适用于儿童的道德发展，并非只限成人。","**Affective**=内疚与关心；**cognitive**=推理；**behavioral**=面对诱惑时的实际行为，正确。"],"explain":"三成分框架用于定位理论：强调内疚与关怀的是情感成分，强调推理与判断的是认知成分，强调面对诱惑时怎么做的是行为成分。分析任何道德理论先问它偏重哪个成分。","source":"L8 p.38","tags":["morality","affective component","cognitive component","behavioral component"],"stem_en":"Developmentalists divide morality into affective, cognitive, and behavioural components. Which set of correspondences is correct?","options_en":["Affective = reasoning; cognitive = guilt and concern; behavioural = actual behaviour","Affective = actual behaviour; cognitive = guilt; behavioural = reasoning","The three components apply only to adults; children have only the behavioural component.","Affective = guilt and concern for others; cognitive = reasoning about right and wrong; behavioural = actual behaviour when tempted"]},{"id":"d1-l8-013","day":1,"lecture":8,"topic":"他律道德","difficulty":2,"type":"direct","stem":"按 **Piaget** 的理论，处于 **heteronomous morality** 的儿童最可能怎样判断？","options":["认为规则可由同伴协商修改，并依据意图判断","对规则几乎没有意识，自行发明规则","认为规则由权威制定不可更改，依据客观后果判断","认为规则可为了人类需要而被违反"],"answer":2,"option_notes":["这是 **autonomous morality**（约 10–11 岁后）的特征。","这是 **pre-moral period**（5 岁前）的表现。","**Heteronomous morality**（约 5–10 岁）：规则不可更改、依客观后果判断、倾向赎罪式惩罚。","这也是 **autonomous morality** 的主张。"],"explain":"**Piaget** 三阶段：**pre-moral**（5 岁前，对规则无意识）→ **heteronomous**（5–10 岁，道德绝对主义、看后果、赎罪式惩罚）→ **autonomous**（10–11 岁后，规则可变、看意图、互惠式惩罚）。","source":"L8 p.40","tags":["Piaget","heteronomous morality","moral realism"],"stem_en":"According to **Piaget**'s theory, how are children in the stage of **heteronomous morality** most likely to make judgments?","options_en":["They believe rules can be changed through negotiation among peers and judge according to intentions.","They have almost no awareness of rules and invent their own rules.","They believe rules are laid down by authority figures and cannot be altered, and they judge by objective consequences.","They believe rules may be violated in the service of human needs."]},{"id":"d1-l8-014","day":1,"lecture":8,"topic":"自律道德","difficulty":2,"type":"direct","stem":"在 **Piaget** 的“谁更淘气”故事中，处于 **autonomous morality** 的儿童会怎样判断？","options":["认为打碎 15 个杯子的约翰更淘气，因后果更严重","认为为拿果酱打碎 1 个杯子的亨利更淘气，因意图不良","认为两人一样淘气，因为都打碎了杯子","拒绝判断，因为故事没有交代父母的惩罚"],"answer":1,"option_notes":["这是 **heteronomous morality** 依客观后果判断的表现。","**Autonomous morality**：依**意图**判断，亨利意图不良所以更淘气。","两个阶段都不只按“都打碎杯子”等同处理，重点是判断依据。","**Piaget** 关注儿童的判断理由，儿童通常仍会作答。"],"explain":"同一故事两种答案：**heteronomous** 看结果（约翰打碎 15 个 → 更淘气）；**autonomous** 看意图（亨利想偷果酱 → 更淘气）。这一对照是 Piaget 道德发展理论最经典的考法。","source":"L8 p.44","tags":["Piaget","autonomous morality","intentions"],"stem_en":"In **Piaget**'s “Who is naughtier?” story, how would a child at the stage of **autonomous morality** judge?","options_en":["They would say John, who broke 15 cups, is naughtier because the consequences were more serious.","They would say Henry, who broke 1 cup while trying to get jam, is naughtier because his intention was bad.","They would say both are equally naughty because both broke cups.","They would refuse to judge because the story does not state the parents' punishment."]},{"id":"d1-l8-015","day":1,"lecture":8,"topic":"道德阶段结构","difficulty":2,"type":"direct","stem":"关于 **Kohlberg** 的道德发展理论，下列哪项正确？","options":["道德发展是连续累积的过程，阶段划分只是人为标签","道德阶段与年龄一一对应，同龄儿童必在同一阶段","三个水平各含两个阶段，共六阶段，后阶段取代前一阶段","道德发展顺序由文化决定，各社会不同"],"answer":2,"option_notes":["**Kohlberg** 是阶段理论：各阶段性质不同、按普遍顺序推进；道德发展不是“连续累积、无阶段”。","阶段与年龄并非一一对应；发展依赖认知能力，同龄儿童可处于不同阶段。","三级水平×两阶段=六阶段；依赖认知能力；后阶段由前一阶段发展而来并取代之。","阶段顺序具普遍性；“文化偏向”是对他的批评，而非他的主张。"],"explain":"**Kohlberg** 用 **Heinz dilemma**，重点不在“偷不偷”，而在判断的**理由**：三个水平（前习俗、习俗、后习俗）× 两个阶段 = 六阶段，后阶段由前一阶段发展而来并取代它。","source":"L8 p.47","tags":["Kohlberg","moral development","Heinz dilemma"],"stem_en":"Which statement about **Kohlberg**'s theory of moral development is correct?","options_en":["Moral development is a continuous cumulative process, and stage divisions are merely artificial labels.","Moral stages correspond one-to-one with ages, so children of the same age must be at the same stage.","There are three levels with two stages each—six stages in total—and each later stage evolves from and replaces the earlier one.","The sequence of moral development is determined by culture, so it differs across societies."]},{"id":"d1-l8-016","day":1,"lecture":8,"topic":"阶段 4","difficulty":2,"type":"direct","stem":"一名青少年说：“偷窃始终是错的，法律必须被遵守，否则社会秩序无法维持。”按 **Kohlberg** 的分类，这属于？","options":["阶段 1：惩罚与服从定向","阶段 2：朴素利己主义","阶段 3：“好孩子/好女孩”定向","阶段 4：维护社会秩序的道德"],"answer":3,"option_notes":["阶段 1 以避免惩罚为理由，题干强调的却是法律与社会秩序。","阶段 2 以自身利益与交换关系作为判断理由。","阶段 3 以获得他人认可、当个好人作理由。","**Stage 4**：考虑法律体现的社会意志，守法是为维护值得保存的社会秩序，法律高于特殊利益。"],"explain":"**Kohlberg** 的阶段判断看“理由”：阶段 4 的标记是“法律/社会秩序值得维护”，不是因为怕罚（阶段 1）、为自身利益（阶段 2）或想被称赞（阶段 3）。","source":"L8 p.52","tags":["Kohlberg","social-order-maintaining","stage 4"],"stem_en":"An adolescent says: “Stealing is always wrong, and the law must be obeyed; otherwise social order cannot be maintained.” According to **Kohlberg**'s classification, which stage is this?","options_en":["Stage 1: punishment-and-obedience orientation","Stage 2: naïve hedonism (self-interest)","Stage 3: “good boy/good girl” orientation","Stage 4: social-order-maintaining morality (law and order)"]},{"id":"d1-l8-017","day":1,"lecture":8,"topic":"惩罚与理由","difficulty":3,"type":"direct","stem":"根据 PPT，惩罚时向儿童说明理由，为什么能促进道德的内化？","options":["理由帮助儿童做内部归因（内疚、损害自我形象）","理由让惩罚更严厉，因此更有效","理由只让儿童当下更服从，与内化无关","不说明理由的惩罚更能培养内疚感"],"answer":0,"option_notes":["说明理由→内部归因（内疚、损害自我形象）；无理由→外部归因，只在权威在场时服从。","促进道德内化的是说明理由，而不是惩罚的强度。","PPT 正相反：外部归因只在权威在场时有效，理由才促成内化。","无理由的惩罚导致外部归因，不能培养内疚。"],"explain":"同一惩罚有两条路径：给理由 → 儿童明白“为何错”→ 内疚、自我形象受损（内部归因）；不给理由 → 只为避免惩罚（外部归因）。配套做法是 **moral self-concept training**，告诉孩子“你是诚实、负责任的人”。","source":"L8 p.61","tags":["internal attributions","moral self-concept","punishment"],"stem_en":"According to the lecture, why does explaining the reasons when punishing a child promote moral internalization?","options_en":["Reasons help children make internal attributions (guilt, damage to self-image).","Reasons make punishment harsher and therefore more effective.","Reasons only make children comply in the moment and are unrelated to internalization.","Punishment without reasons is better at cultivating feelings of guilt."]},{"id":"d1-l8-018","day":1,"lecture":8,"topic":"管教策略","difficulty":1,"type":"direct","stem":"按 PPT，关于三种管教策略与儿童道德发展的关系，下列哪项正确？","options":["**Power assertion** 与道德发展多呈正相关","**Love withdrawal** 与道德发展多正相关","**Induction** 与道德发展多正相关","三种管教策略都与道德发展正相关"],"answer":2,"option_notes":["**Power assertion** 多与道德发展负相关，不是正相关。","**Love withdrawal** 多负相关，不是正相关（方向见 p.64 的 Table 13.4）。","**Induction**（引导/解释）与道德发展多呈正相关，是促进内化的策略。","PPT 显示三种管教策略的方向不同，并非都正相关。"],"explain":"**Induction** 有效的原因：提供评估行为的理由、帮助共情他人、让父母能谈自豪/内疚/羞耻等道德情感，并说明如何弥补过错。相反，权力主张与爱的收回制造焦虑与表面服从，难以促成内化。","source":"L8 p.64","tags":["induction","power assertion","love withdrawal"],"stem_en":"According to the lecture, which statement about the relationship between three disciplinary strategies and children's moral development is correct?","options_en":["**Power assertion** is mostly positively correlated with moral development.","**Love withdrawal** is mostly positively correlated with moral development.","**Induction** is mostly positively correlated with moral development.","All three disciplinary strategies are positively correlated with moral development."]},{"id":"d1-l9-001","day":1,"lecture":9,"topic":"生态系统层级","difficulty":2,"type":"direct","stem":"按 **Bronfenbrenner** 的生态系统理论，家长与班主任定期沟通、家校合作顺畅，这种“两个微系统之间的联结”属于哪一层系统？","options":["**Microsystem**（微系统）","**Mesosystem**（中系统）","**Exosystem**（外系统）","**Macrosystem**（宏观系统）"],"answer":1,"option_notes":["**Microsystem**：儿童亲身参与的直接情境，如家庭、玩伴、班级；它是单个情境，本身不是两个系统之间的联结。","**Mesosystem**：微系统之间的联结，如家庭与学校；题干的家校沟通正是两端之间的桥梁，支持性联结可优化发展。","**Exosystem**：儿童不参与、却会间接影响其发展的情境，例如父母的工作环境。","**Macrosystem**：包裹其他系统的文化、亚文化与社会阶层背景，层级最高，不是具体情境间的联系。"],"explain":"区分关键在“儿童是否在场”加上“看单个情境还是情境之间的桥”。家校沟通发生在家庭与学校两端之间，所以是 mesosystem；若问“父亲公司裁员影响孩子”，那才是 exosystem。","source":"L9 p.3","tags":["Bronfenbrenner","mesosystem","ecological systems"],"stem_en":"According to **Bronfenbrenner**'s ecological systems theory, when parents and the class teacher communicate regularly and home-school cooperation runs smoothly, this connection between two microsystems belongs to which level of the system?","options_en":["**Microsystem**","**Mesosystem**","**Exosystem**","**Macrosystem**"]},{"id":"d1-l9-002","day":1,"lecture":9,"topic":"生态系统层级","difficulty":1,"type":"direct","stem":"父亲任职的公司突然裁员、家庭经济转紧，但孩子从未踏进过父亲的公司。按生态系统理论，父亲的工作环境属于哪一层？","options":["**Microsystem**（微系统）","**Mesosystem**（中系统）","**Exosystem**（外系统）","**Chronosystem**（时序系统）"],"answer":2,"option_notes":["**Microsystem**：儿童亲身参与的直接情境；父亲的公司不是孩子身处的环境。","**Mesosystem**：两个微系统之间的联结，如家庭与学校的沟通，不是单一的外部情境。","**Exosystem**：儿童不参与、但会间接影响其发展的情境，父母的工作环境正是本讲给的典型例子。","**Chronosystem**：儿童或系统随时间发生的改变，如青春期的认知与生理变化，属时间轴而非空间层级。"],"explain":"exosystem 的判准是“孩子不在其中，但它的变化会传进孩子的生活”，工作环境、父母的社会支持网络都是标准例子。chronosystem 管的是时间上的变化，别与空间层级混为一谈。","source":"L9 p.4","tags":["exosystem","Bronfenbrenner"],"stem_en":"The company where the father works suddenly lays off staff and the family's finances become tight, yet the child has never set foot in the father's workplace. According to ecological systems theory, the father's work environment belongs to which level?","options_en":["**Microsystem**","**Mesosystem**","**Exosystem**","**Chronosystem**"]},{"id":"d1-l9-003","day":1,"lecture":9,"topic":"家庭功能","difficulty":1,"type":"direct","stem":"本讲认为家庭最主要的功能是 **socialization**。下列哪一句最准确地描述这一过程？","options":["两个以上因出生、婚姻、收养或选择而联结、彼此有情感与责任的人","父母以坚定合理的纪律规范并监督儿童日常活动","儿童或环境系统随时间推移而发生的改变","儿童习得社会认为恰当的信念、动机、价值观与行为的过程"],"answer":3,"option_notes":["这是本讲对“家庭”的结构定义（成员构成与情感责任），不是社会化的过程。","这是 **behavioral control** 的描述：以纪律与监督规范儿童行为。","这是 **chronosystem** 的描述，指生态系统在时间维度上的变化。","正解：社会化就是儿童习得被社会视为恰当的信念、动机、价值观与行为，这是本讲给家庭的主要功能下的定义。"],"explain":"L9 对家庭只给了两个必背定义：功能是 **socialization**（习得社会认可的一套信念、动机、价值观与行为）；结构是两人以上、因出生/婚姻/收养/选择而联结且有情感纽带与责任。概念题常把两者互换做干扰。","source":"L9 p.5","tags":["socialization","family"],"stem_en":"This lecture states that the major function of the family is **socialization**. Among the following sentences, which one most accurately describes what this process involves?","options_en":["Two or more persons, related by birth, marriage, adoption, or choice, who have emotional ties and responsibilities to each other","Parents regulate and monitor the child's daily activities through firm, reasonable discipline","Changes in the child or in the environmental systems over time","The process by which children acquire the beliefs, motives, values, and behaviors considered appropriate by their society"]},{"id":"d1-l9-004","day":1,"lecture":9,"topic":"教养两维度","difficulty":1,"type":"direct","stem":"本讲用两个维度区分教养方式。其中“父母管教或监督的程度”指的是哪一个维度？","options":["**Demandingness/control**（要求／控制）","**Acceptance/responsiveness**（接纳／回应）","**Behavioral control**（行为控制）","**Psychological control**（心理控制）"],"answer":0,"option_notes":["正解：**demandingness/control** 指父母订立规范与监督的程度；要求高者设限以确保规则被遵守，要求低者给予较大自由。","**Acceptance/responsiveness** 是另一维度，指父母展现的支持与关爱程度，不是管教监督的量。","**Behavioral control** 是行为控制，属具体的纪律做法，不是划分四种类型的那个抽象轴。","**Psychological control** 是心理控制，指以收回关爱、诱发羞耻内疚来影响孩子，同样不是这两个维度之一。"],"explain":"两个轴要成对记：一个管“爱与回应”，一个管“要求与监督”。四种教养方式就是这个 2×2 的产物——先轴后型，题目无论怎么换例子都能推回去。","source":"L9 p.8","tags":["parenting styles","Baumrind","demandingness"],"stem_en":"This lecture uses two dimensions to distinguish parenting styles. Which of these dimensions refers to 'the amount of regulation or supervision parents undertake'?","options_en":["**Demandingness/control**","**Acceptance/responsiveness**","**Behavioral control**","**Psychological control**"]},{"id":"d1-l9-005","day":1,"lecture":9,"topic":"专制型教养","difficulty":1,"type":"direct","stem":"下列哪一组描述最符合 **authoritarian** 教养方式？","options":["**Authoritative**：有控但灵活，说明理由、理性民主","**Authoritarian**：限制严苛，要求服从、不解释原因","**Permissive**：接纳但宽松，要求少、几乎不监督","**Uninvolved**：极宽松、缺乏要求，可能拒斥孩子"],"answer":1,"option_notes":["**Authoritative**：有控制但灵活，提合理要求并说明限制的理由，理性民主，孩子通常能力较强、适应良好。","**Authoritarian**：限制严苛、要求服从、不解释设限原因、对孩子观点不敏感、多用惩罚，常致发展结果欠佳。","**Permissive**：接纳但宽松、要求少、几乎不监督，发展结果往往也不理想。","**Uninvolved**：极为宽松、缺乏要求，可能拒斥孩子或不堪重负而无力投入。"],"explain":"四类型的抓手是“要求高低 + 回应高低”。authoritarian 与 authoritative 同为高要求，唯一差别是是否回应、是否解释理由——这是本讲最常设的陷阱。","source":"L9 p.11","tags":["authoritarian","authoritative","parenting styles"],"stem_en":"Which of the following descriptions best fits the **authoritarian** parenting style?","options_en":["**Authoritative**: controlling but flexible, explains the reasons, rational and democratic","**Authoritarian**: very restrictive, expects obedience, does not explain why limits exist","**Permissive**: accepting but lax, few demands, little monitoring","**Uninvolved**: extremely lax and undemanding, may reject the child"]},{"id":"d1-l9-006","day":1,"lecture":9,"topic":"放任与忽视型","difficulty":2,"type":"direct","stem":"**Permissive** 与 **uninvolved** 同属“低要求”，两者最关键的分野在哪里？","options":["要求程度：uninvolved 的要求其实比 permissive 更高","是否体罚：permissive 不打孩子，uninvolved 经常体罚","回应／接纳度：permissive 温暖，uninvolved 冷淡拒斥","孩子年龄：两者分别只见于学前与青春期"],"answer":2,"option_notes":["两者都属低要求；uninvolved 的特征是“极为宽松、缺乏要求”，要求并不会更高。","体罚与强制并不是这条轴的判准；uninvolved 的要害是不投入、不在乎，而非打得更凶。","正解：两者都少设限，差别在父母是否回应——permissive 接纳温暖，uninvolved 低回应、可能拒斥孩子。","四种教养方式在任何年龄都可能出现，本讲没有按年龄阶段分配类型。"],"explain":"四象限里 permissive 与 uninvolved 挤在同一侧（低要求），只能靠回应／接纳这一轴切开。试题若给“给钱不管、情感冷淡”是 uninvolved；“有求必应、从不设限”才是 permissive。","source":"L9 p.12","tags":["permissive","uninvolved","parenting styles"],"stem_en":"Both **permissive** and **uninvolved** parenting belong to the low-demanding end of the two dimensions used in this lecture. What is the most important distinction between the two styles?","options_en":["Level of demandingness: uninvolved parents actually demand more than permissive parents","Use of physical punishment: permissive parents do not hit the child, whereas uninvolved parents often do","Acceptance/responsiveness: permissive parents are warm, whereas uninvolved parents are cold and rejecting","The child's age: the two styles are found only in preschool and in adolescence respectively"]},{"id":"d1-l9-007","day":1,"lecture":9,"topic":"权威型机制","difficulty":2,"type":"direct","stem":"本讲认为 **authoritative** 教养之所以有效，核心机制是什么？","options":["温暖投入的父母示范关怀与自控，孩子内化看似公平合理的规则","父母从不设限，让孩子自由探索以避免亲子冲突","以收回关爱与引发羞耻感迫使孩子服从","以严格监督与惩罚为主，靠外部约束维持服从"],"answer":0,"option_notes":["正解：温暖投入的父母提供关怀与自控的榜样，孩子更愿意顺从并**内化**看起来公平合理的管控，也因被看见“有能力”而长出自尊。","“从不设限”是 **permissive**；authoritative 仍是高要求、会设限，只是会解释理由。","以收回关爱、引发羞耻或内疚来影响行为属于 **psychological control**，与焦虑抑郁相关，不是权威型有效的原因。","以严格监督与惩罚为主是 **authoritarian** 的做法，靠外部约束而非内化。"],"explain":"authoritative 的有效性来自三件事：温暖投入的示范、孩子对“公平合理”规则的**内化**、以及被父母确认为“有能力的人”而长出的自尊与成熟。本讲还强调这些支持性面向是 **resilience** 的重要来源。","source":"L9 p.13","tags":["authoritative","internalization","resilience"],"stem_en":"This lecture asks what makes **authoritative** child-rearing effective. According to the lecture, what is the core mechanism through which this parenting style achieves its effects?","options_en":["Warm, involved parents model caring concern and self-control, and children internalize rules that appear fair and reasonable","Parents never set limits and let the child explore freely so as to avoid parent-child conflict","Parents withhold affection and induce shame in order to force the child to comply","Parents rely mainly on strict supervision and punishment to maintain obedience through external constraint"]},{"id":"d1-l9-008","day":1,"lecture":9,"topic":"行为控制","difficulty":2,"type":"direct","stem":"父母为子女订立明确家规、说明理由，并持续跟进孩子的活动与行踪。这种 **behavioral control** 通常带来什么发展结果？","options":["儿童焦虑、抑郁，学业成绩下降","儿童攻击、自私、叛逆，甚至滥用药物","儿童自尊与成就取向明显高于独生子女","儿童行为端正，较少参与偏差同伴活动"],"answer":3,"option_notes":["这是 **psychological control**（收回关爱、诱发羞耻内疚）的相关结果，不是行为控制。","这是 **uninvolved** 教养方式常见的孩子特征，与有规范的行为控制不同。","这是 Falbo 等人对**独生子女**的研究发现，与父母的纪律方式无关。","正解：以坚定合理的纪律规范行为并监督活动，往往培养出行为端正、不参与偏差同伴活动的孩子。"],"explain":"行为控制与心理控制的分界在“管行为”还是“动关系”：前者靠明确合理的纪律与监督，后者靠收回关爱、羞辱与内疚。前者多与行为端正相连，后者才与焦虑、抑郁等内化问题挂钩。","source":"L9 p.15","tags":["behavioral control","psychological control"],"stem_en":"Parents set clear family rules, explain the reasons for them, and consistently follow up on the child's activities and whereabouts. What developmental outcome does this **behavioral control** usually produce?","options_en":["The child becomes anxious and depressed, and academic achievement declines","The child becomes aggressive, selfish and rebellious, and may even abuse drugs","The child's self-esteem and achievement orientation are clearly higher than those of an only child","The child is well behaved and less involved in deviant peer activities"]},{"id":"d1-l9-009","day":1,"lecture":9,"topic":"手足与心理理论","difficulty":2,"type":"direct","stem":"研究发现，有兄姐的幼儿在 **false-belief** 任务上表现更好。本讲据此认为手足关系特别促进了什么？","options":["**Intersubjectivity**（主体间性）","**Sibling rivalry**（手足竞争）","**Theory of mind**（心理理论）","**Sociability**（社交性）"],"answer":2,"option_notes":["**Intersubjectivity** 指共享意义、意图与目标的能力，本讲说它是**假装游戏**的必要条件，不是手足研究要解释的能力。","**Sibling rivalry** 是手足竞争，本讲把它列为新生儿到来后常见的负面反应，不是认知收益。","正解：**theory of mind** 指理解他人（错误）信念的能力；与兄姐互动深化错误信念理解，正是本讲列出的社会认知收益。","**Sociability** 指愿意与他人互动并寻求关注或认可的倾向，范围过宽，不是错误信念任务所测的能力。"],"explain":"本讲把“兄姐当榜样与老师”与“促进社会认知”分开讲：前者走 **ZPD** 内的直接指导与示范；后者体现在错误信念理解、观点采择、情感理解与协商妥协上。题干问的是后者。","source":"L9 p.19","tags":["siblings","theory of mind","false belief"],"stem_en":"Research finds that preschoolers who have older siblings perform better on **false-belief** tasks. What does this lecture conclude that sibling relationships particularly promote?","options_en":["**Intersubjectivity**","**Sibling rivalry**","**Theory of mind**","**Sociability**"]},{"id":"d1-l9-010","day":1,"lecture":9,"topic":"离婚前冲突","difficulty":1,"type":"direct","stem":"父母尚未正式分居，但家中争吵急剧增加。按本讲对“离婚前”阶段的描述，儿童最典型的变化是什么？","options":["对兄弟姐妹与同伴更具敌意，并出现焦虑、抑郁与外化问题","认知能力短暂提升，因为必须自己解决问题","完全不受影响，因为父母尚未正式离婚","只影响亲子关系，不影响同伴关系"],"answer":0,"option_notes":["正解：本讲指出婚姻冲突剧增会使儿童极度痛苦、对兄弟姐妹与同伴更具敌意，并引发焦虑、抑郁与外化行为障碍。","本讲没有提到认知提升；反而说父母接纳度与敏感度下降、亲子关系质量变差。","离婚是**一系列压力事件**，起点正是分居前的婚姻冲突，此阶段儿童已经高度痛苦。","本讲明确指出敌意会指向**兄弟姐妹与同伴**，影响范围不止亲子关系。"],"explain":"本讲最核心的提醒：离婚不是分居那天才发生的事，而是从分居前的婚姻冲突就开始了。评价离婚的影响，必须把“离婚前冲突—分居后危机—长期反应”当三段来看。","source":"L9 p.22","tags":["divorce","marital conflict"],"stem_en":"The parents have not yet formally separated, but arguments at home have increased sharply. According to this lecture's description of the pre-divorce period, what is the most typical change in children?","options_en":["They become more hostile toward siblings and peers, and show anxiety, depression and externalizing problems","Cognitive ability improves briefly because the child has to solve problems alone","They are completely unaffected, because the parents have not yet divorced","Only the parent-child relationship is affected; peer relationships are not"]},{"id":"d1-l9-011","day":1,"lecture":9,"topic":"离婚后危机","difficulty":3,"type":"direct","stem":"离婚后，取得监护权的母亲与无监护权的父亲，在教养上分别容易出现哪种失调？","options":["母亲过度放任溺爱；父亲焦虑急躁、倾向强制管教","母亲焦虑急躁、倾向强制管教；父亲过度放任溺爱","双方都变得高度理性一致，形成良好共同养育","双方都完全退出教养，交给学校与祖辈"],"answer":1,"option_notes":["方向相反：本讲说握有监护权的母亲易强制，只探视的父亲易溺爱。","正解：监护母亲常焦虑急躁、对孩子需求不敏感、倾向 **coercive** 管教；无监护父亲则常过度放任溺爱。","离婚后多数家庭进入长达一年以上的**危机期**，父母双方都有情感与实际困难，难以立刻形成良好共育。","本讲没有说父母退出；反而强调他们要面对资源减少、新角色与新互动模式。"],"explain":"记忆抓手是“**coercive** 对 **over-permissive**”：被日常生计压住的监护方容易强硬急躁，只探视的一方容易用溺爱弥补缺席。两端都不是最优的 authoritative，也都不是孩子的错。","source":"L9 p.23","tags":["divorce","coercive parenting","custody"],"stem_en":"According to the research described in this lecture, what parenting difficulties tend to appear in the custodial mother and in the non-custodial father respectively after a divorce?","options_en":["The mother becomes over-permissive and indulgent; the father becomes anxious, impatient and coercive","The mother becomes anxious, impatient and coercive; the father becomes over-permissive and indulgent","Both become highly rational and consistent, forming good co-parenting","Both withdraw completely from parenting and leave it to the school and grandparents"]},{"id":"d1-l9-012","day":1,"lecture":9,"topic":"游戏五类别","difficulty":1,"type":"direct","stem":"两名四岁幼儿并排各搭各的积木，很少交谈或交换材料。按本讲的分法，这属于哪一类游戏？","options":["**Nonsocial activity**（非社交活动）","**Onlooker play**（旁观游戏）","**Parallel play**（平行游戏）","**Associative play**（联合游戏）"],"answer":2,"option_notes":["**Nonsocial activity**：单独活动、未接近他人，随年龄增长而减少；题干两人已相邻在玩。","**Onlooker play**：只是观看而不加入；题干两人都在动手搭积木。","正解：**Parallel play** 是并排各玩各的、互动极少，正是题干描述，且随年龄增长而减少。","**Associative play**：会分享、有交流，但不为共同目标合作；题干“很少交谈或交换材料”不符。"],"explain":"五类游戏是参与度由低到高的阶梯：nonsocial → onlooker → parallel → associative → cooperative。从 parallel 到 associative 跳在**是否有互动**，从 associative 到 cooperative 跳在**有无共同目标**。","source":"L9 p.30","tags":["play","parallel play","preschool"],"stem_en":"Two four-year-olds sit side by side, each building with their own blocks, and rarely talk or exchange materials. According to this lecture's classification, which type of play is this?","options_en":["**Nonsocial activity**","**Onlooker play**","**Parallel play**","**Associative play**"]},{"id":"d1-l9-013","day":1,"lecture":9,"topic":"同伴接纳","difficulty":1,"type":"direct","stem":"在同伴提名中，“喜欢”与“不喜欢”的票数都极少、在班里几近隐形。这属于哪一类同伴社交地位？","options":["**Popular**（受欢迎型）","**Rejected**（被拒绝型）","**Controversial**（有争议型）","**Neglected**（被忽视型）"],"answer":3,"option_notes":["**Popular**：被多数人喜欢、仅少数人讨厌，是被高度接纳的一类。","**Rejected**：被多数人讨厌、少数人喜欢，日后适应问题与偏差行为风险最高。","**Controversial**：被很多人喜欢同时也被很多人讨厌，是“爱恨两极”型。","正解：**Neglected** 是喜欢与不喜欢都极少被提名、近乎隐形；本讲指出他们不像被拒型那样孤独。"],"explain":"判准就是两条提名：“被喜欢”与“被不喜欢”的数量高低。两者皆高 = controversial，两者皆低 = neglected；被喜欢高 = popular，被不喜欢高 = rejected。被拒型风险最高，被忽视型换班后地位还可能改善。","source":"L9 p.33","tags":["peer acceptance","sociometric status","neglected"],"stem_en":"In peer nominations this child receives very few votes either as a liked or as a disliked companion, and seems almost invisible in the class. Which type of sociometric status does this describe?","options_en":["**Popular**","**Rejected**","**Controversial**","**Neglected**"]},{"id":"d1-l9-014","day":1,"lecture":9,"topic":"学校教育","difficulty":2,"type":"direct","stem":"关于学前教育与幼儿园的课程取向，本讲最主张老师采取下列哪一种做法？","options":["儿童中心的社会化目标与 **discovery learning**","尽早加入读写与算术训练，学业优势会一直保持","延长上课时间，全面仿照小学的科目安排","幼儿的认知发展主要由成熟决定，课程取向影响很小"],"answer":0,"option_notes":["正解：本讲主张学前与幼儿园不应以学业为重点，而应聚焦以儿童为中心的社会化目标与**探究式学习**。","本讲指出学术导向的学校只有**初步**学业优势，往往到幼儿园结束时就已经消失。","本讲反对幼儿园学术化，主张儿童中心与发现式学习，而非照搬小学课表。","本讲指出上学与课程取向都会影响认知发展（在校天数更多者更早达到逻辑里程碑），成熟并非唯一决定因素。"],"explain":"这里要分开两个常被混淆的问题：**上学**本身促进认知里程碑（在校天数越多越好，210 对 180 天）；但**学前阶段的课程取向**不宜学术化。前者问“上不上学”，后者问“怎么上”。","source":"L9 p.37","tags":["schooling","discovery learning","preschool"],"stem_en":"Regarding the curriculum orientation of preschool and kindergarten, which of the following approaches does this lecture most recommend that teachers adopt in their classrooms?","options_en":["Child-centered social goals and **discovery learning**","Reading, writing and arithmetic training as early as possible, so that the academic advantage will persist","Longer class hours, with the primary school subject timetable copied in full","Children's cognitive development is determined mainly by maturation, so curriculum orientation matters little"]},{"id":"d1-l9-015","day":1,"lecture":9,"topic":"电视暴力","difficulty":1,"type":"direct","stem":"长期观看电视暴力后，儿童对暴力画面的情绪反应减弱，也更愿意容忍现实生活中的暴力。本讲称之为什么？","options":["**Power-assertive discipline**（强制型管教）","**Desensitization hypothesis**（脱敏假说）","**Co-parenting**（共同养育）","**Intersubjectivity**（主体间性）"],"answer":1,"option_notes":["**Power-assertive discipline**：以权力压制方式管教，本讲在预测敌意手足互动的因素里提到，与媒体无关。","正解：脱敏假说指长期暴露于电视暴力使儿童情绪反应减弱、更愿意在现实中容忍暴力行为。","**Co-parenting**：父母互相支持、组成合作团队，属家庭系统的概念。","**Intersubjectivity**：共享意义、意图与目标的能力，是假装游戏的重要前提。"],"explain":"本讲对电视暴力的证据链分三层：正相关已充分证实、实验结果显示“会造成攻击”、纵向研究显示关系是**双向**的。脱敏假说解释的是另一面——不是更爱攻击，而是对暴力更无感、更容忍。","source":"L9 p.43","tags":["television","desensitization","media violence"],"stem_en":"After prolonged exposure to televised violence, children become less emotionally upset by violent scenes and more willing to tolerate violence in real life. What does this lecture call this phenomenon?","options_en":["**Power-assertive discipline**","**Desensitization hypothesis**","**Co-parenting**","**Intersubjectivity**"]},{"id":"d1-l9-016","day":1,"lecture":9,"topic":"电子游戏","difficulty":3,"type":"direct","stem":"比较电视暴力与暴力电子游戏对儿童发展的影响，本讲的核心判断是什么？","options":["电子游戏只是被动观看，影响必定比电视更小","两者与攻击行为的相关都极弱，文献几乎无发现","电子游戏只影响学业成绩，与攻击行为无关","游戏有中度相关，且主动施暴并获强化，可能比电视暴力更严重"],"answer":3,"option_notes":["刚好相反：玩游戏是**主动**参与，本讲认为它的问题可能比被动收看的电视暴力更严重。","电视暴力与攻击行为的正相关已充分证实，电子游戏亦有中度关联，并非“几乎无发现”。","本讲对电子游戏的核心担忧正是现实攻击行为，不是只谈学业。","正解：玩暴力电子游戏与现实攻击存在**中度关联**；儿童主动执行暴力并因成功施暴获得强化，故本讲认为可能比电视暴力更严重。"],"explain":"关键区别是**主动 vs 被动**：电视是单向接收，游戏要求玩家亲手执行暴力并因“成功”被强化，所以本讲推测影响可能更大。“中度相关”不等于强因果，这两句要一起记住。","source":"L9 p.52","tags":["video games","media violence","aggression"],"stem_en":"Comparing the effects of televised violence and violent video games on child development, what is the central judgment made in this lecture?","options_en":["Video games are only passively watched, so their impact must be smaller than that of television","Both show only very weak correlations with aggression, and the literature finds almost nothing","Video games affect only academic achievement and have nothing to do with aggression","Video games show a moderate correlation, and because players actively perform violence and are reinforced, the impact may be more serious than televised violence"]}],"day2":[{"id":"d2-l1-001","day":2,"lecture":1,"topic":"相关与因果","difficulty":3,"type":"scenario","scenario":"阿欣在网上看到一则新闻：研究发现每天使用社交媒体超过三小时的青少年，抑郁分数显著高于使用较少者；报道的结论是“社交媒体导致青少年抑郁”，但没有交代研究如何设计。","question":"要判断这个结论是否成立，最关键是先确认什么？","options":["抑郁分数是用哪一分量表测量","研究样本是否全部来自香港","研究结果有没有在期刊发表","研究有没有随机分配参与者，并操弄使用时数"],"answer":3,"option_notes":["量表质量影响测量结果，但不能决定“相关”能否升级为“因果”。","样本是否本土化影响可推广性，不是因果推论的关键。","期刊发表是质量线索，但发表了也仍可能只是相关研究。","有随机分配与操弄才是实验研究，才能支持因果；否则只是相关。"],"explain":"相关研究只显示关联，不能证明因果。要判断报道的因果结论，须看研究是否为实验设计（随机分配、操弄自变量）；观察到“使用多者抑郁分数高”也可能源于第三变量。","source":"L1 p.14","tags":["correlational research","causality","experimental design"],"scenario_en":"Ah Yan sees a news report online: a study found that adolescents who use social media for more than three hours a day have significantly higher depression scores than those who use it less. The report concludes that 'social media causes adolescent depression' but does not explain how the study was designed.","question_en":"To judge whether this conclusion holds, what is most important to confirm first?","options_en":["Which scale was used to measure depression scores","Whether the sample came entirely from Hong Kong","Whether the results were published in a journal","Whether the study randomly assigned participants and manipulated hours of use"]},{"id":"d2-l1-002","day":2,"lecture":1,"topic":"准实验设计","difficulty":2,"type":"scenario","scenario":"某中学在 S3 甲班试行“翻转课堂”，乙班沿用传统讲授。两班原本按成绩分班，任教老师不同；学期末研究者比较两班成绩，以评估新教学法是否有效。","question":"根据随机分配与控制的程度，这个研究最适合归类为？","options":["**natural (quasi-) experiment**（自然／准实验）","**experimental research**（实验研究）","**correlational research**（相关研究）","**case study**（个案研究）"],"answer":0,"option_notes":["**natural (quasi-) experiment** 有操弄与比较但缺乏随机分配，正符合分班与老师不同。","**experimental research** 需随机分配与实验控制，此研究未能随机分派学生。","**correlational research** 只测量变量关联，不操弄教学法。","**case study** 深入单一个案，不比较两组。"],"explain":"准实验与实验的差别在随机分配：学校按原班级比较新旧教学法，研究者无法随机分派学生，故属 **natural (quasi-) experiment**；结论仍可能受班级或教师差异混淆。","source":"L1 p.11","tags":["quasi-experiment","random assignment","experimental control"],"scenario_en":"A secondary school tries 'flipped classroom' teaching in Class A of S3 while Class B continues with traditional lecturing. The two classes were originally streamed by achievement and have different teachers; at the end of the term the researchers compare the two classes' results to evaluate whether the new method is effective.","question_en":"In terms of random assignment and experimental control, this study is best classified as:","options_en":["**natural (quasi-) experiment**","**experimental research**","**correlational research**","**case study**"]},{"id":"d2-l1-003","day":2,"lecture":1,"topic":"横断设计","difficulty":2,"type":"scenario","scenario":"一项研究在同一学年比较 8 岁、11 岁与 14 岁学生的推理测验分数，发现年龄越大分数越高。研究者据此写道：“推理能力随年龄增长而提升。”研究只施测一次。","question":"这个结论最可能受到哪一种研究设计问题的威胁？","options":["**practice effect**（练习效应）","**selective attrition**（选择性流失）","**cohort effect**（同辈效应）","**cross-generational problem**（跨代问题）"],"answer":2,"option_notes":["**practice effect** 指重复施测使分数提高，属纵向研究的问题。","**selective attrition** 指参与者选择性退出，属纵向研究的问题。","**cohort effect**：不同年龄组本属不同同辈群体，差异可能来自文化或历史因素，不一定是发展变化。","**cross-generational problem** 属纵向研究的跨代问题，与横断比较的年龄差异不同。"],"explain":"**cross-sectional design** 在同一时点比较不同年龄组，快速省时，但无法追踪个体发展，也易受 **cohort effect** 影响：组间差异可能来自世代经验而非年龄。","source":"L1 p.12","tags":["cross-sectional","cohort effect","research design"],"scenario_en":"A study compares the reasoning test scores of 8-, 11-, and 14-year-olds in the same school year and finds that older students score higher. The researchers conclude that 'reasoning ability improves with age'. The study was conducted only once.","question_en":"Which research design problem most threatens this conclusion?","options_en":["**practice effect**","**selective attrition**","**cohort effect**","**cross-generational problem**"]},{"id":"d2-l1-004","day":2,"lecture":1,"topic":"纵向设计","difficulty":2,"type":"scenario","scenario":"一项追踪研究自 2015 年起每年测试同一批 500 名儿童的阅读能力，十年后只剩 180 人继续参与。研究者发现退出者多为成绩较差、家庭支持较少的学生。","question":"这种参与者流失的情况最主要威胁研究的哪一方面？","options":["**practice effect**（练习效应）","**cohort effect**（同辈效应）","**observer effect**（观察者效应）","**selective attrition**（选择性流失）"],"answer":3,"option_notes":["**practice effect** 是重复测试使分数上升，不是本题的退出偏差。","**cohort effect** 是不同世代经验造成的差异，属横断设计的问题。","**observer effect** 是察觉被观察而改变行为，与退出无关。","**selective attrition**：退出者系统性地不同于留任者，使样本失去代表性。"],"explain":"**longitudinal design** 的优点是能评估稳定性与个别差异，代价是成本高、有 **practice effect**、**selective attrition** 与跨代问题。若退出者多为成绩差、支持少的学生，结果就会高估整体表现。","source":"L1 p.13","tags":["longitudinal","selective attrition","research design"],"scenario_en":"A longitudinal study has tested the reading ability of the same 500 children every year since 2015. Ten years later, only 180 still take part. The researchers find that those who dropped out were mostly students with weaker achievement and less family support.","question_en":"Which aspect of the study does this participant attrition most threaten?","options_en":["**practice effect**","**cohort effect**","**observer effect**","**selective attrition**"]},{"id":"d2-l1-005","day":2,"lecture":1,"topic":"序列设计","difficulty":2,"type":"scenario","scenario":"某团队想知道智能手机普及是否改变青少年的注意力发展。他们追踪 2010 年与 2015 年出生的两个世代，各自从 6 岁起每年测量注意力，并比较同一年龄、不同出生年份的儿童。","question":"上述研究团队采用的是哪一种发展研究设计？","options":["**cross-sectional design**（横断设计）","**sequential design**（序列设计）","**longitudinal design**（纵向设计）","**case study**（个案研究）"],"answer":1,"option_notes":["**cross-sectional design** 只比较不同年龄组一次，不追踪同一批人。","**sequential design** 选取不同同辈群体并长期追踪，可同时做横断与纵向比较。","**longitudinal design** 只追踪一个同辈群体，无法比较不同出生年份。","**case study** 研究单一个案，与两个世代样本不符。"],"explain":"**sequential design** 结合横断与纵向：同时追踪不同出生年份的世代，可检验 **cohort effect**，也能比较发展趋势。分辨关键是“是否包含多个同辈群体且各自被长期追踪”。","source":"L1 p.13","tags":["sequential design","cohort","research design"],"scenario_en":"A team wants to know whether the spread of smartphones has changed adolescents' attention development. They follow two generations born in 2010 and 2015, measuring attention every year from age 6, and compare children of the same age but different birth years.","question_en":"Which developmental research design does this team use?","options_en":["**cross-sectional design**","**sequential design**","**longitudinal design**","**case study**"]},{"id":"d2-l1-006","day":2,"lecture":1,"topic":"研究伦理","difficulty":2,"type":"scenario","scenario":"陈老师想研究赞美对小一学生做功课的影响。他打算放学后把 30 名学生留在课室做 20 分钟实验，但没有通知家长，也没有向学生说明可以中途离开。","question":"上述研究安排最直接违反哪一项研究伦理要求？","options":["**informed consent**（知情同意）","保护参与者免受身体与心理伤害","资料必须妥善储存并保密","使用欺骗手段必须有正当理由"],"answer":0,"option_notes":["**informed consent**：参与前须取得知情同意，未成年学生还须家长同意，本研究完全未做。","研究只是赞美与做功课，未见身体或心理伤害的风险。","题干未提及资料储存方式，无法判断违反保密要求。","题干未见研究者刻意隐瞒研究目的，欺骗条款不是最直接的问题。"],"explain":"本讲研究伦理包括：保护参与者免受身心伤害、取得 **informed consent**、欺骗须有正当理由且无害、可随时退出、资料保密。未通知家长与学生即可施测，最直接违反知情同意与退出权。","source":"L1 p.14","tags":["research ethics","informed consent","withdrawal"],"scenario_en":"Mr Chan wants to study the effect of praise on how Primary 1 students do their homework. He plans to keep 30 students in the classroom for a 20-minute experiment after school, but does not inform their parents or tell the students that they may leave at any time.","question_en":"Which research ethics requirement does this arrangement most directly violate?","options_en":["**informed consent**","Protecting participants from physical and psychological harm","Storing data properly and keeping it confidential","Justifying the use of deception"]},{"id":"d2-l2-001","day":2,"lecture":2,"topic":"双生子研究","difficulty":3,"type":"scenario","scenario":"一对同卵双胞胎出生后分别被两个家庭收养，成年后接受智力测验；研究同时比较一起长大的异卵双胞胎。结果显示，即使分开抚养，同卵双胞胎的智力分数仍比异卵双胞胎更相似。","question":"根据本讲的家庭研究，这项比较最能支持哪一结论？","options":["智力完全由遗传决定","共同家庭环境是智力的唯一来源","智力的个别差异受遗传影响","智力与遗传完全无关"],"answer":2,"option_notes":["同卵双胞胎分开抚养仍有相似性，但不能推到“完全”由遗传决定。","若共同环境是唯一来源，分开抚养的同卵双胞胎不应更相似。","遗传关系越高（同卵 1.00）智力分数越相似，支持遗传对智力有影响。","同卵与异卵的相似度差异正说明遗传有作用，并非无关。"],"explain":"家庭研究以遗传关系与智力分数的相关作比较：同卵双胞胎（遗传关系 1.00）相似度高于异卵（0.50）与手足（0.50）。同卵分开抚养仍相似，是遗传影响的关键证据，但不等于“完全由遗传决定”。","source":"L2 p.12","tags":["twin study","heritability","intelligence"],"scenario_en":"Identical twins are adopted into two families at birth and take intelligence tests as adults; the study also compares fraternal twins raised together. The results show that, even when raised apart, identical twins' intelligence scores are more similar than those of fraternal twins.","question_en":"According to the lecture's family studies, which conclusion does this comparison best support?","options_en":["Intelligence is completely determined by heredity","The shared family environment is the only source of intelligence","Individual differences in intelligence are influenced by heredity","Intelligence has nothing to do with heredity"]},{"id":"d2-l2-002","day":2,"lecture":2,"topic":"睡眠模式","difficulty":2,"type":"scenario","scenario":"新手父母发现 8 周大的女儿白天与夜晚的睡眠开始有些分别，晚上可以连续睡两三个两小时的周期而不完全醒来，白天清醒的时间也比之前长了一点。","question":"按本讲所述的睡眠发展，这属于哪一种正常变化？","options":["昼夜睡眠节律开始显现，属正常发展","睡眠总量异常增加，需要求医","已达到 6 个月大的睡眠模式","睡眠退步，应立即进行睡眠训练"],"answer":0,"option_notes":["8 周大时总睡眠略减、昼夜节律迹象出现，开始能连续睡两三个两小时周期，属正常。","8 周时每日总睡眠量其实略为减少，不是增加。","6 个月大仍日睡 14 小时以上但更规律可预测，8 周尚未达到。","这是神经系统与昼夜周期同步的正常进程，不是退步。"],"explain":"新生儿约 80% 时间在睡、日夜睡眠量相近；8 周时总睡眠略减、昼夜节律显现，可连续睡两三个两小时周期；6 个月时每天仍睡 14 小时以上但更规律。**circadian rhythms** 的形成是关键。","source":"L2 p.18","tags":["sleep patterns","circadian rhythms","infancy"],"scenario_en":"New parents notice that their 8-week-old daughter's sleep is beginning to differ between day and night: at night she can sleep through two or three two-hour cycles without fully waking, and her daytime waking periods are a little longer than before.","question_en":"According to the lecture's account of sleep development, what kind of normal change is this?","options_en":["Day/night sleep rhythms are beginning to appear, which is normal development","Total sleep is increasing abnormally and medical advice is needed","She has already reached the 6-month sleep pattern","This is a sleep regression, and sleep training should start immediately"]},{"id":"d2-l2-003","day":2,"lecture":2,"topic":"啼哭与肠绞痛","difficulty":2,"type":"scenario","scenario":"一个 5 周大的男婴每天傍晚突然剧烈啼哭，持续约三小时，怎样安抚都难以停止；喂奶、换尿片后情况没有改善，医生检查亦找不到疾病。","question":"按本讲对婴儿啼哭的描述，这最可能是什么情况？","options":["因饥饿引起的正常啼哭","**colic**（肠绞痛），通常会自行消失","因疼痛引起的持续啼哭","睡眠周期紊乱造成的哭闹"],"answer":1,"option_notes":["喂奶后没有改善，且每天固定剧哭三小时，不像单纯饥饿。","**colic**：每天无明显原因剧烈啼哭、总时数达三小时以上，约 15-20% 婴儿出现，通常自行消失。","医生检查找不到疾病且安抚无效，较符合 **colic** 而非疼痛。","本讲未以睡眠周期紊乱解释这种固定时段的剧哭。"],"explain":"本讲指出婴儿啼哭原因多样（疼痛、愤怒、饥饿），频率在出生后 6 周内增加、之后渐减；15-20% 婴儿有 **colic**，每天无明显原因剧哭三小时以上，通常不需干预便自行消失。","source":"L2 p.19","tags":["colic","crying","infancy"],"scenario_en":"A 5-week-old boy suddenly cries intensely every evening for about three hours and is hard to soothe; feeding and changing his nappy do not help, and the doctor finds no illness.","question_en":"According to the lecture's description of infant crying, what is this most likely to be?","options_en":["Normal crying caused by hunger","**colic**, which usually disappears without intervention","Persistent crying caused by pain","Crying caused by a disrupted sleep cycle"]},{"id":"d2-l2-004","day":2,"lecture":2,"topic":"大动作里程碑","difficulty":3,"type":"scenario","scenario":"10 个月大的男婴已能熟练爬行、扶物站立，但祖母发现他仍未能独自站立，担心发展迟缓，要求父母带他做评估。父母为此感到焦虑。","question":"根据本讲的大动作发展常模，最恰当的回应是什么？","options":["10 个月应已能独走，确实落后","爬行通常晚于独站出现，应先检查爬行","扶物站立约在 14 个月才出现，10 个月能扶站属超前","独站约在 11 个月出现，10 个月未能独站属正常范围"],"answer":3,"option_notes":["独走比独站更晚，10 个月不会独走也不算异常；此回应错误。","本讲的常模是爬行约 10 个月、独站约 11 个月，顺序与此项相反。","扶物站立约 9 个月出现，本项把时间往后推得太多。","常模显示扶物站立约 9 个月、爬行约 10 个月、独站约 11 个月，10 个月未独站正常。"],"explain":"婴儿大动作里程碑有固定顺序：抬头 1 个月、抬胸 2 个月、扶坐 4 个月、独坐 7 个月、扶物站立 9 个月、爬行 10 个月、牵走与独站约 11 个月。个别差异存在，单一项目未达不必立即判定迟缓。","source":"L2 p.21","tags":["gross motor","milestones","infancy"],"scenario_en":"A 10-month-old boy can crawl skillfully and stand while holding on to furniture, but his grandmother notices that he cannot yet stand alone and worries about developmental delay, asking the parents to have him assessed. The parents become anxious.","question_en":"According to the lecture's gross motor norms, what is the most appropriate response?","options_en":["He should already walk alone at 10 months, so he is delayed","Crawling usually appears later than standing alone, so crawling should be checked first","Standing while holding on to furniture appears at about 14 months, so standing at 10 months is advanced","Standing alone appears at about 11 months, so not standing alone at 10 months is within the normal range"]},{"id":"d2-l2-005","day":2,"lecture":2,"topic":"分类能力","difficulty":2,"type":"scenario","scenario":"约 12 个月大的女婴能在图片中分辨狗与鸟，也能在听到“动物”时看向动物图卡；但若要求她把狗和鸟归入同一个“动物”类别，她做不到，似乎不明白两者都属于动物。","question":"按本讲的分类能力发展，这最符合哪个年龄段的表现？","options":["7 至 8 个月大","12 个月大","24 个月大","5 岁左右"],"answer":1,"option_notes":["7 至 8 个月能分出动物与家具，但连狗与鸟都未能区分，不符题干。","12 个月能理解上位（动物）与基本（狗、鸟）类别，但未懂基本类别嵌套于上位类别，正符合。","24 个月已出现层级类别，能把小类别放进大类别。","5 岁才完全理解层级分类；题干的表现明显早于此。"],"explain":"分类能力随年龄推进：7 个月已主动用类别处理资讯；7 至 8 个月未分上下位；12 个月懂上位与基本类别但不理解嵌套；24 个月出现 **hierarchical categories**；完全理解约 5 岁，与语言经验有关。","source":"L2 p.38","tags":["categorization","hierarchical categories","infancy"],"scenario_en":"A girl of about 12 months can tell dogs from birds in pictures and looks at animal picture cards when she hears the word 'animals'; however, when asked to put dogs and birds into the same 'animal' category, she cannot, and seems not to understand that both belong to animals.","question_en":"According to the lecture's account of categorization, which age band does this best fit?","options_en":["7 to 8 months old","12 months old","24 months old","About 5 years old"]},{"id":"d2-l2-006","day":2,"lecture":2,"topic":"操作性条件作用","difficulty":2,"type":"scenario","scenario":"3 岁的轩仔最喜欢用蜡笔画画。每次他在墙上涂画，妈妈就大声责骂并要他回房间冷静。几星期后，他在墙上画画的次数明显减少，但在画纸上画画则没有减少。","question":"按操作性条件作用，墙上涂画减少的现象最符合哪一项？","options":["**punishment**（惩罚）","**positive reinforcement**（正强化）","**classical conditioning**（经典条件作用）","**observational learning**（观察学习）"],"answer":0,"option_notes":["**punishment**：行为后果削弱该行为，责骂与隔离使墙上涂画减少，正符合。","**positive reinforcement** 会增加行为；此处行为减少，方向相反。","**classical conditioning** 是刺激配对形成条件反应，不涉及行为后果。","**observational learning** 是观察榜样学习，题干没有示范者。"],"explain":"操作性条件作用看“行为、后果、行为机率”：后果使行为增加是强化，使行为减少是惩罚。责骂、**time-out** 属本讲列出的惩罚方式；若孩子微笑换来关注而增加，才属 **positive reinforcement**。","source":"L2 p.44","tags":["operant conditioning","punishment","reinforcement"],"scenario_en":"Three-year-old Hin likes drawing with crayons best. Every time he draws on the wall, his mother scolds him loudly and sends him to his room to calm down. A few weeks later, he draws on the wall much less often, but his drawing on paper has not decreased.","question_en":"In terms of operant conditioning, which principle best fits the decrease in wall drawing?","options_en":["**punishment**","**positive reinforcement**","**classical conditioning**","**observational learning**"]},{"id":"d2-l2-007","day":2,"lecture":2,"topic":"观察学习","difficulty":2,"type":"scenario","scenario":"18 个月大的乐乐昨天在公园看过爸爸用毛巾擦长椅。今天在家中，他拿起自己的小毛巾，走到长椅旁做出同样的擦拭动作，虽然昨天没有人叫他练习，也没有人给他奖励。","question":"这种行为最能说明本讲所说的哪一种学习形式？","options":["**immediate imitation**（即时模仿）","**operant conditioning**（操作性条件作用）","**deferred imitation**（延迟模仿）","**classical conditioning**（经典条件作用）"],"answer":2,"option_notes":["**immediate imitation** 是看到后立即模仿，题干是隔天才出现。","**operant conditioning** 靠行为后果调整频率，题干未见奖惩。","**deferred imitation**：观察后经过一段时间才重现榜样动作，正符合隔天模仿。","**classical conditioning** 是刺激与反应的配对，与观察榜样无关。"],"explain":"观察学习先注意榜样并形成符号表征（编码）。新生儿若动作属其行为储备，7 天大即可模仿；对新反应的模仿在 8 至 12 个月较稳定；初期是 **immediate imitation**，之后才出现 **deferred imitation**。","source":"L2 p.46","tags":["observational learning","deferred imitation","imitation"],"scenario_en":"Eighteen-month-old Lok watched his father wipe a bench with a towel in the park yesterday. Today at home he picks up his own small towel, walks to the bench and makes the same wiping movement, although yesterday no one asked him to practise or gave him a reward.","question_en":"Which form of learning described in the lecture does this behaviour best illustrate?","options_en":["**immediate imitation**","**operant conditioning**","**deferred imitation**","**classical conditioning**"]},{"id":"d2-l3-001","day":2,"lecture":3,"topic":"守恒","difficulty":2,"type":"scenario","scenario":"小一课堂上，老师把同样多的果汁分别倒入高瘦杯和矮宽杯。家怡刚看到两杯一样多，却指着高瘦杯说“这杯多很多”；问她为什么，她只说“因为它比较高”。","question":"家怡的表现最直接反映前运算思维的哪一特征？","options":["**Animism**（泛灵论）","**Conservation** 已掌握","**Centration**（集中化）：只注意高度一个维度","**Reversibility**（可逆性）已获得"],"answer":2,"option_notes":["泛灵论是把生命赋予无生命物（如风知道我怕热），与守恒判断无关。","她判断错误，正说明 **conservation** 尚未获得，而非已掌握。","**Centration**：只从一个维度（高度）思考、忽略宽度，是守恒失败的典型机制。","**Reversibility** 是具体运算阶段能力；本例恰恰缺乏可逆性。"],"explain":"守恒任务失败的关键机制是 **centration**：儿童只注意知觉上突出的单一维度。学会 **decentration**（同时考虑多个变量）后才可能守恒，约 6–7 岁逐步获得。","source":"L3 p.16","tags":["conservation","centration","preoperational stage"],"scenario_en":"In a Primary 1 lesson, the teacher pours equal amounts of juice into a tall narrow glass and a short wide glass. Ka-yi has just seen that the two amounts were equal, yet she points to the tall glass and says, 'This one has much more'; when asked why, she only says, 'Because it is taller.'","question_en":"Which feature of preoperational thought does Ka-yi's performance most directly reflect?","options_en":["**Animism**","**Conservation** has already been mastered","**Centration**: attending to only one dimension, height","**Reversibility** has already been acquired"]},{"id":"d2-l3-002","day":2,"lecture":3,"topic":"同化与顺应","difficulty":2,"type":"scenario","scenario":"幼稚园老师带小朋友观察动物。浩然看到斑马，立刻说“这是马！我家里有马的图书”；老师解释斑马有条纹、是另一种动物后，浩然把图书里的“马”和“斑马”分成两类。","question":"从“斑马叫马”到“分开两类”，浩然经历了什么？","options":["先 **assimilation**，后 **accommodation**","先 **accommodation**，后 **assimilation**","只有 **organization**，没有图式改变","只有 **centration**，与图式无关"],"answer":0,"option_notes":["先用“马”的既有图式解释斑马是 **assimilation**；被纠正后修改图式、分出斑马是 **accommodation**。","顺序反了：同化在前（用旧图式解释），顺应在后（旧图式失败才修改）。","**Organization** 是把图式重组为层级结构，本例主要是图式内容的修改。","**Centration** 是单一维度思维，与本题的新旧图式互动无关。"],"explain":"皮亚杰的认知过程是连续的：同化成功则维持平衡；同化失败（斑马不是马）产生失衡，于是 **accommodation** 修改图式，再通过 **equilibration** 达到新平衡。","source":"L3 p.7","tags":["assimilation","accommodation","equilibration"],"scenario_en":"A kindergarten teacher takes the children to observe animals. When Ho-yin sees a zebra, he immediately says, 'That is a horse! I have a book about horses at home.' After the teacher explains that zebras have stripes and are a different animal, Ho-yin separates 'horse' and 'zebra' into two categories in the book.","question_en":"From calling the zebra a horse to separating the two categories, what did Ho-yin experience?","options_en":["**assimilation** first, then **accommodation**","**accommodation** first, then **assimilation**","Only **organization**, with no change in schemes","Only **centration**, unrelated to schemes"]},{"id":"d2-l3-003","day":2,"lecture":3,"topic":"平衡化","difficulty":2,"type":"scenario","scenario":"科学老师先让小三学生预测“大球和小球同时从同一高度落下，谁先着地”，多数人说大球；实验后他们发现同时落地，老师再请他们改写自己的解释。","question":"老师的这种安排最能促进哪一个皮亚杰式过程？","options":["**Assimilation**（把新经验直接纳入旧图式）","**Organization**（把图式整合成层级）","**Horizontal décalage**（水平滞差）","**Equilibration**（平衡化：由失衡走向新平衡）"],"answer":3,"option_notes":["同化只会把结果勉强纳入旧想法；本设计刻意让旧预测失败。","组织是图式层级重组，本活动的核心是让预测与证据冲突后调整。","水平滞差描述跨任务获得时间差，不是教学活动设计的目标。","**Equilibration**：通过制造认知冲突（失衡）→ 调整图式（顺应）→ 形成新平衡。"],"explain":"皮亚杰式教学常先暴露学生的错误预测，制造 **disequilibrium**，再用实验证据促使 **accommodation**，最后形成更完整的 **cognitive equilibrium**。这正是平衡化的历程。","source":"L3 p.8","tags":["equilibration","disequilibrium","accommodation"],"scenario_en":"A science teacher first asks Primary 3 pupils to predict which ball will land first when a large ball and a small ball are dropped from the same height; most say the large ball. After the experiment they find that the balls land at the same time, and the teacher then asks them to revise their explanations.","question_en":"Which Piagetian process does this arrangement most promote?","options_en":["**Assimilation** (fitting new experience directly into an existing scheme)","**Organization** (combining schemes into a hierarchy)","**Horizontal décalage**","**Equilibration** (moving from disequilibrium to a new equilibrium)"]},{"id":"d2-l3-004","day":2,"lecture":3,"topic":"心理理论","difficulty":2,"type":"scenario","scenario":"四岁的子晴和妈妈玩糖果盒游戏：盒子里装的其实是铅笔。妈妈问“如果志明没打开过这个盒子，他会以为里面是什么？”子晴回答“铅笔”。","question":"子晴的答案说明她在哪方面的能力尚未成熟？","options":["**Object permanence**（客体永久性）","**False belief understanding**（错误信念理解）","**Conservation**（守恒）","**Transitivity**（传递性）"],"answer":1,"option_notes":["**Object permanence** 是物体被遮挡仍存在的理解，属感知运动阶段，本例不涉及。","**False belief understanding**：预测他人依据自己的（错误）信念行事；子晴以自己已知的事实回答，未通过。","**Conservation** 是外观改变而数量不变，本题与数量判断无关。","**Transitivity** 是 A<B<C 式关系推理，属形式运算，与本例无关。"],"explain":"错误信念任务要求儿童抑制自己知道的真相、站在他人视角作答。约 3–5 岁逐步通过；**TOM** 缺失与自闭症相关，语言与工作记忆也影响表现。","source":"L3 p.19","tags":["theory of mind","false belief","candy box"],"scenario_en":"Four-year-old Tsz-ching plays the candy-box game with her mother: the box actually contains pencils. Her mother asks, 'If Chi-ming has never opened this box, what will he think is inside?' Tsz-ching answers, 'Pencils.'","question_en":"Tsz-ching's answer shows that she is not yet mature in which ability?","options_en":["**Object permanence**","**False belief understanding**","**Conservation**","**Transitivity**"]},{"id":"d2-l3-005","day":2,"lecture":3,"topic":"最近发展区","difficulty":2,"type":"scenario","scenario":"数学老师给中二学生阿俊三类题目：一类他完全会做；一类他独自做不出来、但经老师提示一句就能完成；另一类即使提示多次他也毫无头绪。","question":"按 **Vygotsky** 的观点，哪一类题目最适合安排给阿俊？","options":["独自做不出、经提示能完成的那一类（**ZPD** 内）","完全会做的那一类（过易区）","提示多次也毫无头绪的那一类（过难区）","三类没有区别，随机安排即可"],"answer":0,"option_notes":["这一档位于独立水平与协助水平之间，正是 **zone of proximal development** 的范围。","完全会做属“过易区”，只会巩固已有能力，不能促进新发展。","毫无头绪属“过难区”，即使有协助也超出能力范围。","无视难度与协助的关系，违背 **ZPD** 的核心主张。"],"explain":"**ZPD** 是“独立能完成”与“在指导下能完成”之间的差距。教学应落在此区：由 **more knowledgeable other** 提供提示、开放式提问与示范，并随能力提升撤除支持。","source":"L3 p.35","tags":["zone of proximal development","scaffolding","Vygotsky"],"scenario_en":"A mathematics teacher gives Form 2 student Ah-chun three kinds of problems: ones he can already do completely; ones he cannot do alone but can finish after a single hint from the teacher; and ones he cannot start even after many hints.","question_en":"According to **Vygotsky**, which kind of problem is most suitable for Ah-chun?","options_en":["The kind he cannot do alone but can finish with a hint (within the **ZPD**)","The kind he can already do completely (the too-easy zone)","The kind he cannot start even after many hints (the too-hard zone)","There is no difference among the three; any arrangement is fine"]},{"id":"d2-l3-006","day":2,"lecture":3,"topic":"支架","difficulty":2,"type":"scenario","scenario":"小五学生嘉欣第一次做海报，老师先示范排版、再给她检查清单、最后只在她卡住时提问“你觉得标题放哪里更醒目？”几周后老师把清单也收回了。","question":"老师逐步减少支持的做法体现了哪一种概念？","options":["**Personal fable**","**Horizontal décalage**","**Centration**","**Scaffolding**（支架，随能力提升逐步撤除）"],"answer":3,"option_notes":["**Personal fable** 是青春期“自己独特、不受伤害”的信念，与教学支持无关。","**Horizontal décalage** 是具体运算技能跨任务的时间差，不描述教学支持。","**Centration** 是前运算期单一维度思维，与支架撤除无关。","**Scaffolding**：为接近能力上限的学习者提供结构化支持，随其独立而逐步撤除。"],"explain":"支架的特征是“量身定制＋逐步撤除”：从示范、清单到提问，支持越来越少，学生独立能力越来越强。支架常与 **ZPD** 一起考，支持者包括家长、教师与年长兄弟姐妹。","source":"L3 p.36","tags":["scaffolding","zone of proximal development","Vygotsky"],"scenario_en":"Primary 5 student Ka-yan is making a poster for the first time. The teacher first models the layout, then gives her a checklist, and finally asks a question only when she gets stuck: 'Where do you think the title would be most eye-catching?' A few weeks later the teacher also takes back the checklist.","question_en":"The teacher's gradual reduction of support illustrates which concept?","options_en":["**Personal fable**","**Horizontal décalage**","**Centration**","**Scaffolding** (support that is gradually withdrawn as competence grows)"]},{"id":"d2-l3-007","day":2,"lecture":3,"topic":"青春期自我中心","difficulty":2,"type":"scenario","scenario":"中四的凯琳拒绝在课堂发言，认为“所有人都会记得我说错的那句话”；她同时相信“就算酒后驾车，我也不会出事，因为我跟别人不一样”。","question":"凯琳的两种想法依次对应青春期自我中心的哪两种表现？","options":["**Naïve idealism**；**centration**","**personal fable**→imaginary audience","**imaginary audience**→personal fable","**Animism**；**conservation**"],"answer":2,"option_notes":["天真理想主义是用理想世界批判现实；集中化是前运算局限，均不符。","顺序反了：先“所有人记得我”是假想观众，后“我不会出事”是个人寓言。","前者是 **imaginary audience**（觉得被人注视、评价），后者是 **personal fable**（独特、不会受伤）。","**Animism** 与 **conservation** 都是前运算期概念，与青春期自我中心无关。"],"explain":"青春期自我中心有两大表现：**imaginary audience**（被注视感、渴望隐私）与 **personal fable**（独特、不受伤害）。后者会提高危险行为风险，也可能带来焦虑、抑郁。","source":"L3 p.30","tags":["imaginary audience","personal fable","adolescent egocentrism"],"scenario_en":"Form 4 student Hoi-lam refuses to speak in class because she believes that 'everyone will remember the sentence I said wrong'; at the same time she believes that 'even if I drink and drive, nothing will happen to me, because I am different from other people.'","question_en":"Which two manifestations of adolescent egocentrism do Hoi-lam's two beliefs correspond to, in order?","options_en":["**Naïve idealism**; **centration**","**personal fable** → imaginary audience","**imaginary audience** → personal fable","**Animism**; **conservation**"]},{"id":"d2-l3-008","day":2,"lecture":3,"topic":"形式运算","difficulty":3,"type":"scenario","scenario":"中六通识课上，学生讨论“应否禁止校园使用手机”。家豪先列出普遍原则（自由与安全），再据原则推出几种具体政策，逐条列出可能后果与反例，并设计问卷检验。","question":"家豪的思考方式最能体现哪一阶段的认知特征？","options":["**Preoperational stage**：符号游戏与泛灵论","**Formal operational stage**：假设演绎推理","**concrete operational** 只归纳可观察事物","**Sensorimotor stage**：通过感官与动作探索"],"answer":1,"option_notes":["前运算期以符号功能、泛灵论、自我中心为特征，不做系统假设检验。","**Hypothetical-deductive reasoning**：从总体原则推出具体结论、预先考虑各种可能并系统检验。","具体运算儿童善于归纳可观察事物，但不擅长从原则演绎、处理抽象可能性。","感知运动期（0–2 岁）通过感官动作认识世界，与抽象政策讨论无关。"],"explain":"形式运算的标志：能处理无实物参照的抽象概念（自由、公平），能先想所有可能再系统检验。具体运算期虽已能 **inductive logic**，但仍不擅长 **deductive logic**。","source":"L3 p.26","tags":["formal operational stage","hypothetical-deductive reasoning"],"scenario_en":"In a Form 6 liberal studies lesson, students debate whether mobile phones should be banned on campus. Ka-ho first sets out general principles (freedom and safety), then derives several concrete policies from these principles, lists possible consequences and counterexamples for each, and designs a questionnaire to test them.","question_en":"Which stage's cognitive characteristics does Ka-ho's way of thinking best reflect?","options_en":["**Preoperational stage**: symbolic play and animism","**Formal operational stage**: hypothetical-deductive reasoning","**concrete operational**: generalizing only from observable things","**Sensorimotor stage**: exploring through the senses and actions"]},{"id":"d2-l4-001","day":2,"lecture":4,"topic":"快速映射","difficulty":2,"type":"scenario","scenario":"诊所里，物理治疗师对两岁半的乐乐说“把那个 **goniometer**（量角器）拿给我，不是这个”。乐乐第一次听到这个词，之后竟能从工具盒中正确取出一件量角器。","question":"按 PPT，乐乐的表现最能说明哪一种词汇学习现象？","options":["**Overextension**（过度扩展）","**Underextension**（扩展不足）","**Fast-mapping**（快速映射）","**Overregularization**（过度规则化）"],"answer":2,"option_notes":["**Overextension** 是把词义过度概括（“猫”指所有有毛动物），属用词错误。","**Underextension** 是用词范围过窄（“猫”只指自家猫），也是用词错误。","**Fast-mapping**：听过新词被应用几次（甚至一次）后快速掌握词义，13–15 个月起出现。","**Overregularization** 是把语法规则过度泛化（mice→mouses），属语法而非词义。"],"explain":"儿童不必把每个词都教到熟练：借对比线索（“不是这个”）就能快速映射词义，这是词汇爆发的重要机制，与过度扩展/扩展不足这类“已学词用错”不同。","source":"L4 p.42","tags":["fast-mapping","word learning","prelinguistic"],"scenario_en":"At a clinic, a physiotherapist says to two-and-a-half-year-old Lok-lok, 'Bring me the **goniometer**, not this one.' Lok-lok has never heard this word before, yet afterwards he correctly takes a goniometer out of the toolbox.","question_en":"According to the lecture, which vocabulary-learning phenomenon does Lok-lok's performance best illustrate?","options_en":["**Overextension**","**Underextension**","**Fast-mapping**","**Overregularization**"]},{"id":"d2-l4-002","day":2,"lecture":4,"topic":"词义错误","difficulty":2,"type":"scenario","scenario":"两岁的咏仪在公园看到松鼠、兔子和金毛犬，全都指着喊“狗狗”。妈妈问“那是什么”，她仍坚持这些毛茸茸的动物都是“狗狗”，回家看到猫也这样叫。","question":"按 PPT，咏仪这种用词方式属于哪一种词义错误？","options":["**Overextension**（过度扩展）","**Underextension**（扩展不足）","**Fast-mapping**（快速映射）","**Telegraphic speech**（电报式言语）"],"answer":0,"option_notes":["**Overextension**（过度扩展）：过度概括词义，用“狗狗”指所有有毛动物，正是本例。","**Underextension** 是范围过窄，如“狗”只指自家那只狗，与“全部叫狗狗”相反。","**Fast-mapping** 是快速掌握新词义的过程，不是用词范围错误。","**Telegraphic speech** 是 18–24 个月的双词组合，与词义范围无关。"],"explain":"**Overextension** 与 **underextension** 是词义掌握中方向相反的两种错误：范围过宽与过窄。随类别知识与词汇增长，儿童会逐步把范围收窄到成人用法。","source":"L4 p.43","tags":["overextension","underextension","word meaning"],"scenario_en":"Two-year-old Wing-yee sees squirrels, rabbits and a golden retriever in the park and points at all of them, saying 'doggy'. When her mother asks, 'What is that?', she still insists that all these furry animals are 'doggy', and at home she calls the cat 'doggy' too.","question_en":"According to the lecture, which kind of word-meaning error does Wing-yee's use of words illustrate?","options_en":["**Overextension**","**Underextension**","**Fast-mapping**","**Telegraphic speech**"]},{"id":"d2-l4-003","day":2,"lecture":4,"topic":"电报句期","difficulty":2,"type":"scenario","scenario":"一岁十个月的子朗指着玄关喊“爸爸鞋”。妈妈依情境有时理解为“这是爸爸的鞋”，有时理解为“帮爸爸穿鞋”，发现同一句话可以传达不同意思。","question":"子朗的“爸爸鞋”最能说明电报句期的哪一特征？","options":["已能使用完整 **grammatical morphemes**","开始理解被动句的结构","能产出带关系从句的完整句","只有实词、省略功能词，须靠语境与手势补充意义"],"answer":3,"option_notes":["语法语素（-ed、-s、-ing）要到学前期才按顺序习得，电报句期尚未掌握。","被动句要到 4–5 岁以后仍常被误解，不属 18–24 个月特征。","内嵌句、从句约 3 岁后才逐步出现，电报句期只有双词组合。","**Telegraphic speech**：由实词构成、省略意义较弱成分；同一句可因语境不同而有多种含义。"],"explain":"电报句期（18–24 个月）儿童已意识到词序重要（“妈妈喝”而非“喝妈妈”），但只保留实词。理解时必须借助语境、手势与语调，这本身也是 **pragmatics** 的早期表现。","source":"L4 p.45","tags":["telegraphic speech","word order","context"],"scenario_en":"Twenty-two-month-old Tsz-long points to the entrance and says 'Daddy shoe'. Depending on the situation, his mother sometimes understands it as 'This is Daddy's shoe' and sometimes as 'Help Daddy put on his shoes', realizing that the same utterance can convey different meanings.","question_en":"Which feature of the telegraphic period does Tsz-long's 'Daddy shoe' best illustrate?","options_en":["The child can already use complete **grammatical morphemes**","The child is beginning to understand the structure of passive sentences","The child can produce full sentences containing relative clauses","Only content words are used and function words are omitted, so context and gestures must supplement the meaning"]},{"id":"d2-l4-004","day":2,"lecture":4,"topic":"语法语素","difficulty":3,"type":"scenario","scenario":"三岁的家俊说“我昨天 goed 公园”“有两个 mouses”。妈妈从未这样说过，家中也没人示范过这些形式，妈妈纠正后他仍重复使用。","question":"家俊从没听过的说法却能自创，最能说明什么？","options":["儿童通过模仿成人句子习得语法","儿童会主动抽取并过度概括语法规则","儿童的 **phonology** 尚未发展","儿童仍处于 **holophrase** 阶段"],"answer":1,"option_notes":["成人不会说“goed”“mouses”，纯模仿无法产生这些形式，故该项错误。","**Overregularization**：儿童已抽取规则（-ed、-s）并过度泛化到不规则词，证明其主动建构语法。","**Phonology** 指语音系统，本例是形态/语法问题，不是发音问题。","**Holophrase period** 是单词句期（一次一个词），三岁儿童早已越过该阶段。"],"explain":"过度规则化是语法发展的“好消息”：说明儿童掌握了规则，只是还不会例外。它也反驳纯模仿/强化解释——这些形式几乎不可能从成人输入中模仿到。","source":"L4 p.47","tags":["overregularization","grammatical morphemes","learning perspective"],"scenario_en":"Three-year-old Ka-chun says 'I goed to the park yesterday' and 'there are two mouses'. His mother has never spoken this way and no one at home has modelled these forms, and he keeps repeating them even after his mother corrects him.","question_en":"Ka-chun produces forms he has never heard. What does this best show?","options_en":["Children acquire grammar by imitating adults' sentences","Children actively extract grammatical rules and overgeneralize them","The child's **phonology** has not yet developed","The child is still in the **holophrase** stage"]},{"id":"d2-l4-005","day":2,"lecture":4,"topic":"敏感期","difficulty":3,"type":"scenario","scenario":"陈太一家从内地移居香港。大儿子 6 岁来港，几年后广东话与本地同学几乎无差别；小儿子 16 岁才来港，即使努力多年，语法细节仍常出错。","question":"两兄弟语言发展的差异最符合下列哪项研究结论？","options":["语言习得与年龄无关，只要努力就能达到母语水平","**Nativist** 理论已被完全推翻","**Sensitive-period hypothesis**：青春期前更有利","**Interactionist** 理论否认环境的作用"],"answer":2,"option_notes":["两兄弟的差异与年龄高度一致；“与年龄无关”的结论与移民研究证据不符。","敏感期效应其实支持先天论，而非推翻；先天论的问题在其他方面（如无法解释 LAD 运作）。","**Sensitive-period hypothesis**：青春期前是语言习得的有利窗口，Johnson & Newport 支持。","**Interactionist** 视角恰恰强调环境（成人语言输入）的作用，不会否认环境。"],"explain":"Johnson & Newport (1989) 发现 3–7 岁开始学英语者接近母语水平，15 岁后抵达者较差。该结果支持敏感期假说，并说明“越早越容易”对第二语言同样成立。","source":"L4 p.27","tags":["sensitive period","second language","Johnson & Newport"],"scenario_en":"Mrs Chan's family moved from the mainland to Hong Kong. Her elder son arrived at age 6 and after a few years his Cantonese is almost indistinguishable from that of local classmates; her younger son arrived only at age 16 and, despite years of effort, still often makes mistakes in grammatical details.","question_en":"The difference between the two brothers' language development is most consistent with which research finding?","options_en":["Language acquisition is unrelated to age; with enough effort anyone can reach native level","The **Nativist** perspective has been completely refuted","**Sensitive-period hypothesis**: learning is more favourable before puberty","The **Interactionist** perspective denies the role of the environment"]},{"id":"d2-l4-006","day":2,"lecture":4,"topic":"互动论","difficulty":2,"type":"scenario","scenario":"两岁半的悦悦说“车车坏”。妈妈回应“对，车车坏了，轮子掉了”；之后又问“你看，车车怎么了？”悦悦尝试说出“轮子……掉”。","question":"妈妈的两句回应依次体现了互动论的哪种策略？","options":["先 **expansion**（扩展），再 **recast** 与延伸对话","先 **overextension**，再 **underextension**","**fast-mapping**；**overregularization**","先 **phonology**，再 **pragmatics**"],"answer":0,"option_notes":["**Expansion** 把“车车坏”改为语法完整丰富的“车车坏了，轮子掉了”；再以新形式提问属 **recast** 与延伸。","**Overextension**/**underextension** 是儿童用词范围错误，不是成人策略。","快速映射是词义学习机制，过度规则化是儿童语法错误，均非成人回应策略。","**Phonology**、**pragmatics** 是语言组成部分，不是具体的亲子对话策略。"],"explain":"**Expansion** 与 **recast** 都属互动论的环境支持：成人把儿童不合语法的句子改成正确而更丰富的版本，或用新语法形式重述。常获扩展与重述的儿童更快掌握语法规则。","source":"L4 p.32","tags":["expansion","recast","interactionist"],"scenario_en":"Two-and-a-half-year-old Yuet-yuet says, 'Car broken.' Her mother replies, 'Yes, the car is broken, the wheel fell off,' and later asks, 'Look, what happened to the car?' Yuet-yuet tries to say, 'Wheel... fell.'","question_en":"Which interactionist strategies do the mother's two responses illustrate, in order?","options_en":["**expansion** first, then **recast** and extending the conversation","**overextension** first, then **underextension**","**fast-mapping**; **overregularization**","**phonology** first, then **pragmatics**"]},{"id":"d2-l4-007","day":2,"lecture":4,"topic":"指称交流","difficulty":2,"type":"scenario","scenario":"六岁的颖彤负责向同学描述一张图片：“就是那个……很大很大的、有颜色的东西在那边”，同学完全听不懂。老师提示后，她才补充“蓝色的大象在左下角”。","question":"颖彤的描述总让同学听不懂，她最需要提升哪一种能力？","options":["**Phonology** 的发音清晰度","**Referential communication skills**","**Overregularization** 的控制","**Telegraphic speech** 的产出"],"answer":1,"option_notes":["她的问题不是发音不清，而是信息不足以让听者辨识所指对象。","**Referential communication skills**：生成清晰言语信息、察觉他人听不懂、并主动澄清模糊信息。","**Overregularization** 是语法过度泛化（mice→mouses），与描述清晰度无关。","六岁儿童早已越过电报句期；本例的问题是信息组织与听者意识。"],"explain":"指称交流技能要求说话者考虑听者的知识与需要。约 6–7 岁自我中心减弱、角色采择增强，9–10 岁更能澄清模糊信息；语言发展尚不成熟的兄弟姐妹间互动也有促进作用。","source":"L4 p.49","tags":["referential communication","pragmatics","role taking"],"scenario_en":"Six-year-old Wing-tung is describing a picture to her classmates: 'It's that... really really big, coloured thing over there.' Her classmates cannot understand at all. After the teacher prompts her, she adds, 'The blue elephant in the bottom left corner.'","question_en":"Wing-tung's descriptions always confuse her classmates. Which ability does she most need to improve?","options_en":["The clarity of her **phonology** (pronunciation)","**Referential communication skills**","Control of **overregularization**","Production of **telegraphic speech**"]},{"id":"d2-l5-001","day":2,"lecture":5,"topic":"情绪对话与共情","difficulty":2,"type":"scenario","scenario":"小一学生阿欣放学回家说：“今天家明跑得太快摔倒了，膝盖流血，看起来很痛。”妈妈没有马上安慰，而是问：“你觉得他当时是什么感觉？为什么会摔倒？”两人聊了很久关于不同心情的事。第二天，阿欣主动把自己的创可贴送给家明。","scenario_en":"Ah Yan, a Primary 1 pupil, comes home and says: 'Ka Ming fell over today because he was running too fast. His knee was bleeding and he looked in a lot of pain.' Instead of comforting her immediately, her mother asks: 'How do you think he felt? Why did he fall?' They talk for a long time about different feelings. The next day, Ah Yan gives Ka Ming her own sticking plaster.","question":"这段关于情绪的亲子对话，最可能促进阿欣哪方面的发展？","question_en":"Which aspect of Ah Yan's development is this parent–child conversation about emotions most likely to promote?","options":["理解他人情绪的成因，促进 **empathy** 与安慰行为","透过 **emotional display rules** 学会掩饰情绪","**self-conscious emotions**（如内疚）更早出现","发展出更强的 **effortful control**"],"options_en":["Understanding the causes of others' emotions, which promotes **empathy** and comforting behaviour","Learning to disguise emotions through **emotional display rules**","Showing **self-conscious emotions** such as guilt earlier","Developing stronger **effortful control**"],"answer":0,"option_notes":["讨论情绪体验与成因能加深对他人感受的理解，**empathy** 正是安慰困境同伴的动力。","**display rules** 是学习按社会期待调整表情，题干重点是理解与共情。","**self-conscious emotions** 需自我意识与标准评价，不是这段情绪对话的直接结果。","**effortful control** 指抑制冲动与转移注意，题干没有相关线索。"],"explain":"18–24 个月起儿童开始谈论自己的情绪；家庭中关于情绪体验的对话能加深对自己与他人感受的理解。理解他人情绪的成因是 **empathy** 的基础，而共情会促使儿童安慰、帮助处于困境的同伴。","source":"L5 p.9","tags":["empathy","emotion talk","prosocial behavior"]},{"id":"d2-l5-002","day":2,"lecture":5,"topic":"气质六维度","difficulty":3,"type":"scenario","scenario":"同一间幼儿中心的两名新生：小雅一进新教室就缩在角落、紧抓妈妈衣角，看到陌生教具就哭；小俊则能自己进教室玩，但一到点心时间若没拿到想要的饼干，就大哭大闹、很难安抚。","scenario_en":"Two new children join the same nursery class. When Xiao Ya enters the new classroom, she shrinks into a corner, clings to her mother's clothes and cries at the sight of unfamiliar toys. Xiao Jun, by contrast, enters and plays by himself, but at snack time, if he does not get the biscuit he wants, he cries loudly and is very hard to soothe.","question":"按 **Rothbart & Bates** 的六维度，小雅对新环境退缩哭闹最突出地反映哪一维度？","question_en":"According to **Rothbart & Bates**' six dimensions, Xiao Ya's crying and withdrawal in the new environment most clearly reflects which dimension?","options":["**irritable distress**（愿望受挫时的烦躁哭闹）","**activity level**（粗大动作活动量）","**fearful distress**（新奇情境下的警惕退缩）","**attention span/persistence**（专注时长）"],"options_en":["**irritable distress** (fussiness and crying when desires are frustrated)","**activity level** (amount of gross motor activity)","**fearful distress** (wariness and withdrawal in novel situations)","**attention span/persistence** (length of focus on interesting objects)"],"answer":2,"option_notes":["**irritable distress** 是愿望受挫时的烦躁哭闹，更像情景中的小俊。","**activity level** 指粗大动作活动量，与在新环境中的退缩恐惧无关。","**fearful distress** 正指新情境或新奇刺激下的警惕、痛苦与退缩，小雅的表现完全吻合。","**attention span/persistence** 是专注时长，题干没有相关线索。"],"explain":"**Rothbart & Bates** 把负向情绪分为两种：**fearful distress**（对新奇与陌生情境的恐惧退缩）与 **irritable distress**（愿望受阻时的易怒哭闹）。同一孩子可能两维度都高，但判断时要看引发情境是“新奇”还是“受挫”。","source":"L5 p.15","tags":["fearful distress","irritable distress","Rothbart & Bates"]},{"id":"d2-l5-003","day":2,"lecture":5,"topic":"回避型依恋","difficulty":2,"type":"scenario","scenario":"9 个月大的子朗主要由妈妈照顾。妈妈带他参加大学的依恋观察研究：妈妈离开房间时，子朗只抬头看一下门口，继续玩手边的玩具；妈妈回来时他也没有伸手要抱，继续自己玩，好像什么都没发生。","scenario_en":"Nine-month-old Zi Long is mainly cared for by his mother. She takes him to a university observation study of attachment: when the mother leaves the room, Zi Long only glances at the door and keeps playing with the toy in his hand; when she returns, he does not reach out to be held and keeps playing by himself, as if nothing had happened.","question":"按 **Ainsworth** 的分类，子朗最可能是哪种依恋类型？","question_en":"According to **Ainsworth**'s classification, which attachment type is Zi Long most likely to show?","options":["**secure attachment**（安全型）","**avoidant attachment**（回避型）","**resistant attachment**（抗拒型）","**disorganized attachment**（混乱型）"],"options_en":["**secure attachment**","**avoidant attachment**","**resistant attachment**","**disorganized attachment**"],"answer":1,"option_notes":["安全型在分离时会难过、重聚时主动寻求安慰与热情问候，子朗两者都缺乏。","**avoidant** 型分离时几乎没有痛苦、重聚时忽略照料者，与子朗的表现完全吻合。","抗拒型分离时极度不安、重聚时矛盾纠结；子朗表现平淡，不符。","混乱型会接近与回避并存、显得困惑；子朗的行为是有组织的回避。"],"explain":"判断依
